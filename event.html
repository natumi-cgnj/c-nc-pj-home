<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Activity">
<title>Activity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:env(safe-area-inset-top,24px);border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#9B6BCC}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}
.view{display:none}.view.active{display:block}

/* Event list */
.event-list{padding:8px 0}
.event-row{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s}
.event-row:active{background:#F8F5FF}
.event-icon-wrap{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#F3EDFF;flex-shrink:0}
.event-icon-wrap img{width:100%;height:100%;object-fit:cover}
.event-icon-wrap .emoji-fb{font-size:22px}
.event-row-body{flex:1;min-width:0}
.event-row-name{font-size:14px;font-weight:500;color:#333;margin-bottom:2px}
.event-row-meta{font-size:11px;color:#bbb;display:flex;align-items:center;gap:8px}
.event-row-progress{flex:1;max-width:120px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.event-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#B88AE0,#9B6BCC);transition:width 0.3s}
.event-row-pct{font-size:10px;color:#ccc;min-width:28px;text-align:right}
.event-complete-star{font-size:12px;color:#B88AE0;flex-shrink:0}
.event-row-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px;color:#ccc}

/* Sub-activity list */
.sub-list{padding:8px 0}
.sub-row{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer}
.sub-row:active{background:#F8F5FF}
.sub-type-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sub-row-body{flex:1;min-width:0}
.sub-row-name{font-size:13px;font-weight:500;color:#333;margin-bottom:2px}
.sub-row-status{font-size:11px;color:#bbb}
.sub-check{font-size:14px;color:#B88AE0;flex-shrink:0}

/* Detail header / overall */
.detail-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.detail-header h2{font-size:15px;font-weight:600;color:#333;letter-spacing:0.5px;flex:1;text-align:center;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-overall{padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;background:#fff;border-bottom:1px solid #f5f5f5}
.detail-overall-bar{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.detail-overall-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#B88AE0,#9B6BCC);transition:width 0.3s}

/* Visit log */
.visit-log{padding:12px 20px;background:#fff;border-bottom:1px solid #f5f5f5}
.visit-log-title{font-size:11px;color:#bbb;margin-bottom:8px}
.visit-entry{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#faf8ff;border-radius:8px;margin-bottom:6px;font-size:13px}
.visit-entry-date{color:#999;font-size:12px;min-width:80px;flex-shrink:0}
.visit-entry-note{color:#555;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit-entry-note.empty{color:#ccc;font-style:italic}
.visit-entry-del{font-size:14px;color:#ccc;background:none;border:none;cursor:pointer;padding:2px}
.visit-add-btn{width:100%;padding:8px;border:1.5px dashed #ddd;border-radius:8px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;margin-top:6px}

/* Item grid */
.item-grid{padding:16px 0}
.section-divider{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.section-divider-line{flex:1;height:1px;background:#e0e0e0}
.section-divider-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.section-type-badge{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:4px}
.section-type-badge.collab-food{background:#E8B96A20;color:#B9872F}
.section-type-badge.merch{background:#9B6BCC20;color:#9B6BCC}
.section-type-badge.movie{background:#4AADE820;color:#4AADE8}
.section-type-badge.restaurant{background:#D8854020;color:#D88540}
.section-type-badge.mall{background:#E84A7A20;color:#E84A7A}
.section-grid{display:grid;gap:8px;padding:8px 20px 16px}
.item-cell{aspect-ratio:1;border-radius:10px;border:1.5px solid #e8e8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;background:#f5f5f5}
.item-cell:active{transform:scale(0.97)}
.item-cell .item-img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:9px;position:absolute;top:0;left:0;background:#fff;filter:grayscale(100%) brightness(0.85);transition:filter 0.4s}
.item-cell.recorded .item-img,.item-cell.collected .item-img{filter:none}
.item-cell.collected{border-color:#B88AE0;box-shadow:0 0 0 1px rgba(184,138,224,0.12)}
.item-cell .item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.5));color:#fff;font-size:10px;font-weight:500;padding:14px 5px 4px;border-radius:0 0 9px 9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.item-cell:not(.has-img) .item-label{background:none;color:#ccc;position:static;font-size:9px;padding:0 4px;margin-top:2px}
.item-cell.recorded:not(.has-img){background:#fff}
.item-cell.collected:not(.has-img){background:#F8F5FF;border-color:#B88AE0}
.item-cell.collected:not(.has-img) .item-num{color:#B88AE0}
.item-cell .item-num{font-size:20px;font-weight:200;color:#ddd;position:relative;z-index:1}
.item-check{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(155,107,204,0.9);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;z-index:2}
.item-count-badge{position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:rgba(155,107,204,0.9);color:#fff;font-size:9px;font-weight:600;text-align:center;line-height:18px;padding:0 4px;z-index:2}
.item-status-dot{position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:50%;z-index:2;border:1px solid rgba(255,255,255,0.8)}
.item-status-dot.keeping{background:#5BA66B}
.item-status-dot.sold{background:#ccc}
.item-status-dot.mixed{background:linear-gradient(135deg,#5BA66B 50%,#ccc 50%)}
.add-item-btn{margin:0 20px 16px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}

/* Item detail card */
.card-detail{width:calc(100% - 40px);max-width:520px;margin:20px auto;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card-detail-body{padding:14px 16px}
.card-detail-name{font-size:16px;font-weight:600;color:#333;margin-bottom:4px}
.card-detail-image{width:100%;max-height:300px;object-fit:contain;background:#fafafa;display:block}
.card-detail-date{font-size:11px;color:#bbb;margin-bottom:8px}
.card-detail-note{font-size:13px;color:#666;line-height:1.6;white-space:pre-wrap}
.card-actions{width:calc(100% - 40px);max-width:520px;display:flex;gap:8px;padding:0;margin:8px auto 0}
.card-actions .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.history-list{width:calc(100% - 40px);max-width:520px;margin:8px auto 0}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #eee;border-radius:8px;margin-bottom:6px;font-size:13px}
.history-thumb{width:42px;height:42px;object-fit:cover;border-radius:7px;background:#f5f5f5;flex-shrink:0}
.history-date{color:#999;font-size:12px;min-width:80px;flex-shrink:0}
.history-note{color:#555;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-note.is-empty{color:#ccc;font-style:italic}
.history-status{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.history-status.keeping{background:#5BA66B20;color:#5BA66B}
.history-status.sold{background:#ccc3;color:#999}
.history-status.gifted{background:#9B6BCC20;color:#9B6BCC}
.history-process{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.history-process.pending{background:#E8B96A20;color:#E8B96A}
.history-process.processed{background:#5BA66B20;color:#5BA66B}
.history-delete{font-size:14px;color:#ccc;background:none;border:none;cursor:pointer;padding:2px;flex-shrink:0}
.history-add-btn{width:calc(100% - 40px);max-width:520px;margin:6px auto 12px;display:block;padding:8px;border:1.5px dashed #ddd;border-radius:8px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal textarea{resize:vertical;min-height:50px}
.photo-picker{display:flex;align-items:center;gap:10px;padding:10px;border:1.5px dashed #ddd;border-radius:9px;background:#fafafa;cursor:pointer;color:#aaa;font-size:12px}
.photo-picker img{width:52px;height:52px;object-fit:cover;border-radius:7px;background:#fff;display:none}
.photo-picker.has-img img{display:block}
.photo-picker.has-img .photo-picker-text{color:#888}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}

/* Sub-activity type colors */
.type-collab{background:#E8B96A20;color:#B9872F}
.type-visit{background:#9B6BCC20;color:#9B6BCC}
.type-merch{background:#5BA66B20;color:#5BA66B}
.type-checkin{background:#4AADE820;color:#4AADE8}

/* Toast / Confirm */
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,0.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1),opacity 0.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}
.confirm-box p{font-size:14px;color:#333;margin-bottom:16px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:center}
.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:13px}

/* Section config in modal */
.section-list{margin-top:8px}
.section-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
.section-row input{font-size:13px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-family:inherit}
.section-row input[type="text"]{flex:1 1 80px;min-width:60px}
.section-row input[type="number"]{flex:0 0 50px;min-width:0}
.section-row select{width:70px;font-size:12px;padding:4px;border:1px solid #e0e0e0;border-radius:6px;font-family:inherit}
.section-row .del-sec{font-size:12px;color:#ccc;background:none;border:none;cursor:pointer;padding:4px}
.add-section-btn{font-size:12px;color:#aaa;background:none;border:1px dashed #ddd;border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:6px;font-family:inherit;width:100%}
</style>
</head>
<body>

<!-- HOME -->
<div id="viewHome" class="view active">
  <div class="top-bar">
    <a class="back-btn" href="index.html">← Home</a>
    <h1>ACTIVITY</h1>
    <button class="btn-s" onclick="openModal('backupModal')">备份</button>
  </div>
  <div class="event-list" id="eventList"></div>
</div>

<!-- EVENT DETAIL -->
<div id="viewEvent" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <h2 id="eventTitle"></h2>
    <button class="btn-s" onclick="openEventMenu()">⋯</button>
  </div>
  <div class="detail-overall" id="eventOverall"></div>
  <div class="sub-list" id="subList"></div>
  <div class="event-row-add" onclick="openAddSub()">+ 添加活动</div>
</div>

<!-- SUB-ACTIVITY DETAIL -->
<div id="viewDetail" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="goEvent()">← 返回</button>
    <h2 id="detailTitle"></h2>
    <button class="btn-s" onclick="openSubMenu()">⋯</button>
  </div>
  <div class="detail-overall" id="detailOverall"></div>
  <div id="visitLogArea"></div>
  <div class="item-grid" id="itemGrid"></div>
  <button class="add-item-btn" onclick="openAddItem()">+ 添加品目</button>
  <button class="add-item-btn" style="border-color:#B88AE0;color:#B88AE0" onclick="openAddSection()">+ 追加分栏</button>
</div>

<!-- ITEM VIEW -->
<div id="viewItem" class="view">
  <div class="detail-header">
    <button class="back-btn" id="itemBackBtn">← 返回</button>
    <h2 id="itemTitle"></h2>
    <button class="btn-s" onclick="openItemMenu()">⋯</button>
  </div>
  <div id="itemContent"></div>
</div>

<!-- MODALS -->

<!-- Add/Edit Event -->
<div class="modal-bg" id="eventModal">
  <div class="modal">
    <h2 id="eventModalTitle">添加活动</h2>
    <label>活动名称</label>
    <input type="text" id="inputEventName" placeholder="如: CKW × CoCo 联名">
    <label>备注（选填）</label>
    <textarea id="inputEventNote" placeholder="活动时间、地点等"></textarea>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('eventModal')">取消</button>
      <button class="btn btn-primary" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<!-- Add/Edit Sub-activity -->
<div class="modal-bg" id="subModal">
  <div class="modal">
    <h2 id="subModalTitle">添加活动</h2>
    <label>名称</label>
    <input type="text" id="inputSubName" placeholder="如: 联名饮品">
    <label>活动类型</label>
    <select id="inputSubType" onchange="onSubTypeChange()">
      <option value="collab">品牌联名（餐品+周边）</option>
      <option value="visit">主题/活动打卡（去了就算）</option>
      <option value="merch">周边收集</option>
      <option value="checkin">简单打卡（吃到即完成）</option>
    </select>
    <label>项目细分</label>
    <div class="section-list" id="subSectionList"></div>
    <button class="add-section-btn" onclick="addSubSectionRow()">+ 添加分栏</button>
    <label>备注（选填）</label>
    <textarea id="inputSubNote" placeholder="详情、地址等"></textarea>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('subModal')">取消</button>
      <button class="btn btn-primary" onclick="saveSub()">保存</button>
    </div>
  </div>
</div>

<!-- Add Section -->
<div class="modal-bg" id="addSectionModal">
  <div class="modal">
    <h2>追加分栏</h2>
    <label>名称</label>
    <input type="text" id="inputNewSectionName" placeholder="分栏名称" maxlength="40">
    <label>品目数量</label>
    <input type="number" id="inputNewSectionCount" placeholder="数量" min="1" max="99">
    <label>分栏类型</label>
    <select id="inputNewSectionType">
      <option value="normal">普通</option>
      <option value="collab_food">联动</option>
      <option value="merch">周边</option>
      <option value="movie">电影</option>
      <option value="restaurant">餐厅</option>
      <option value="mall">商场</option>
    </select>
    <label>列数</label>
    <select id="inputNewSectionCols">
      <option value="3" selected>3列</option>
      <option value="2">2列</option>
      <option value="4">4列</option>
    </select>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('addSectionModal')">取消</button>
      <button class="btn btn-primary" onclick="saveNewSection()">添加</button>
    </div>
  </div>
</div>

<!-- Check-in Modal -->
<div class="modal-bg" id="checkinModal">
  <div class="modal">
    <h2 id="checkinModalTitle">打卡</h2>
    <label>品名</label>
    <input type="text" id="checkinName" placeholder="品目名称">
    <label>日期</label>
    <input type="date" id="checkinDate">
    <label>感想（选填）</label>
    <input type="text" id="checkinNote" maxlength="120" placeholder="一句话记录">
    <label>照片（选填）</label>
    <div class="photo-picker" id="checkinPhotoPicker" onclick="document.getElementById('checkinPhotoInput').click()">
      <img id="checkinPhotoPreview" alt="">
      <span class="photo-picker-text">拍照或选择图片</span>
    </div>
    <input type="file" id="checkinPhotoInput" accept="image/*" capture="environment" onchange="loadCheckinPhoto(this)" hidden>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('checkinModal')">取消</button>
      <button class="btn btn-primary" id="checkinSubmitBtn" onclick="saveCheckin()">打卡</button>
    </div>
  </div>
</div>

<!-- Visit Modal -->
<div class="modal-bg" id="visitModal">
  <div class="modal">
    <h2>记录到访</h2>
    <label>日期</label>
    <input type="date" id="visitDate">
    <label>备注（选填）</label>
    <input type="text" id="visitNote" maxlength="120" placeholder="去了做了什么">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('visitModal')">取消</button>
      <button class="btn btn-primary" onclick="saveVisit()">记录</button>
    </div>
  </div>
</div>

<!-- Item Add/Edit Modal -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <h2 id="itemModalTitle">添加品目</h2>
    <div id="itemSectionField" style="display:none">
      <label>所属分栏</label>
      <select id="inputItemSection"></select>
    </div>
    <label>名称</label>
    <input type="text" id="inputItemName" placeholder="品目名称">
    <label>备注（选填）</label>
    <textarea id="inputItemNote" placeholder="说明"></textarea>
    <label>图鉴图片（选填）</label>
    <div class="photo-picker" id="itemPhotoPicker" onclick="document.getElementById('inputItemImage').click()">
      <img id="itemPhotoPreview" alt="">
      <span class="photo-picker-text">选择用于图鉴的图片</span>
    </div>
    <input type="file" id="inputItemImage" accept="image/*" onchange="loadItemPhoto(this)" hidden>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('itemModal')">取消</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- Backup -->
<div class="modal-bg" id="backupModal">
  <div class="modal">
    <h2>活动数据备份</h2>
    <div style="padding:8px 0">

<script src="cloud-sync.js?v=20260730-guard2"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
const SK='activity_db';
let events=[];
try{events=JSON.parse(localStorage.getItem(SK))||[];}catch(e){events=[];}

let curEventId=null,curSubId=null,curItemIdx=null;
let editEventId=null,editSubId=null,editItemIdx=null;
let _subSections=[];
let pendingItemImg='',pendingCheckinImg='';

function save(){
  try{localStorage.setItem(SK,JSON.stringify(events));}
  catch(e){showToast('保存失败，浏览器空间不足');}
}
function gid(){return 'a_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function localDateStr(value){
  var d=value?new Date(value):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function makeItem(name){
  return{id:gid(),name:name||'',note:'',img:'',collected:false,collectedDate:null,checkinNote:'',checkinImg:'',records:[],checkinHistory:[]};
}
function normalizeEventData(){
  var changed=false;
  if(!Array.isArray(events)){events=[];changed=true;}
  events.forEach(function(ev,eventIndex){
    if(!ev.id){ev.id=gid();changed=true;}
    if(!Array.isArray(ev.subs)){ev.subs=[];changed=true;}
    if(typeof ev.order!=='number'){ev.order=eventIndex;changed=true;}
    ev.subs.forEach(function(sub){
      if(!sub.id){sub.id=gid();changed=true;}
      if(!Array.isArray(sub.items)){sub.items=[];changed=true;}
      if(!Array.isArray(sub.sections)){sub.sections=[];changed=true;}
      if(!Array.isArray(sub.visits)){sub.visits=[];changed=true;}
      sub.items.forEach(function(item){
        if(!item.id){item.id=gid();changed=true;}
        if(!Array.isArray(item.records)){item.records=[];changed=true;}
        if(!Array.isArray(item.checkinHistory)){item.checkinHistory=[];changed=true;}
      });
      var total=0;
      sub.sections.forEach(function(section){
        if(!section.id){section.id=gid();changed=true;}
        section.count=Math.max(0,parseInt(section.count)||0);
        section.cols=[2,3,4].includes(parseInt(section.cols))?parseInt(section.cols):3;
        if(section.sectionType==='food')section.sectionType='normal';var vst=['normal','collab_food','merch','movie','restaurant','mall'];section.sectionType=vst.indexOf(section.sectionType)>=0?section.sectionType:'normal';
        total+=section.count;
      });
      if(sub.sections.length&&total<sub.items.length){
        sub.sections[sub.sections.length-1].count+=sub.items.length-total;
        total=sub.items.length;changed=true;
      }
      while(total>sub.items.length){
        sub.items.push(makeItem('品目'+(sub.items.length+1)));
        changed=true;
      }
    });
  });
  if(changed)save();
}
normalizeEventData();

function imagePathExt(value){
  var match=String(value||'').match(/^data:image\/(png|webp|jpe?g)/i);
  return match?(match[1].toLowerCase()==='jpeg'?'jpg':match[1].toLowerCase()):'jpg';
}
function readImageFile(input,callback){
  var file=input.files&&input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var raw=ev.target.result;
    var image=new Image();
    image.onload=function(){
      var max=1400,scale=Math.min(1,max/Math.max(image.width,image.height));
      var canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(image.width*scale));
      canvas.height=Math.max(1,Math.round(image.height*scale));
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      var type=file.type==='image/png'?'image/png':file.type==='image/webp'?'image/webp':'image/jpeg';
      callback(canvas.toDataURL(type,type==='image/jpeg'?0.86:0.9));
    };
    image.onerror=function(){callback(raw);};
    image.src=raw;
  };
  reader.readAsDataURL(file);
  input.value='';
}
function setPhotoPreview(pickerId,imgId,value){
  var picker=document.getElementById(pickerId),img=document.getElementById(imgId);
  img.src=value||'';picker.classList.toggle('has-img',!!value);
}
function loadItemPhoto(input){readImageFile(input,function(value){pendingItemImg=value;setPhotoPreview('itemPhotoPicker','itemPhotoPreview',value);});}
function loadCheckinPhoto(input){readImageFile(input,function(value){pendingCheckinImg=value;setPhotoPreview('checkinPhotoPicker','checkinPhotoPreview',value);});}
async function uploadActivityImage(value,path){
  if(!value||!value.startsWith('data:')||!window.CloudSync)return value;
  try{return await CloudSync.uploadDataUrl(value,'activity/'+path+'.'+imagePathExt(value));}
  catch(e){showToast('照片暂存于本机，稍后可继续同步');return value;}
}
async function deleteActivityAsset(value){
  if(value&&String(value).startsWith('cloud://')&&window.CloudSync){
    try{await CloudSync.deleteAsset(value);}catch(e){}
  }
}

/* Dialogs */
function customConfirm(msg,onYes,opts){
  const bg=document.getElementById('confirmBg');const box=bg.querySelector('.confirm-box');
  const yesLabel=(opts&&opts.yes)||'确定';const noLabel=(opts&&opts.no)||'取消';const isDanger=opts&&opts.danger;
  box.innerHTML='<p>'+msg+'</p><div class="btn-row"><button class="btn btn-cancel" id="confirmNo">'+esc(noLabel)+'</button><button class="btn '+(isDanger?'btn-del':'btn-primary')+'" id="confirmYes">'+esc(yesLabel)+'</button></div>';
  bg.classList.add('show');
  box.querySelector('#confirmYes').onclick=function(){bg.classList.remove('show');onYes();};
  box.querySelector('#confirmNo').onclick=function(){bg.classList.remove('show');};
  bg.onclick=function(e){if(e.target===bg)bg.classList.remove('show');};
}
let _toastTimer=null;
function showToast(msg,ms){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){el.classList.remove('show');},ms||2200);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(function(bg){bg.addEventListener('click',function(e){if(e.target===bg)closeModal(bg.id);});});

/* Views */
function switchView(id){document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){switchView('viewHome');renderEvents();}
function goEvent(){if(!curEventId){goHome();return;}switchView('viewEvent');renderEventDetail();}
function getEvent(id){return events.find(function(e){return e.id===id;});}
function getSub(eventId,subId){var ev=getEvent(eventId);if(!ev)return null;return(ev.subs||[]).find(function(s){return s.id===subId;});}

/* Helpers */
function isGenericName(name){return !String(name||'').trim()||/^品目\d+$/.test(String(name).trim());}
function getItemSectionType(sub,itemIdx){
  if(!sub||!sub.sections||!sub.sections.length)return'normal';
  var offset=0;
  for(var i=0;i<sub.sections.length;i++){
    var count=Math.max(0,parseInt(sub.sections[i].count)||0);
    if(itemIdx>=offset&&itemIdx<offset+count)return sub.sections[i].sectionType||'normal';
    offset+=count;
  }
  return'normal';
}
function getItemSectionIndex(sub,itemIdx){
  if(!sub||!sub.sections||!sub.sections.length||itemIdx===null||itemIdx<0)return -1;
  var offset=0;
  for(var i=0;i<sub.sections.length;i++){
    var count=Math.max(0,parseInt(sub.sections[i].count)||0);
    if(itemIdx>=offset&&itemIdx<offset+count)return i;
    offset+=count;
  }
  return -1;
}

/* Stats */
function subStats(sub){
  var total=0,done=0;
  if(sub.activityType==='visit'){
    total++;
    if(sub.visits&&sub.visits.length)done++;
  }
  (sub.items||[]).forEach(function(item,idx){
    total++;
    var secType=getItemSectionType(sub,idx);
    if(secType==='merch'){
      if(item.records&&item.records.length&&item.records.every(function(r){return r.processStatus==='processed';}))done++;
    }else{
      if(item.collected)done++;
    }
  });
  return{total:total,done:done};
}
function eventStats(ev){
  var total=0,done=0;
  (ev.subs||[]).forEach(function(sub){var st=subStats(sub);total+=st.total;done+=st.done;});
  return{total:total,done:done};
}

/* ═══ EVENT LIST ═══ */
function renderEvents(){
  var list=document.getElementById('eventList');
  var html=events.sort(function(a,b){return(a.order||0)-(b.order||0);}).map(function(ev){
    var st=eventStats(ev);
    var pct=st.total>0?Math.round(st.done/st.total*100):0;
    var allDone=st.done>=st.total&&st.total>0;
    return '<div class="event-row" onclick="openEvent(\''+ev.id+'\')"><div class="event-icon-wrap"><div class="emoji-fb">🎪</div></div><div class="event-row-body"><div class="event-row-name">'+esc(ev.name)+(allDone?' <span class="event-complete-star">★</span>':'')+'</div><div class="event-row-meta"><span>'+st.done+' / '+st.total+'</span><div class="event-row-progress"><div class="event-row-fill" style="width:'+pct+'%"></div></div><span class="event-row-pct">'+pct+'%</span></div></div></div>';
  }).join('');
  html+='<div class="event-row-add" onclick="openAddEvent()">+ 添加活动</div>';
  list.innerHTML=html;
}

/* ═══ EVENT CRUD ═══ */
function openAddEvent(){editEventId=null;document.getElementById('eventModalTitle').textContent='添加活动';document.getElementById('inputEventName').value='';document.getElementById('inputEventNote').value='';openModal('eventModal');}
function editEvent(){var ev=getEvent(curEventId);if(!ev)return;editEventId=ev.id;document.getElementById('eventModalTitle').textContent='编辑活动';document.getElementById('inputEventName').value=ev.name;document.getElementById('inputEventNote').value=ev.note||'';openModal('eventModal');}
function saveEvent(){
  var name=document.getElementById('inputEventName').value.trim();if(!name)return;
  var note=document.getElementById('inputEventNote').value.trim();

  else{events.push({id:gid(),name:name,note:note,subs:[],order:events.length});}

}
function deleteEvent(){
  var ev=getEvent(curEventId);if(!ev)return;

    events=events.filter(function(e){return e.id!==curEventId;});
    curEventId=null;curSubId=null;save();goHome();
  },{yes:'删除',danger:true});
}
function openEvent(id){curEventId=id;var ev=getEvent(id);if(!ev)return;document.getElementById('eventTitle').textContent=ev.name;renderEventDetail();switchView('viewEvent');}
function openEventMenu(){openModal('eventMenuSheet');}

/* ═══ EVENT DETAIL (sub-activity list) ═══ */
function renderEventDetail(){
  var ev=getEvent(curEventId);if(!ev)return;

  var typeIcons={collab:'🤝',visit:'📍',merch:'🎁',checkin:'✅'};

  editSubId=sub.id;
  document.getElementById('subModalTitle').textContent='编辑';
  document.getElementById('inputSubName').value=sub.name;
  document.getElementById('inputSubType').value=sub.activityType||'checkin';
  document.getElementById('inputSubNote').value=sub.note||'';
  _subSections=(sub.sections||[]).map(function(s){return{id:s.id||gid(),name:s.name||'',count:s.count||0,cols:s.cols||3,sectionType:s.sectionType||'normal'};});
  if(!_subSections.length)_subSections=[{id:gid(),name:'',count:0,cols:3,sectionType:'normal'}];
  renderSubSectionList();
  openModal('subModal');

function onSubTypeChange(){renderSubSectionList();}
function renderSubSectionList(){
  var list=document.getElementById('subSectionList');
  var type=document.getElementById('inputSubType').value;
  if(type==='visit'){
    list.innerHTML='<div style="font-size:11px;color:#ccc;padding:8px 0">打卡活动：到访即完成，下方可添加周边分栏</div>';
    if(!_subSections.length||(_subSections.length===1&&!_subSections[0].name&&!_subSections[0].count)){
      _subSections=[];
    }
  }
  var html=_subSections.map(function(s,i){
    return '<div class="section-row"><input type="text" value="'+esc(s.name)+'" placeholder="分栏名称" onchange="_subSections['+i+'].name=this.value"><input type="number" value="'+(s.count||0)+'" min="0" max="99" placeholder="数量" onchange="_subSections['+i+'].count=parseInt(this.value)||0"><select onchange="_subSections['+i+'].sectionType=this.value"><option value="normal"'+((!s.sectionType||s.sectionType==='normal')?' selected':'')+'>普通</option><option value="collab_food"'+(s.sectionType==='collab_food'?' selected':'')+'>联动</option><option value="merch"'+(s.sectionType==='merch'?' selected':'')+'>周边</option><option value="movie"'+(s.sectionType==='movie'?' selected':'')+'>电影</option><option value="restaurant"'+(s.sectionType==='restaurant'?' selected':'')+'>餐厅</option><option value="mall"'+(s.sectionType==='mall'?' selected':'')+'>商场</option></select><select onchange="_subSections['+i+'].cols=parseInt(this.value)"><option value="2"'+(s.cols===2?' selected':'')+'>2列</option><option value="3"'+(s.cols===3?' selected':'')+'>3列</option><option value="4"'+(s.cols===4?' selected':'')+'>4列</option></select><button class="del-sec" onclick="_subSections.splice('+i+',1);renderSubSectionList()">×</button></div>';
  }).join('');
  if(type!=='visit'||_subSections.length>0)list.innerHTML=html||'<div style="font-size:11px;color:#ccc;padding:8px 0">点下方"添加分栏"设置细分</div>';
}
function addSubSectionRow(){

  _subSections.push({id:gid(),name:'',count:0,cols:3,sectionType:type==='visit'?'merch':'normal'});
  renderSubSectionList();
}
function saveSub(){
  var name=document.getElementById('inputSubName').value.trim();if(!name)return;
  var type=document.getElementById('inputSubType').value;
  var note=document.getElementById('inputSubNote').value.trim();
  var ev=getEvent(curEventId);if(!ev)return;
  if(!ev.subs)ev.subs=[];
  var sections=_subSections.filter(function(s){return s.name||s.count>0;}).map(function(s){return{id:s.id||gid(),name:s.name,count:Math.max(0,parseInt(s.count)||0),cols:s.cols||3,sectionType:s.sectionType||'normal'};});
  if(editSubId){
    var sub=getSub(curEventId,editSubId);
    if(sub){
      sub.name=name;sub.activityType=type;sub.note=note;
      var oldSections=(sub.sections||[]).slice();
      var oldItems=(sub.items||[]).slice();
      if(sections.length){
        var blocks={};var oldOffset=0;
        oldSections.forEach(function(section){
          var count=Math.max(0,parseInt(section.count)||0);
          blocks[section.id]=oldItems.slice(oldOffset,oldOffset+count);
          oldOffset+=count;
        });
        var unsectioned=oldSections.length?[]:oldItems.slice();
        var rebuilt=[];
        sections.forEach(function(section,sectionIndex){
          var block=blocks[section.id]?blocks[section.id].slice():(sectionIndex===0?unsectioned.splice(0):[]);
          if(block.length>section.count)block=block.slice(0,section.count);
          while(block.length<section.count)block.push(makeItem('品目'+(rebuilt.length+block.length+1)));
          rebuilt=rebuilt.concat(block);
        });
        sub.items=rebuilt;
      }else{
        sub.items=oldItems;
      }
      sub.sections=sections;
    }
  }else{
    var items=[];
    var totalItems=0;
    sections.forEach(function(s){totalItems+=s.count||0;});
    for(var i=0;i<totalItems;i++)items.push(makeItem('品目'+(i+1)));
    ev.subs.push({id:gid(),name:name,activityType:type,note:note,sections:sections,items:items,visits:[]});
  }
  save();closeModal('subModal');
  if(editSubId&&curSubId===editSubId)renderSubDetail(getSub(curEventId,curSubId));
  else renderEventDetail();
  editSubId=null;
}
function deleteSub(){
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  customConfirm('删除「'+esc(sub.name)+'」？',function(){
    var ev=getEvent(curEventId);if(!ev)return;
    ev.subs=ev.subs.filter(function(s){return s.id!==curSubId;});
    curSubId=null;save();goEvent();
  },{yes:'删除',danger:true});
}

function renderSubDetail(sub){
  if(!sub)sub=getSub(curEventId,curSubId);if(!sub)return;
  var st=subStats(sub);
  var pct=st.total>0?Math.round(st.done/st.total*100):0;
  document.getElementById('detailTitle').textContent=sub.name;
  document.getElementById('detailOverall').innerHTML='<span>'+st.done+' / '+st.total+'</span><div class="detail-overall-bar"><div class="detail-overall-fill" style="width:'+pct+'%"></div></div><span>'+pct+'%</span>';

  // Visit log
  var vArea=document.getElementById('visitLogArea');
  if(sub.activityType==='visit'){
    var vHtml='<div class="visit-log"><div class="visit-log-title">到访记录'+(sub.visits&&sub.visits.length?' ('+sub.visits.length+'次)':'')+'</div>';
    (sub.visits||[]).forEach(function(v,vi){
      vHtml+='<div class="visit-entry"><span class="visit-entry-date">'+esc(v.date)+'</span><span class="visit-entry-note '+(v.note?'':'empty')+'">'+esc(v.note||'—')+'</span><button class="visit-entry-del" onclick="deleteVisit('+vi+')">×</button></div>';
    });
    vHtml+='<button class="visit-add-btn" onclick="openAddVisit()">+ 记录到访</button></div>';
    vArea.innerHTML=vHtml;
  }else{vArea.innerHTML='';}

  // Item grid
  var grid=document.getElementById('itemGrid');
  var sections=sub.sections&&sub.sections.length?sub.sections:null;
  if(!sections&&sub.items&&sub.items.length){
    grid.innerHTML='<div class="section-grid" style="grid-template-columns:repeat(3,1fr)">'+renderItemCells(sub,sub.items,0)+'</div>';
  }else if(sections){
    var html='';var offset=0;
    sections.forEach(function(sec,si){
      var count=sec.count||0;var cols=sec.cols||3;
      if(sec.name){
        var badge='';if(sec.sectionType==='collab_food')badge='<span class="section-type-badge collab-food">联动</span>';else if(sec.sectionType==='merch')badge='<span class="section-type-badge merch">周边</span>';else if(sec.sectionType==='movie')badge='<span class="section-type-badge movie">电影</span>';else if(sec.sectionType==='restaurant')badge='<span class="section-type-badge restaurant">餐厅</span>';else if(sec.sectionType==='mall')badge='<span class="section-type-badge mall">商场</span>';
        html+='<div class="section-divider"><div class="section-divider-line"></div><span class="section-divider-label">'+esc(sec.name)+badge+'</span><div class="section-divider-line"></div></div>';
      }
      html+='<div class="section-grid" style="grid-template-columns:repeat('+cols+',1fr)">';
      html+=renderItemCells(sub,sub.items.slice(offset,offset+count),offset);
      html+='</div>';
      offset+=count;
    });
    grid.innerHTML=html;
  }else{grid.innerHTML='';}
}
function renderItemCells(sub,items,globalOffset){
  return items.map(function(item,i){
    var idx=globalOffset+i;
    var secType=getItemSectionType(sub,idx);
    var hasName=!isGenericName(item.name);
    var hasImg=!!item.img;
    var recordBadge='';
    var showCheck=false;
    var recorded=false;
    if(secType==='merch'){
      if(item.records&&item.records.length){
        recorded=true;
        if(item.records.length>1)recordBadge+='<span class="item-count-badge">×'+item.records.length+'</span>';
        var hasKeeping=item.records.some(function(r){return !r.status||r.status==='keeping';});
        var hasGone=item.records.some(function(r){return r.status==='sold'||r.status==='gifted';});
        recordBadge+='<span class="item-status-dot '+(hasKeeping&&hasGone?'mixed':hasGone?'sold':'keeping')+'"></span>';
        showCheck=item.records.every(function(r){return r.processStatus==='processed';});
      }
    }else{
      showCheck=!!item.collected;
      recorded=showCheck;
      var history=item.checkinHistory||[];
      if(history.length>1)recordBadge+='<span class="item-count-badge">×'+history.length+'</span>';
    }
    return '<div class="item-cell '+(recorded?'recorded ':'')+(showCheck?'collected ':'')+(hasImg?'has-img':'')+'" data-index="'+idx+'" onclick="handleItemClick('+idx+')">'+
      (hasImg?'<img class="item-img" src="'+esc(item.img)+'" alt="">':'<span class="item-num">'+(idx+1)+'</span>')+
      (hasName?'<span class="item-label">'+esc(item.name)+'</span>':'')+
      (showCheck?'<div class="item-check">✓</div>':'')+
      recordBadge+
      '</div>';
  }).join('');
}

/* ═══ VISIT CRUD ═══ */
function openAddVisit(){document.getElementById('visitDate').value=localDateStr();document.getElementById('visitNote').value='';openModal('visitModal');}
function saveVisit(){
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  if(!sub.visits)sub.visits=[];
  sub.visits.push({id:gid(),date:document.getElementById('visitDate').value||localDateStr(),note:document.getElementById('visitNote').value.trim()});
  save();closeModal('visitModal');renderSubDetail(sub);
}
function deleteVisit(vi){
  var sub=getSub(curEventId,curSubId);if(!sub||!sub.visits||!sub.visits[vi])return;
  customConfirm('删除这条到访记录？',function(){sub.visits.splice(vi,1);save();renderSubDetail(sub);},{yes:'删除',danger:true});
}

/* ═══ ITEM CLICK / DETAIL ═══ */
function handleItemClick(idx){
  var sub=getSub(curEventId,curSubId);if(!sub||!sub.items[idx])return;
  curItemIdx=idx;
  openItemView(idx);
}
function openCheckinFor(idx){
  curItemIdx=idx;
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  var item=sub.items[idx];
  var secType=getItemSectionType(sub,idx);
  var modal=document.getElementById('checkinModal');
  modal.dataset.mode=secType==='merch'?'merch':'food';
  document.getElementById('checkinModalTitle').textContent=secType==='merch'?'记录周边':'打卡';
  document.getElementById('checkinSubmitBtn').textContent=secType==='merch'?'记录':'打卡';
  document.getElementById('checkinName').value=isGenericName(item.name)?'':item.name;
  document.getElementById('checkinDate').value=localDateStr();
  document.getElementById('checkinNote').value='';
  pendingCheckinImg='';
  setPhotoPreview('checkinPhotoPicker','checkinPhotoPreview','');
  openModal('checkinModal');
}
async function saveCheckin(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];
  var mode=document.getElementById('checkinModal').dataset.mode||'food';
  var name=document.getElementById('checkinName').value.trim();
  if(name)item.name=name;
  var dateVal=document.getElementById('checkinDate').value||localDateStr();
  var noteVal=document.getElementById('checkinNote').value.trim();
  var recordId=gid();
  var photo=await uploadActivityImage(pendingCheckinImg,curEventId+'_'+curSubId+'_'+item.id+'_record_'+recordId);
  if(mode==='merch'){
    if(!item.records)item.records=[];
    item.records.push({id:recordId,date:dateVal,note:noteVal,img:photo||'',status:'keeping',processStatus:'pending'});
    item.collected=true;item.collectedDate=dateVal;item.checkinNote=noteVal;
  }else{
    item.collected=true;item.collectedDate=dateVal;item.checkinNote=noteVal;item.checkinImg=photo||'';
    if(!item.checkinHistory)item.checkinHistory=[];
    item.checkinHistory.push({id:recordId,date:dateVal,note:noteVal,img:photo||''});
  }
  pendingCheckinImg='';
  save();closeModal('checkinModal');
  if(document.getElementById('viewItem').classList.contains('active'))openItemView(curItemIdx);
  else renderSubDetail(sub);
}

function openItemView(idx){
  var sub=getSub(curEventId,curSubId);if(!sub||!sub.items[idx])return;
  curItemIdx=idx;
  var item=sub.items[idx];
  var secType=getItemSectionType(sub,idx);
  var displayName=isGenericName(item.name)?'品目'+(idx+1):item.name;
  document.getElementById('itemTitle').textContent=displayName;
  document.getElementById('itemBackBtn').onclick=function(){switchView('viewDetail');renderSubDetail();};
  var html='<div class="card-detail">';
  if(item.img)html+='<img class="card-detail-image" src="'+esc(item.img)+'" alt="">';
  html+='<div class="card-detail-body">';
  html+='<div class="card-detail-name">'+esc(displayName)+'</div>';
  if(item.note)html+='<div style="font-size:12px;color:#999;margin-top:4px">'+esc(item.note)+'</div>';

  if(secType==='merch'){
    html+='</div></div>';
    var records=item.records||[];
    if(records.length){
      html+='<div class="history-list"><div style="font-size:11px;color:#bbb;padding:4px 14px">收藏记录（'+records.length+'个）</div>';
      records.forEach(function(record,ri){
        var statusClass=record.status==='sold'?'sold':record.status==='gifted'?'gifted':'keeping';
        var statusLabel=record.status==='sold'?'已出':record.status==='gifted'?'送掉':'自留';
        var processClass=(record.processStatus||'pending')==='processed'?'processed':'pending';
        var processLabel=(record.processStatus||'pending')==='processed'?'已处理':'待处理';
        html+='<div class="history-item">'+(record.img?'<img class="history-thumb" src="'+esc(record.img)+'" alt="">':'')+'<span class="history-date">'+esc(record.date||'')+'</span><span class="history-note '+(record.note?'':'is-empty')+'">'+esc(record.note||'—')+'</span><button class="history-process '+processClass+'" onclick="toggleProcess('+ri+')">'+processLabel+'</button><button class="history-status '+statusClass+'" onclick="toggleStatus('+ri+')">'+statusLabel+'</button><button class="history-delete" onclick="deleteRecord('+ri+')">×</button></div>';
      });
      html+='</div>';
    }
    html+='<button class="history-add-btn" onclick="addMoreMerch()">+ '+(records.length?'再记录一个':'记录入手')+'</button>';
  }else{
    if(item.collected&&item.collectedDate)html+='<div class="card-detail-date">打卡于 '+esc(item.collectedDate)+'</div>';
    if(item.checkinNote)html+='<div class="card-detail-note">'+esc(item.checkinNote)+'</div>';
    if(item.checkinImg)html+='<img class="card-detail-image" style="margin-top:10px;border-radius:8px" src="'+esc(item.checkinImg)+'" alt="">';
    html+='</div></div>';
    var history=item.checkinHistory||[];
    if(history.length>1){
      html+='<div class="history-list"><div style="font-size:11px;color:#bbb;padding:4px 14px">打卡记录（'+history.length+'次）</div>';
      history.forEach(function(record){
        html+='<div class="history-item">'+(record.img?'<img class="history-thumb" src="'+esc(record.img)+'" alt="">':'')+'<span class="history-date">'+esc(record.date||'')+'</span><span class="history-note '+(record.note?'':'is-empty')+'">'+esc(record.note||'—')+'</span></div>';
      });
      html+='</div>';
    }
    html+=item.collected
      ?'<div class="card-actions"><button class="btn btn-primary" onclick="addMoreCheckin()">再来一次</button><button class="btn btn-cancel" onclick="uncollectItem()">清空记录</button></div>'
      :'<div class="card-actions"><button class="btn btn-primary" onclick="openCheckinFor('+idx+')">打卡</button></div>';
  }
  document.getElementById('itemContent').innerHTML=html;
  switchView('viewItem');
}

/* Merch status toggles */
function toggleStatus(ri){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];if(!item||!item.records||!item.records[ri])return;
  var cur=item.records[ri].status||'keeping';
  item.records[ri].status=cur==='keeping'?'sold':cur==='sold'?'gifted':'keeping';
  save();openItemView(curItemIdx);
}
function toggleProcess(ri){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];if(!item||!item.records||!item.records[ri])return;
  item.records[ri].processStatus=(item.records[ri].processStatus||'pending')==='processed'?'pending':'processed';
  save();openItemView(curItemIdx);
}
function deleteRecord(ri){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];if(!item||!item.records||!item.records[ri])return;
  customConfirm('删除这条记录？',function(){
    var removed=item.records.splice(ri,1)[0];
    if(removed)deleteActivityAsset(removed.img);
    item.collected=item.records.length>0;
    save();openItemView(curItemIdx);
  },{yes:'删除',danger:true});
}
function addMoreMerch(){openCheckinFor(curItemIdx);}
function addMoreCheckin(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];
  var modal=document.getElementById('checkinModal');
  modal.dataset.mode='food_repeat';
  document.getElementById('checkinModalTitle').textContent='追加打卡';
  document.getElementById('checkinSubmitBtn').textContent='保存';
  document.getElementById('checkinName').value=isGenericName(item.name)?'':item.name;
  document.getElementById('checkinDate').value=localDateStr();
  document.getElementById('checkinNote').value='';
  pendingCheckinImg='';
  setPhotoPreview('checkinPhotoPicker','checkinPhotoPreview','');
  openModal('checkinModal');
}
function uncollectItem(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];if(!item)return;
  customConfirm('清空全部记录？',function(){
    (item.records||[]).forEach(function(record){deleteActivityAsset(record.img);});
    (item.checkinHistory||[]).forEach(function(record){deleteActivityAsset(record.img);});
    item.collected=false;item.collectedDate=null;item.checkinNote='';item.checkinImg='';
    item.checkinHistory=[];item.records=[];
    save();openItemView(curItemIdx);
  },{yes:'清空',danger:true});
}

/* Item menu */
function openItemMenu(){openModal('itemMenuSheet');}
function toggleItemCollected(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  var item=sub.items[curItemIdx];
  if(item.collected){uncollectItem();}else{openCheckinFor(curItemIdx);}
}
function deleteItem(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null)return;
  customConfirm('删除这个品目？',function(){
    var secIdx=getItemSectionIndex(sub,curItemIdx);
    if(secIdx>=0&&sub.sections[secIdx])sub.sections[secIdx].count=Math.max(0,(parseInt(sub.sections[secIdx].count)||0)-1);
    var removed=sub.items.splice(curItemIdx,1)[0];
    if(removed){
      deleteActivityAsset(removed.img);deleteActivityAsset(removed.checkinImg);
      (removed.records||[]).forEach(function(record){deleteActivityAsset(record.img);});
      (removed.checkinHistory||[]).forEach(function(record){deleteActivityAsset(record.img);});
    }
    curItemIdx=null;save();switchView('viewDetail');renderSubDetail();
  },{yes:'删除',danger:true});
}

/* Add Item */
function openAddItem(){
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  editItemIdx=null;
  document.getElementById('itemModalTitle').textContent='添加品目';
  document.getElementById('inputItemName').value='';
  document.getElementById('inputItemNote').value='';
  pendingItemImg='';
  setPhotoPreview('itemPhotoPicker','itemPhotoPreview','');
  var select=document.getElementById('inputItemSection');
  var field=document.getElementById('itemSectionField');
  if(sub.sections&&sub.sections.length){
    select.innerHTML=sub.sections.map(function(s,i){return '<option value="'+i+'">'+esc(s.name||('分栏'+(i+1)))+'</option>';}).join('');
    field.style.display='block';
  }else{field.style.display='none';}
  openModal('itemModal');
}
function editCurrentItem(){
  var sub=getSub(curEventId,curSubId);if(!sub||curItemIdx===null||!sub.items[curItemIdx])return;
  var item=sub.items[curItemIdx];
  editItemIdx=curItemIdx;
  document.getElementById('itemModalTitle').textContent='编辑品目';
  document.getElementById('inputItemName').value=isGenericName(item.name)?'':item.name;
  document.getElementById('inputItemNote').value=item.note||'';
  pendingItemImg=item.img||'';
  setPhotoPreview('itemPhotoPicker','itemPhotoPreview',pendingItemImg);
  var select=document.getElementById('inputItemSection');
  var field=document.getElementById('itemSectionField');
  if(sub.sections&&sub.sections.length){
    select.innerHTML=sub.sections.map(function(s,i){return '<option value="'+i+'">'+esc(s.name||('分栏'+(i+1)))+'</option>';}).join('');
    select.value=String(Math.max(0,getItemSectionIndex(sub,curItemIdx)));
    field.style.display='block';
  }else{field.style.display='none';}
  openModal('itemModal');
}
async function saveItem(){
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  var name=document.getElementById('inputItemName').value.trim()||('品目'+(sub.items.length+1));
  var note=document.getElementById('inputItemNote').value.trim();
  var item=editItemIdx===null?makeItem(name):sub.items[editItemIdx];
  if(!item)return;
  item.name=name;item.note=note;
  item.img=await uploadActivityImage(pendingItemImg,curEventId+'_'+curSubId+'_'+item.id+'_catalog');
  if(editItemIdx!==null){
    if(sub.sections&&sub.sections.length){
      var oldSection=getItemSectionIndex(sub,editItemIdx);
      var newSection=parseInt(document.getElementById('inputItemSection').value)||0;
      if(oldSection>=0&&newSection!==oldSection){
        sub.items.splice(editItemIdx,1);
        sub.sections[oldSection].count=Math.max(0,(parseInt(sub.sections[oldSection].count)||0)-1);
        var insertAt=0;
        for(var s=0;s<=newSection&&s<sub.sections.length;s++)insertAt+=Math.max(0,parseInt(sub.sections[s].count)||0);
        sub.items.splice(insertAt,0,item);
        sub.sections[newSection].count=(parseInt(sub.sections[newSection].count)||0)+1;
        curItemIdx=insertAt;
      }
    }
    editItemIdx=null;pendingItemImg='';
    save();closeModal('itemModal');openItemView(curItemIdx);return;
  }
  if(sub.sections&&sub.sections.length){
    var secIdx=parseInt(document.getElementById('inputItemSection').value)||0;
    var offset=0;
    for(var i=0;i<=secIdx&&i<sub.sections.length;i++){offset+=Math.max(0,parseInt(sub.sections[i].count)||0);}
    sub.items.splice(offset,0,item);
    sub.sections[secIdx].count=(parseInt(sub.sections[secIdx].count)||0)+1;
  }else{sub.items.push(item);}
  pendingItemImg='';
  save();closeModal('itemModal');renderSubDetail();
}

/* Add Section */
function openAddSection(){
  document.getElementById('inputNewSectionName').value='';
  document.getElementById('inputNewSectionCount').value='';
  document.getElementById('inputNewSectionType').value='normal';
  document.getElementById('inputNewSectionCols').value='3';
  openModal('addSectionModal');
}
function saveNewSection(){
  var sub=getSub(curEventId,curSubId);if(!sub)return;
  var name=document.getElementById('inputNewSectionName').value.trim();
  var count=parseInt(document.getElementById('inputNewSectionCount').value)||0;
  if(count<=0){showToast('请输入数量');return;}
  var type=document.getElementById('inputNewSectionType').value;
  var cols=parseInt(document.getElementById('inputNewSectionCols').value)||3;
  if(!sub.sections)sub.sections=[];
  sub.sections.push({id:gid(),name:name,count:count,cols:cols,sectionType:type});
  for(var i=0;i<count;i++)sub.items.push(makeItem('品目'+(sub.items.length+1)));
  save();closeModal('addSectionModal');renderSubDetail();
}

/* Backup */
function exportData(){
  var blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='activity_backup_'+localDateStr()+'.json';a.click();
}
function importData(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{var data=JSON.parse(ev.target.result);
    if(!Array.isArray(data)){showToast('格式不正确');input.value='';return;}
    customConfirm('导入数据？将覆盖当前记录。',function(){events=data;normalizeEventData();save();renderEvents();closeModal('backupModal');});
    }catch(e){showToast('导入失败');}
    input.value='';
  };
  reader.readAsText(input.files[0]);
}

/* Init */
renderEvents();
