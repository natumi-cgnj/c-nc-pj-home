<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<title>Daily</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:24px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:1px;color:#666}
.top-bar .back{font-size:13px;color:#999;text-decoration:none}
.top-bar .btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer}
.status-bar{display:flex;justify-content:space-around;padding:12px 20px;background:#fff;border-bottom:1px solid #f0f0f0}
.status-item{text-align:center;min-width:80px}
.status-label{font-size:10px;color:#bbb;margin-bottom:2px}
.status-value{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.status-value.neal-color{color:#6B8AFF}
.status-value.jane-color{color:#5BA66B}
.status-value.sapphire-color{color:#6B8AFF}
.status-value.emerald-color{color:#5BA66B}
.status-value.coffee-color{color:#8B6914}
.status-value.tea-color{color:#5A7247}
.tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.tab{flex:1;text-align:center;padding:12px;font-size:12px;font-weight:500;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.drag-handle{cursor:grab;color:#ccc;font-size:14px;padding:0 4px;user-select:none;touch-action:none;flex-shrink:0;display:flex;align-items:center}
.drag-handle:active{cursor:grabbing;color:#999}
.dragging{opacity:0.5;background:#f8f8f8}
.drag-over{border-top:2px solid #E8B96A}
.clear-done{font-size:10px;color:#bbb;background:none;border:1px solid #e0e0e0;border-radius:5px;padding:2px 8px;cursor:pointer;font-family:inherit;margin-left:auto}
.clear-done:active{background:#f5f5f5;color:#999}
.sub-tabs{display:flex;gap:0;margin-bottom:12px;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden}
.sub-tab{flex:1;text-align:center;padding:8px;font-size:12px;font-weight:500;color:#999;cursor:pointer;background:#fff;border:none;font-family:inherit;transition:all 0.2s}
.sub-tab.active{background:#1a1a1a;color:#fff}
.content{padding:16px 20px}
.section-title{font-size:13px;font-weight:600;color:#999;margin-bottom:8px;letter-spacing:0.5px}
.task-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:all 0.2s}
.task-card.completed{opacity:0.45}
.task-top{display:flex;align-items:center;gap:12px}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-size:12px;color:#fff}
.task-check.checked{background:#1a1a1a;border-color:#1a1a1a}
.task-body{flex:1;min-width:0}
.task-name{font-size:13px;color:#333;margin-bottom:2px}
.task-meta{font-size:10px;color:#bbb;display:flex;gap:8px;flex-wrap:wrap}
.task-quote{font-size:11px;color:#999;font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid #f5f5f5;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.task-quote img{width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:2px}
.task-quote span{flex:1}
.task-reward-toast{font-size:11px;color:#5BA66B;text-align:center;padding:6px;min-height:20px}
.drop-label{font-size:9px;font-weight:500;letter-spacing:0.5px;margin-bottom:4px}
/* Commission - 3 columns */
.comm-columns{display:flex;flex-direction:column;gap:14px}
.comm-col{border:1px solid #eee;border-radius:10px;overflow:hidden}
.comm-col-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.comm-col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.comm-col-title{font-size:12px;font-weight:500;color:#555;flex:1}
.comm-col-status{font-size:10px;color:#bbb}
.comm-col-body{padding:12px 14px}
.comm-accept-btn{display:inline-block;font-size:11px;color:#E8B96A;border:1px solid #E8B96A;border-radius:6px;padding:4px 12px;background:#fff;cursor:pointer;font-family:inherit;margin-top:8px}
.comm-accept-btn:active{background:#fdf6eb}
.comm-accepted{font-size:10px;color:#5BA66B;margin-top:4px}
.comm-tomorrow-tag{font-size:9px;color:#bbb;background:#f8f8f8;border-radius:4px;padding:2px 6px;display:inline-block;margin-bottom:6px}
/* Progress section */
.progress-box{background:#fff;border:1.5px solid #E8B96A;border-radius:10px;padding:12px 14px;margin-top:16px;cursor:pointer}
.progress-bar-bg{background:#f0f0f0;border-radius:4px;height:4px;margin-top:8px;overflow:hidden}
.progress-bar-fill{background:#E8B96A;height:100%;border-radius:4px;transition:width 0.3s}
.pool-section{margin-bottom:18px}
.pool-header{display:flex;align-items:center;gap:8px;padding:7px 0;cursor:pointer}
.pool-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pool-title{font-size:12px;font-weight:500;color:#555;flex:1}
.pool-toggle{font-size:10px;color:#bbb;font-variant-numeric:tabular-nums}
.pool-list{display:none;margin:0 0 9px 16px;max-height:220px;overflow-y:auto}
.pool-list-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5f5f5}
.pool-list-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pool-list-name{flex:1;font-size:11px;color:#555}
.daily-complete{background:#f8faf7;border:1px solid #e2eadf;border-radius:10px;padding:16px 14px;text-align:center;color:#7b9575;font-size:12px}
/* Todo */
.todo-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.todo-card.completed{opacity:0.4}
.todo-card.completed .todo-name{text-decoration:line-through;color:#bbb}
.todo-top{display:flex;align-items:center;gap:12px}
.todo-check{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-size:12px;color:#fff}
.todo-check.checked{background:#1a1a1a;border-color:#1a1a1a}
.todo-body{flex:1;min-width:0}
.todo-name{font-size:13px;color:#333;margin-bottom:2px}
.todo-date{font-size:10px;color:#E8B96A}
.todo-date.overdue{color:#D85A30}
.todo-del{font-size:10px;color:#ccc;background:none;border:none;cursor:pointer;padding:4px}
.todo-edit{font-size:10px;color:#aaa;background:none;border:none;cursor:pointer;padding:4px;margin-right:2px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-header .section-title{margin-bottom:0}
.clickable-body{cursor:pointer}
/* Habits */
.habit-card{background:#fff;border:1px solid #eee;border-radius:11px;padding:14px 16px;margin-bottom:9px}
.habit-top{display:flex;align-items:flex-start;gap:12px}
.habit-add-btn{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;background:#fff;color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;line-height:1;transition:all .2s;margin-top:2px}
.habit-add-btn:active{background:#1a1a1a;border-color:#1a1a1a;color:#fff}
.habit-body{flex:1;min-width:0}
.habit-name{font-size:13px;color:#333;margin-bottom:2px}
.habit-meta{font-size:10px;color:#bbb}
.habit-streak{font-size:10px;color:#E8B96A;font-weight:500}
.habit-edit{font-size:10px;color:#aaa;background:none;border:none;cursor:pointer;padding:4px;margin-right:2px}
.habit-card.has-progress{border-color:#eadfc9}
.habit-stat-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px;font-variant-numeric:tabular-nums}
.habit-stat-tag{display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;font-size:9px;line-height:1.4;background:#E8B96A;color:#fff}
.habit-stat-tag.today{background:#f5efe4;color:#b48a3e}
.habit-undo-link{border:none;background:none;color:#bbb;font-size:9px;font-family:inherit;cursor:pointer;padding:2px 3px;margin-left:auto}
.habit-undo-link:active{color:#777}
.habit-section{margin-bottom:25px}
.habit-empty{font-size:11px;color:#ccc;padding:14px;text-align:center;background:#fff;border:1px dashed #e6e6e6;border-radius:9px}
.add-inline{width:100%;padding:12px;border:1px dashed #ddd;border-radius:10px;background:#fff;font-size:13px;color:#aaa;cursor:pointer;text-align:center;margin-top:8px;font-family:inherit}
.add-inline:active{background:#f8f8f8}
/* Interval indicator */
.interval-info{font-size:10px;color:#bbb;margin-top:4px}
.interval-info.ok{color:#5BA66B}
/* Type toggle */
.type-toggle{display:flex;gap:0;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden;margin-top:4px}
.type-toggle button{flex:1;padding:8px;font-size:13px;border:none;background:#fff;cursor:pointer;font-family:inherit;color:#999;transition:all 0.2s}
.type-toggle button.active{background:#1a1a1a;color:#fff}
.type-toggle.locked button{cursor:default;opacity:.45}
.type-toggle.locked button.active{opacity:1}
/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal textarea{resize:vertical;min-height:60px}
.modal .btn-row{display:flex;gap:8px;margin-top:20px}
.modal .btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.modal .btn-primary{background:#1a1a1a;color:#fff}
.modal .btn-cancel{background:#f0f0f0;color:#666}
.compact-modal-bg{align-items:center;padding:20px}
.compact-modal{border-radius:16px;width:100%;max-width:340px;padding:20px;animation:revealPop .22s ease-out}
.empty{text-align:center;padding:40px 20px;color:#ccc;font-size:13px;line-height:1.6}
.detail-description{font-size:13px;line-height:1.75;color:#555;white-space:pre-wrap;background:#fafafa;border-radius:10px;padding:12px 14px;min-height:48px}
.detail-meta{font-size:11px;color:#aaa;line-height:1.8;margin-top:12px}
.signin-popup{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;display:none;align-items:center;justify-content:center}
.signin-popup.show{display:flex}
.signin-box{background:#fff;border-radius:16px;padding:24px 20px;width:90%;max-width:340px;text-align:center;animation:revealPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes revealPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.signin-box h2{font-size:16px;font-weight:500;margin-bottom:4px}
.signin-streak-text{font-size:12px;color:#aaa;margin-bottom:12px}
.signin-reward-text{font-size:13px;color:#5BA66B;margin-bottom:16px;font-weight:500}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.streak-day{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-variant-numeric:tabular-nums}
.streak-day.signed{background:#1a1a1a;color:#fff}
.streak-day.today{border:2px solid #1a1a1a;font-weight:600}
.streak-day.empty{background:transparent}
.streak-day.future{background:#f5f5f5;color:#ccc}
.streak-day.past{background:#f0f0f0;color:#bbb}
.signin-close{margin-top:16px;padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
.streak-rewards{display:flex;gap:6px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.streak-reward{background:#fff;border:1px solid #eee;border-radius:6px;padding:4px 8px;text-align:center}
.streak-reward.claimed{border-color:#5BA66B;background:#f0faf2}
.streak-reward.current{border-color:#E8B96A}
.streak-reward .sr-day{font-size:9px;color:#aaa}
.streak-reward .sr-reward{font-size:10px;font-weight:500;color:#555}
.aff-row{display:flex;gap:8px}
.aff-row>div{flex:1}
</style>
</head>
<body>
<div class="top-bar">
  <a class="back" href="index.html?p=2">&larr; Home</a>
  <h1>DAILY</h1>
  <button class="btn-s" onclick="showModal('exportModal')">备份</button>
</div>
<div class="status-bar" id="statusBar"></div>
<div class="tabs">
  <div class="tab" data-tab="drop" onclick="switchTab('drop')">委托</div>
  <div class="tab active" data-tab="todo" onclick="switchTab('todo')">日程</div>
  <div class="tab" data-tab="habits" onclick="switchTab('habits')">日课</div>
</div>
<div class="content" id="content"></div>

<div class="signin-popup" id="signinPopup">
  <div class="signin-box">
    <h2 id="signinTitle">签到完成 ✦</h2>
    <div class="signin-streak-text" id="signinStreak"></div>
    <div class="signin-reward-text" id="signinRewardText"></div>
    <div id="signinCalendar"></div>
    <div class="streak-rewards" id="signinStreakRewards"></div>
    <button class="signin-close" onclick="closeSignin()">确认</button>
  </div>
</div>

<div class="modal-bg" id="todoModal">
  <div class="modal">
    <h2 id="todoModalTitle">添加日程</h2>
    <label>内容</label>
    <input type="text" id="todoContent" placeholder="如: 8.31前兑换商品券">
    <label>说明（可选）</label>
    <textarea id="todoDescription" rows="4" placeholder="详细记录放在这里"></textarea>
    <label>截止日期（可选）</label>
    <input type="date" id="todoDate" value="">
    <label>完成碎片</label>
    <div class="aff-row">
      <div><label style="margin-top:4px">画作 +</label><input type="number" id="todoAffNeal" value="3" min="0"></div>
      <div><label style="margin-top:4px">档案 +</label><input type="number" id="todoAffJane" value="2" min="0"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('todoModal')">取消</button>
      <button class="btn btn-primary" onclick="saveTodo()">保存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="habitModal">
  <div class="modal">
    <h2 id="habitModalTitle">添加日课</h2>
    <label>名称</label>
    <input type="text" id="habitName" placeholder="如: 洗澡">
    <label>说明（可选）</label>
    <textarea id="habitDescription" rows="4" placeholder="详细记录放在这里"></textarea>
    <label>类型</label>
    <input type="hidden" id="habitType" value="count" data-locked="false">
    <div class="type-toggle" id="habitTypeToggle">
      <button type="button" class="active" data-type="daily" onclick="setHabitType('daily')">间隔打卡</button>
      <button type="button" data-type="count" onclick="setHabitType('count')">Times</button>
    </div>
    <div id="habitTypeNote" style="font-size:10px;color:#bbb;margin-top:5px"></div>
    <div id="intervalRow" style="display:none">
      <label>间隔天数</label>
      <input type="number" id="habitInterval" value="1" min="1" max="30" placeholder="每 X 天打卡一次">
    </div>
    <label id="habitRewardLabel">每次记录产出</label>
    <div class="aff-row">
      <div><label style="margin-top:4px">咖啡豆</label><input type="number" id="habitCoffee" value="10" min="0" max="100"></div>
      <div><label style="margin-top:4px">茶叶</label><input type="number" id="habitTea" value="10" min="0" max="100"></div>
    </div>
    <div id="habitRewardHint" style="font-size:10px;color:#bbb;margin-top:4px"></div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('habitModal')">取消</button>
      <button class="btn btn-primary" onclick="saveHabit()">保存</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="detailModal">
  <div class="modal">
    <h2 id="detailTitle"></h2>
    <div class="detail-description" id="detailDescription"></div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('detailModal')">关闭</button></div>
  </div>
</div>

<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>数据备份</h2>
    <div style="padding:8px 0;">
      <button class="btn btn-cancel" style="margin-bottom:8px;width:100%;" onclick="exportData()">导出所有数据</button>
      <button class="btn btn-cancel" style="width:100%;" onclick="document.getElementById('importFile').click()">从备份导入</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none;">
    </div>
    <div style="border-top:1px solid #eee;margin-top:12px;padding-top:12px">
      <div style="font-size:12px;font-weight:600;color:#666;margin-bottom:8px">委托任务池</div>
      <div style="font-size:10px;color:#aaa;margin-bottom:8px;line-height:1.5">用 Excel 编辑委托任务，导出 CSV 后导入替换。列：id, card, ep, rarity, task, quote, nealAff, janeAff, src</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-cancel" style="font-size:11px;padding:6px 10px" onclick="exportDropPool()">导出委托 CSV</button>
        <label class="btn btn-cancel" style="font-size:11px;padding:6px 10px;cursor:pointer">导入委托 CSV<input type="file" accept=".csv" onchange="importDropPool(this)" style="display:none"></label>
      </div>
    </div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('exportModal')">关闭</button></div>
  </div>
</div>

<script src="cloud-sync.js?v=20260824-cbi-work1"></script>
<script src="cbi-data.js?v=20260901-wishes1"></script>
<script src="cbi-work.js?v=20260825-daily2"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
const IS_CBI_DAILY = window.WorldContext && WorldContext.getActiveWorldId() === 'cbi';
const DAILY_URL_TAB = new URLSearchParams(location.search).get('tab');
const IS_CBI_HABITS = IS_CBI_DAILY && DAILY_URL_TAB === 'habits';
let cbiDailyDb = null;
// ══════════════════════════════════════
// DROP TASK POOL
// ══════════════════════════════════════
let DROP_POOL=[
// Jane pool (23)
{id:"j01",card:"Pilot",ep:"S1E01",rarity:"SSR",task:"去一个你没去过的咖啡店，坐下来喝点东西",quote:"「我对你的活动范围有一些假设。去一个你没去过的店，坐下来。点什么都行。我想知道你会选什么。」",nealAff:0,janeAff:7,src:"jane"},
{id:"j02",card:"Red Hair and Silver Tape",ep:"S1E02",rarity:"R",task:"拍一张你现在窗外的样子",quote:"「你窗外现在长什么样？我好奇。不需要好看，我要的是真实信息。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j03",card:"Red Tide",ep:"S1E03",rarity:"R",task:"今天的午饭/晚饭拍一张照",quote:"「你吃了什么？拍给我看。不是要监督你，我在做数据收集。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j04",card:"Ladies in Red",ep:"S1E04",rarity:"R",task:"告诉我你今天穿了什么颜色的衣服",quote:"「今天穿的什么颜色？我在测试一个关于你穿衣习惯的假说。」",nealAff:0,janeAff:1,src:"jane"},
{id:"j05",card:"Redwood",ep:"S1E05",rarity:"R",task:"拍一张你经常走的那条路",quote:"「你每天走的路是什么样的？拍一张给我看。我想在脑子里建个模型。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j06",card:"Red-Handed",ep:"S1E06",rarity:"SR",task:"帮我查一下大阪今天日落的准确时间",quote:"「帮我查一下你那边今天日落几点几分。精确到分钟。…不告诉你为什么。」",nealAff:0,janeAff:4,src:"jane"},
{id:"j07",card:"Seeing Red",ep:"S1E07",rarity:"R",task:"闻一下你手边最近的东西是什么味道，告诉我",quote:"「你现在伸手能够到的最近的东西，闻一下，什么味道？我在做一个实验。」",nealAff:0,janeAff:1,src:"jane"},
{id:"j08",card:"The Thin Red Line",ep:"S1E08",rarity:"R",task:"写一句你今天的心情",quote:"「一句话。只要一句。描述你现在的状态。不需要积极，不需要完整，一句就够。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j09",card:"Flame Red",ep:"S1E09",rarity:"SR",task:"泡一杯红茶，慢慢喝完",quote:"「红茶。不加糖。…你加不加糖随你，但慢慢喝，别一口闷。你喝东西的方式太粗暴了。」",nealAff:0,janeAff:4,src:"jane"},
{id:"j10",card:"Red Brick and Ivy",ep:"S1E10",rarity:"R",task:"翻一下手机相册，找一张你觉得拍得好的旧照片",quote:"「翻一下你的相册，找一张你自己觉得拍得不错的照片。什么时候的都行。我想看你的审美。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j11",card:"Red John's Friends",ep:"S1E11",rarity:"SSR",task:"找一家你没吃过的店去吃一顿",quote:"「你总是去那几家店。今天换一家你没去过的。不需要好吃，我要的是你的新体验报告。」",nealAff:0,janeAff:6,src:"jane"},
{id:"j12",card:"Red Rum",ep:"S1E12",rarity:"R",task:"猜一下我现在在做什么",quote:"「猜一下我现在在做什么。不给提示。猜错没关系，我想看你怎么推理。」",nealAff:0,janeAff:1,src:"jane"},
{id:"j13",card:"Paint It Red",ep:"S1E13",rarity:"R",task:"拍一张你今天看到的最好看的颜色",quote:"「你注意力太往内走了。看看外面，找一个让你觉得好看的颜色，拍下来。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j14",card:"Crimson Casanova",ep:"S1E14",rarity:"R",task:"给我推荐一首你最近在听的歌",quote:"「推荐一首歌给我。不要想太多，第一反应就行。人的音乐品味比他们以为的更诚实。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j15",card:"Scarlett Fever",ep:"S1E15",rarity:"R",task:"形容一下你今天的天气，不准用“热”“冷”“还行”",quote:"「描述一下你那边现在的天气。不准用“热”、“冷”、“还行”这三个词。我要看你怎么表达。」",nealAff:0,janeAff:1,src:"jane"},
{id:"j16",card:"Bloodshot",ep:"S1E16",rarity:"SSR",task:"带娃去外面拍一张合照",quote:"「带他们出去。我想看他们在你的世界里是什么样的。在户外。…拍照的时候别太僵。」",nealAff:0,janeAff:7,src:"jane"},
{id:"j17",card:"Carnelian, Inc.",ep:"S1E17",rarity:"R",task:"告诉我你最近看的一部剧/电影，用一句话评价",quote:"「你最近看了什么？一句话评价。我对你的判断力有一些好奇。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j18",card:"Russet Potatoes",ep:"S1E18",rarity:"SR",task:"最近看的书或剧，写两三句观后感",quote:"「写一下感想。不需要长，两三句就行。我不是要你交作业，我想听你自己的想法。」",nealAff:0,janeAff:3,src:"jane"},
{id:"j19",card:"A Dozen Red Roses",ep:"S1E19",rarity:"R",task:"给一个你在意的人发一条消息（说什么都行）",quote:"「给一个你在意的人发条消息。内容不重要，发了就行。…不，我不算，发给别人。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j20",card:"Red Sauce",ep:"S1E20",rarity:"R",task:"告诉我你们那边便利店里最奇怪的商品是什么",quote:"「你们那边的便利店都卖什么奇怪的东西？我很好奇高维世界十几年后便利店进化成什么样了。」",nealAff:0,janeAff:2,src:"jane"},
{id:"j21",card:"Miss Red",ep:"S1E21",rarity:"SR",task:"帮我描述一下你家附近的一条商店街长什么样",quote:"「描述一下你家附近的商店街。什么店在什么位置，有什么味道，地面是什么颜色。我在还原场景。」",nealAff:0,janeAff:4,src:"jane"},
{id:"j22",card:"Blood Brothers",ep:"S1E22",rarity:"R",task:"找一个你身边的小东西，给它编一个一句话的故事",quote:"「随便拿一个你手边的东西。给它编一个故事。一句话就够。什么都行。我想看你的脑子怎么转。」",nealAff:0,janeAff:1,src:"jane"},
{id:"j23",card:"Red John's Footsteps",ep:"S1E23",rarity:"SSR",task:"去通天阁附近的商店街逛逛，吃一个串炸",quote:"「你住在大阪。新世界商店街离你不远。去走一圈，吃个串炸。不是命令，是建议。…好吧是命令。拍照。」",nealAff:0,janeAff:7,src:"jane"},
// Neal pool (14)
{id:"n01",card:"Pilot",ep:"S1E01",rarity:"SSR",task:"穿一身你觉得最好看的衣服，自拍一张",quote:"「You don't dress up for other people, Natumi. You dress up because you deserve it. 穿上你最好看的那一身，让我看看。」",nealAff:18,janeAff:0,src:"neal"},
{id:"n02",card:"Threads",ep:"S1E02",rarity:"R",task:"买一束花或者一枝花（什么花都行）",quote:"「给你的生活加一点颜色。不需要大束的，路边摘一枝都行。…但如果你要买，买好看的。我有审美标准。」",nealAff:6,janeAff:0,src:"neal"},
{id:"n03",card:"Book of Hours",ep:"S1E03",rarity:"R",task:"拍一张你觉得光线好看的照片",quote:"「你注意过光线吗？现在看看你周围，找一个光线最好看的角度，拍下来给我看。I collect beautiful things.」",nealAff:5,janeAff:0,src:"neal"},
{id:"n04",card:"Flip of the Coin",ep:"S1E04",rarity:"R",task:"今天吃一个你从来没吃过的口味/食物",quote:"「Life is too short to eat the same thing twice. 今天尝一个新口味，什么都行。Tell me about it later.」",nealAff:6,janeAff:0,src:"neal"},
{id:"n05",card:"The Portrait",ep:"S1E05",rarity:"R",task:"自拍一张（什么表情都行）",quote:"「我今天想看你的脸。什么表情都行。丑也行。…你不可能丑。但如果你非要丑着拍我也接受。」",nealAff:7,janeAff:0,src:"neal"},
{id:"n06",card:"All In",ep:"S1E06",rarity:"R",task:"做一杯好喝的饮料（手冲咖啡、果汁、什么都行）",quote:"「给自己做一杯好喝的。认真做，不是随便泡的那种。你值得一杯认真对待的饮料。I mean it.」",nealAff:5,janeAff:0,src:"neal"},
{id:"n07",card:"Free Fall",ep:"S1E07",rarity:"SSR",task:"去一家你一直想去但没去过的餐厅吃一顿",quote:"「You've been putting it off, haven't you? 那家你一直想去的店。今天去。不要再说下次了。去了告诉我好不好吃。」",nealAff:16,janeAff:0,src:"neal"},
{id:"n08",card:"Hard Sell",ep:"S1E08",rarity:"SR",task:"做一道你没做过的菜",quote:"「You know what's sexy? A man who can cook something new. 做一道你没做过的菜，不需要好吃，重点是你做了。拍给我看。」",nealAff:10,janeAff:0,src:"neal"},
{id:"n09",card:"Bad Judgment",ep:"S1E09",rarity:"SR",task:"给你的娃换一套新衣服拍张照",quote:"「他们值得一套新 look. Come on, 给他们换一身，拍给我看。我要审核。」",nealAff:10,janeAff:0,src:"neal"},
{id:"n10",card:"Vital Signs",ep:"S1E10",rarity:"R",task:"用你手边的东西摆一个好看的构图拍下来",quote:"「Composition is everything. 你手边有什么就用什么，摆一个你觉得好看的画面。不需要专业，你的眼光就够了。」",nealAff:5,janeAff:0,src:"neal"},
{id:"n11",card:"Home Invasion",ep:"S1E11",rarity:"R",task:"给我描述一下你今天闻到的最好闻的味道",quote:"「今天闻到什么好闻的了吗？描述给我听。I want to smell your world through your words.」",nealAff:6,janeAff:0,src:"neal"},
{id:"n12",card:"Bottlenecked",ep:"S1E12",rarity:"R",task:"画一个小涂鸦（什么都行，火柴人也行）",quote:"「Draw something. 什么都行，seriously. 火柴人、一只猫、一个圈。Art doesn't have to be perfect. 给我看。」",nealAff:6,janeAff:0,src:"neal"},
{id:"n13",card:"Front Man",ep:"S1E13",rarity:"R",task:"听一首你没听过的歌",quote:"「Try something new today. 随便搜一首你没听过的歌，听完告诉我什么感觉。Expand your world, gorgeous.」",nealAff:5,janeAff:0,src:"neal"},
{id:"n14",card:"Out of the Box",ep:"S1E14",rarity:"SSR",task:"带娃去一个好看的地方拍一组照片",quote:"「Take them somewhere beautiful. 商场也行，公园也行，anywhere that looks good. 他们值得一个好看的背景。你也是。」",nealAff:18,janeAff:0,src:"neal"},
// Duo pool (9)
{id:"d01",card:"Red Threads",rarity:"SR",task:"拍一张你今天的OOTD",quote:"Neal:「Let me see today's look.」Jane:「他说得好像你每天都精心打扮似的。但确实，拍一张吧，我也想看。」",nealAff:6,janeAff:2,src:"duo"},
{id:"d02",card:"Flame and Portrait",rarity:"SR",task:"做一页手账（拼贴/画画/贴纸/什么形式都行）",quote:"Neal:「Create something beautiful today, sweetheart.」Jane:「他说的太抽象了。就是做一页手账。什么形式都行。做完拍一张。」",nealAff:7,janeAff:2,src:"duo"},
{id:"d03",card:"Ladies All In",rarity:"SR",task:"认真吃一顿好吃的饭并且拍照",quote:"Jane:「你吃了吗？拍给我看。不然我不信。」Neal:「He's right, I don't trust you either. 而且我要看你吃的配不配得上你。」",nealAff:6,janeAff:2,src:"duo"},
{id:"d04",card:"Scarlett Hours",rarity:"SR",task:"去附近的书店或杂货店逛逛，不一定要买",quote:"Jane:「你多久没逛过实体店了？不用买。我想知道什么东西会让你停下脚步。」Neal:「If you do buy something though, make sure it's pretty.」",nealAff:5,janeAff:3,src:"duo"},
{id:"d05",card:"Crimson Free Fall",rarity:"SSR",task:"去通天阁商店街吃关东煮或串炸，拍照",quote:"Neal:「I heard 新世界 is something. 替我去看看那些花哨的招牌，and eat something local.」Jane:「他想看招牌。我想看你吃串炸的样子。各有所图。去吧。」",nealAff:10,janeAff:5,src:"duo"},
{id:"d06",card:"Blood and Coin",rarity:"SR",task:"尝一种你没喝过的饮料（便利店新品/新口味都算）",quote:"Jane:「你们那边便利店的饮料种类多得不正常。选一个你没喝过的。」Neal:「And if it's bad, your face will be funny, so either way we win.」",nealAff:5,janeAff:2,src:"duo"},
{id:"d07",card:"Russet Bottleneck",rarity:"SR",task:"去一家新的咖啡店或茶室坐坐",quote:"Neal:「我对你的咖啡品味很好奇。Find a new café, sit down, take your time.」Jane:「拍一张环境。我要分析那家店的客人构成。」",nealAff:6,janeAff:3,src:"duo"},
{id:"d08",card:"Paint the Box",rarity:"SSR",task:"带娃去一个好看的商场或公园，拍一组生活照",quote:"Neal:「Take them on a date. 商场、公园、anywhere with good light. 他们值得一个好看的下午。」Jane:「他说得好像他自己会带娃出门似的。但意思是对的。去吧，拍给我们看。」",nealAff:10,janeAff:5,src:"duo"},
{id:"d09",card:"Red Footsteps, Hard Sell",rarity:"SSR",task:"去尝一次日式烤肉或者一家你一直想去的餐厅",quote:"Neal:「You deserve a good meal, Natumi. 不是凑合的那种，是坐下来认真吃的那种。」Jane:「他难得没说废话。去吧。拍菜单给我看，我想知道你会点什么。」",nealAff:10,janeAff:5,src:"duo"},

// CSV helpers
function parseCSV(text){
  const lines=text.split('\n').map(l=>l.replace(/\r$/,''));if(lines.length<2)return[];
  function splitRow(line){const f=[];let c='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(inQ&&line[i+1]==='"'){c+='"';i++;}else inQ=!inQ;}else if(ch===','&&!inQ){f.push(c);c='';}else c+=ch;}f.push(c);return f;}
  const headers=splitRow(lines[0]).map(h=>h.trim());const rows=[];
  for(let i=1;i<lines.length;i++){if(!lines[i].trim())continue;const vals=splitRow(lines[i]);const obj={};headers.forEach((h,j)=>{obj[h]=vals[j]!==undefined?vals[j].trim():'';});rows.push(obj);}return rows;
}
function toCSV(headers,rows){function esc(v){v=String(v||'');if(v.includes(',')||v.includes('"')||v.includes('\n'))return '"'+v.replace(/"/g,'""')+'"';return v;}let csv=headers.join(',')+'\n';rows.forEach(r=>{csv+=headers.map(h=>esc(r[h])).join(',')+'\n';});return csv;}
function exportDropPool(){const bom='\uFEFF';const csv=toCSV(['id','card','ep','rarity','task','quote','nealAff','janeAff','src'],DROP_POOL);const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily_drop_pool.csv';a.click();}
function importDropPool(input){if(!input.files||!input.files[0])return;const reader=new FileReader();reader.onload=function(e){try{const rows=parseCSV(e.target.result);const data=rows.map((r,i)=>({id:r.id||'d_'+(i+1),card:r.card||'',ep:r.ep||'',rarity:r.rarity||'R',task:r.task||'',quote:r.quote||'',nealAff:Number(r.nealAff)||0,janeAff:Number(r.janeAff)||0,src:r.src||'neal'})).filter(r=>r.task);if(!data.length){alert('没有有效数据');return;}DROP_POOL=data;localStorage.setItem('daily_presets',JSON.stringify({dropPool:data}));alert('导入 '+data.length+' 条委托任务');render();}catch(ex){alert('导入失败：'+ex.message);}input.value='';};reader.readAsText(input.files[0]);}

    const oldDrops=db.todayDrops||{};

      const old=oldDrops[slot];
      if(old&&old.dropId){
        db.commissions.active[slot]={dropId:old.dropId,completed:!!old.completed};

    if(db.todayDrop&&db.todayDrop.dropId&&!db.todayDrop.dismissed){

      }
    }
    db.commissions.date=db.todayDate||null;
  }

}

  cbiDailyDb=CBIData.load();

    habits:cbiDailyDb.work.habits.map(h=>Object.assign({},h,{type:h.type==='interval'?'daily':'count'})),

    records:cbiDailyDb.work.habitRecords||{}
  };

if(!hdb.records)hdb.records={};
// Migrate old types
hdb.habits.forEach(h=>{
  if(h.type==='timer'||h.type==='time'){
    // Hours→interval daily: clear old minute-based records to prevent "90 days" display
    h.type='daily';
    Object.keys(hdb.records).forEach(date=>{
      if(hdb.records[date]&&hdb.records[date][h.id]){
        const oldVal=Number(hdb.records[date][h.id].value)||0;
        // Convert: if there was any activity that day, count as 1 day
        hdb.records[date][h.id]={value:oldVal>0?1:0,events:[]};
      }
    });
    // Delete timerLog so it doesn't restore minute values below
    delete h.timerLog;
  }
  if(!h.type)h.type='count';
  if(h.description===undefined)h.description=h.desc||'';
  if(h.type==='daily'&&!h.interval)h.interval=1; // default: every day
  if(h.timerLog&&typeof h.timerLog==='object'){Object.keys(h.timerLog).forEach(date=>{const value=Math.max(0,Number(h.timerLog[date])||0);if(!value)return;if(!hdb.records[date])hdb.records[date]={};const old=hdb.records[date][h.id];if(!old)hdb.records[date][h.id]={value,events:[]};else old.value=Math.max(Number(old.value)||0,value);});}
});
Object.keys(hdb.log).forEach(date=>{const ids=Array.isArray(hdb.log[date])?hdb.log[date]:[];if(!hdb.records[date])hdb.records[date]={};ids.forEach(id=>{if(!hdb.records[date][id])hdb.records[date][id]={value:1,events:[]};});});
function saveHabits(){
  if(IS_CBI_HABITS&&cbiDailyDb){
    cbiDailyDb.work.habits=hdb.habits.map(h=>({
      id:h.id,
      name:h.name,
      description:h.description||'',
      type:(h.type||'count')==='daily'?'interval':'count',
      interval:Math.max(1,Math.min(365,Number(h.interval)||1)),
      salary:Math.max(0,Math.floor(Number(h.salary)||0)),
      createdAt:h.createdAt||new Date().toISOString()
    }));
    cbiDailyDb.work.habitRecords=hdb.records;
    cbiDailyDb=CBIData.save(cbiDailyDb)||cbiDailyDb;
    return;
  }
  if(IS_CBI_DAILY)return;
  try{localStorage.setItem('habit_db',JSON.stringify(hdb));}catch(e){}
}
saveHabits();

// Daily reset at 4:00 AM
function shiftedDateKey(dayOffset=0){const d=new Date();d.setHours(d.getHours()-4);d.setDate(d.getDate()+dayOffset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const today=()=>shiftedDateKey(0);
const tomorrow=()=>shiftedDateKey(1);
const STREAK_REWARDS=[{day:3,emerald:3,sapphire:3},{day:7,emerald:5,sapphire:5},{day:14,emerald:8,sapphire:8},{day:21,emerald:10,sapphire:10},{day:30,emerald:15,sapphire:15}];

function autoSignin(){
  if(db.signin.lastDate===today())return;
  const yesterdayStr=shiftedDateKey(-1);
  if(db.signin.lastDate===yesterdayStr){db.signin.streak++;}else{db.signin.streak=1;}
  db.signin.lastDate=today();
  if(!db.signin.history.includes(today()))db.signin.history.push(today());
  let totalE=BASE_SIGNIN.emerald,totalS=BASE_SIGNIN.sapphire;
  STREAK_REWARDS.forEach(sr=>{if(db.signin.streak===sr.day){totalE+=sr.emerald;totalS+=sr.sapphire;}});
  addGemsToGacha(totalE,totalS);addBeans(10,10);save();
  showSigninPopup(totalE,totalS);
}
function showSigninPopup(e,s){
  document.getElementById('signinTitle').textContent='签到完成 ✦';
  document.getElementById('signinStreak').textContent='连续签到 '+db.signin.streak+' 天';
  let rewardMsg='祖母绿 +'+e+'  蓝宝石 +'+s+'  豆/叶 +10';
  const milestone=STREAK_REWARDS.find(sr=>sr.day===db.signin.streak);
  if(milestone)rewardMsg+='  ('+db.signin.streak+'日连续奖励！)';
  document.getElementById('signinRewardText').textContent='✦ '+rewardMsg;
  const now=new Date();const year=now.getFullYear(),month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();const todayDate=now.getDate();
  let cal='<div style="font-size:11px;color:#bbb;margin-bottom:6px;">'+(month+1)+'月</div><div class="streak-grid">';
  for(let i=0;i<firstDay;i++)cal+='<div class="streak-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){const ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const signed=db.signin.history.includes(ds);const isToday=d===todayDate;let cls='streak-day';if(signed)cls+=' signed';if(isToday)cls+=' today';else if(d>todayDate)cls+=' future';else if(!signed)cls+=' past';cal+='<div class="'+cls+'">'+d+'</div>';}
  cal+='</div>';document.getElementById('signinCalendar').innerHTML=cal;
  let srHtml=STREAK_REWARDS.map(sr=>{const claimed=db.signin.streak>=sr.day;const current=db.signin.streak<sr.day&&(STREAK_REWARDS.indexOf(sr)===0||db.signin.streak>=STREAK_REWARDS[STREAK_REWARDS.indexOf(sr)-1].day);return'<div class="streak-reward '+(claimed?'claimed':'')+' '+(current?'current':'')+'"><div class="sr-day">'+sr.day+'日</div><div class="sr-reward">💎×'+(sr.emerald+sr.sapphire)+'</div></div>';}).join('');
  document.getElementById('signinStreakRewards').innerHTML=srHtml;

}

// ══════════════════════════════════════
// COMMISSION SYSTEM (Preview Tomorrow → Accept → Active Today)
// ══════════════════════════════════════
function getPoolForSlot(slot){
  if(slot==='jane')return DROP_POOL.filter(d=>d.src==='jane');
  if(slot==='neal')return DROP_POOL.filter(d=>d.src==='neal');
  return DROP_POOL.filter(d=>d.src==='duo');
}
function pickRandomDrop(slot){
  const pool=getPoolForSlot(slot);
  const cm=db.commissions;
  // Exclude completed + currently active + other slots' previews
  const activeIds=['jane','neal','duo'].map(s=>cm.active[s]&&cm.active[s].dropId).filter(Boolean);
  const previewIds=['jane','neal','duo'].map(s=>cm.preview[s]).filter(Boolean);
  const excludeIds=[...db.completedDrops,...activeIds,...previewIds];
  const unfinished=pool.filter(d=>!excludeIds.includes(d.id));
  if(!unfinished.length)return null;
  return unfinished[Math.floor(Math.random()*unfinished.length)].id;
}

function initCommissions(){
  const cm=db.commissions;
  if(cm.date===today())return; // already initialized today

  // Check if this is a multi-day gap (last visit was >1 day ago)
  // In that case, accepted previews are stale - don't promote them
  const lastDate=cm.date;
  const yesterday=shiftedDateKey(-1);
  const isNextDay=lastDate===yesterday;

  // Day transition
  ['jane','neal','duo'].forEach(slot=>{
    // Return unfinished active tasks to pool (no penalty)
    cm.active[slot]=null;

    // Only promote accepted previews if this is the very next day
    if(isNextDay&&cm.accepted[slot]){
      cm.active[slot]={dropId:cm.accepted[slot],completed:false};
    }
    cm.accepted[slot]=null;

    // Generate new preview for tomorrow
    cm.preview[slot]=pickRandomDrop(slot);
  });
  cm.date=today();
  save();
}

function acceptCommission(slot){
  db.commissions.accepted[slot]=db.commissions.preview[slot];
  save();render();
}
function unacceptCommission(slot){
  db.commissions.accepted[slot]=null;
  save();render();
}

function completeActive(slot){
  const active=db.commissions.active[slot];
  if(!active||active.completed)return;
  active.completed=true;
  const d=DROP_POOL.find(x=>x.id===active.dropId);
  if(d){
    db.affinity.neal+=d.nealAff;db.affinity.jane+=d.janeAff;
    if(!db.completedDrops.includes(d.id))db.completedDrops.push(d.id);
  }
  save();render();
  if(d){setTimeout(()=>{const el=document.getElementById('taskToast');const parts=[];if(d.nealAff)parts.push('画作 +'+d.nealAff);if(d.janeAff)parts.push('档案 +'+d.janeAff);if(el)el.textContent='✦ '+parts.join('  ');},50);}
}

// ── Habits tab (Days = interval, Times = count, NO Hours) ──
function getHabitRecord(date,id,create=false){if(!hdb.records[date]){if(!create)return null;hdb.records[date]={};}if(!hdb.records[date][id]){if(!create)return null;hdb.records[date][id]={value:0,events:[]};}const record=hdb.records[date][id];if(!Array.isArray(record.events))record.events=[];return record;}
function getHabitTotal(id){return Object.keys(hdb.records).reduce((sum,date)=>{const record=hdb.records[date]&&hdb.records[date][id];return sum+(record&&Number(record.value)||0);},0);}
function getHabitToday(id){const record=getHabitRecord(today(),id,false);return record&&Number(record.value)||0;}
function getHabitDayValue(date,id){const record=hdb.records[date]&&hdb.records[date][id];return record&&Number(record.value)||0;}
function getHabitStreak(id){let offset=getHabitDayValue(today(),id)>0?0:-1;let streak=0;while(streak<10000&&getHabitDayValue(shiftedDateKey(offset),id)>0){streak++;offset--;}return streak;}
function getHabitStreakBonus(streak){if(streak>=30)return 1.5;if(streak>=14)return 1;if(streak>=7)return 0.5;return 0;}

// Get days since last check for interval habits
function getDaysSinceLastCheck(id){
  for(let i=0;i<365;i++){
    const d=shiftedDateKey(-i);
    if(getHabitDayValue(d,id)>0)return i;
  }
  return 999;
}
function getIntervalStatus(h){
  const interval=h.interval||1;
  const daysSince=getDaysSinceLastCheck(h.id);
  const daysUntil=interval-daysSince;
  if(daysSince===0)return{text:'今天已打卡 ✓',cls:'ok',due:false};
  if(daysUntil<=0)return{text:'该打卡了',cls:'due',due:true};
  return{text:'距下次打卡还有 '+daysUntil+' 天',cls:'',due:false};
}

function renderHabitCard(h){
  const type=h.type||'count';
  const todayValue=getHabitToday(h.id);
  const total=getHabitTotal(h.id);
  const streak=getHabitStreak(h.id);
  const streakBonus=getHabitStreakBonus(streak);
  const rewardParts=[];
  if(IS_CBI_HABITS){if(h.salary)rewardParts.push('工资 +$'+h.salary);}
  else{if(h.coffee)rewardParts.push('☕豆+'+h.coffee);if(h.tea)rewardParts.push('🍃叶+'+h.tea);}
  const record=getHabitRecord(today(),h.id,false);
  const canUndo=!!(record&&record.events&&record.events.length);
  const undoLink=canUndo?'<button class="habit-undo-link" onclick="event.stopPropagation();undoHabitProgress(\''+h.id+'\')">撤回</button>':'';

  if(type==='daily'){
    const isDone=todayValue>0;
    const intervalStatus=getIntervalStatus(h);
    const streakHtml=streak>0?' <span class="habit-streak">★'+streak+'天'+(streakBonus?' +'+Math.round(streakBonus*100)+'%':'')+'</span>':'';
    const intervalLabel=h.interval>1?'每'+h.interval+'天':'每天';
    return '<div class="habit-card'+(isDone?' has-progress':'')+'" data-id="'+h.id+'"><div class="habit-top"><div class="drag-handle" data-id="'+h.id+'">⠿</div><div class="todo-check'+(isDone?' checked':'')+'" onclick="'+(isDone?'':'recordHabitProgress(\''+h.id+'\',1)')+'">'+(isDone?'✓':'')+'</div><div class="habit-body clickable-body" onclick="openHabitDetail(\''+h.id+'\')"><div class="habit-name">'+escHtml(h.name)+' <span style="font-size:10px;color:#bbb">'+intervalLabel+'</span></div><div class="habit-meta">'+(rewardParts.length?rewardParts.join(' '):'无基础产出')+streakHtml+'</div><div class="interval-info '+intervalStatus.cls+'">'+intervalStatus.text+'</div><div class="habit-stat-tags"><span class="habit-stat-tag">累计 '+total+' 日</span></div></div><div class="habit-actions">'+undoLink+'<button class="habit-edit" onclick="openEditHabit(\''+h.id+'\')">✎</button><button class="todo-del" onclick="deleteHabit(\''+h.id+'\')">×</button></div></div></div>';
  }

  // count type
  const addAction="recordHabitProgress('"+h.id+"',1)";
  return '<div class="habit-card count-card'+(todayValue>0?' has-progress':'')+'" data-id="'+h.id+'"><div class="habit-top"><div class="drag-handle" data-id="'+h.id+'">⠿</div><button class="habit-add-btn" onclick="'+addAction+'">＋</button><div class="habit-body clickable-body" onclick="openHabitDetail(\''+h.id+'\')"><div class="habit-name">'+escHtml(h.name)+'</div><div class="habit-meta">'+(rewardParts.length?rewardParts.join(' '):'无基础产出')+'</div><div class="habit-stat-tags"><span class="habit-stat-tag today">今日 '+Math.round(todayValue)+'次</span><span class="habit-stat-tag">累计 '+Math.round(total)+'次</span></div></div><div class="habit-actions">'+undoLink+'<button class="habit-edit" onclick="openEditHabit(\''+h.id+'\')">✎</button><button class="todo-del" onclick="deleteHabit(\''+h.id+'\')">×</button></div></div></div>';
}

function recordHabitProgress(id,value){
  const h=hdb.habits.find(x=>x.id===id);value=Number(value)||0;if(!h||value<=0)return;
  const type=h.type||'count';
  if(type==='daily'){const existing=getHabitToday(id);if(existing>0)return;value=1;}
  const before=getHabitTotal(id);const after=before+value;
  const baseUnits=Math.round(value);
  const record=getHabitRecord(today(),id,true);
  record.value=(Number(record.value)||0)+value;
  const streak=getHabitStreak(id);
  const streakBonus=type==='daily'?getHabitStreakBonus(streak):0;
  const rewardUnits=Math.max(0,baseUnits);
  if(IS_CBI_HABITS){
    const salary=(h.salary||0)*rewardUnits+Math.round((h.salary||0)*Math.max(0,baseUnits)*streakBonus);
    record.events.push({value,salary,streak,streakBonus,at:new Date().toISOString()});
    cbiDailyDb.work.salary=(cbiDailyDb.work.salary||0)+salary;
    saveHabits();render();
    return;
  }
  const coffee=(h.coffee||0)*rewardUnits+Math.round((h.coffee||0)*Math.max(0,baseUnits)*streakBonus);
  const tea=(h.tea||0)*rewardUnits+Math.round((h.tea||0)*Math.max(0,baseUnits)*streakBonus);
  record.events.push({value,coffee,tea,streak,streakBonus,at:Date.now()});
  if(coffee||tea)addBeans(coffee,tea);
  saveHabits();render();
  // Store interval reminder data for index.html
  updateIntervalReminders();
}

function undoHabitProgress(id){
  const record=getHabitRecord(today(),id,false);if(!record||!record.events||!record.events.length)return;
  const event=record.events.pop();
  if(IS_CBI_HABITS){
    const salary=Math.max(0,Number(event.salary)||0);
    if((cbiDailyDb.work.salary||0)<salary){record.events.push(event);showHabitNotice('这笔工资已经花掉了，不能撤回本次登记');return;}
    record.value=Math.max(0,(Number(record.value)||0)-(Number(event.value)||0));
    cbiDailyDb.work.salary=Math.max(0,(cbiDailyDb.work.salary||0)-salary);
    if(record.value===0&&record.events.length===0)delete hdb.records[today()][id];
    if(hdb.records[today()]&&!Object.keys(hdb.records[today()]).length)delete hdb.records[today()];
    saveHabits();render();
    return;
  }
  record.value=Math.max(0,(Number(record.value)||0)-(Number(event.value)||0));
  const beans=getBeans();beans.coffee=Math.max(0,(beans.coffee||0)-(event.coffee||0));beans.tea=Math.max(0,(beans.tea||0)-(event.tea||0));saveBeans(beans);
  if(record.value===0&&record.events.length===0)delete hdb.records[today()][id];
  saveHabits();render();updateIntervalReminders();
}

function showHabitNotice(message){const el=document.getElementById('habitToast');if(!el)return;el.textContent=message;setTimeout(()=>{if(el.textContent===message)el.textContent='';},2600);}

// Store due habits for index.html character line reminders
function updateIntervalReminders(){
  if(IS_CBI_HABITS)return;
  const dueHabits=hdb.habits.filter(h=>h.type==='daily').map(h=>{
    const status=getIntervalStatus(h);return status.due?h.name:null;
  }).filter(Boolean);
  try{localStorage.setItem('habit_due_reminders',JSON.stringify(dueHabits));}catch(e){}
}

function setHabitType(type,force=false){
  const input=document.getElementById('habitType');if(!force&&input.dataset.locked==='true')return;
  input.value=type;
  document.querySelectorAll('#habitTypeToggle button').forEach(b=>{b.classList.toggle('active',b.dataset.type===type);});
  document.getElementById('intervalRow').style.display=type==='daily'?'block':'none';
  updateHabitTypeHint();
}
function openAddHabit(type='count'){
  editingHabitId=null;
  document.getElementById('habitModalTitle').textContent='添加日课';
  document.getElementById('habitName').value='';
  document.getElementById('habitDescription').value='';
  document.getElementById('habitType').dataset.locked='false';
  document.getElementById('habitTypeToggle').classList.remove('locked');
  document.getElementById('habitCoffee').value='10';
  document.getElementById('habitTea').value=IS_CBI_HABITS?'0':'10';
  document.getElementById('habitInterval').value='1';
  setHabitType(type,true);showModal('habitModal');
}
function openEditHabit(id){
  const h=hdb.habits.find(x=>x.id===id);if(!h)return;
  editingHabitId=id;
  document.getElementById('habitModalTitle').textContent='编辑日课';
  document.getElementById('habitName').value=h.name||'';
  document.getElementById('habitDescription').value=h.description||'';
  const locked=getHabitTotal(id)>0;
  document.getElementById('habitType').dataset.locked=String(locked);
  document.getElementById('habitTypeToggle').classList.toggle('locked',locked);
  document.getElementById('habitCoffee').value=IS_CBI_HABITS?(h.salary||0):(h.coffee||0);
  document.getElementById('habitTea').value=IS_CBI_HABITS?0:(h.tea||0);
  document.getElementById('habitInterval').value=h.interval||1;
  setHabitType(h.type||'count',true);showModal('habitModal');
}
function updateHabitTypeHint(){
  const type=document.getElementById('habitType').value;
  const locked=document.getElementById('habitType').dataset.locked==='true';
  const hints={daily:'设置间隔天数，到期提醒打卡',count:'适合贴纸、收纳等一次一次累积的事'};
  document.getElementById('habitTypeNote').textContent=locked?'已有统计记录，类型不再更改':(hints[type]||'');
  document.getElementById('habitRewardLabel').textContent=IS_CBI_HABITS?'每次记录工资':'每次记录产出';
  document.getElementById('habitRewardHint').textContent='只按实际记录累计';
}
function saveHabit(){
  const name=document.getElementById('habitName').value.trim();if(!name)return;
  const description=document.getElementById('habitDescription').value.trim();
  const type=document.getElementById('habitType').value;
  const salary=Math.max(0,Math.floor(Number(document.getElementById('habitCoffee').value)||0));
  const coffee=IS_CBI_HABITS?0:Math.max(0,Math.min(100,salary));
  const tea=IS_CBI_HABITS?0:Math.max(0,Math.min(100,parseInt(document.getElementById('habitTea').value)||0));
  const interval=Math.max(1,Math.min(IS_CBI_HABITS?365:30,parseInt(document.getElementById('habitInterval').value)||1));
  if(editingHabitId){
    const h=hdb.habits.find(x=>x.id===editingHabitId);
    if(h){h.name=name;h.description=description;if(getHabitTotal(h.id)===0)h.type=type;if(IS_CBI_HABITS)h.salary=salary;else{h.coffee=coffee;h.tea=tea;}h.interval=interval;}
  }else{
    const habit={id:'hb_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name,description,type,interval};
    if(IS_CBI_HABITS){habit.salary=salary;habit.createdAt=new Date().toISOString();}else{habit.coffee=coffee;habit.tea=tea;}
    hdb.habits.push(habit);
  }
  editingHabitId=null;
  document.getElementById('habitType').dataset.locked='false';
  document.getElementById('habitTypeToggle').classList.remove('locked');
  saveHabits();closeModal('habitModal');render();updateIntervalReminders();
}
function openHabitDetail(id){
  const h=hdb.habits.find(x=>x.id===id);if(!h)return;
  const type=h.type||'count';const streak=getHabitStreak(id);const streakBonus=getHabitStreakBonus(streak);
  const parts=[type==='daily'?'间隔打卡 (每'+(h.interval||1)+'天)':'Times','今日：'+(getHabitToday(id)>0?'已完成':'未完成'),'累计：'+getHabitTotal(id)+(type==='daily'?'日':'次')];
  if(streak)parts.push('连续：'+streak+'天'+(streakBonus?'（奖励 +'+Math.round(streakBonus*100)+'%）':''));
  if(IS_CBI_HABITS&&h.salary)parts.push('工资 +$'+h.salary+'/次');
  if(!IS_CBI_HABITS&&h.coffee)parts.push('咖啡豆 +'+h.coffee+'/次');
  if(!IS_CBI_HABITS&&h.tea)parts.push('茶叶 +'+h.tea+'/次');
  document.getElementById('detailTitle').textContent=h.name||'日课';
  document.getElementById('detailDescription').textContent=h.description||'没有填写详细说明';
  document.getElementById('detailMeta').textContent=parts.join(' · ');showModal('detailModal');
}
function deleteHabit(id){hdb.habits=hdb.habits.filter(x=>x.id!==id);Object.keys(hdb.records).forEach(date=>{delete hdb.records[date][id];if(!Object.keys(hdb.records[date]).length)delete hdb.records[date];});Object.keys(hdb.log).forEach(date=>{if(Array.isArray(hdb.log[date]))hdb.log[date]=hdb.log[date].filter(x=>x!==id);if(Array.isArray(hdb.log[date])&&!hdb.log[date].length)delete hdb.log[date];});saveHabits();render();}

// ══════════════════════════════════════
// EXPORT/IMPORT
// ══════════════════════════════════════
function exportData(){const bundle={version:4,daily_db:db,habit_db:hdb,gacha_st:getGacha(),bean_st:getBeans()};const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='daily_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(input){if(!input.files||!input.files[0])return;const reader=new FileReader();reader.onload=(ev)=>{try{const imp=JSON.parse(ev.target.result);if(!confirm('导入数据？将覆盖当前数据'))return;if(imp.daily_db){db=imp.daily_db;if(!db.commissions)db.commissions={date:null,preview:{jane:null,neal:null,duo:null},accepted:{jane:null,neal:null,duo:null},active:{jane:null,neal:null,duo:null}};if(imp.habit_db){hdb=imp.habit_db;if(!hdb.records)hdb.records={};saveHabits();}if(imp.gacha_st)saveGacha(imp.gacha_st);if(imp.bean_st)saveBeans(imp.bean_st);}else{db=imp;if(!db.commissions)db.commissions={date:null,preview:{jane:null,neal:null,duo:null},accepted:{jane:null,neal:null,duo:null},active:{jane:null,neal:null,duo:null}};}save();render();closeModal('exportModal');}catch(e){alert('导入失败：文件格式不正确');}};reader.readAsText(input.files[0]);}

function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');});});

// ══════════════════════════════════════
// DRAG SORT
// ══════════════════════════════════════
function initDragSort(containerId,dataType){
  const container=document.getElementById(containerId);if(!container)return;let dragEl=null;
  const getCards=()=>Array.from(container.children).filter(card=>card.dataset.id);
  container.querySelectorAll('.drag-handle').forEach(handle=>{handle.addEventListener('touchstart',onStart,{passive:false});handle.addEventListener('mousedown',onStart);});
  function onStart(e){e.preventDefault();dragEl=e.target.closest('.todo-card, .habit-card');if(!dragEl)return;dragEl.classList.add('dragging');document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);}
  function onMove(e){if(!dragEl)return;e.preventDefault();const y=e.touches?e.touches[0].clientY:e.clientY;const cards=getCards();cards.forEach(c=>c.classList.remove('drag-over'));for(const card of cards){if(card===dragEl)continue;const rect=card.getBoundingClientRect();if(y<rect.top+rect.height/2){card.classList.add('drag-over');break;}}}
  function onEnd(e){if(!dragEl)return;document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);const y=e.changedTouches?e.changedTouches[0].clientY:e.clientY;const dragId=dragEl.dataset.id;dragEl.classList.remove('dragging');const cards=getCards();cards.forEach(c=>c.classList.remove('drag-over'));let insertBefore=null;for(const card of cards){if(card===dragEl)continue;const rect=card.getBoundingClientRect();if(y<rect.top+rect.height/2){insertBefore=card.dataset.id;break;}}
    if(dataType==='todo'){const undated=db.todos.filter(t=>!t.completed&&!t.date);const item=undated.find(t=>t.id===dragId);if(!item){dragEl=null;return;}const others=undated.filter(t=>t.id!==dragId);const newOrder=[];if(!insertBefore){others.forEach(t=>newOrder.push(t));newOrder.push(item);}else{others.forEach(t=>{if(t.id===insertBefore)newOrder.push(item);newOrder.push(t);});}db.todos=[...db.todos.filter(t=>t.completed||t.date),...newOrder];save();render();}
    else if(dataType==='habit'){const item=hdb.habits.find(h=>h.id===dragId);if(!item){dragEl=null;return;}const sameType=hdb.habits.filter(h=>(h.type||'count')===item.type);const others=sameType.filter(h=>h.id!==dragId);const newOrder=[];if(!insertBefore){others.forEach(h=>newOrder.push(h));newOrder.push(item);}else{others.forEach(h=>{if(h.id===insertBefore)newOrder.push(item);newOrder.push(h);});}hdb.habits=[...hdb.habits.filter(h=>(h.type||'count')!==item.type),...newOrder];saveHabits();render();}
    dragEl=null;}
}

// ══════════════════════════════════════
function prepareCbiHabitPage(){
  document.body.dataset.cbiHabits='1';
  currentTab='habits';
  const tabs=document.querySelector('.tabs');
  if(tabs)tabs.style.display='none';
  const utility=document.querySelector('.top-bar .btn-s');
  if(utility)utility.remove();
  const salaryInput=document.getElementById('habitCoffee');
  if(salaryInput){
    salaryInput.removeAttribute('max');
    const label=salaryInput.parentElement&&salaryInput.parentElement.querySelector('label');
    if(label)label.textContent='工资';
  }
  const teaInput=document.getElementById('habitTea');
  if(teaInput&&teaInput.parentElement)teaInput.parentElement.style.display='none';
  document.getElementById('habitInterval').max='365';
  updateHabitTypeHint();
}
// Deep link: ?tab=drop|todo|habits
var urlTab = DAILY_URL_TAB;
if (IS_CBI_HABITS) {
  prepareCbiHabitPage();
  render();
} else if (IS_CBI_DAILY && window.CBIWork) {
  CBIWork.mount({initialTab:urlTab,lockedTab:['drop','todo','habits'].indexOf(urlTab)>=0?urlTab:''});
} else {
  autoSignin();
  updateIntervalReminders();
  if (urlTab && ['drop','todo','habits'].indexOf(urlTab) >= 0) { currentTab = urlTab; }
  render();
}
