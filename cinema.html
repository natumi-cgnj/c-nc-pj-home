<!DOCTYPE html>
<!-- Cinema build: 2026-07-31 -->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cinema">
<title>Cinema</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top,12px));border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#6B5ACD}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}
.view{display:none}.view.active{display:block}
#viewHome.active{min-height:100vh;min-height:100dvh}

/* ── Project list ── */
.project-list{padding:8px 0}
.project-row{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;position:relative}
.project-row:active{background:#F8F6FF}
.project-icon-wrap{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#F0EDFF;flex-shrink:0}
.project-icon-wrap img{width:100%;height:100%;object-fit:cover}
.project-icon-wrap .emoji-fb{font-size:22px}
.project-row-body{flex:1;min-width:0}
.project-row-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.project-row-name{font-size:14px;font-weight:500;color:#333}
.project-row-meta{font-size:11px;color:#bbb;display:flex;align-items:center;gap:8px}
.project-row-progress{flex:1;max-width:120px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.project-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#9B8AE8,#6B5ACD);transition:width 0.3s}
.project-row-pct{font-size:10px;color:#ccc;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.project-complete-star{font-size:12px;color:#9B8AE8;flex-shrink:0}
.project-row-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px;color:#ccc}
.project-row-add:active{background:#f8f8f8}
.shelf-header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;user-select:none;-webkit-user-select:none}
.shelf-header:active{background:#f5f5f5}
.shelf-line{flex:1;height:1px;background:#e0e0e0}
.shelf-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.shelf-arrow{font-size:8px;color:#ccc;transition:transform 0.25s;display:inline-block;width:8px}
.shelf-header.collapsed .shelf-arrow{transform:rotate(-90deg)}
.shelf-items{display:grid;grid-template-rows:1fr;overflow:hidden;transition:grid-template-rows 0.3s ease,opacity 0.25s ease;opacity:1}
.shelf-items>div{min-height:0}
.shelf-items.collapsed{grid-template-rows:0fr;opacity:0;pointer-events:none}
.duty-badge{font-size:9px;font-weight:500;letter-spacing:0.5px;display:inline-block;padding:1px 6px;border-radius:4px}
.project-row{touch-action:pan-y;position:relative}
.project-delete-x{display:none;position:absolute;top:50%;right:14px;transform:translateY(-50%) scale(0.3);width:20px;height:20px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(100,90,130,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:10px;line-height:17px;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewHome.project-arrange-mode .project-delete-x{display:block;opacity:1;transform:translateY(-50%) scale(1)}
#viewHome.project-arrange-mode .project-row{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewHome.project-arrange-mode .project-row-add{pointer-events:none;opacity:0.35}
.dragging{opacity:0.45;transform:scale(0.97);background:#F8F6FF;transition:opacity 0.2s,transform 0.2s}
.drag-over{box-shadow:0 -2px 0 0 #9B8AE8}

/* ── Detail header ── */
.detail-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.detail-header h2{font-size:15px;font-weight:600;color:#333;letter-spacing:0.5px}
.detail-overall{padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;background:#fff;border-bottom:1px solid #f5f5f5}
.detail-overall-bar{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.detail-overall-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#9B8AE8,#6B5ACD);transition:width 0.3s}

/* ── Item list (horizontal rows with poster) ── */
.item-list{padding:8px 0}
.item-row{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;position:relative}
.item-row:active{background:#F8F6FF}
.item-poster-wrap{width:42px;height:60px;border-radius:6px;overflow:hidden;background:#f0eeff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.item-poster-wrap img{width:100%;height:100%;object-fit:cover}
.item-poster-wrap .poster-placeholder{font-size:20px;color:#ccc}
.item-row-body{flex:1;min-width:0}
.item-row-name{font-size:14px;font-weight:500;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row-sub{font-size:11px;color:#bbb;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-row-check{width:22px;height:22px;border-radius:50%;border:1.5px solid #ddd;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all 0.2s}
.item-row-check.done{background:#9B8AE8;border-color:#9B8AE8}
.item-delete-x{display:none;position:absolute;top:50%;right:14px;transform:translateY(-50%) scale(0.3);width:20px;height:20px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(100,90,130,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:10px;line-height:17px;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewDetail.arrange-mode .item-delete-x{display:block;opacity:1;transform:translateY(-50%) scale(1)}
#viewDetail.arrange-mode .item-row{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewDetail.arrange-mode .item-row-check{display:none}
#viewDetail.arrange-mode .add-item-btn{pointer-events:none;opacity:0.35}
.item-row.drag-source{opacity:0.2}
.item-row.drag-over{box-shadow:0 -2px 0 0 #9B8AE8}
.add-item-btn{margin:0 20px 16px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}

/* ── Section dividers ── */
.section-divider{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.section-divider-line{flex:1;height:1px;background:#e0e0e0}
.section-divider-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px;cursor:text;border-bottom:1px dashed transparent;transition:color 0.15s,border-color 0.15s}
.section-divider-label:hover{color:#6B5ACD;border-bottom-color:#9B8AE8}

/* ── Item detail card ── */
.card-detail{width:calc(100% - 40px);max-width:520px;margin:20px auto;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card-detail-media{min-height:180px;max-height:420px;padding:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center}
.card-detail-img{display:block;width:auto;max-width:100%;height:auto;max-height:388px;object-fit:contain;border-radius:4px}
.card-detail-body{padding:14px 16px}
.card-detail-name{font-size:16px;font-weight:600;color:#333;margin-bottom:4px;cursor:default;border-bottom:1px dashed transparent;transition:border-color 0.15s}
.card-detail-name:hover{border-bottom-color:#9B8AE8}
.card-detail-name[contenteditable]{outline:none;border-bottom:1px solid #9B8AE8;cursor:text}
.card-detail-date{font-size:11px;color:#bbb;margin-bottom:8px}
.rating-row{display:flex;gap:6px;margin-top:8px;margin-bottom:4px}
.rating-btn{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:500;cursor:pointer;border:1.5px solid #e8e8e8;background:#fff;font-family:inherit;color:#bbb;transition:all 0.15s;letter-spacing:0.3px}
.rating-btn.active{color:#fff;border-color:transparent}
.rating-btn.r-love.active{background:#E85A6E}
.rating-btn.r-like.active{background:#E8A04A}
.rating-btn.r-fine.active{background:#B0B0B0}
.rating-btn.r-dull.active{background:#8AAAC4}
.rating-btn.r-hate.active{background:#6B6B8A}
.rating-badge{font-size:8px;font-weight:600;letter-spacing:0.5px;padding:1px 5px;border-radius:3px;color:#fff;display:inline-block;margin-left:4px;vertical-align:1px}
.rating-badge.r-love{background:#E85A6E}
.rating-badge.r-like{background:#E8A04A}
.rating-badge.r-fine{background:#B0B0B0}
.rating-badge.r-dull{background:#8AAAC4}
.rating-badge.r-hate{background:#6B6B8A}
.card-detail-info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.info-tag{font-size:11px;color:#6B5ACD;background:#F0EDFF;padding:2px 8px;border-radius:4px}
.card-detail-note{font-size:13px;color:#666;line-height:1.6;white-space:pre-wrap}
.card-detail-note[contenteditable]{outline:none;border-bottom:1px solid #9B8AE8;cursor:text}
.card-detail-item-note{margin-top:8px;padding:8px 10px;border-radius:8px;background:#faf8ff;font-size:12px;color:#777;line-height:1.6;white-space:pre-wrap}
.card-detail-item-note-label{display:block;margin-bottom:2px;font-size:9px;color:#bbb;letter-spacing:0.8px}
.card-actions{width:calc(100% - 40px);max-width:520px;display:flex;gap:8px;padding:0;margin:8px auto 0}
.card-actions .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Modals ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal textarea{resize:vertical;min-height:50px}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}
.file-label{display:block;padding:10px 12px;border:1px dashed #ddd;border-radius:8px;text-align:center;color:#aaa;font-size:12px;cursor:pointer;margin-top:4px}
.img-preview{width:100%;border-radius:8px;margin-top:8px;max-height:240px;object-fit:contain;background:#f7f7f7}
.duty-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.duty-opt{padding:4px 10px;border-radius:6px;border:1.5px solid #e0e0e0;font-size:12px;cursor:pointer;font-family:inherit;background:#fff;transition:all 0.15s}
.duty-opt.active{border-width:2px}
.duty-custom-row{display:flex;gap:12px;align-items:center;margin-top:8px}
.duty-custom-row input{flex:0 0 100px;min-width:0}
.color-picker-row{display:grid;grid-template-columns:repeat(8,28px);gap:5px;flex:1}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border 0.15s}
.color-swatch.active{border-color:#333}
.section-list{margin-top:8px}
.section-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
.section-row input{font-size:13px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-family:inherit}
.section-row input[type="text"]{flex:1 1 90px;min-width:70px}
.section-row input[type="number"]{flex:0 0 50px;min-width:0}
.section-row .del-sec{font-size:12px;color:#ccc;background:none;border:none;cursor:pointer;padding:4px}
.section-row.sec-dragging{opacity:0.4;background:#f8f8f8}
.section-row.sec-drag-over{box-shadow:0 -2px 0 0 #9B8AE8}
.add-section-btn{font-size:12px;color:#aaa;background:none;border:1px dashed #ddd;border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:6px;font-family:inherit;width:100%}

/* ── Checkin celebration ── */
.checkin-popup{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center}
.checkin-popup.show{display:flex}
.checkin-box{background:#fff;border-radius:16px;padding:24px 20px;width:85%;max-width:300px;text-align:center;animation:revealPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes revealPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.checkin-char-placeholder{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#fff}
.checkin-char-name{font-size:12px;font-weight:600;letter-spacing:0.5px;margin-bottom:4px}
.checkin-char-line{font-size:13px;color:#555;line-height:1.5;margin-bottom:16px;font-style:italic}
.checkin-ok{padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Action sheet ── */
.action-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:250;display:none;align-items:flex-end;justify-content:center}
.action-sheet-bg.show{display:flex}
.action-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:400px;padding:8px 0 env(safe-area-inset-bottom,8px)}
.action-sheet button{display:block;width:100%;padding:14px;background:none;border:none;border-bottom:1px solid #f5f5f5;font-size:14px;cursor:pointer;font-family:inherit;color:#333}
.action-sheet button:active{background:#f8f8f8}
.action-sheet button.cancel-as{color:#999;border-bottom:none}
.action-sheet button.del-as{color:#D85A30}

/* ── Confirm / Toast ── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}
.confirm-box p{font-size:14px;color:#333;margin-bottom:16px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:center}
.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:13px}
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,0.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1),opacity 0.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(min-width:700px){
  .item-list{max-width:640px;margin:0 auto}
  .add-item-btn{max-width:600px;margin-left:auto;margin-right:auto;display:block}
}
</style>
</head>
<body>

<!-- HOME VIEW -->
<div id="viewHome" class="view active">
  <div class="top-bar">
    <a class="back-btn" href="index.html">← Home</a>
    <h1>CINEMA</h1>
    <button class="btn-s" onclick="openModal('backupModal')">Backup</button>
  </div>
  <div class="project-list" id="projectList"></div>
</div>

<!-- DETAIL VIEW -->
<div id="viewDetail" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <h2 id="detailTitle"></h2>
    <button class="btn-s" id="projectHeaderBtn" onclick="handleProjectHeaderButton()">⋯</button>
  </div>
  <div class="detail-overall" id="detailOverall"></div>
  <div class="item-list" id="itemList"></div>
  <button class="add-item-btn" style="border-color:#E8B96A;color:#E8B96A" onclick="openAddItem()">New Title</button>
  <button class="add-item-btn" style="border-color:#9B8AE8;color:#9B8AE8" onclick="openAddSection()">New Section</button>
</div>

<!-- ITEM VIEW -->
<div id="viewItem" class="view">
  <div class="detail-header">
    <button class="back-btn" id="itemBackBtn">← Back</button>
    <h2 id="itemTitle"></h2>
    <button class="btn-s" onclick="openItemMenu()">⋯</button>
  </div>
  <div id="itemContent"></div>
</div>

<!-- Add/Edit project -->
<div class="modal-bg" id="projectModal">
  <div class="modal">
    <h2 id="projectModalTitle">New List</h2>
    <label>Cover</label>
    <label class="file-label" id="projectIconLabel">Select</label>
    <input type="file" accept="image/*" id="projectIconInput" onchange="previewProjectIcon(this)" style="display:none">
    <img id="projectIconPreview" class="img-preview" style="display:none">
    <label>Name</label>
    <input type="text" id="inputProjectName">
    <label>Shelf</label>
    <input type="text" id="inputProjectShelf">
    <label>Sections</label>
    <div class="section-list" id="sectionList"></div>
    <button class="add-section-btn" onclick="addSectionRow()">+ Section</button>
    <label>Notes</label>
    <textarea id="inputProjectNote"></textarea>
    <label>Label</label>
    <div class="duty-custom-row" id="dutyCustomRow" style="display:flex">
      <input type="text" id="dutyCustomName">
      <div class="color-picker-row" id="colorPicker"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('projectModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Save</button>
    </div>
  </div>
</div>

<!-- Add/Edit item -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <h2 id="itemModalTitle">New Title</h2>
    <div id="itemSectionField" style="display:none">
      <label>Section</label>
      <select id="inputItemSection"></select>
    </div>
    <label>Title</label>
    <input type="text" id="inputItemName">
    <label>Cover</label>
    <label class="file-label" id="itemFileLabel">Select</label>
    <input type="file" accept="image/*" id="itemImgInput" onchange="previewItemImg(this)" style="display:none">
    <img id="itemImgPreview" class="img-preview" style="display:none">
    <label>Release</label>
    <input type="text" id="inputItemRelease">
    <label>Studio</label>
    <input type="text" id="inputItemStudio">
    <label>Duration</label>
    <input type="text" id="inputItemDuration">
    <label>Notes</label>
    <textarea id="inputItemNote"></textarea>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('itemModal')">Cancel</button>
      <button class="btn btn-del" id="itemDeleteBtn" style="display:none" onclick="deleteEditingItem()">Delete</button>
      <button class="btn btn-primary" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- Check-in modal -->
<div class="modal-bg" id="checkinModal">
  <div class="modal">
    <h2 id="checkinModalTitle">Check In</h2>
    <label>Title</label>
    <input type="text" id="checkinItemName">
    <label>Date</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="date" id="checkinDate" style="flex:1">
      <button class="btn-s" type="button" id="monthOnlyBtn" onclick="toggleMonthOnly()" title="Month only" style="white-space:nowrap;font-size:10px">≈ Month</button>
    </div>
    <input type="hidden" id="monthOnlyFlag" value="0">
    <label>Rating</label>

<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');

/* ═══ DATA ═══ */
const SK='cinema_db';
let projects=[];
try{projects=JSON.parse(localStorage.getItem(SK))||[];}catch(e){projects=[];}

let curProjectId=null,curItemIdx=null,editProjectId=null,editItemIdx=null,editSectionIdx=null;
let projectTempIcon='',itemArrangeMode=false,itemPressState=null,itemClickSuppressedUntil=0;
const detailScrollByProject={};

function save(){localStorage.setItem(SK,JSON.stringify(projects));}
function gid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ═══ DIALOGS ═══ */
function customConfirm(msg,onYes,opts){
  const bg=document.getElementById('confirmBg'),box=bg.querySelector('.confirm-box');
  const yesLabel=(opts&&opts.yes)||'OK',noLabel=(opts&&opts.no)||'Cancel',isDanger=opts&&opts.danger;
  box.innerHTML=`<p>${msg}</p><div class="btn-row"><button class="btn btn-cancel" id="confirmNo">${esc(noLabel)}</button><button class="btn ${isDanger?'btn-del':'btn-primary'}" id="confirmYes">${esc(yesLabel)}</button></div>`;
  bg.classList.add('show');
  box.querySelector('#confirmYes').onclick=()=>{bg.classList.remove('show');onYes();};
  box.querySelector('#confirmNo').onclick=()=>{bg.classList.remove('show');};
  bg.onclick=e=>{if(e.target===bg)bg.classList.remove('show');};
}
let _toastTimer=null;
function showToast(msg,ms){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),ms||2200);}
function getProject(id){return projects.find(p=>p.id===id);}
function projectStats(p){let t=0,c=0;(p.items||[]).forEach(item=>{t++;if(item.collected)c++;});return{total:t,collected:c};}
function isGenericItemName(name){return !String(name||'').trim()||/^(?:Title \d+|影片\d+)$/.test(String(name).trim());}
function getItemDisplayName(p,item,idx){
  const name=String(item&&item.name||'').trim();
  if(!isGenericItemName(name))return name;
  const si=getItemSectionIndex(p,idx);
  const sec=si>=0&&p&&Array.isArray(p.sections)?p.sections[si]:null;
  return sec?String(sec.name||'').trim():'';
}

/* ═══ VIEWS ═══ */
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){setItemArrangeMode(false);switchView('viewHome');renderProjects();}
function currentScrollY(){return window.scrollY||document.documentElement.scrollTop||0;}
function rememberDetailScroll(){if(curProjectId)detailScrollByProject[curProjectId]=currentScrollY();}
function restoreDetailScroll(y){const t=Math.max(0,Number(y)||0);requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,t)));}
function returnToDetail(){
  const p=getProject(curProjectId);if(!p)return;
  const active=document.getElementById('viewDetail').classList.contains('active');
  const target=active?currentScrollY():(detailScrollByProject[curProjectId]||0);
  detailScrollByProject[curProjectId]=target;
  renderDetail(p);switchView('viewDetail');restoreDetailScroll(target);
}

/* ═══ DUTY ═══ */
const DUTY_PRESETS=[];
const CUSTOM_COLORS=['#9B8AE8','#6B5ACD','#D85A30','#E84A7A','#E8B96A','#C7A24C','#9B6BCC','#4AADE8','#3A8DD4','#5BA66B','#3D8B50','#6B8AFF','#4A6AE0','#888','#B0805A','#4ECDC4'];
let _dutyState={type:'',color:'#9B8AE8',name:''};

const CHECKIN_LINES={
  neal:[{line:'镜头语言不错，值得二刷。'},{line:'这个我可以给 7 分。嗯……7.5。'},{line:'配乐是亮点，你注意到了吗？'},{line:'是我推荐的吧？品味从不出错。'},{line:'一起看的时候更有意思。'}],
  jane:[{line:'嗯……还行。仅此而已。'},{line:'看完了？评价一下。'},{line:'你刚才那个表情……很入戏。'},{line:'偶尔看点好片也不坏。'},{line:'已记录。继续看下一部。'}],
  will:[{line:'好看吗好看吗！！我也要看！'},{line:'看完了就是满足～你说对不对！'},{line:'下次一起看嘛～'},{line:'还有几部没看？我帮你排计划！'},{line:'看着你打卡我又想看了……'}],
  other:[{line:'又看完一部，继续加油。'},{line:'观影进度 +1！'},{line:'不错不错，记录下来了。'}]
};
function showCheckinCelebration(duty){
  const d=duty||{};const charType=d.type||'';
  const lines=CHECKIN_LINES[charType]||CHECKIN_LINES.other;
  const pick=lines[Math.floor(Math.random()*lines.length)];
  const color=d.color||'#9B8AE8';

  let visual='';
  if(name)visual=`<div class="checkin-char-placeholder" style="background:${color}">${name[0]}</div>`;
  else if(d.name)visual=`<div class="checkin-char-placeholder" style="background:${color}">${d.name[0]||'★'}</div>`;
  else visual=`<div class="checkin-char-placeholder" style="background:#9B8AE8">🎬</div>`;

  document.getElementById('checkinCharName').textContent=name||d.name||'';

function closeCheckinPopup(){document.getElementById('checkinPopup').classList.remove('show');}

function renderDutyRow(sel){
  document.getElementById('dutyCustomRow').style.display='flex';
  document.getElementById('dutyCustomName').value=(sel&&sel.name)||'';
  renderColorPicker((sel&&sel.color)||'#9B8AE8');

function renderColorPicker(ac){document.getElementById('colorPicker').innerHTML=CUSTOM_COLORS.map(c=>`<div class="color-swatch ${c===ac?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');}
function selectDuty(type){}
function pickColor(c){_dutyState.color=c;renderColorPicker(c);}

/* ═══ PROJECT LIST ═══ */
function renderProjects(){
  const list=document.getElementById('projectList');
  const sorted=projects.sort((a,b)=>(a.order||0)-(b.order||0));
  const ungrouped=sorted.filter(p=>!p.shelf);
  const shelves={};const shelfOrder=[];
  sorted.forEach(p=>{
    if(!p.shelf)return;
    if(!shelves[p.shelf]){shelves[p.shelf]=[];shelfOrder.push(p.shelf);}
    shelves[p.shelf].push(p);
  });
  const collapsed=readJson('cinema_shelf_collapsed',{});
  let html='';
  ungrouped.forEach(p=>{html+=renderProjectRow(p);});
  shelfOrder.forEach(shelf=>{
    const isColl=!!collapsed[shelf];
    html+=`<div class="shelf-header${isColl?' collapsed':''}" onclick="toggleShelf('${esc(shelf)}')">
      <div class="shelf-line"></div>
      <span class="shelf-label">${esc(shelf)}</span>
      <span class="shelf-arrow">▼</span>
      <div class="shelf-line"></div>
    </div>`;
    html+=`<div class="shelf-items${isColl?' collapsed':''}"><div>`;
    shelves[shelf].forEach(p=>{html+=renderProjectRow(p);});
    html+=`</div></div>`;
  });
  html+=`<div class="project-row-add" onclick="openAddProject()">New List</div>`;
  list.innerHTML=html;initProjectDrag();
}
function renderProjectRow(p){
  const st=projectStats(p);const pct=st.total>0?Math.round(st.collected/st.total*100):0;
  const done=st.collected>=st.total&&st.total>0;
  const iconHtml=p.icon?`<img src="${p.icon}" alt="">`:`<div class="emoji-fb">🎬</div>`;
  const duty=p.duty||{};const dc=duty.color||'#9B8AE8';
  const dn=duty.name||'';
  const db=dn?`<span class="duty-badge" style="background:${dc}15;color:${dc}">${esc(dn)}</span>`:'';
  const bs=dn?`border-left:3px solid ${dc}`:'';
  const fs=dn?`background:linear-gradient(90deg,${dc},${dc}cc)`:'';
  return`<div class="project-row" style="${bs}" data-id="${p.id}" onclick="handleProjectRowClick('${p.id}')">
    <div class="project-icon-wrap">${iconHtml}</div>
    <div class="project-row-body">
      <div class="project-row-top"><span class="project-row-name">${esc(p.name)}</span>${db}${done?'<span class="project-complete-star">★</span>':''}</div>
      <div class="project-row-meta"><span>${st.collected} / ${st.total}</span><div class="project-row-progress"><div class="project-row-fill" style="width:${pct}%;${fs}"></div></div><span class="project-row-pct">${pct}%</span></div>
    </div>
    <button class="project-delete-x" aria-label="Delete" onclick="handleProjectDeleteClick(event,'${p.id}')">×</button>
  </div>`;
}
function toggleShelf(name){
  const collapsed=readJson('cinema_shelf_collapsed',{});
  collapsed[name]=!collapsed[name];
  writeJson('cinema_shelf_collapsed',collapsed);
  renderProjects();
}
function readJson(k,d){try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;}}
function writeJson(k,v){localStorage.setItem(k,JSON.stringify(v));}

/* ── Project drag/arrange ── */
let projectArrangeMode=false,projectClickSuppressed=0,projectDeleteArmedAt=0,projectGestureBound=false,projectPressState=null;
function setProjectArrangeMode(a){projectArrangeMode=!!a;document.getElementById('viewHome').classList.toggle('project-arrange-mode',projectArrangeMode);if(a){projectDeleteArmedAt=Date.now()+500;projectClickSuppressed=Date.now()+700;}else{projectDeleteArmedAt=0;projectClickSuppressed=Date.now()+400;clearProjectPress(false);}}
function handleProjectRowClick(id){if(projectArrangeMode||Date.now()<projectClickSuppressed)return;openProject(id);}
function handleProjectDeleteClick(e,id){e.preventDefault();e.stopPropagation();if(!projectArrangeMode||Date.now()<projectDeleteArmedAt)return;deleteProjectById(id);}
function deleteProjectById(id){const p=projects.find(pr=>pr.id===id);customConfirm(`Delete "${esc(p?p.name:'list')}"? All titles and check-in data will be lost.`,()=>{if(curProjectId===id){curProjectId=null;curItemIdx=null;setItemArrangeMode(false);switchView('viewHome');}projects=projects.filter(pr=>pr.id!==id);save();renderProjects();if(!projects.length)setProjectArrangeMode(false);},{yes:'Delete',danger:true});}
function initProjectDrag(){
  if(projectGestureBound)return;projectGestureBound=true;
  const list=document.getElementById('projectList');
  list.addEventListener('pointerdown',e=>{if(e.target.closest('.project-delete-x'))return;const row=e.target.closest('.project-row');if(!row||e.button)return;clearProjectPress(false);const state={row,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastY:e.clientY,activated:false,moved:false,timer:null};projectPressState=state;if(row.setPointerCapture)try{row.setPointerCapture(e.pointerId);}catch(err){}state.timer=setTimeout(()=>{if(projectPressState!==state)return;state.timer=null;state.activated=true;if(!projectArrangeMode)setProjectArrangeMode(true);projectClickSuppressed=Date.now()+700;if(navigator.vibrate)navigator.vibrate(12);},projectArrangeMode?170:450);});
  list.addEventListener('pointermove',e=>{const s=projectPressState;if(!s||s.pointerId!==e.pointerId)return;s.lastY=e.clientY;const d=Math.hypot(e.clientX-s.startX,e.clientY-s.startY);if(!s.activated){if(d>10)clearProjectPress(false);return;}if(d<=6)return;s.moved=true;s.row.classList.add('dragging');e.preventDefault();list.querySelectorAll('.project-row').forEach(c=>c.classList.remove('drag-over'));for(const card of list.querySelectorAll('.project-row')){if(card===s.row)continue;const r=card.getBoundingClientRect();if(e.clientY<r.top+r.height/2){card.classList.add('drag-over');break;}}},{passive:false});
  list.addEventListener('pointerup',e=>{const s=projectPressState;if(!s||s.pointerId!==e.pointerId)return;if(s.timer)clearTimeout(s.timer);releaseProjectPointer(s);if(s.activated||s.moved)projectClickSuppressed=Date.now()+700;if(s.activated&&s.moved)commitProjectDrag(s);clearProjectPress(false);});
  list.addEventListener('pointercancel',e=>{const s=projectPressState;if(!s||s.pointerId!==e.pointerId)return;projectClickSuppressed=Date.now()+700;clearProjectPress(false);});
  list.addEventListener('contextmenu',e=>{if(e.target.closest('.project-row'))e.preventDefault();});
  list.addEventListener('dragstart',e=>e.preventDefault());
  document.addEventListener('click',e=>{if(!projectArrangeMode||!document.getElementById('viewHome').classList.contains('active'))return;if(document.querySelector('.modal-bg.show,.action-sheet-bg.show,.confirm-bg.show'))return;if(e.target.closest('.project-row')||e.target.closest('.btn-s')||e.target.closest('.back-btn'))return;setProjectArrangeMode(false);});
}
function releaseProjectPointer(s){if(!s||!s.row||!s.row.releasePointerCapture)return;try{if(!s.row.hasPointerCapture||s.row.hasPointerCapture(s.pointerId))s.row.releasePointerCapture(s.pointerId);}catch(e){}}
function clearProjectPress(release=true){const s=projectPressState;if(!s)return;if(s.timer)clearTimeout(s.timer);if(release)releaseProjectPointer(s);s.row&&s.row.classList.remove('dragging');document.querySelectorAll('#projectList .project-row.drag-over').forEach(r=>r.classList.remove('drag-over'));projectPressState=null;}
function commitProjectDrag(state){
  const dragId=state.row.dataset.id;let insertBefore=null;
  for(const card of document.querySelectorAll('#projectList .project-row')){if(card===state.row||!card.dataset.id)continue;const r=card.getBoundingClientRect();if(state.lastY<r.top+r.height/2){insertBefore=card.dataset.id;break;}}
  const item=projects.find(p=>p.id===dragId);if(!item)return;const others=projects.filter(p=>p.id!==dragId);const newOrder=[];
  if(!insertBefore)newOrder.push(...others,item);else others.forEach(p=>{if(p.id===insertBefore)newOrder.push(item);newOrder.push(p);});
  newOrder.forEach((p,i)=>p.order=i);projects=newOrder;save();renderProjects();
}

/* ═══ PROJECT MODAL ═══ */
let _sections=[],sectionDragBound=false,sectionPressState=null;
function makeEmptyItem(n){return{id:gid(),name:'Title '+n,note:'',img:'',collected:false,collectedDate:null,checkinNote:'',checkinImg:'',releaseDate:'',studio:'',duration:''};}
function buildSectionDrafts(p){
  const src=p.sections&&p.sections.length?p.sections:[{name:'',count:p.items.length}];
  let off=0;const drafts=src.map(sec=>{const c=Math.max(0,parseInt(sec.count)||0);const d={name:sec.name||'',count:c,_items:p.items.slice(off,off+c)};off+=c;return d;});
  if(off<p.items.length){if(!drafts.length)drafts.push({name:'',count:0,_items:[]});const last=drafts[drafts.length-1];last._items.push(...p.items.slice(off));last.count=last._items.length;}
  return drafts;
}
function itemHasSavedContent(item){return !!(item&&(item.collected||item.img||item.note||item.checkinNote||item.checkinImg||item.releaseDate||item.studio||item.duration||!isGenericItemName(item.name)));}
function finalizeSectionDrafts(){
  const sections=[],items=[];let preserved=0;
  _sections.filter(s=>s.name||s.count>0||(s._items&&s._items.length)).forEach(sec=>{
    const req=Math.max(0,parseInt(sec.count)||0);const bucket=Array.isArray(sec._items)?sec._items.slice():[];const group=bucket.slice(0,req);
    for(let i=req;i<bucket.length;i++)if(itemHasSavedContent(bucket[i])){group.push(bucket[i]);preserved++;}
    while(group.length<req)group.push(makeEmptyItem(items.length+group.length+1));
    sections.push({name:sec.name||'',count:group.length});items.push(...group);
  });
  items.forEach((item,i)=>{if(isGenericItemName(item.name))item.name='Title '+(i+1);});
  return{sections,items,preserved};
}
function renderSectionList(){
  const list=document.getElementById('sectionList');
  if(!_sections.length){list.innerHTML='<div style="font-size:11px;color:#ccc;padding:8px 0">点下方"添加分类"设置分组</div>';return;}
  list.innerHTML=_sections.map((s,i)=>`<div class="section-row" data-sec-idx="${i}">
    <input type="text" value="${esc(s.name)}" onchange="_sections[${i}].name=this.value">
    <input type="number" value="${s.count||0}" min="0" max="99" style="width:50px" onchange="_sections[${i}].count=Math.max(0,parseInt(this.value)||0)">
    <button class="del-sec" onclick="_sections.splice(${i},1);renderSectionList()">×</button>
  </div>`).join('');
  initSectionDrag();
}
function addSectionRow(){_sections.push({name:'',count:0,_items:[]});renderSectionList();}
function initSectionDrag(){
  if(sectionDragBound)return;
  sectionDragBound=true;
  const list=document.getElementById('sectionList');
  list.addEventListener('pointerdown',e=>{
    if(e.target.closest('input')||e.target.closest('select')||e.target.closest('button'))return;
    const row=e.target.closest('.section-row');
    if(!row||(e.button!==undefined&&e.button!==0))return;
    clearSectionPress();
    const state={row,index:parseInt(row.dataset.secIdx),pointerId:e.pointerId,startY:e.clientY,lastY:e.clientY,activated:false,moved:false,timer:null};
    sectionPressState=state;
    if(row.setPointerCapture){try{row.setPointerCapture(e.pointerId);}catch(err){}}
    state.timer=setTimeout(()=>{if(sectionPressState!==state)return;state.timer=null;state.activated=true;if(navigator.vibrate)navigator.vibrate(12);},350);
  });
  list.addEventListener('pointermove',e=>{
    const state=sectionPressState;if(!state||state.pointerId!==e.pointerId)return;
    state.lastY=e.clientY;const distance=Math.abs(e.clientY-state.startY);
    if(!state.activated){if(distance>10)clearSectionPress();return;}
    if(distance<=6)return;state.moved=true;state.row.classList.add('sec-dragging');e.preventDefault();
    list.querySelectorAll('.section-row').forEach(r=>r.classList.remove('sec-drag-over'));
    for(const row of list.querySelectorAll('.section-row')){const idx=parseInt(row.dataset.secIdx);if(idx===state.index)continue;const r=row.getBoundingClientRect();if(e.clientY<r.top+r.height/2){row.classList.add('sec-drag-over');break;}}
  },{passive:false});
  list.addEventListener('pointerup',e=>{
    const state=sectionPressState;if(!state||state.pointerId!==e.pointerId)return;
    if(state.timer){clearTimeout(state.timer);state.timer=null;}
    if(state.activated&&state.moved)commitSectionDrag(state);clearSectionPress();
  });
  list.addEventListener('pointercancel',e=>{
    const state=sectionPressState;if(!state||state.pointerId!==e.pointerId)return;clearSectionPress();
  });
  function commitSectionDrag(state){
    let toIdx=_sections.length;

function openProject(id){setItemArrangeMode(false);curProjectId=id;const p=getProject(id);if(!p)return;renderDetail(p);switchView('viewDetail');}
function renderDetail(p){
  if(!p)p=getProject(curProjectId);if(!p)return;
  const st=projectStats(p);const pct=st.total>0?Math.round(st.collected/st.total*100):0;
  document.getElementById('detailTitle').textContent=p.name;
  document.getElementById('detailOverall').innerHTML=`<span>${st.collected} / ${st.total}</span><div class="detail-overall-bar"><div class="detail-overall-fill" style="width:${pct}%"></div></div><span>${pct}%</span>`;
  const container=document.getElementById('itemList');
  const sections=p.sections&&p.sections.length?p.sections:null;
  if(!sections){container.innerHTML=renderItemRows(p.items,0);return;}
  let html='',offset=0;
  sections.forEach((sec,si)=>{
    const count=sec.count||0;
    if(sec.name)html+=`<div class="section-divider"><div class="section-divider-line"></div><span class="section-divider-label" title="双击编辑" ondblclick="event.stopPropagation();openSectionQuickEdit(${si})">${esc(sec.name)}</span><div class="section-divider-line"></div></div>`;
    else if(si>0)html+=`<div class="section-divider"><div class="section-divider-line"></div></div>`;
    html+=renderItemRows(p.items.slice(offset,offset+count),offset);
    offset+=count;
  });
  if(offset<p.items.length)html+=renderItemRows(p.items.slice(offset),offset);
  container.innerHTML=html;
}
function renderItemRows(items,globalOffset){
  return items.map((item,i)=>{
    const idx=globalOffset+i;
    const posterHtml=item.img?`<img src="${item.img}" alt="">`:'<div class="poster-placeholder">🎞</div>';
    const displayName=getItemDisplayName(getProject(curProjectId),item,idx);
    const subParts=[];
    if(item.releaseDate)subParts.push(esc(item.releaseDate));
    if(item.studio)subParts.push(esc(item.studio));
    if(item.duration)subParts.push(esc(item.duration));
    if(!subParts.length&&item.note&&!item.collected)subParts.push(esc(item.note));
    const subHtml=subParts.length?subParts.join(' · '):(item.collectedDate?esc(item.collectedDate):'');
    return`<div class="item-row" data-index="${idx}" onclick="handleItemClick(${idx})">
      <div class="item-poster-wrap">${posterHtml}</div>
      <div class="item-row-body">
        <div class="item-row-name">${displayName?esc(displayName):('Title '+(idx+1))}${item.rating?`<span class="rating-badge r-${item.rating}">${item.rating.charAt(0).toUpperCase()+item.rating.slice(1)}</span>`:''}</div>
        ${subHtml?`<div class="item-row-sub">${subHtml}</div>`:''}
      </div>
      <div class="item-row-check ${item.collected?'done':''}">${item.collected?'✓':''}</div>
      <button class="item-delete-x" aria-label="删除" onclick="event.stopPropagation();deleteGridItem(${idx})">×</button>
    </div>`;
  }).join('');
}

function handleProjectHeaderButton(){if(itemArrangeMode){setItemArrangeMode(false);return;}openProjectMenu();}
function setItemArrangeMode(a){itemArrangeMode=!!a;const v=document.getElementById('viewDetail'),b=document.getElementById('projectHeaderBtn');if(v)v.classList.toggle('arrange-mode',a);if(b){b.textContent=a?'完成':'⋯';}if(!a)clearItemArrangeGesture();}
function moveGridItem(fromIdx,toIdx){
  const p=getProject(curProjectId);if(!p||fromIdx===toIdx||!p.items[fromIdx]||!p.items[toIdx])return false;
  const fromSec=getItemSectionIndex(p,fromIdx),toSec=getItemSectionIndex(p,toIdx);
  if(fromSec>=0&&toSec>=0&&fromSec!==toSec){p.sections[fromSec].count=Math.max(0,(parseInt(p.sections[fromSec].count)||0)-1);p.sections[toSec].count=(parseInt(p.sections[toSec].count)||0)+1;}
  const scroll=currentScrollY(),item=p.items.splice(fromIdx,1)[0];p.items.splice(toIdx,0,item);
  p.items.forEach((it,i)=>{if(isGenericItemName(it.name))it.name='Title '+(i+1);});
  save();renderDetail(p);restoreDetailScroll(scroll);return true;
}
function clearItemArrangeGesture(){
  const s=itemPressState;if(s&&s.timer)clearTimeout(s.timer);
  if(s&&s.row&&s.row.releasePointerCapture)try{s.row.releasePointerCapture(s.pointerId);}catch(e){}
  document.querySelectorAll('#itemList .drag-source,#itemList .drag-over').forEach(el=>el.classList.remove('drag-source','drag-over'));
  itemPressState=null;
}
function setupItemArrangeGestures(){
  const list=document.getElementById('itemList');if(!list)return;
  list.addEventListener('pointerdown',e=>{
    if(e.target.closest('button'))return;const row=e.target.closest('.item-row');if(!row||(e.button!==undefined&&e.button!==0))return;
    clearItemArrangeGesture();const state={row,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,targetIdx:parseInt(row.dataset.index),activated:false,timer:null};itemPressState=state;
    if(row.setPointerCapture)try{row.setPointerCapture(e.pointerId);}catch(err){}
    state.timer=setTimeout(()=>{if(itemPressState!==state)return;state.activated=true;setItemArrangeMode(true);row.classList.add('drag-source');if(navigator.vibrate)navigator.vibrate(12);},420);
  });
  list.addEventListener('pointermove',e=>{
    const s=itemPressState;if(!s||s.pointerId!==e.pointerId)return;const distance=Math.hypot(e.clientX-s.startX,e.clientY-s.startY);
    if(!s.activated){if(distance>10)clearItemArrangeGesture();return;}e.preventDefault();
    document.querySelectorAll('#itemList .item-row.drag-over').forEach(el=>el.classList.remove('drag-over'));
    const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.item-row');if(target&&target!==s.row&&list.contains(target)){target.classList.add('drag-over');s.targetIdx=parseInt(target.dataset.index);}
  },{passive:false});
  const finish=e=>{const s=itemPressState;if(!s||s.pointerId!==e.pointerId)return;if(s.activated){itemClickSuppressedUntil=Date.now()+700;if(s.targetIdx!==parseInt(s.row.dataset.index))moveGridItem(parseInt(s.row.dataset.index),s.targetIdx);}clearItemArrangeGesture();};
  list.addEventListener('pointerup',finish);list.addEventListener('pointercancel',finish);
  list.addEventListener('contextmenu',e=>{if(e.target.closest('.item-row'))e.preventDefault();});
  list.addEventListener('dragstart',e=>e.preventDefault());
}
function deleteGridItem(idx){

function getItemSectionIndex(p,idx){if(!p.sections||!p.sections.length||idx===null||idx<0)return -1;let off=0;for(let i=0;i<p.sections.length;i++){const c=Math.max(0,parseInt(p.sections[i].count)||0);if(idx>=off&&idx<off+c)return i;off+=c;}return -1;}
function getSectionEndIndex(p,si){let end=0;for(let i=0;i<=si&&i<p.sections.length;i++)end+=Math.max(0,parseInt(p.sections[i].count)||0);return Math.min(end,p.items.length);}

function deleteSectionQuickEdit(){

    p.items.splice(start,Math.min(count,Math.max(0,p.items.length-start)));p.sections.splice(si,1);

function startInlineEdit(elId,field){
  const el=document.getElementById(elId);if(!el)return;const p=getProject(curProjectId);if(!p||curItemIdx===null)return;const item=p.items[curItemIdx];
  el.contentEditable='true';el.style.color='';el.style.fontStyle='';
  if(field==='checkinNote'&&!item.checkinNote)el.textContent='';
  el.focus();const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  function commit(){el.contentEditable='false';const val=el.textContent.trim();item[field]=val;
    if(field==='name'){document.getElementById('itemTitle').textContent=getItemDisplayName(p,item,curItemIdx);if(!val)el.textContent=getItemDisplayName(p,item,curItemIdx);}
    if(field==='checkinNote'&&!val){el.textContent='add notes...';el.style.color='#ccc';el.style.fontStyle='italic';}
    save();el.removeEventListener('blur',commit);el.removeEventListener('keydown',onKey);}

  el.addEventListener('blur',commit);el.addEventListener('keydown',onKey);

  renderItemSectionSelect(p,getItemSectionIndex(p,curItemIdx));openModal('itemModal');
}
function previewItemImg(input){if(!input.files||!input.files[0])return;optimizedImageDataUrl(input.files[0],1000).then(d=>{const p=document.getElementById('itemImgPreview');p.dataset.source=d;p.src=d;p.style.display='block';}).catch(()=>showToast('图片读取失败'));}
async function saveItem(){
  const p=getProject(curProjectId);if(!p)return;const wasEditing=editItemIdx!==null;
  const existingItem=wasEditing?p.items[editItemIdx]:null;const stableId=existingItem&&existingItem.id?existingItem.id:gid();
  if(existingItem&&!existingItem.id)existingItem.id=stableId;
  const selectedSection=getSelectedItemSection(p);
  const inputName=document.getElementById('inputItemName').value.trim();
  const name=wasEditing?inputName:(inputName||('Title '+(p.items.length+1)));
  const note=document.getElementById('inputItemNote').value.trim();
  const releaseDate=document.getElementById('inputItemRelease').value.trim();
  const studio=document.getElementById('inputItemStudio').value.trim();
  const duration=document.getElementById('inputItemDuration').value.trim();
  const preview=document.getElementById('itemImgPreview');
  let img=preview.style.display!=='none'?(preview.dataset.source||''):'';
  if(img&&img.startsWith('data:')&&window.CloudSync)try{img=await CloudSync.uploadDataUrl(img,`cinema/${curProjectId}_${stableId}.${imagePathExt(img)}`);}catch(e){}
  if(wasEditing){
    const item=p.items[editItemIdx];if(item){item.name=name;item.note=note;item.releaseDate=releaseDate;item.studio=studio;item.duration=duration;if(img)item.img=img;
      const oldSec=getItemSectionIndex(p,editItemIdx);
      if(selectedSection>=0&&selectedSection!==oldSec){p.items.splice(editItemIdx,1);if(oldSec>=0)p.sections[oldSec].count=Math.max(0,(parseInt(p.sections[oldSec].count)||0)-1);const at=getSectionEndIndex(p,selectedSection);p.items.splice(at,0,item);p.sections[selectedSection].count=(parseInt(p.sections[selectedSection].count)||0)+1;curItemIdx=at;editItemIdx=at;}
    }
  }else{
    const item={id:stableId,name,note,img,collected:false,collectedDate:null,checkinNote:'',checkinImg:'',releaseDate,studio,duration};
    if(selectedSection>=0){const at=getSectionEndIndex(p,selectedSection);p.items.splice(at,0,item);p.sections[selectedSection].count=(parseInt(p.sections[selectedSection].count)||0)+1;}else p.items.push(item);
  }
  p.count=p.items.length;save();closeModal('itemModal');
  if(wasEditing){if(document.getElementById('viewItem').classList.contains('active'))openItem(curItemIdx);else renderDetail(p);}else renderDetail(p);
}
function deleteEditingItem(){if(editItemIdx===null)return;curItemIdx=editItemIdx;deleteItem();}
function deleteItem(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  customConfirm('删除这部影片？打卡记录也会一起删除。',()=>{
    const si=getItemSectionIndex(p,curItemIdx);if(si>=0)p.sections[si].count=Math.max(0,(parseInt(p.sections[si].count)||0)-1);
    p.items.splice(curItemIdx,1);p.count=p.items.length;curItemIdx=null;editItemIdx=null;
    closeModal('itemModal');save();returnToDetail();
  },{yes:'Delete',danger:true});
}

/* ═══ IMAGE HELPERS ═══ */
function optimizedImageDataUrl(file,maxSize){
  return new Promise((resolve,reject)=>{if(!file){reject(new Error('没有选择图片'));return;}
    const reader=new FileReader();reader.onerror=()=>reject(reader.error);
    reader.onload=ev=>{const img=new Image();img.onerror=()=>reject(new Error('图片格式无法读取'));
      img.onload=()=>{const c=document.createElement('canvas');const M=maxSize||1000;let w=img.width,h=img.height;if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const keepAlpha=file.type==='image/png';resolve(c.toDataURL(keepAlpha?'image/png':'image/jpeg',keepAlpha?undefined:0.82));};img.src=ev.target.result;};reader.readAsDataURL(file);});
}
function imagePathExt(d){if(String(d).startsWith('data:image/png'))return'png';if(String(d).startsWith('data:image/webp'))return'webp';return'jpg';}

async function uploadInlineCinemaImages(targetProjects){
  if(!window.CloudSync)return false;
  await CloudSync.whenReady();
  let changed=false;
  for(const p of targetProjects){
    if(!p.id){p.id=gid();changed=true;}
    if(p.icon&&p.icon.startsWith('data:')){p.icon=await CloudSync.uploadDataUrl(p.icon,`cinema/${p.id}_icon.${imagePathExt(p.icon)}`);changed=true;}
    if(!Array.isArray(p.items))p.items=[];
    for(const item of p.items){
      if(!item.id){item.id=gid();changed=true;}
      if(item.img&&item.img.startsWith('data:')){item.img=await CloudSync.uploadDataUrl(item.img,`cinema/${p.id}_${item.id}.${imagePathExt(item.img)}`);changed=true;}
      if(item.checkinImg&&item.checkinImg.startsWith('data:')){item.checkinImg=await CloudSync.uploadDataUrl(item.checkinImg,`cinema/${p.id}_${item.id}_checkin.${imagePathExt(item.checkinImg)}`);changed=true;}
    }
  }
  return changed;
}

function collectCinemaAssetRefs(sourceProjects){
  const refs=new Set();
  for(const p of sourceProjects||[]){
    if(p.icon&&String(p.icon).startsWith('cloud://'))refs.add(String(p.icon));
    for(const item of Array.isArray(p.items)?p.items:[]){
      if(item.img&&String(item.img).startsWith('cloud://'))refs.add(String(item.img));
      if(item.checkinImg&&String(item.checkinImg).startsWith('cloud://'))refs.add(String(item.checkinImg));
    }
  }
  return refs;
}

async function checkOrphanedCinemaAssets(){
  if(!window.CloudSync||typeof CloudSync.listAssets!=='function'||typeof CloudSync.deleteAssets!=='function'){
    showToast('请刷新页面后再检查');return;
  }
  try{
    showToast('正在检查影视图片…');
    const stored=await CloudSync.listAssets('cinema');
    const refs=collectCinemaAssetRefs(projects);
    const orphaned=stored.filter(value=>!refs.has(value));
    if(!orphaned.length){showToast('没有发现无引用图片');return;}
    customConfirm(
      `找到 ${orphaned.length} 张当前片单未引用的图片。清理后，旧快照中若仍有已删影片，其图片将无法恢复。确认清理？`,
      async()=>{
        try{
          const removed=await CloudSync.deleteAssets(orphaned);
          showToast(`已清理 ${removed} 张无引用图片`);
        }catch(e){console.warn('Cinema orphan cleanup failed:',e);showToast('清理失败，请稍后重试');}
      },
      {yes:'清理',danger:true}
    );
  }catch(e){console.warn('Cinema orphan scan failed:',e);showToast('检查失败，请稍后重试');}
}

/* ═══ MENUS / MODALS / BACKUP ═══ */
function openProjectMenu(){document.getElementById('projectMenuSheet').classList.add('show');}
function openItemMenu(){document.getElementById('itemMenuSheet').classList.add('show');}
function closeSheet(id){document.getElementById(id).classList.remove('show');}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){const m=document.getElementById(id);if(m)m.classList.remove('show');}
document.querySelectorAll('.modal-bg,.action-sheet-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)closeModal(bg.id);});});
document.getElementById('projectIconLabel').addEventListener('click',()=>document.getElementById('projectIconInput').click());
document.getElementById('itemFileLabel').addEventListener('click',()=>document.getElementById('itemImgInput').click());
document.getElementById('checkinImgLabel').addEventListener('click',()=>document.getElementById('checkinImgInput').click());

function exportData(){const blob=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cinema_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importData(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)){showToast('格式不正确');input.value='';return;}
      customConfirm('导入数据？将覆盖当前记录。',async()=>{
        try{
          if(window.CloudSync){
            showToast('正在上传导入图片…');
            await uploadInlineCinemaImages(data);
          }
          projects=data;save();renderProjects();closeModal('backupModal');showToast('导入完成');
        }catch(e){console.warn('Cinema import failed:',e);showToast('图片上传失败，原记录未覆盖');}
      });
    }catch(e){showToast('导入失败');}
    input.value='';
  };
  reader.readAsText(input.files[0]);
}

/* ═══ CLOUD MIGRATE ═══ */
async function migrateLocalImages(){
  if(!window.CloudSync)return;
  try{
    const changed=await uploadInlineCinemaImages(projects);
    if(changed){save();renderProjects();}
  }catch(e){console.warn('Cinema image migration pending:',e);}
}

/* ═══ INIT ═══ */
renderProjects();
setupItemArrangeGestures();
migrateLocalImages();
</script>
