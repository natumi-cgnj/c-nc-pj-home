<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dynamics">
<title>Dynamics</title>
<style>
html{scrollbar-gutter:stable}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#fafafa;color:#292929;min-height:100vh;min-height:100dvh}
.top-bar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:15px 20px;padding-top:calc(15px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.96);border-bottom:1px solid #eeeeec}
.top-bar h1{font-size:12px;font-weight:500;letter-spacing:3.2px;color:#8d8579;white-space:nowrap}
.top-bar a{font-size:11px;color:#aaa;text-decoration:none}
.top-bar .home{justify-self:start}.top-bar .shop{justify-self:end}
.status{padding:22px 20px 18px;background:#fff;border-bottom:1px solid #eeeeec}
.kicker{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:#b1aaa0}
.status-line{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:7px}
.status h2{font-size:19px;font-weight:450}
.owned-count{font-size:10px;color:#aaa;font-variant-numeric:tabular-nums}
.status p{margin-top:7px;color:#aaa;font-size:10px;line-height:1.65}
.empty{display:flex;min-height:calc(100dvh - 168px);padding:72px 28px 110px;align-items:flex-start;justify-content:center;text-align:center}
.empty-inner{max-width:340px}
.empty-mark{font-size:30px;font-weight:200;color:#cac5bd}
.empty-title{margin-top:15px;font-size:14px;font-weight:500;color:#555}
.empty-copy{margin-top:8px;color:#aaa;font-size:10px;line-height:1.85}
.empty a{display:inline-block;margin-top:20px;padding:7px 1px;border-bottom:1px solid #aaa;color:#777;font-size:10px;text-decoration:none}
.waiting-list{background:#fff}
.waiting-row{padding:16px 20px;border-bottom:1px solid #f0f0ee}
.waiting-name{font-size:12px;color:#555}
.waiting-meta{margin-top:4px;font-size:9px;color:#aaa}
.locked{margin:20px;padding:14px 0;border-top:1px solid #e6e3de;border-bottom:1px solid #e6e3de;color:#aaa;font-size:10px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<header class="top-bar">
  <a class="home" href="index.html?p=5">← Home</a>
  <h1>DYNAMICS</h1>
  <a class="shop" href="shop.html">Shop</a>
</header>
<main id="dynamicRoot"></main>
<script src="world-context.js?v=20260824-cbi-work1"></script>
<script src="cloud-sync.js?v=20260824-cbi-work1"></script>
<script src="cbi-data.js?v=20260903-allocation-reason1"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
(function(){
  'use strict';
  function esc(value){
    return String(value==null?'':value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var db=window.CBIData?CBIData.load():null;
  var shop=db&&db.work&&db.work.shop?db.work.shop:{projects:[],owned:[]};
  var ownedIds=Array.isArray(shop.owned)?shop.owned:[];
  var ownedItems=[];
  (Array.isArray(shop.projects)?shop.projects:[]).forEach(function(project){
    (Array.isArray(project.items)?project.items:[]).forEach(function(item){
      if(ownedIds.indexOf(item.id)>=0)ownedItems.push({project:project,item:item});
    });
  });
  var root=document.getElementById('dynamicRoot');
  var html='<section class="status"><div class="kicker">Usage log</div><div class="status-line"><h2>物品动态</h2><div class="owned-count">'+ownedItems.length+' 件物品已就位</div></div><p>这里只承接商城物品的使用记录；动态刷新以后再接入打卡货币。</p></section>';
  if(!ownedItems.length){
    html+='<section class="empty"><div class="empty-inner"><div class="empty-mark">◌</div><div class="empty-title">暂无动态</div><div class="empty-copy">你还没有在商城点亮物品。获得物品后，角色的使用记录会从这里开始；现在不会为了填满页面而生成假的日常。</div><a href="shop.html">前往跨世界橱窗</a></div></section>';
  }else{
    html+='<section class="waiting-list">';
    ownedItems.forEach(function(entry){
      html+='<div class="waiting-row"><div class="waiting-name">'+esc(entry.item.name)+'</div><div class="waiting-meta">'+esc(entry.project.name)+' · 已获得，等待动态功能接入</div></div>';
    });
    html+='</section><div class="locked">刷新功能暂未开放<br>之后会使用打卡货币解锁角色使用记录与小剧情</div>';
  }
  root.innerHTML=html;
})();
</script>
</body>
</html>
