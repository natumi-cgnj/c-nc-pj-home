<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backup">
<title>Backup</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:24px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:1px;color:#666}
.top-bar .back{font-size:13px;color:#999;text-decoration:none}
.top-bar .logout{width:36px;border:0;background:none;color:#bbb;font-size:12px;cursor:pointer;padding:0}
.content{padding:20px;max-width:400px;margin:0 auto}
.section{margin-bottom:24px}
.section-title{font-size:12px;font-weight:500;color:#999;letter-spacing:0.5px;margin-bottom:10px;padding-left:2px}
.card{background:#fff;border:1px solid #eee;border-radius:10px;padding:16px}
.system-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5}
.system-row:last-child{border-bottom:none}
.system-info{display:flex;align-items:center;gap:10px}
.system-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.system-name{font-size:13px;font-weight:500;color:#333}
.system-status{font-size:11px;color:#bbb}
.system-size{font-size:11px;color:#ccc;font-variant-numeric:tabular-nums}
.action-btn{width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;border:none;letter-spacing:0.3px;margin-bottom:8px}
.action-btn:active{transform:scale(0.98)}
.btn-export{background:#1a1a1a;color:#fff}
.btn-import{background:#fff;color:#333;border:1px solid #ddd}
.hint{font-size:11px;color:#bbb;text-align:center;line-height:1.6;margin-top:4px}
.last-backup{font-size:11px;color:#999;text-align:center;margin-bottom:16px;padding:8px;background:#fff;border-radius:8px;border:1px solid #f0f0f0}
.toast{position:fixed;bottom:20%;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center}
.confirm-title{font-size:15px;font-weight:600;color:#333;margin-bottom:8px}
.confirm-msg{font-size:12px;color:#999;line-height:1.6;margin-bottom:20px}
.confirm-msg strong{color:#D85A30}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;padding:12px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none}
.cbtn-cancel{background:#f5f5f5;color:#999}
.cbtn-danger{background:#D85A30;color:#fff}
@media (min-width:700px){.content{max-width:680px;padding:28px}.card{padding:20px}}
</style>
</head>
<body>
<div class="top-bar"><a class="back" href="index.html">&larr; 主页</a><h1>数据备份</h1><button class="logout" onclick="CloudSync.logout()">退出</button></div>
<div class="content">
<div id="lastBackup" class="last-backup" style="display:none"></div>
<div class="section"><div class="section-title">系统数据概况</div><div class="card" id="systemList"></div></div>
<div class="section"><div class="section-title">备份操作</div>
<button class="action-btn btn-export" onclick="exportAll()">&#8681; 导出全部数据</button>
<button class="action-btn btn-import" onclick="document.getElementById('importFile').click()">&#8679; 从备份文件恢复</button>
<input type="file" id="importFile" accept=".json" onchange="handleImport(this)" style="display:none">
<p class="hint">导出的 JSON 文件包含所有系统数据。<br>换浏览器或清缓存前请务必备份。</p>
</div></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="confirmOverlay"><div class="confirm-box">
<div class="confirm-title">确认恢复数据？</div><div class="confirm-msg" id="confirmMsg"></div>
<div class="confirm-btns"><button class="cbtn-cancel" onclick="hideConfirm()">取消</button><button class="cbtn-danger" onclick="doImport()">覆盖恢复</button></div>
</div></div>
<script src="cloud-sync.js"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
const SYS=[
{key:'daily_db',name:'\u65E5\u5E38',color:'#E8B96A',desc:d=>{if(!d)return'-';const a=d.affinity||{};return'N\u2764'+(a.neal||0)+' J\u2764'+(a.jane||0);}},
{key:'gacha_st',name:'\u62BD\u5361',color:'#B388FF',desc:d=>{if(!d)return'-';return'\u7FE0'+(d.emerald||0)+' \u84DD'+(d.sapphire||0)+' '+(d.owned||[]).length+'\u5361';}},
{key:'bean_st',name:'\u8C46\u53F6',color:'#8B6914',desc:d=>{if(!d)return'-';return'\u8C46'+(d.coffee||0)+' \u53F6'+(d.tea||0);}},
{key:'habit_db',name:'\u4E60\u60EF',color:'#5A7247',desc:d=>{if(!d)return'-';return(d.habits||[]).length+'\u4E2A';}},
{key:'story_db',name:'\u5267\u60C5',color:'#9C6ADE',desc:d=>{if(!d)return'-';return(d.completedEps||[]).length+'\u6BB5';}},
{key:'bjd_db3',name:'BJD',color:'#6B8AFF',desc:d=>{if(!d)return'-';return(d.entries||[]).length+'\u6761';}},
{key:'techo_db2',name:'\u624B\u8D26',color:'#5BA66B',desc:d=>{if(!d)return'-';return(d.entries||[]).length+'\u6761';}},
{key:'shop_db',name:'\u5546\u57CE',color:'#D85A30',desc:d=>{if(!d)return'-';return(d.owned||[]).length+'\u4EF6';}}
];
function gd(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function gs(k){const v=localStorage.getItem(k);if(!v)return'-';const b=new Blob([v]).size;return b<1024?b+'B':(b/1024).toFixed(1)+'KB';}
function renderSys(){document.getElementById('systemList').innerHTML=SYS.map(s=>'<div class="system-row"><div class="system-info"><div class="system-dot" style="background:'+s.color+'"></div><div><div class="system-name">'+s.name+'</div><div class="system-status">'+s.desc(gd(s.key))+'</div></div></div><div class="system-size">'+gs(s.key)+'</div></div>').join('');}
function showLast(){const el=document.getElementById('lastBackup'),t=localStorage.getItem('last_backup_time');if(t){const d=new Date(+t);el.textContent='\u4E0A\u6B21\u5907\u4EFD\uFF1A'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');el.style.display='block';}}
function exportAll(){const bk={_meta:{app:'Liminal Space',version:2,exportTime:new Date().toISOString(),keys:SYS.map(s=>s.key)}};SYS.forEach(s=>{const d=gd(s.key);if(d)bk[s.key]=d;});const bl=new Blob([JSON.stringify(bk,null,2)],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a'),n=new Date();a.href=u;a.download='liminal_'+n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'_'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0')+'.json';a.click();URL.revokeObjectURL(u);localStorage.setItem('last_backup_time',''+Date.now());showLast();toast('\u2705 \u5DF2\u4FDD\u5B58');}
let pd=null;
function handleImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d._meta||d._meta.app!=='Liminal Space'){toast('\u274C \u4E0D\u662F\u6709\u6548\u5907\u4EFD');inp.value='';return;}pd=d;const ks=SYS.filter(s=>d[s.key]).map(s=>s.name),tm=d._meta.exportTime?new Date(d._meta.exportTime).toLocaleString('zh-CN'):'?';document.getElementById('confirmMsg').innerHTML=tm+'<br>'+ks.join('\u3001')+'<br><br><strong>\u8986\u76D6\u5F53\u524D\u6570\u636E\uFF0C\u65E0\u6CD5\u64A4\u9500</strong>';document.getElementById('confirmOverlay').classList.add('show');}catch(x){toast('\u274C \u683C\u5F0F\u9519\u8BEF');}inp.value='';};r.readAsText(f);}
function doImport(){if(!pd)return;SYS.forEach(s=>{if(pd[s.key])try{localStorage.setItem(s.key,JSON.stringify(pd[s.key]));}catch(e){}});pd=null;hideConfirm();renderSys();toast('\u2705 \u5DF2\u6062\u590D');}
function hideConfirm(){document.getElementById('confirmOverlay').classList.remove('show');pd=null;}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.className='toast show';clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2500);}
renderSys();showLast();
</script>
</body>
</html>
