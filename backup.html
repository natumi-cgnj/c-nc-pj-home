<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
function collectionItemType(owner,item,index){
  if(item.itemType)return item.itemType;let offset=0;
  for(const sec of owner.sections||[]){
    const count=Math.max(0,parseInt(sec.count)||0);
    if(index>=offset&&index<offset+count){
      if(sec.subcounts){let run=offset;for(const key of ['food','merch','shopping','content']){run+=Math.max(0,parseInt(sec.subcounts[key])||0);if(index<run)return key;}}
      if(sec.sectionType==='merch'||sec.sectionType==='activity')return'merch';
      return'food';
    }
    offset+=count;
  }
  return'food';
}
function collectionDesc(d){
  if(!Array.isArray(d))return'-';let total=0,done=0;
  const visit=owner=>(owner.items||[]).forEach((item,index)=>{total++;const type=collectionItemType(owner,item,index);if(type==='merch'||type==='shopping'){if(item.records&&item.records.length&&item.records.every(r=>r.processStatus==='processed'))done++;}else if(item.collected)done++;});
  d.forEach(project=>{if(Array.isArray(project.subs))project.subs.forEach(visit);else visit(project);});
  return d.length+'个项目 '+done+'/'+total;
}
function stationeryDesc(d){
  if(!Array.isArray(d))return'-';let total=0,done=0;
  d.forEach(p=>{let offset=0;const sections=p.sections&&p.sections.length?p.sections:[{count:(p.items||[]).length,type:'collection'}];sections.forEach(sec=>{const count=Math.max(0,parseInt(sec.count)||0);for(let i=offset;i<offset+count&&i<(p.items||[]).length;i++){const item=p.items[i];total++;if(sec.type==='collection'){if(item.records&&item.records.length&&item.records.every(r=>r.processStatus==='processed'))done++;}else if(item.collected)done++;}offset+=count;});});
  return d.length+'个项目 '+done+'/'+total;
}
const SYS=[
{key:'daily_db',name:'\u65E5\u5E38',color:'#E8B96A',desc:d=>{if(!d)return'-';const a=d.affinity||{};return'\u753B\u4F5C\u788E\u7247 '+(a.neal||0)+'  \u6863\u6848\u788E\u7247 '+(a.jane||0);}},
{key:'daily_presets',name:'\u65E5\u5E38\u59D4\u6258\u6A21\u677F',color:'#D9A44E',desc:d=>{if(!d)return'-';return(d.dropPool||[]).length+'\u6761\u59D4\u6258';}},
{key:'gacha_st',name:'\u62BD\u5361',color:'#B388FF',desc:d=>{if(!d)return'-';return'\u7FE0'+(d.emerald||0)+' \u84DD'+(d.sapphire||0)+' '+(d.owned||[]).length+'\u5361';}},
{key:'bean_st',name:'\u8C46\u53F6',color:'#8B6914',desc:d=>{if(!d)return'-';return'\u8C46'+(d.coffee||0)+' \u53F6'+(d.tea||0);}},
{key:'habit_db',name:'\u4E60\u60EF',color:'#5A7247',desc:d=>{if(!d)return'-';return(d.habits||[]).length+'\u4E2A';}},
{key:'story_db',name:'\u5267\u60C5',color:'#9C6ADE',desc:d=>{if(!d)return'-';return(d.completedEps||[]).length+'\u6BB5';}},
{key:'cbi_db',name:'CBI\u6848\u5377',color:'#B49A61',desc:d=>{if(!d)return'-';return(d.cases||[]).length+'\u4EFD\u6848\u5B97 '+(d.personnel||[]).length+'\u4EFD\u4EBA\u7269\u6863\u6848';}},
{key:'bjd_db3',name:'BJD',color:'#6B8AFF',desc:d=>{if(!d)return'-';return(d.entries||[]).length+'\u6761';}},
{key:'techo_db2',name:'\u624B\u8D26',color:'#5BA66B',desc:d=>{if(!d)return'-';return(d.entries||[]).length+'\u6761';}},
{key:'shop_db',name:'\u5546\u57CE',color:'#D85A30',desc:d=>{if(!d)return'-';return(d.owned||[]).length+'\u4EF6';}},
{key:'activity_db',name:'\u6D3B\u52A8\u6536\u96C6',color:'#9B6BCC',desc:collectionDesc},
{key:'cinema_db',name:'\u5F71\u89C6',color:'#8F78C6',desc:d=>{if(!Array.isArray(d))return'-';const total=d.reduce((n,p)=>n+(p.items||[]).length,0),done=d.reduce((n,p)=>n+(p.items||[]).filter(i=>i.collected).length,0);return d.length+'\u4E2A\u9879\u76EE '+done+'/'+total;}},
{key:'stationery_db',name:'\u6587\u5177',color:'#D4A030',desc:stationeryDesc},
{key:'shortcut-order',name:'\u9996\u9875\u5FEB\u6377\u5165\u53E3\u6392\u5E8F',color:'#8396A8',desc:d=>Array.isArray(d)?d.length+'\u4E2A\u5165\u53E3':'\u9ED8\u8BA4'},
{key:'wallet_db',name:'\u8BB0\u8D26',color:'#D85A30',desc:d=>{if(!d)return'-';return(d.records||[]).length+'\u7B14\u8BB0\u5F55 '+(d.outings||[]).length+'\u6B21\u5916\u51FA';}},
{key:'event_db',name:'\u65E7\u6D3B\u52A8\u5B58\u6863\uFF08\u4FDD\u7559\uFF09',color:'#D6C09A',desc:d=>{if(!d)return'-';const c=d.currency||{};return'\u5956\u52B1 '+(c.a||0)+' / '+(c.b||0)+' / '+(c.c||0);}},
{key:'event_presets',name:'\u65E7\u6D3B\u52A8\u6A21\u677F\uFF08\u4FDD\u7559\uFF09',color:'#D8C8AC',desc:d=>{if(!d)return'-';return'\u59D4'+(d.commissions||[]).length+' \u5361'+(d.cards||[]).length+' \u5468'+(d.goods||[]).length+' \u6C60'+((d.identities||[]).length+(d.tags||[]).length);}},
{key:'home_lines',name:'\u9996\u9875\u53F0\u8BCD',color:'#888',desc:d=>{if(!d)return'\u9ED8\u8BA4';let n=0;['neal','jane','natumi'].forEach(z=>{n+=(d.neal&&d.neal[z]||[]).length+(d.jane&&d.jane[z]||[]).length;});return n+'\u6761';}},
{key:'dungeon_db',name:'\u526F\u672C\u5E93\u5B58',color:'#7A8FB8',desc:d=>{if(!d)return'-';return(d.inventory||[]).length+'\u6761';}},
{key:'kitchen_db',name:'\u996E\u98DF\u6536\u96C6',color:'#8B6914',desc:collectionDesc},
{key:'meal_log_db',name:'\u73B0\u5B9E\u9910\u98DF',color:'#E8B96A',desc:d=>{if(!d||!d.days)return'-';return Object.values(d.days).reduce((n,day)=>n+Object.values(day||{}).reduce((m,list)=>m+(Array.isArray(list)?list.length:0),0),0)+'\u6761';}},
{key:'meal_companion_db',name:'\u4E16\u754C\u996E\u98DF\u966A\u4F34',color:'#A88E54',desc:d=>{if(!d||!d.worlds)return'-';return Object.keys(d.worlds).length+'\u4E2A\u4E16\u754C';}},
{key:'recipe_salad_db',name:'\u5939\u7F1D\u7A7A\u95F4\u83DC\u8C31',color:'#5BA66B',desc:d=>{if(!d||!d.items)return'-';return Object.values(d.items).filter(x=>x.status==='collected').length+'/18';}},
{key:'recipe_project_config',name:'\u5939\u7F1D\u7A7A\u95F4\u83DC\u8C31\u8BBE\u7F6E',color:'#6B8AFF',desc:d=>d&&d.name?d.name:'\u9ED8\u8BA4'},
{key:'recipe_salad_db__world__cbi',name:'CBI \u83DC\u8C31',color:'#B49A61',desc:d=>{if(!d||!d.items)return'\u5C1A\u672A\u5EFA\u7ACB';return Object.keys(d.items).length+'\u5F20';}},
{key:'recipe_project_config__world__cbi',name:'CBI \u83DC\u8C31\u8BBE\u7F6E',color:'#9B896D',desc:d=>d&&d.name?d.name:'\u5C1A\u672A\u5EFA\u7ACB'},
{key:'schedule_packs',name:'\u89D2\u8272\u884C\u7A0B\u5305',color:'#7A6FB8',desc:d=>{if(!d)return'-';if(d.worlds)return Object.values(d.worlds).reduce((n,w)=>n+((w&&w.events)||[]).length,0)+'\u6761';return(d.events||[]).length+'\u6761';}},
{key:'schedule_user_events',name:'\u73B0\u5B9E\u65E5\u7A0B',color:'#E8B96A',desc:d=>{if(!d)return'-';return(d.events||[]).length+'\u6761';}},
{key:'home_modules',name:'\u623F\u95F4\u8FDE\u63A5',color:'#D85A30',desc:d=>{if(!d)return'\u9ED8\u8BA4';const n=Object.values(d).filter(Boolean).length;return n+'\u4E2A\u5DF2\u8FDE\u63A5';}},
{key:'home_skins',name:'\u8863\u67DC\u5019\u9009',color:'#B58A6A',desc:d=>{if(!d)return'\u9ED8\u8BA4';return Object.values(d).reduce((n,c)=>n+((c&&c.selected)||[]).length,0)+'\u5957\u5019\u9009';}},
{key:'home_skin_custom',name:'\u8863\u67DC\u8863\u88C5',color:'#C69A7A',desc:d=>{if(!d)return'\u9ED8\u8BA4';return Object.values(d).reduce((n,list)=>n+(Array.isArray(list)?list.length:0),0)+'\u6761\u8BB0\u5F55';}},
{key:'home_skin_daily',name:'\u4ECA\u65E5\u8863\u88C5',color:'#D4B08C',desc:d=>{if(!d||!d.active)return'-';return Object.keys(d.active).length+'\u4EBA\u5DF2\u62BD\u53D6';}},
{key:'home_cg_library',name:'\u9996\u9875 CG \u5E93',color:'#7C8798',desc:d=>{if(!d)return'\u9ED8\u8BA4';const libs=d.contexts?Object.values(d.contexts):[d];return libs.reduce((total,lib)=>total+Object.values(lib&&lib.slots||{}).reduce((n,s)=>n+((s&&s.custom)||[]).length,0),0)+'\u5F20\u81EA\u5B9A\u4E49';}},
{key:'home_cg_period',name:'\u5F53\u524D\u65F6\u6BB5 CG',color:'#98A2B1',desc:d=>{if(!d)return'-';if(d.periodKey)return d.periodKey;return d.contexts?Object.keys(d.contexts).length+'\u4E2A\u573A\u666F':'-';}},
{key:'home_character_runtime',name:'\u4EBA\u7269\u72B6\u6001\u5F15\u64CE',color:'#7A6FB8',desc:d=>{if(!d||!d.characters)return'\u521D\u59CB\u5316';const active=Object.values(d.characters).filter(c=>c.worldActivity).length;return active+'\u4EBA\u6D3B\u52A8\u4E2D';}},
{key:'omniverse_world_context',name:'\u5F53\u524D\u4E16\u754C',color:'#A88E54',desc:d=>{if(!d||!d.activeWorldId)return'liminal';const l=d.locationByWorld&&d.locationByWorld[d.activeWorldId];return d.activeWorldId+(l?' · '+l:'');}},
{key:'home_character_action_packs',name:'\u884C\u52A8\u5305\u914D\u7F6E',color:'#6B7AA8',desc:d=>{if(!d||!d.merged)return'\u672A\u52A0\u8F7D';return(d.merged||[]).length+'\u4E2A\u884C\u52A8';}},
{key:'shared_diary_db',name:'\u5171\u4EAB\u65E5\u8BB0',color:'#A87B6B',desc:d=>{if(!d||!d.entries)return'-';return(d.entries||[]).length+'\u6761\u8BB0\u5F55';}}
];
function gd(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function gs(k){const v=localStorage.getItem(k);if(!v)return'-';const b=new Blob([v]).size;return b<1024?b+'B':(b/1024).toFixed(1)+'KB';}
function renderSys(){document.getElementById('systemList').innerHTML=SYS.map(s=>'<div class="system-row"><div class="system-info"><div class="system-dot" style="background:'+s.color+'"></div><div><div class="system-name">'+s.name+'</div><div class="system-status">'+s.desc(gd(s.key))+'</div></div></div><div class="system-size">'+gs(s.key)+'</div></div>').join('');}
function showLast(){const el=document.getElementById('lastBackup'),t=localStorage.getItem('last_backup_time');if(t){const d=new Date(+t);el.textContent='\u4E0A\u6B21\u5907\u4EFD\uFF1A'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');el.style.display='block';}}
async function exportAll(){try{await CloudSync.createSnapshot('manual-export');}catch(e){console.warn('Cloud snapshot failed before export:',e);}const bk={_meta:{app:'Liminal Space',version:8,exportTime:new Date().toISOString(),keys:SYS.map(s=>s.key),protection:'history-v2'}};SYS.forEach(s=>{const raw=localStorage.getItem(s.key);if(raw!==null)try{bk[s.key]=JSON.parse(raw);}catch(e){}});const bl=new Blob([JSON.stringify(bk,null,2)],{type:'application/json'}),u=URL.createObjectURL(bl),a=document.createElement('a'),n=new Date();a.href=u;a.download='liminal_'+n.getFullYear()+String(n.getMonth()+1).padStart(2,'0')+String(n.getDate()).padStart(2,'0')+'_'+String(n.getHours()).padStart(2,'0')+String(n.getMinutes()).padStart(2,'0')+'.json';a.click();URL.revokeObjectURL(u);localStorage.setItem('last_backup_time',''+Date.now());showLast();toast('\u2705 \u5DF2\u4FDD\u5B58');}
async function createCloudSnapshot(){try{toast('正在创建安全快照…');await CloudSync.createSnapshot('manual');await loadSnapshots();toast('✅ 云端安全快照已创建');}catch(e){console.error(e);toast('❌ 快照创建失败，未改动数据');}}
let pd=null;
let restoreSnapshotKey=null;
function handleImport(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d._meta||d._meta.app!=='Liminal Space'){toast('\u274C \u4E0D\u662F\u6709\u6548\u5907\u4EFD');inp.value='';return;}restoreSnapshotKey=null;pd=d;const ks=SYS.filter(s=>Object.prototype.hasOwnProperty.call(d,s.key)).map(s=>s.name),tm=d._meta.exportTime?new Date(d._meta.exportTime).toLocaleString('zh-CN'):'?';document.querySelector('.confirm-title').textContent='确认恢复备份文件？';document.getElementById('confirmMsg').innerHTML=tm+'<br>'+ks.join('\u3001')+'<br><br><strong>恢复前会先保存当前完整快照</strong>';document.getElementById('confirmOverlay').classList.add('show');}catch(x){toast('\u274C \u683C\u5F0F\u9519\u8BEF');}inp.value='';};r.readAsText(f);}
function runConfirmedRestore(){if(restoreSnapshotKey)doSnapshotRestore();else doImport();}
async function doImport(){if(!pd)return;const incoming=pd;pd=null;hideConfirm();toast('正在保存恢复前快照…');try{await CloudSync.restoreStates(incoming);renderSys();toast('\u2705 \u5DF2\u6062\u590D\uFF0C\u539F\u6570\u636E\u5DF2\u5B58\u5165\u5386\u53F2');}catch(e){console.error('Protected import failed:',e);toast('\u274C \u6062\u590D\u5931\u8D25\uFF0C\u4E91\u7AEF\u672A\u88AB\u9759\u9ED8\u8986\u76D6');}}
function hideConfirm(){document.getElementById('confirmOverlay').classList.remove('show');pd=null;restoreSnapshotKey=null;}
async function loadSnapshots(){const el=document.getElementById('snapshotList');try{const rows=await CloudSync.listSnapshots(20);if(!rows.length){el.innerHTML='<div class="system-status">还没有云端安全快照</div>';return;}el.innerHTML=rows.map(row=>{const info=row.state_data||{},when=new Date(info.createdAt||row.updated_at),count=info.states?Object.keys(info.states).length:0,reason=info.reason==='manual'?'手动':info.reason==='before-import'?'恢复前':info.reason==='manual-export'?'导出前':'每日保护';return'<div class="system-row"><div><div class="system-name">'+when.toLocaleString('zh-CN')+'</div><div class="system-status">'+reason+' · '+count+'个模块</div></div><button class="cbtn-cancel snapshot-restore" data-key="'+row.state_key+'" style="padding:7px 9px;border:0;border-radius:7px;cursor:pointer">恢复</button></div>';}).join('');el.querySelectorAll('.snapshot-restore').forEach(btn=>btn.onclick=()=>requestSnapshotRestore(btn.dataset.key,btn.closest('.system-row').querySelector('.system-name').textContent));}catch(e){console.error(e);el.innerHTML='<div class="system-status">读取快照失败，当前数据未改动</div>';}}
function requestSnapshotRestore(key,label){pd=null;restoreSnapshotKey=key;document.querySelector('.confirm-title').textContent='恢复到这个时间点？';document.getElementById('confirmMsg').innerHTML=label+'<br><br><strong>全部模块会一起恢复；当前状态会先自动保存</strong>';document.getElementById('confirmOverlay').classList.add('show');}
async function doSnapshotRestore(){const key=restoreSnapshotKey;if(!key)return;restoreSnapshotKey=null;document.getElementById('confirmOverlay').classList.remove('show');toast('正在恢复安全快照…');try{await CloudSync.restoreSnapshot(key);toast('✅ 已恢复，正在刷新');setTimeout(()=>location.reload(),700);}catch(e){console.error(e);toast('❌ 恢复失败，当前云端数据未被静默覆盖');}}
let tt;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.className='toast show';clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2500);}

function handleLinesImport(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const text=e.target.result.replace(/^\uFEFF/,'');
      const rows=text.split('\n').map(r=>r.trim()).filter(r=>r);
      const data={neal:{neal:[],jane:[],natumi:[]},jane:{neal:[],jane:[],natumi:[]}};
      let count=0;
      rows.forEach((row,i)=>{
        if(i===0 && row.startsWith('角色'))return; // skip header
        // Parse CSV with quoted fields
        const parts=[];let cur='',inQ=false;
        for(let c=0;c<row.length;c++){
          const ch=row[c];
          if(ch==='"'){if(inQ&&row[c+1]==='"'){cur+='"';c++;}else{inQ=!inQ;}}
          else if(ch===','&&!inQ){parts.push(cur);cur='';}
          else{cur+=ch;}
        }
        parts.push(cur);
        if(parts.length>=4){
          const who=parts[0].trim().toLowerCase();
          const zone=parts[1].trim().toLowerCase();
          const status=parts[2].trim();
          const msg=parts[3].trim();
          if(data[who]&&data[who][zone]!==undefined){
            data[who][zone].push({s:status,m:msg});
            count++;
          }
        }
      });
      if(count===0){toast('❌ 没有有效台词');inp.value='';return;}
      localStorage.setItem('home_lines',JSON.stringify(data));
      toast('✅ 已导入 '+count+' 条台词，刷新首页生效');
    }catch(x){toast('❌ 格式错误');}
    inp.value='';
  };
  r.readAsText(f);
}

function resetLines(){
  localStorage.removeItem('home_lines');
  toast('✅ 已恢复默认台词，刷新首页生效');
}
