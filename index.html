<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="mobile-web-app-capable" content="yes">
<title>Home</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiSG9tZSIsInNob3J0X25hbWUiOiJIb21lIiwiZGlzcGxheSI6InN0YW5kYWxvbmUiLCJiYWNrZ3JvdW5kX2NvbG9yIjoiI0ZBRkFGQSIsInRoZW1lX2NvbG9yIjoiI0ZBRkFGQSJ9">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;overflow-x:hidden;overflow-y:auto}
.header{text-align:center;margin-bottom:28px;cursor:pointer}
.header h1{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#999;margin-bottom:4px}
.header p{font-size:11px;color:#ccc;letter-spacing:1px}

/* ── Apartment wrap ── */
.apt-wrap{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:stretch}
.branch-stack{position:relative;display:grid;min-width:0}
.branch-stack>.branch-room{grid-area:1/1;width:100%;z-index:calc(1 + var(--stack-order,0))}
.branch-stack>.branch-room.is-stack-front{z-index:20}
.branch-stack:not(.has-active-room){pointer-events:none}
.branch-top{z-index:1}
.branch-left{flex:1;z-index:2}
.branch-adaptive{z-index:4;margin-top:-1px}

/* ── Room boxes ── */
.room-box{position:relative;border:1px solid #E8E8E8;border-radius:4px;background:#fff;overflow:visible}
.room-box .room-inner{position:relative;width:100%;height:100%;cursor:pointer;overflow:hidden}
/* Ensure rooms with connectors on their edges stack above neighbors */
.room-neal{aspect-ratio:2/1}
.room-jane{aspect-ratio:1.2/1}
.room-natumi{flex:1;aspect-ratio:1.2/1;z-index:3;margin-left:-1px}
/* Will: full width 2.4 × 1.6 */
.room-will{aspect-ratio:2.4/1.6;transition:max-height 0.35s,opacity 0.35s;overflow:hidden}
.room-will.will-off{max-height:0;opacity:0;border-color:transparent}
.room-will.will-on{max-height:600px;opacity:1}
/* Hidden rooms */
.room-box.off{max-height:0;opacity:0;border-color:transparent;overflow:hidden;pointer-events:none}
.room-box.off *{visibility:hidden}

/* Portrait/mobile: Will shares one border with the row above, without adding a route. */
@media(max-width:899px),(orientation:portrait){
  .apt-wrap.has-will-room>.mid-row>.branch-left .room-jane,
  .apt-wrap.has-will-room>.mid-row>.room-natumi{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .apt-wrap.has-will-room>.branch-adaptive>.room-will{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
}

/* ── Connectors: absolutely positioned on room edges ── */
/* Neal↔Jane: top center of Jane's room */
.conn-on-jane-top{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:6}
/* Neal↔Natumi: top center of Natumi's room */
.conn-on-natumi-top{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);z-index:6}
/* Jane↔Natumi: left center of Natumi's room */
.conn-on-natumi-left{position:absolute;left:0;top:50%;transform:translate(-50%,-50%);z-index:6}
/* Third branch: bottom on portrait/mobile, right on wide desktop */
.conn-on-natumi-adaptive{position:absolute;bottom:0;left:50%;transform:translate(-50%,50%);z-index:6}
.mid-row{display:flex;align-items:flex-start;margin-top:-1px;position:relative;z-index:5}
.conn-btn{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border:1px solid #E0E0E0;border-radius:8px;background:#fff;font-size:7px;color:#bbb;cursor:pointer;letter-spacing:0.3px;font-family:inherit;transition:all 0.2s;white-space:nowrap;line-height:1;z-index:6}
.conn-btn:hover{color:#999}
.conn-btn.on{color:#999}
.conn-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* Jane↔Natumi left connector: override base conn-btn for vertical layout */
.conn-on-natumi-left.conn-btn{flex-direction:column;padding:3px 2px;gap:1px;white-space:normal;width:14px;text-align:center;line-height:1.2}

/* ── Room labels ── */
.room-label{position:absolute;font-size:8px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;opacity:0.18;pointer-events:none;z-index:1;top:6px;left:8px}

/* ── Furniture ── */
.furniture{position:absolute;border-radius:2px;opacity:0.08;pointer-events:none}
.neal-sofa{width:50px;height:16px;background:#6B8AFF;bottom:24px;left:20px;border-radius:3px}
.neal-table{width:20px;height:20px;background:#6B8AFF;bottom:44px;left:90px;border-radius:50%}
.neal-easel{width:7px;height:28px;background:#6B8AFF;top:16px;right:32px}
.neal-rug{width:70px;height:42px;background:#6B8AFF;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.04}
.neal-piano{width:32px;height:18px;background:#6B8AFF;top:16px;left:20px}
.neal-shelf{width:5px;height:36px;background:#6B8AFF;top:20px;right:54px;opacity:0.06}
.neal-wine{width:12px;height:12px;background:#6B8AFF;bottom:24px;right:32px;border-radius:50%;opacity:0.06}
.jane-couch{width:36px;height:10px;background:#5BA66B;top:35%;left:12%;border-radius:3px}
.jane-teatable{width:12px;height:12px;background:#5BA66B;top:35%;left:calc(12% + 44px);border-radius:50%}
.jane-lamp{width:5px;height:5px;background:#5BA66B;top:16px;right:18%;border-radius:50%;opacity:0.18}
.jane-painting{width:9px;height:7px;background:#5BA66B;top:12px;right:calc(18% + 12px);opacity:0.14}
.jane-blanket{width:16px;height:9px;background:#5BA66B;top:calc(35% + 1px);left:calc(12% + 4px);opacity:0.07}
.natumi-box1{width:12px;height:10px;background:#E8B96A;top:16px;left:10px;transform:rotate(12deg)}
.natumi-box2{width:9px;height:9px;background:#E8B96A;top:30px;left:22px;transform:rotate(-8deg)}
.natumi-box3{width:14px;height:7px;background:#E8B96A;bottom:16px;right:8px;transform:rotate(5deg)}
.natumi-box4{width:10px;height:12px;background:#E8B96A;bottom:32px;left:12px;transform:rotate(-15deg)}
.natumi-box5{width:7px;height:7px;background:#E8B96A;top:44px;right:16px;transform:rotate(20deg)}
.natumi-box6{width:16px;height:5px;background:#E8B96A;bottom:46px;right:20px;transform:rotate(-3deg)}
.natumi-box7{width:9px;height:10px;background:#E8B96A;top:24px;right:28px;transform:rotate(7deg)}
.natumi-bed{width:26px;height:18px;background:#E8B96A;top:10px;right:5px;opacity:0.05;border-radius:2px}
.will-table{width:28px;height:14px;background:#D85A30;top:50%;left:20%;border-radius:3px}
.will-bowl{width:9px;height:9px;background:#D85A30;top:calc(50% - 5px);left:calc(20% + 7px);border-radius:50%;opacity:0.12}
.will-cushion{width:18px;height:18px;background:#D85A30;bottom:14px;right:20%;border-radius:50%;opacity:0.06}
.will-snack{width:7px;height:5px;background:#D85A30;top:18px;right:28%;transform:rotate(15deg)}
.will-cup{width:5px;height:7px;background:#D85A30;top:20px;left:30%;opacity:0.1}

/* ── Sprites ── */
.char-sprite{position:absolute;z-index:10;cursor:pointer;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.08));transition:transform 0.3s}
.char-sprite img,.char-placeholder .character-skin-img{height:90px;width:auto;pointer-events:none}
.char-sprite:active{transform:scale(0.95)}
.char-placeholder{position:absolute;z-index:10;cursor:pointer;transition:transform 0.3s}
.char-placeholder:active{transform:scale(0.95)}
.char-placeholder .placeholder-circle{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#D85A30,#E8846A);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(216,90,48,0.2)}

/* ── Speech bubble ── */
.speech-bubble{position:absolute;z-index:30;background:rgba(255,255,255,0.97);border-radius:12px;padding:10px 14px;max-width:180px;min-width:90px;box-shadow:0 4px 20px rgba(0,0,0,0.1);font-size:11px;line-height:1.5;color:#333;opacity:0;transform:translateY(6px) scale(0.92);transition:opacity 0.3s,transform 0.3s;pointer-events:none}
.speech-bubble.show{opacity:1;transform:translateY(0) scale(1)}
.speech-bubble::after{content:'';position:absolute;bottom:-5px;width:10px;height:10px;background:rgba(255,255,255,0.97);transform:rotate(45deg);border-radius:2px;left:var(--arrow-left,20px)}
.bubble-status{font-size:9px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:3px;display:block}
.bubble-status-neal{color:#6B8AFF}
.bubble-status-jane{color:#5BA66B}
.bubble-status-will{color:#D85A30}
.speech-bubble.bubble-below::after{bottom:auto;top:-5px}
.tooltip{position:fixed;bottom:20%;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all 0.3s;white-space:nowrap;z-index:50}
.tooltip.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Shortcuts ── */
.shortcuts{display:flex;gap:16px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;cursor:pointer;transition:opacity 0.2s}
.shortcut:active{opacity:0.6}
.shortcut-icon{width:40px;height:40px;border-radius:10px;border:1px solid #E8E8E8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:#999}
.shortcut-label{font-size:10px;color:#bbb;letter-spacing:0.3px}
.action-panel{width:100%;display:flex;flex-direction:column;align-items:center}
.drawer-wrap{width:100%;max-width:360px;margin-top:8px;display:flex;flex-direction:column;align-items:center}
.drawer-handle{width:32px;height:4px;border-radius:2px;background:#ddd;cursor:pointer}
.drawer-tray{max-height:0;overflow:hidden;transition:max-height 0.3s,opacity 0.3s;opacity:0;width:100%}
.drawer-tray.open{max-height:80px;opacity:1}
.drawer-items{display:flex;gap:20px;justify-content:center;padding:10px 0 2px}
.footer{margin-top:24px;text-align:center}
.footer .time{font-size:28px;font-weight:200;color:#ccc;letter-spacing:2px;font-variant-numeric:tabular-nums}
.footer .date{font-size:11px;color:#ddd;margin-top:2px;letter-spacing:0.5px}
.cg-banner{width:100%;max-width:360px;aspect-ratio:32/9;border-radius:6px;overflow:hidden;margin-bottom:10px;position:relative;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
.cg-banner img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.cg-banner .cg-time-tag{position:absolute;bottom:4px;right:6px;font-size:8px;letter-spacing:1px;color:rgba(255,255,255,0.6);text-shadow:0 1px 2px rgba(0,0,0,0.3)}
.cg-banner .cg-close{position:absolute;top:4px;right:6px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.25);border:none;color:rgba(255,255,255,0.7);font-size:10px;line-height:18px;text-align:center;cursor:pointer}
.cg-fullscreen{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;cursor:pointer}
.cg-fullscreen.show{display:flex}
.cg-fullscreen img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:4px}
@media(min-width:700px){
  body{height:auto;min-height:100dvh;display:grid;grid-template-columns:minmax(0,auto) 260px;grid-template-rows:auto auto auto;grid-template-areas:"header actions" "banner actions" "apartment actions";column-gap:clamp(36px,6vw,88px);row-gap:14px;justify-content:center;align-content:start;align-items:start;padding:24px 32px;overflow-x:hidden;overflow-y:auto}
  .header{grid-area:header;width:100%;margin:0;align-self:end}
  .cg-banner{grid-area:banner;max-width:none;width:min(460px,calc((100dvh - 103px)*.6),calc(100vw - 390px));margin-bottom:0}
  .apt-wrap{grid-area:apartment;width:min(460px,calc((100dvh - 103px)*.6),calc(100vw - 390px));max-width:none;align-self:start;overflow:visible;max-height:none}
  .char-sprite img,.char-placeholder .character-skin-img{height:clamp(68px,13dvh,100px)}
  .action-panel{grid-area:actions;width:260px;align-self:center}
  .shortcuts{gap:16px;margin-top:0}
  .shortcut-icon{width:46px;height:46px;font-size:18px}
  .shortcut-label{font-size:11px}
  .drawer-wrap{max-width:260px;margin-top:0}
  .drawer-handle{display:none}
  .drawer-tray,.drawer-tray.open{max-height:84px;opacity:1;overflow:visible}
  .drawer-items{gap:8px;padding-top:18px}
  .drawer-items .shortcut-icon{width:42px;height:42px}
  .footer{margin-top:28px}
}
@media(min-width:900px) and (orientation:landscape){
  body{--desktop-map-width:min(660px,calc(100vw - 390px),calc((100dvh - 106px)*.98))}
  .cg-banner{width:var(--desktop-map-width)}
  .apt-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:minmax(0,6fr) minmax(0,5fr);grid-template-areas:"top-branch adaptive-branch" "trunk-row adaptive-branch";width:var(--desktop-map-width);max-width:none;aspect-ratio:18/11;min-height:0;align-items:stretch}
  .apt-wrap>.branch-top{grid-area:top-branch;min-height:0}
  .apt-wrap>.mid-row{grid-area:trunk-row;min-height:0}
  .apt-wrap>.branch-adaptive{grid-area:adaptive-branch;margin:0 0 0 -1px;min-height:0}
  .apt-wrap>.branch-adaptive>.room-will{height:100%;max-height:none;aspect-ratio:auto}
  .apt-wrap .conn-on-natumi-adaptive{left:auto;right:0;top:50%;bottom:auto;transform:translate(50%,-50%)}
  .apt-wrap .conn-on-natumi-adaptive.conn-btn{flex-direction:column;padding:3px 2px;gap:1px;white-space:normal;width:14px;text-align:center;line-height:1.2}
}

/* ── Wardrobe system ── */
.wardrobe-btn{position:absolute;bottom:8px;right:8px;width:24px;height:28px;border-radius:3px;background:rgba(0,0,0,0.035);border:1px solid rgba(0,0,0,0.06);cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:15;transition:all 0.25s;opacity:0.35}
.wardrobe-btn:hover{opacity:0.75;background:rgba(0,0,0,0.06)}
.wardrobe-btn:active{transform:scale(0.9)}
.wardrobe-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none;color:#888}
.wardrobe-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.wardrobe-overlay.show{display:flex}
.wardrobe-panel{background:#fff;border-radius:18px;width:min(400px,100%);max-height:82dvh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.18);overflow:hidden}
.wardrobe-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.wardrobe-title{font-size:14px;font-weight:600;color:#333;letter-spacing:0.5px}
.wardrobe-close{width:28px;height:28px;border-radius:50%;border:none;background:#f5f5f5;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#999;transition:all 0.2s}
.wardrobe-close:hover{background:#eee;color:#666}
.wardrobe-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.skin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 18px}
.skin-card{border-radius:12px;border:2px solid #eee;overflow:hidden;transition:all 0.2s;position:relative;cursor:pointer;background:#fff;min-width:0}
.skin-card:active{transform:scale(0.97)}
.skin-card.is-selected{border-color:color-mix(in srgb,var(--cc) 40%,transparent)}
.skin-card.is-locked{opacity:0.55;cursor:default}
.skin-card.is-locked:active{transform:none}
.skin-preview{aspect-ratio:3/4;background:linear-gradient(135deg,#fafafa,#f3f3f3);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.skin-preview-ph{width:100%;height:100%;opacity:0.6}
.skin-preview img.skin-thumb{height:82%;width:auto;max-width:92%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.08))}
.skin-badge{position:absolute;top:6px;left:6px;font-size:7.5px;padding:2px 7px;border-radius:5px;font-weight:700;letter-spacing:0.4px;line-height:1.4}
.badge-obtained{background:#E6F4EA;color:#34A853}
.badge-locked{background:#F1F1F1;color:#aaa}
.skin-lock-icon{position:absolute;inset:0;background:rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;font-size:22px;color:#ccc}
.skin-info{padding:8px 10px 7px}
.skin-name{font-size:11px;font-weight:600;color:#333;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-desc{font-size:9px;color:#bbb;line-height:1.35;min-height:24px}
.skin-source-tag{font-size:8px;color:#999;margin-top:2px}
.wardrobe-footer{padding:10px 18px 18px;border-top:1px solid #f0f0f0;font-size:9px;color:#bbb;line-height:1.7;flex-shrink:0}
.wardrobe-footer strong{color:#666;font-weight:600}
.wardrobe-hdr-right{display:flex;gap:6px;align-items:center}
.edit-toggle{height:26px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;font-size:10px;color:#999;padding:0 10px;font-family:inherit;letter-spacing:0.3px;transition:all 0.2s}
.edit-toggle:hover{color:#666;background:#f8f8f8}
.edit-toggle.active{background:var(--cc,#4A7BF7);color:#fff;border-color:var(--cc,#4A7BF7)}
.skin-card .edit-overlay{position:absolute;inset:0;background:rgba(255,255,255,0.7);display:none;align-items:center;justify-content:center;z-index:2;border-radius:10px;cursor:pointer;font-size:11px;color:#666;font-weight:600;letter-spacing:0.5px;transition:background 0.2s}
.skin-card .edit-overlay:hover{background:rgba(255,255,255,0.85)}
.is-edit-mode .skin-card .edit-overlay{display:flex}
.add-skin-card{border-radius:12px;border:2px dashed #ddd;display:none;align-items:center;justify-content:center;cursor:pointer;min-height:160px;transition:all 0.2s;flex-direction:column;gap:6px;color:#ccc;font-size:12px}
.add-skin-card:hover{border-color:#bbb;color:#999;background:#fafafa}
.is-edit-mode .add-skin-card{display:flex}
.skin-editor{display:none;padding:16px 20px 20px;flex-direction:column;gap:12px}
.skin-editor.show{display:flex}
.skin-editor-hdr{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;margin-bottom:4px}
.skin-editor-hdr .wardrobe-title{text-align:center}
.skin-editor-hdr .back-btn{justify-self:start;background:none;border:none;font-size:18px;cursor:pointer;color:#999;padding:0 4px;transition:color 0.2s}
.skin-editor-hdr .back-btn:hover{color:#333}
.skin-editor-hdr .del-btn{justify-self:end;background:none;border:1px solid #f0c0c0;border-radius:6px;font-size:9px;color:#e57373;cursor:pointer;padding:4px 10px;font-family:inherit;transition:all 0.2s;display:none}
.skin-editor-hdr .del-btn:hover{background:#fff0f0}
.skin-editor-hdr .del-btn.can-del{display:block}
.editor-img-area{width:100%;aspect-ratio:5/3;border-radius:12px;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;background:#fafafa;transition:border-color 0.2s}
.editor-img-area:hover{border-color:#bbb}
.editor-img-area img{max-height:100%;max-width:100%;object-fit:contain}
.editor-img-area .upload-hint{position:absolute;font-size:11px;color:#ccc;text-align:center;line-height:1.6;pointer-events:none;white-space:pre-line}
.editor-img-area .upload-hint.has-img{background:rgba(255,255,255,0.7);padding:4px 12px;border-radius:6px;font-size:9px;bottom:6px}
.editor-img-actions{display:flex;justify-content:flex-end;margin-top:-6px}
.editor-remove-img{display:none;border:0;background:none;color:#aaa;font-size:9px;font-family:inherit;cursor:pointer;padding:2px 4px}
.editor-remove-img.show{display:block}
.editor-remove-img:hover{color:#D85A30}
.editor-label{font-size:10px;color:#999;font-weight:600;letter-spacing:0.3px;margin-bottom:-6px}
.editor-input{width:100%;height:36px;border:1px solid #e8e8e8;border-radius:8px;padding:0 12px;font-size:12px;font-family:inherit;color:#333;outline:none;transition:border-color 0.2s}
.editor-input:focus{border-color:var(--cc,#4A7BF7)}
.editor-select{width:100%;height:36px;border:1px solid #e8e8e8;border-radius:8px;padding:0 8px;font-size:12px;font-family:inherit;color:#333;outline:none;background:#fff;cursor:pointer}
.editor-row{display:flex;gap:10px;align-items:flex-end}
.editor-row>*{flex:1}
.editor-color-wrap{display:flex;align-items:center;gap:8px}
.editor-color{width:36px;height:36px;border:1px solid #e8e8e8;border-radius:8px;cursor:pointer;padding:2px}
.editor-save{width:100%;height:40px;border:none;border-radius:10px;background:var(--cc,#4A7BF7);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:0.5px;transition:opacity 0.2s;margin-top:4px}
.editor-save:hover{opacity:0.85}
.editor-save:active{opacity:0.7}
.editor-save:disabled{opacity:0.45;cursor:wait}

@media(max-width:400px){.apt-wrap{max-width:320px}.char-sprite img,.char-placeholder .character-skin-img{height:74px}.speech-bubble{max-width:148px;font-size:10px}.wardrobe-overlay{padding:10px}.skin-grid{gap:9px;padding:13px}}
</style>

<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');

/* ═══ MODULES ═══ */
let modules;
try{modules=JSON.parse(localStorage.getItem('home_modules'));}catch(e){modules=null;}
if(!modules)modules={};
if(modules.neal===undefined)modules.neal=true;
if(modules.jane===undefined)modules.jane=true;
if(modules.will===undefined)modules.will=false;
if(modules.nealjane===undefined)modules.nealjane=true;
function saveMod(){localStorage.setItem('home_modules',JSON.stringify(modules));}
function toggleMod(id){modules[id]=!modules[id];saveMod();applyMod();}

const MC={neal:'#6B8AFF',jane:'#5BA66B',will:'#D85A30',nealjane:'#5B9AB5'};

function refreshBranchStacks(){
  document.querySelectorAll('.branch-stack').forEach(stack=>{
    const rooms=Array.from(stack.children).filter(el=>el.classList.contains('branch-room'));
    const visibleRooms=rooms.filter(room=>!room.classList.contains('off'));
    stack.classList.toggle('has-active-room',visibleRooms.length>0);
    rooms.forEach((room,index)=>room.style.setProperty('--stack-order',index));

    let front=visibleRooms.find(room=>room.classList.contains('is-stack-front'));
    if(!front)front=visibleRooms[visibleRooms.length-1];
    rooms.forEach(room=>room.classList.toggle('is-stack-front',room===front));
  });

}

function applyMod(){
  // rooms
  document.getElementById('roomNeal').classList.toggle('off',!modules.neal);
  document.getElementById('roomJane').classList.toggle('off',!modules.jane);
  document.getElementById('aptWrap').classList.toggle('has-will-room',!!modules.will);
  const rW=document.getElementById('roomWill');
  rW.classList.toggle('off',!modules.will);
  rW.classList.toggle('will-off',!modules.will);
  rW.classList.toggle('will-on',modules.will);
  // buttons
  const idMap={neal:'Neal',jane:'Jane',will:'Will',nealjane:'NealJane'};
  ['neal','jane','will','nealjane'].forEach(id=>{
    const suffix=idMap[id];
    const b=document.getElementById('c'+suffix);
    const d=document.getElementById('d'+suffix);
    const l=document.getElementById('l'+suffix);
    if(!b)return;
    b.classList.toggle('on',modules[id]);
    d.style.background=modules[id]?MC[id]:'#ddd';
    if(l)l.textContent='连接';
  });
  // A disabled character must disappear even when currently visiting another room.
  ['neal','jane','will'].forEach(id=>{
    const el=document.getElementById('char-'+id);
    if(!el)return;
    const enabled=!!modules[id];
    el.style.display=enabled?'':'none';
    if(!enabled){
      delete charZone[id];
      const bubble=document.getElementById('bubble-'+id);
      if(bubble)bubble.classList.remove('show');
      if(bubbleTimers[id]){
        clearTimeout(bubbleTimers[id]);
        delete bubbleTimers[id];
      }
    }
  });
  refreshBranchStacks();
  // place chars in available rooms
  setTimeout(()=>{
    ['neal','jane','will'].forEach(id=>{
      if(!modules[id])return;
      const el=document.getElementById('char-'+id);
      if(el)el.style.display='';
      applySkin(id);
      placeChar(id);
    });
  },200);
}

/* ═══ CHARACTER PLACEMENT ═══ */
const charZone={}; // tracks which room each char is currently in
const CHAR_PLACEMENT_KEY='home_character_placement';
let charPlacementState={periodKey:'',placements:{}};

function getCharacterPlacementState(){
  const periodKey=getCGPeriodKey(new Date());
  if(charPlacementState.periodKey===periodKey)return charPlacementState;

  try{
    const saved=JSON.parse(localStorage.getItem(CHAR_PLACEMENT_KEY)||'null');
    if(saved&&saved.periodKey===periodKey&&saved.placements&&typeof saved.placements==='object'){
      charPlacementState=saved;
      return charPlacementState;
    }
  }catch(e){}

  charPlacementState={periodKey,placements:{}};
  return charPlacementState;
}

function saveCharacterPlacementState(){
  try{localStorage.setItem(CHAR_PLACEMENT_KEY,JSON.stringify(charPlacementState));}catch(e){}
}

function validCharacterPlacement(placement,availableRooms){
  return !!placement
    && availableRooms.includes(placement.zone)
    && Number.isFinite(placement.x)
    && Number.isFinite(placement.y)
    && placement.x>=0&&placement.x<=1
    && placement.y>=0&&placement.y<=1;
}

function getAvailableRooms(charId){
  const rooms=[charId]; // always own room
  // everyone connected to Natumi can visit Natumi's room
  if(modules[charId]) rooms.push('natumi');
  // Neal↔Jane cross-visit if nealjane is connected
  if(charId==='neal' && modules.nealjane && modules.jane) rooms.push('jane');
  if(charId==='jane' && modules.nealjane && modules.neal) rooms.push('neal');
  // Will only visits Natumi (already added above), no cross-visits
  return rooms;
}

const roomIdMap={neal:'roomNeal',jane:'roomJane',natumi:'roomNatumi',will:'roomWill'};

function placeChar(id){
  const avail=getAvailableRooms(id);
  const state=getCharacterPlacementState();
  let placement=state.placements[id];
  if(!validCharacterPlacement(placement,avail)){
    placement={
      zone:avail[Math.floor(Math.random()*avail.length)],
      x:Math.random(),
      y:Math.random()
    };
    state.placements[id]=placement;
    saveCharacterPlacementState();
  }
  const zone=placement.zone;
  charZone[id]=zone;
  const room=document.getElementById(roomIdMap[zone]);
  const el=document.getElementById('char-'+id);
  // move sprite into the chosen room
  room.appendChild(el);
  const inner=room.querySelector('.room-inner');
  if(!inner||!el)return;
  const w=inner.offsetWidth,h=inner.offsetHeight;
  if(w<10||h<10)return;
  const isPh=characterUsesPlaceholder(el);
  const spriteImg=el.querySelector('img');
  const sH=isPh?40:((spriteImg&&spriteImg.offsetHeight)||90);
  const sW=isPh?40:sH*0.55;
  const minX=w*0.08,maxX=Math.max(minX+sW,w*0.85-sW);
  const minY=h*0.08,maxY=Math.max(minY,h*0.85-sH);
  el.style.left=Math.round(minX+(maxX-minX)*placement.x)+'px';
  el.style.top=Math.round(minY+(maxY-minY)*placement.y)+'px';
}

let bubbleTimers={};
let bubbleZCounter=30;
function showBubble(id){
  const lp=id==='neal'?NEAL_BY_ZONE:id==='jane'?JANE_BY_ZONE:WILL_BY_ZONE;
  const zone=charZone[id]||id;
  const pool=lp[zone]||lp[id]||[];
  const charEl=document.getElementById('char-'+id);
  const room=charEl.parentElement;
  if(!pool.length||!charEl||!room)return;
  let line=pool[Math.floor(Math.random()*pool.length)];
  // habit reminder 30%
  if(id!=='will'){try{const hdb=JSON.parse(localStorage.getItem('habit_db')||'{}');if(hdb.habits&&hdb.records){const sh=new Date();sh.setHours(sh.getHours()-4);const dn=hdb.habits.filter(h=>{if(h.type!=='daily')return false;const iv=h.interval||1;for(let i=0;i<365;i++){const d2=new Date(sh);d2.setDate(d2.getDate()-i);const dk=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');if(hdb.records[dk]&&hdb.records[dk][h.id]&&Number(hdb.records[dk][h.id].value)>0)return i>=iv;}return true;}).map(h=>h.name);if(dn.length&&Math.random()<0.3){const hab=dn[Math.floor(Math.random()*dn.length)];if(id==='neal')line={s:'提醒你',m:"Hey, 你是不是该"+hab+"了？Don\u0027t put it off."};else line={s:'提醒你',m:'根据记录，你已经超过预定间隔没有'+hab+'了。这不是建议，是数据。'};}}}catch(e){}}
  const bubble=document.getElementById('bubble-'+id);
  const wrap=document.getElementById('aptWrap');
  // move bubble to apt-wrap so it's never clipped by room boundaries
  if(bubble.parentElement!==wrap) wrap.appendChild(bubble);
  const isPh=characterUsesPlaceholder(charEl);
  const charImg=charEl.querySelector('img');
  const eH=isPh?40:((charImg&&charImg.offsetHeight)||90);
  const eW=isPh?40:eH*0.55;
  document.getElementById('status-'+id).textContent=line.s;
  document.getElementById('msg-'+id).textContent=line.m;
  // calculate position relative to apt-wrap
  const wrapRect=wrap.getBoundingClientRect();
  const charRect=charEl.getBoundingClientRect();
  const charCX=charRect.left+charRect.width/2-wrapRect.left;
  const charTopInWrap=charRect.top-wrapRect.top;
  const charBotInWrap=charRect.bottom-wrapRect.top;
  const below=charTopInWrap<50;
  let bL=Math.round(charCX-90),bT=below?Math.round(charBotInWrap+10):Math.round(charTopInWrap-78);
  const cW=wrap.offsetWidth||360;
  if(bL<4)bL=4;if(bL+180>cW)bL=cW-184;
  bubble.style.left=bL+'px';bubble.style.top=bT+'px';
  bubble.classList.toggle('bubble-below',below);
  let al=Math.round(charCX-bL-5);al=Math.max(10,Math.min(al,160));
  bubble.style.setProperty('--arrow-left',al+'px');
  if(bubbleTimers[id])clearTimeout(bubbleTimers[id]);
  bubble.style.zIndex=++bubbleZCounter;
  bubble.classList.add('show');
  bubbleTimers[id]=setTimeout(()=>bubble.classList.remove('show'),4500);
}
function onCharTap(id,e){e.stopPropagation();showBubble(id);}
function onRoomTap(e){if(!e.target.closest('.char-sprite')&&!e.target.closest('.char-placeholder'))showTip('布置功能开发中…');}

function loadLines() {
  try {
    const saved = JSON.parse(localStorage.getItem('home_lines'));
    if (saved && saved.neal && saved.jane) return saved;
  } catch(e) {}
  return null;
}
const _custom = loadLines();
const NEAL_BY_ZONE = _custom ? _custom.neal : DEFAULT_NEAL;

const CG_MAP = [
  { start: 6, end: 11, src: '晨光CG.png', tag: 'おはよう' },
  { start: 11, end: 17, src: '白日CG.png', tag: '' },
  { start: 17, end: 22, src: '夕照CG.png', tag: '' },
  { start: 22, end: 24, src: '夜景CG.png', tag: 'おやすみ' },
  { start: 0, end: 6, src: '夜景CG.png', tag: 'おやすみ' }
];

const CG_DISMISSED_PERIOD_KEY = 'home_cg_dismissed_period';
let currentCGPeriodKey = '';

function getCGPeriodKey(now) {
  const h = now.getHours();
  const periodDate = new Date(now);
  let period;

  if (h >= 6 && h < 11) period = 'morning';
  else if (h >= 11 && h < 17) period = 'day';
  else if (h >= 17 && h < 22) period = 'evening';
  else {
    period = 'night';
    // 22:00–次日 06:00 属于同一个夜间时段，午夜不重复弹出。
    if (h < 6) periodDate.setDate(periodDate.getDate() - 1);
  }

  const y = periodDate.getFullYear();
  const m = String(periodDate.getMonth() + 1).padStart(2, '0');
  const d = String(periodDate.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}:${period}`;
}

function initCG() {
  const now = new Date();
  const h = now.getHours();
  currentCGPeriodKey = getCGPeriodKey(now);

  const banner = document.getElementById('cgBanner');
  const dismissed = localStorage.getItem(CG_DISMISSED_PERIOD_KEY) === currentCGPeriodKey;
  banner.style.display = dismissed ? 'none' : '';

  let cg = CG_MAP.find(c => h >= c.start && h < c.end) || CG_MAP[1];
  if ((h >= 17 || h < 6) && Math.random() < 0.2) cg = CG_SPECIAL;
  const img = document.getElementById('cgImg');
  img.src = cg.src;
  img.onerror = function() { banner.style.display = 'none'; };
  document.getElementById('cgTimeTag').textContent = cg.tag;
  document.getElementById('cgFullImg').src = cg.src;
}

function closeCgBanner(e) {
  e.stopPropagation();
  localStorage.setItem(
    CG_DISMISSED_PERIOD_KEY,
    currentCGPeriodKey || getCGPeriodKey(new Date())
  );
  document.getElementById('cgBanner').style.display = 'none';
}

function readWardrobeJson(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key));
    return value&&typeof value==='object'?value:fallback;
  }catch(e){return fallback;}
}

function saveWardrobeJson(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch(e){
    showTip('保存失败，浏览器空间不足');
    return false;
  }
}

function loadCustomSkins(){return readWardrobeJson(SKIN_CUSTOM_KEY,{});}
function saveCustomSkins(value){return saveWardrobeJson(SKIN_CUSTOM_KEY,value);}

function getMergedSkins(charId){
  const base=JSON.parse(JSON.stringify(SKIN_DB[charId]||[]));
  const custom=loadCustomSkins();
  const changes=Array.isArray(custom[charId])?custom[charId]:[];
  changes.forEach(change=>{
    if(!change||typeof change.id!=='string')return;
    const index=base.findIndex(skin=>skin.id===change.id);
    if(change._deleted){
      if(index>=0)base.splice(index,1);
      return;
    }
    if(index>=0)base[index]=Object.assign(base[index],change);
    else base.push(Object.assign({},change));
  });
  return base;
}

function isBuiltinSkin(charId,skinId){
  return (SKIN_DB[charId]||[]).some(skin=>skin.id===skinId);
}

function loadSkinCfg(){return readWardrobeJson(SKIN_CFG_KEY,{});}

function getCharSkinCfg(charId){
  const allCfg=loadSkinCfg();
  const usableIds=getMergedSkins(charId).filter(skin=>skin.status==='obtained').map(skin=>skin.id);
  const existing=allCfg[charId]&&Array.isArray(allCfg[charId].selected)?allCfg[charId].selected:[];
  let selected=[...new Set(existing)].filter(id=>usableIds.includes(id));
  if(!selected.length)selected=usableIds.slice();
  const changed=!allCfg[charId]||JSON.stringify(existing)!==JSON.stringify(selected);
  const result={selected};
  if(changed){
    allCfg[charId]=result;
    saveWardrobeJson(SKIN_CFG_KEY,allCfg);
  }
  return result;
}

function setCharSkinCfg(charId,value){
  const allCfg=loadSkinCfg();
  allCfg[charId]={selected:[...new Set(value.selected||[])]};
  return saveWardrobeJson(SKIN_CFG_KEY,allCfg);
}

function getWardrobeDayKey(now){
  const date=new Date(now||Date.now());
  date.setHours(date.getHours()-WARDROBE_DAY_START_HOUR);
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,'0');
  const d=String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}

function getDailySkinState(){
  const dayKey=getWardrobeDayKey();
  const saved=readWardrobeJson(SKIN_DAILY_KEY,{});
  if(saved.dayKey===dayKey&&saved.active&&typeof saved.active==='object')return saved;
  return {dayKey,active:{}};
}

function saveDailySkinState(state){return saveWardrobeJson(SKIN_DAILY_KEY,state);}

function invalidateDailySkin(charId){
  const state=getDailySkinState();
  delete state.active[charId];
  saveDailySkinState(state);
}

function getDailySkinPool(charId){
  const skins=getMergedSkins(charId);
  const available=skins.filter(skin=>skin.status==='obtained');
  const selected=getCharSkinCfg(charId).selected;
  const pool=available.filter(skin=>selected.includes(skin.id));
  return pool.length?pool:available;
}

function resolveActiveSkin(charId){
  const pool=getDailySkinPool(charId);
  if(!pool.length)return null;
  const state=getDailySkinState();
  const cached=pool.find(skin=>skin.id===state.active[charId]);
  if(cached)return cached.id;
  const chosen=pool[Math.floor(Math.random()*pool.length)];
  state.active[charId]=chosen.id;
  saveDailySkinState(state);
  return chosen.id;
}

function characterUsesPlaceholder(element){
  if(!element)return false;
  const placeholder=element.querySelector('.placeholder-circle');
  return !!placeholder&&placeholder.style.display!=='none'&&!element.querySelector('img');
}

function getSkinPreviewArt(charId,skin){
  if(skin&&skin.src)return skin.src;
  if(skin&&skin.useBaseArt)return BASE_CHARACTER_ART[charId]||'';
  return '';
}

function renderCharacterArt(charId,src){
  const element=document.getElementById('char-'+charId);
  if(!element)return;
  const placeholder=element.querySelector('.placeholder-circle');
  let image=element.querySelector('img');
  if(src){
    if(!image){
      image=document.createElement('img');
      image.className='character-skin-img';
      image.dataset.wardrobeGenerated='1';
      image.alt=CHAR_LABEL[charId];
      element.appendChild(image);
    }
    if(image.dataset.cloudPath!==src&&image.getAttribute('src')!==src){
      delete image.dataset.cloudPath;
      image.setAttribute('src',src);
    }
    if(placeholder)placeholder.style.display='none';
    return;
  }
  if(image&&image.dataset.wardrobeGenerated==='1')image.remove();
  if(placeholder)placeholder.style.display='';
}

function applySkin(charId){
  const skinId=resolveActiveSkin(charId);
  const skin=getMergedSkins(charId).find(item=>item.id===skinId)||null;
  const art=(skin&&skin.src)||BASE_CHARACTER_ART[charId]||'';
  renderCharacterArt(charId,art);
  const element=document.getElementById('char-'+charId);
  if(element){
    if(skinId)element.dataset.activeSkin=skinId;
    else delete element.dataset.activeSkin;
  }
}

function makeWardrobeNode(tag,className,text){
  const element=document.createElement(tag);
  if(className)element.className=className;
  if(text!==undefined)element.textContent=text;
  return element;
}

function safeSkinColor(value,fallback){
  return /^#[0-9a-f]{6}$/i.test(String(value||''))?value:(fallback||'#999999');
}

function renderWardrobe(charId){
  const skins=getMergedSkins(charId);
  const cfg=getCharSkinCfg(charId);
  const charColor=MC[charId]||'#999999';
  const title=document.getElementById('wardrobeTitle');
  const editButton=document.getElementById('editModeBtn');
  const body=document.querySelector('.wardrobe-body');
  const grid=document.getElementById('skinGrid');
  title.textContent=CHAR_LABEL[charId]+' 的衣柜';
  title.style.color=charColor;
  editButton.style.setProperty('--cc',charColor);
  editButton.classList.toggle('active',editMode);
  editButton.textContent=editMode?'完成':'管理';
  body.classList.toggle('is-edit-mode',editMode);
  document.getElementById('skinEditor').classList.remove('show');
  grid.style.display='';
  document.getElementById('wardrobeFooter').style.display='';
  grid.style.setProperty('--cc',charColor);
  grid.replaceChildren();

  skins.forEach(skin=>{
    const canUse=skin.status==='obtained';
    const selected=canUse&&cfg.selected.includes(skin.id);
    const card=makeWardrobeNode('div','skin-card'+(selected?' is-selected':'')+(canUse?'':' is-locked'));
    card.style.setProperty('--cc',charColor);
    if(canUse)card.addEventListener('click',()=>toggleSelect(charId,skin.id));

    const preview=makeWardrobeNode('div','skin-preview');
    const previewSrc=getSkinPreviewArt(charId,skin);
    if(previewSrc){
      const image=makeWardrobeNode('img','skin-thumb');
      image.alt=skin.name||'衣装立绘';
      image.setAttribute('src',previewSrc);
      preview.appendChild(image);
    }else{
      const placeholder=makeWardrobeNode('div','skin-preview-ph');
      const color=safeSkinColor(skin.color,charColor);
      placeholder.style.background='linear-gradient(135deg,'+color+'22,'+color+'44)';
      preview.appendChild(placeholder);
    }
    preview.appendChild(makeWardrobeNode('span','skin-badge '+(canUse?'badge-obtained':'badge-locked'),canUse?'已获得':'未解锁'));
    if(!canUse)preview.appendChild(makeWardrobeNode('div','skin-lock-icon','🔒'));

    const info=makeWardrobeNode('div','skin-info');
    info.appendChild(makeWardrobeNode('div','skin-name',skin.name||'未命名衣装'));
    info.appendChild(makeWardrobeNode('div','skin-desc',skin.desc||''));
    if(skin.source)info.appendChild(makeWardrobeNode('div','skin-source-tag',skin.source));

    const editOverlay=makeWardrobeNode('div','edit-overlay','✏️ 编辑');
    editOverlay.addEventListener('click',event=>{
      event.stopPropagation();
      openEditor(charId,skin.id);
    });
    card.append(preview,info,editOverlay);
    grid.appendChild(card);
  });

  const addCard=makeWardrobeNode('div','add-skin-card');
  addCard.append(makeWardrobeNode('span','', '+'),makeWardrobeNode('span','', '添加衣装格'));
  addCard.firstChild.style.fontSize='28px';
  addCard.addEventListener('click',()=>openEditor(charId,null));
  grid.appendChild(addCard);
  updateWardrobeFooter(charId);
}

function updateWardrobeFooter(charId){
  const footer=document.getElementById('wardrobeFooter');
  const skins=getMergedSkins(charId);
  const selectedIds=getCharSkinCfg(charId).selected;
  const selected=skins.filter(skin=>skin.status==='obtained'&&selectedIds.includes(skin.id));
  const activeId=resolveActiveSkin(charId);
  const active=skins.find(skin=>skin.id===activeId);
  footer.replaceChildren();

  const today=makeWardrobeNode('div');
  today.append('今日穿着：');
  today.appendChild(makeWardrobeNode('strong','',active?active.name:'暂无'));
  footer.appendChild(today);

  const pool=makeWardrobeNode('div');
  pool.append('每日候选：');
  pool.appendChild(makeWardrobeNode('strong','',selected.length?selected.map(skin=>skin.name).join('、'):'暂无'));
  footer.appendChild(pool);
  footer.appendChild(makeWardrobeNode('div','', '每天早晨刷新一次，当天保持不变'));
}

function closeWardrobe(event){
  if(event&&event.target!==event.currentTarget)return;
  document.getElementById('wardrobeOverlay').classList.remove('show');
  currentWardrobeChar=null;
  editMode=false;
}

function toggleSelect(charId,skinId){
  const skin=getMergedSkins(charId).find(item=>item.id===skinId);
  if(!skin||skin.status!=='obtained')return;
  const cfg=getCharSkinCfg(charId);
  const index=cfg.selected.indexOf(skinId);
  if(index>=0){
    if(cfg.selected.length===1){
      showTip('至少保留一套每日候选');
      return;
    }
    cfg.selected.splice(index,1);
  }else cfg.selected.push(skinId);
  if(!setCharSkinCfg(charId,cfg))return;
  invalidateDailySkin(charId);
  applySkin(charId);
  if(modules[charId])requestAnimationFrame(()=>placeChar(charId));
  renderWardrobe(charId);
}

function toggleEditMode(){
  editMode=!editMode;
  if(currentWardrobeChar)renderWardrobe(currentWardrobeChar);
}

function openEditor(charId,skinId){
  editorCharId=charId;
  editorSkinId=skinId;
  editorImgData=null;
  editorImageRemoved=false;
  editorOriginalSrc='';
  const charColor=MC[charId]||'#999999';
  const isNew=!skinId;
  const skin=isNew?null:getMergedSkins(charId).find(item=>item.id===skinId);

  document.getElementById('editorTitle').textContent=isNew?'添加新衣装':'编辑 · '+(skin?skin.name:'');
  document.getElementById('editorTitle').style.color=charColor;
  const deleteButton=document.getElementById('editorDelBtn');
  deleteButton.classList.toggle('can-del',!isNew&&!isBuiltinSkin(charId,skinId));
  document.getElementById('editorName').value=skin?skin.name:'';
  document.getElementById('editorDesc').value=skin?(skin.desc||''):'';
  document.getElementById('editorStatus').value=skin?skin.status:'obtained';
  document.getElementById('editorSource').value=skin?(skin.source||''):'';
  const colorInput=document.getElementById('editorColor');
  colorInput.value=safeSkinColor(skin&&skin.color,charColor);
  document.getElementById('editorColorHex').textContent=colorInput.value;
  colorInput.oninput=()=>{document.getElementById('editorColorHex').textContent=colorInput.value;};

  editorOriginalSrc=skin&&skin.src?skin.src:'';
  editorImgData=editorOriginalSrc||null;
  const previewSrc=editorOriginalSrc||getSkinPreviewArt(charId,skin);
  setEditorImagePreview(previewSrc,!!editorOriginalSrc);

  const editor=document.getElementById('skinEditor');
  editor.style.setProperty('--cc',charColor);
  document.getElementById('editorSaveBtn').style.background=charColor;
  document.getElementById('skinGrid').style.display='none';
  document.getElementById('wardrobeFooter').style.display='none';

}

function removeEditorImage(){

}

function handleImgUpload(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!/^image\/(png|jpeg|webp)$/i.test(file.type)){
    showTip('请选择 PNG、JPG 或 WEBP 图片');
    input.value='';
    return;
  }
  const reader=new FileReader();
  reader.onload=event=>{
    const image=new Image();
    image.onload=()=>{
      const maxSide=720;
      const scale=Math.min(1,maxSide/image.width,maxSide/image.height);
      const width=Math.max(1,Math.round(image.width*scale));
      const height=Math.max(1,Math.round(image.height*scale));
      const canvas=document.createElement('canvas');
      canvas.width=width;
      canvas.height=height;
      const context=canvas.getContext('2d');
      if(!context){
        showTip('图片处理失败');
        return;
      }
      context.drawImage(image,0,0,width,height);
      let data=canvas.toDataURL('image/webp',0.88);
      if(!data.startsWith('data:image/webp'))data=canvas.toDataURL('image/png');
      editorImgData=data;
      editorImageRemoved=false;
      setEditorImagePreview(data,true);
    };
    image.onerror=()=>showTip('无法读取这张图片');
    image.src=event.target.result;
  };
  reader.onerror=()=>showTip('无法读取这张图片');
  reader.readAsDataURL(file);
  input.value='';
}

async function uploadWardrobeImage(dataUrl,charId,skinId){
  if(!dataUrl||!dataUrl.startsWith('data:'))return dataUrl||'';
  if(!window.CloudSync||typeof CloudSync.uploadDataUrl!=='function')throw new Error('Cloud upload unavailable');
  const ext=dataUrl.startsWith('data:image/webp')?'webp':'png';
  return CloudSync.uploadDataUrl(dataUrl,'wardrobe/'+charId+'/'+skinId+'-'+Date.now()+'.'+ext);
}

async function safelyDeleteWardrobeAsset(value){
  if(!value||!String(value).startsWith('cloud://'))return;
  try{
    if(window.CloudSync&&typeof CloudSync.deleteAsset==='function')await CloudSync.deleteAsset(value);
  }catch(e){console.warn('Could not delete old wardrobe art:',e);}
}

async function saveEditor(){
  const name=document.getElementById('editorName').value.trim();
  if(!name){
    showTip('请输入衣装名称');
    return;
  }
  const saveButton=document.getElementById('editorSaveBtn');
  saveButton.disabled=true;
  const isNew=!editorSkinId;
  const skinId=editorSkinId||('custom_'+Date.now());
  const previousSkin=isNew?null:getMergedSkins(editorCharId).find(item=>item.id===editorSkinId);
  const previousStatus=previousSkin?previousSkin.status:null;
  let savedSrc=editorImageRemoved?'':(editorImgData||'');
  let uploadedNewAsset=false;

  try{
    if(savedSrc.startsWith('data:')){
      showTip('正在保存立绘…');
      savedSrc=await uploadWardrobeImage(savedSrc,editorCharId,skinId);
      uploadedNewAsset=true;
    }
  }catch(e){
    console.error('Wardrobe image upload failed:',e);
    showTip('立绘上传失败，请联网后重试');
    saveButton.disabled=false;
    return;
  }

  const status=document.getElementById('editorStatus').value;
  const custom=loadCustomSkins();
  if(!Array.isArray(custom[editorCharId]))custom[editorCharId]=[];
  const list=custom[editorCharId];
  let entry=list.find(item=>item.id===skinId);
  if(!entry){
    entry={id:skinId};
    list.push(entry);
  }
  delete entry._deleted;
  entry.name=name;
  entry.desc=document.getElementById('editorDesc').value.trim();
  entry.status=status;
  entry.color=safeSkinColor(document.getElementById('editorColor').value,MC[editorCharId]);
  const source=document.getElementById('editorSource').value.trim();
  if(source)entry.source=source;
  else delete entry.source;
  if(savedSrc)entry.src=savedSrc;
  else delete entry.src;

  if(!saveCustomSkins(custom)){
    if(uploadedNewAsset)await safelyDeleteWardrobeAsset(savedSrc);
    saveButton.disabled=false;
    return;
  }

  const cfg=getCharSkinCfg(editorCharId);
  if(status!=='obtained')cfg.selected=cfg.selected.filter(id=>id!==skinId);
  else if(isNew||previousStatus!=='obtained'){
    if(!cfg.selected.includes(skinId))cfg.selected.push(skinId);
  }
  setCharSkinCfg(editorCharId,cfg);
  getCharSkinCfg(editorCharId);
  invalidateDailySkin(editorCharId);
  applySkin(editorCharId);
  if(modules[editorCharId])requestAnimationFrame(()=>placeChar(editorCharId));
  if(editorOriginalSrc&&editorOriginalSrc!==savedSrc)await safelyDeleteWardrobeAsset(editorOriginalSrc);
  showTip('已保存');
  saveButton.disabled=false;
  closeEditor();
}

async function deleteSkinEditor(){
  if(!editorSkinId)return;
  if(isBuiltinSkin(editorCharId,editorSkinId)){
    showTip('预设衣装格可修改，不能删除');
    return;
  }
  if(!confirm('确定删除这个衣装格？'))return;
  const custom=loadCustomSkins();
  const list=Array.isArray(custom[editorCharId])?custom[editorCharId]:[];
  const removed=list.find(item=>item.id===editorSkinId);
  custom[editorCharId]=list.filter(item=>item.id!==editorSkinId);
  if(!saveCustomSkins(custom))return;
  const cfg=getCharSkinCfg(editorCharId);
  cfg.selected=cfg.selected.filter(id=>id!==editorSkinId);
  setCharSkinCfg(editorCharId,cfg);
  getCharSkinCfg(editorCharId);
  invalidateDailySkin(editorCharId);
  applySkin(editorCharId);
  if(removed&&removed.src)await safelyDeleteWardrobeAsset(removed.src);
  showTip('已删除');
  closeEditor();
}

function showTip(t){const el=document.getElementById('tooltip');el.textContent=t;el.classList.add('show');clearTimeout(tipTimer);tipTimer=setTimeout(()=>el.classList.remove('show'),2000);}
