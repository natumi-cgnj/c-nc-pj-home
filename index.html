<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: #FAFAFA;
    color: #1a1a1a;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    overflow: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 11px;
    color: #ccc;
    letter-spacing: 1px;
  }

  /* ── 公寓容器 ── */
  .apartment {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 3 / 4;
    position: relative;
    border: 1px solid #E8E8E8;
    border-radius: 4px;
    background: #fff;
    overflow: hidden;
  }

  /* 区域分隔线 */
  .divider-h {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: #E8E8E8;
    z-index: 2;
  }

  .divider-v {
    position: absolute;
    width: 1px;
    background: #E8E8E8;
    z-index: 2;
  }

  /* ── 房间区域 ── */
  .room {
    position: absolute;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease;
  }

  .room:hover { background: rgba(0,0,0,0.015); }
  .room:active { background: rgba(0,0,0,0.03); }

  /*
    布局：
    Neal 的大公寓 - 上方全宽，占 55%
    下方左右各一半：左边 Jane 阁楼，右边 Natumi（群聊入口）
  */
  .room-neal {
    top: 0; left: 0;
    width: 100%;
    height: 55%;
  }

  .room-jane {
    bottom: 0; left: 0;
    width: 50%;
    height: 45%;
  }

  .room-natumi {
    bottom: 0; right: 0;
    width: 50%;
    height: 45%;
  }

  /* 分隔线定位 */
  .divider-h-1 { top: 55%; }
  .divider-v-1 { left: 50%; top: 55%; height: 45%; }

  /* ── 房间内容 ── */
  .room-icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 18px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .room:hover .room-icon {
    transform: scale(1.08);
  }

  .room-neal .room-icon {
    background: #EEF1FF;
    color: #6B8AFF;
    box-shadow: 0 2px 12px rgba(107, 138, 255, 0.12);
  }

  .room-natumi .room-icon {
    background: #FFF8E6;
    color: #E8B96A;
    box-shadow: 0 2px 12px rgba(232, 185, 106, 0.12);
  }

  .room-jane .room-icon {
    background: #EDFBEF;
    color: #5BA66B;
    box-shadow: 0 2px 12px rgba(91, 166, 107, 0.12);
  }

  .room-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
  }

  .room-neal .room-label { color: #6B8AFF; }
  .room-natumi .room-label { color: #E8B96A; }
  .room-jane .room-label { color: #5BA66B; }

  .room-sub {
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.3px;
    text-align: center;
    line-height: 1.4;
    max-width: 85%;
  }

  /* ── 家具示意 ── */
  .furniture {
    position: absolute;
    border-radius: 2px;
    opacity: 0.08;
  }

  /* Neal 的家具 - June 的大公寓顶层，精致有序，空间宽裕 */
  .neal-sofa { width: 56px; height: 18px; background: #6B8AFF; bottom: 28px; left: 24px; border-radius: 3px; }
  .neal-table { width: 22px; height: 22px; background: #6B8AFF; bottom: 50px; left: 100px; border-radius: 50%; }
  .neal-easel { width: 8px; height: 32px; background: #6B8AFF; top: 20px; right: 36px; border-radius: 1px; }
  .neal-rug { width: 80px; height: 48px; background: #6B8AFF; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 2px; opacity: 0.04; }
  .neal-piano { width: 36px; height: 20px; background: #6B8AFF; top: 20px; left: 24px; border-radius: 2px; }
  .neal-shelf { width: 6px; height: 40px; background: #6B8AFF; top: 24px; right: 60px; opacity: 0.06; }
  .neal-wine { width: 14px; height: 14px; background: #6B8AFF; bottom: 28px; right: 36px; border-radius: 50%; opacity: 0.06; }

  /* Natumi 的家具 - 混乱堆积 */
  .natumi-box1 { width: 14px; height: 12px; background: #E8B96A; top: 18px; left: 12px; transform: rotate(12deg); }
  .natumi-box2 { width: 10px; height: 10px; background: #E8B96A; top: 34px; left: 24px; transform: rotate(-8deg); }
  .natumi-box3 { width: 16px; height: 8px; background: #E8B96A; bottom: 18px; right: 10px; transform: rotate(5deg); }
  .natumi-box4 { width: 12px; height: 14px; background: #E8B96A; bottom: 36px; left: 14px; transform: rotate(-15deg); }
  .natumi-box5 { width: 8px; height: 8px; background: #E8B96A; top: 48px; right: 18px; transform: rotate(20deg); }
  .natumi-box6 { width: 18px; height: 6px; background: #E8B96A; bottom: 52px; right: 22px; transform: rotate(-3deg); }
  .natumi-box7 { width: 10px; height: 12px; background: #E8B96A; top: 26px; right: 30px; transform: rotate(7deg); }
  .natumi-bed { width: 28px; height: 20px; background: #E8B96A; top: 12px; right: 6px; opacity: 0.05; border-radius: 2px; }

  /* Jane 的阁楼 - 朴素简单 + Neal 放的小装饰（蓝色） */
  .jane-couch { width: 40px; height: 12px; background: #5BA66B; top: 35%; left: 12%; border-radius: 3px; }
  .jane-teatable { width: 14px; height: 14px; background: #5BA66B; top: 35%; left: calc(12% + 48px); border-radius: 50%; }
  .jane-lamp { width: 6px; height: 6px; background: #6B8AFF; top: 18px; right: 18%; border-radius: 50%; opacity: 0.18; }
  .jane-painting { width: 10px; height: 8px; background: #6B8AFF; top: 14px; right: calc(18% + 14px); border-radius: 1px; opacity: 0.14; }
  .jane-blanket { width: 18px; height: 10px; background: #6B8AFF; top: calc(35% + 1px); left: calc(12% + 4px); border-radius: 2px; opacity: 0.07; }

  /* ── 连接走廊标记 ── */
  .door {
    position: absolute;
    width: 16px;
    height: 3px;
    background: #E0E0E0;
    border-radius: 2px;
    z-index: 3;
  }

  .door-neal-jane { top: 55%; left: 25%; transform: translate(-50%, -50%); }
  .door-neal-natumi { top: 55%; right: 25%; transform: translate(50%, -50%); }
  .door-jane-natumi { top: 77.5%; left: 50%; transform: translate(-50%, -50%); width: 3px; height: 16px; }

  /* ── 群聊小标记（在 Natumi 房间里） ── */
  .group-hint {
    display: flex;
    gap: 3px;
    align-items: center;
    margin-top: 6px;
  }

  .group-hint .dot-b { width: 4px; height: 4px; border-radius: 50%; background: #6B8AFF; }
  .group-hint .dot-g { width: 4px; height: 4px; border-radius: 50%; background: #5BA66B; }
  .group-hint .dot-n { width: 4px; height: 4px; border-radius: 50%; background: #E8B96A; }

  /* ── 底部 ── */
  .footer {
    margin-top: 24px;
    text-align: center;
  }

  .footer .time {
    font-size: 28px;
    font-weight: 200;
    color: #ccc;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }

  .footer .date {
    font-size: 11px;
    color: #ddd;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* ── Tooltip ── */
  .tooltip {
    position: fixed;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.3px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .tooltip.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Shortcuts ── */
  .shortcuts {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 20px;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .shortcut:active { opacity: 0.6; }

  .shortcut-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1px solid #E8E8E8;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #999;
    transition: box-shadow 0.2s;
  }

  .shortcut:hover .shortcut-icon {
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .shortcut-label {
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.3px;
  }


  .room-char {
    height: 110px;
    width: auto;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    transition: transform 0.3s ease;
  }

  .room:hover .room-char {
    transform: scale(1.05);
  }

  .room-icon-group {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .room-avt {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .room-avt-n {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #FFF8E6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #E8B96A;
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  @media (max-width: 400px) {
    .apartment { max-width: 320px; }
    .room-char { height: 90px; }
    .room-label { font-size: 11px; }
  }
</style>
</head>

  const URLS = {

    jane: "https://claude.ai/chat/216e0875-eb1a-4982-856b-24aa393037a7",

  };

  function goTo(key) {
    window.location.href = URLS[key];
  }

  let tipTimer;
  function showTip(text) {
    const el = document.getElementById('tooltip');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('clock').textContent = `${h}:${m}`;

    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const month = now.getMonth() + 1;
    const day = now.getDate();
    const dayName = days[now.getDay()];
    document.getElementById('date').textContent = `${month}月${day}日 ${dayName}曜日`;
  }

  updateClock();
  setInterval(updateClock, 10000);
</script>
