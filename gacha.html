<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gacha">
<title>Gacha</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:24px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:1px;color:#666}
.top-bar .back{font-size:13px;color:#999;text-decoration:none}
.top-bar .btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer}

/* Gem bar */
.gem-bar{display:flex;justify-content:center;gap:20px;padding:12px 20px;background:#fff;border-bottom:1px solid #f0f0f0}
.gem-item{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.gem-dot{width:10px;height:10px;border-radius:50%}
.gem-emerald{background:#5BA66B}
.gem-sapphire{background:#6B8AFF}

/* Pool tabs */
.pool-tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.pool-tab{flex:1;text-align:center;padding:12px;font-size:12px;font-weight:500;color:#aaa;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;letter-spacing:0.3px}
.pool-tab.active-jane{color:#5BA66B;border-bottom-color:#5BA66B}
.pool-tab.active-neal{color:#6B8AFF;border-bottom-color:#6B8AFF}
.pool-tab.active-duo{color:#9B6BCC;border-bottom-color:#9B6BCC}

/* View tabs */
.view-tabs{display:flex;background:#fff;border-bottom:1px solid #eee}
.view-tab{flex:1;text-align:center;padding:10px;font-size:11px;color:#bbb;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s}
.view-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

.content{padding:16px 20px;padding-bottom:100px}

/* Pull view */
.info-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.info-label{font-size:11px;color:#aaa}
.info-value{font-size:12px;font-weight:500}
.info-value.pity-warn{color:#E8B96A}

.pull-btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s;margin-bottom:8px;font-family:inherit}
.pull-btn:active{transform:scale(0.98)}
.pull-btn.jane{background:linear-gradient(135deg,#4a8a5a,#5BA66B);color:#fff}
.pull-btn.neal{background:linear-gradient(135deg,#4a6adf,#6B8AFF);color:#fff}
.pull-btn.duo{background:linear-gradient(135deg,#7a4ab7,#9B6BCC);color:#fff}
.pull-btn.disabled{background:#e8e8e8;color:#bbb;cursor:not-allowed}

.rate-bar{display:flex;justify-content:center;gap:16px;padding:8px;font-size:10px;color:#bbb}
.rate-ssr{color:#E8B96A}.rate-sr{color:#999}.rate-r{color:#c4b5a0}

/* Recharge section */
.recharge{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-top:16px}
.recharge h3{font-size:12px;color:#999;margin-bottom:10px;text-align:center;font-weight:500}
.recharge-row{display:flex;gap:8px;margin-bottom:8px;justify-content:center;flex-wrap:wrap}
.recharge-desc{font-size:10px;color:#ccc;text-align:center;margin-top:8px;line-height:1.5}
.rch-btn{padding:8px 14px;border:1px solid #e8e8e8;border-radius:8px;background:#fff;font-size:11px;cursor:pointer;transition:all 0.15s;font-family:inherit}
.rch-btn:active{background:#f5f5f5}
.rch-btn.emerald{color:#5BA66B;border-color:#c8e6cd}
.rch-btn.sapphire{color:#6B8AFF;border-color:#c8d6ff}

/* Settings */
.settings{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;margin-top:16px}
.settings h3{font-size:12px;color:#999;margin-bottom:10px;font-weight:500}
.settings label{font-size:12px;color:#666;display:block;margin-bottom:4px}
.settings input{width:100%;padding:8px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:13px;margin-bottom:8px;font-family:inherit}
.settings .save-btn{padding:8px 20px;border:none;background:#1a1a1a;color:#fff;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}

/* Collection grid */
.coll-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.coll-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px 8px;text-align:center;position:relative}
.coll-card.owned{border-color:#ddd}
.coll-card.locked{opacity:0.4}
.coll-rarity{font-size:10px;font-weight:600;margin-bottom:2px}
.coll-rarity.ssr{color:#E8B96A}.coll-rarity.sr{color:#999}.coll-rarity.r{color:#c4b5a0}
.coll-name{font-size:10px;color:#666;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.coll-ep{font-size:9px;color:#ccc;margin-top:2px}
.coll-new{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:#E8B96A}

/* History */
.hist-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.hist-rarity{font-size:10px;font-weight:600;width:28px;text-align:center}
.hist-name{flex:1;font-size:12px;color:#555}
.hist-meta{font-size:10px;color:#ccc}
.hist-new{font-size:9px;color:#5BA66B;margin-left:4px}
.hist-dup{font-size:9px;color:#ccc;margin-left:4px}

/* Reveal overlay */
.reveal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reveal-card{background:#fff;border-radius:16px;padding:32px 28px;text-align:center;max-width:300px;width:90%;animation:revealPop 0.5s cubic-bezier(0.34,1.56,0.64,1);position:relative;z-index:2}
.reveal-card.ssr-card{box-shadow:0 0 40px rgba(232,185,106,0.4),0 0 80px rgba(232,185,106,0.15)}
.reveal-card.sr-card{box-shadow:0 0 30px rgba(153,153,153,0.3)}
@keyframes revealPop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}
.reveal-rarity{font-size:14px;font-weight:700;margin-bottom:4px}
.reveal-name{font-size:18px;font-weight:600;margin-bottom:4px;color:#333}
.reveal-name.ssr-name{font-size:22px;animation:ssrGlow 1.5s ease-in-out infinite alternate}
@keyframes ssrGlow{from{color:#333}to{color:#E8B96A}}
.reveal-ep{font-size:12px;color:#aaa;margin-bottom:12px}
.reveal-status{font-size:13px;margin-bottom:16px}
.reveal-close{padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
/* SSR particles */
.ssr-particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#E8B96A;animation:particleFly 2s ease-out forwards;opacity:0}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}50%{opacity:0.8}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal .btn-row{display:flex;gap:8px;margin-top:20px}
.modal .btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.modal .btn-cancel{background:#f0f0f0;color:#666}

.empty{text-align:center;padding:40px 20px;color:#ccc;font-size:13px}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" href="index.html">&larr; Home</a>
  <h1>GACHA</h1>
  <button class="btn-s" onclick="showModal('exportModal')">备份</button>
</div>

<div class="gem-bar" id="gemBar"></div>

<div class="pool-tabs" id="poolTabs"></div>
<div class="view-tabs" id="viewTabs"></div>

<div class="content" id="content"></div>

<!-- Reveal -->
<div class="reveal-bg" id="revealBg" style="display:none" onclick="closeReveal()"></div>

<!-- Export/Import -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>数据备份</h2>
    <div style="padding:8px 0;">
      <button class="btn btn-cancel" style="margin-bottom:8px;width:100%;" onclick="exportData()">导出所有数据</button>
      <button class="btn btn-cancel" style="width:100%;" onclick="document.getElementById('importFile').click()">从备份导入</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none;">
      <p style="font-size:11px;color:#bbb;text-align:center;margin-top:12px;">建议定期导出备份</p>
    </div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('exportModal')">关闭</button></div>
  </div>
</div>

<script src="cloud-sync.js?v=20260802-outing1"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
// ── Card pools ──
const JANE_POOL=[{id:"j01",name:"Pilot",ep:"S1E01",rarity:"SSR"},{id:"j02",name:"Red Hair and Silver Tape",ep:"S1E02",rarity:"R"},{id:"j03",name:"Red Tide",ep:"S1E03",rarity:"R"},{id:"j04",name:"Ladies in Red",ep:"S1E04",rarity:"R"},{id:"j05",name:"Redwood",ep:"S1E05",rarity:"R"},{id:"j06",name:"Red-Handed",ep:"S1E06",rarity:"SR"},{id:"j07",name:"Seeing Red",ep:"S1E07",rarity:"R"},{id:"j08",name:"The Thin Red Line",ep:"S1E08",rarity:"R"},{id:"j09",name:"Flame Red",ep:"S1E09",rarity:"SR"},{id:"j10",name:"Red Brick and Ivy",ep:"S1E10",rarity:"R"},{id:"j11",name:"Red John's Friends",ep:"S1E11",rarity:"SSR"},{id:"j12",name:"Red Rum",ep:"S1E12",rarity:"R"},{id:"j13",name:"Paint It Red",ep:"S1E13",rarity:"R"},{id:"j14",name:"Crimson Casanova",ep:"S1E14",rarity:"R"},{id:"j15",name:"Scarlett Fever",ep:"S1E15",rarity:"R"},{id:"j16",name:"Bloodshot",ep:"S1E16",rarity:"SSR"},{id:"j17",name:"Carnelian, Inc.",ep:"S1E17",rarity:"R"},{id:"j18",name:"Russet Potatoes",ep:"S1E18",rarity:"SR"},{id:"j19",name:"A Dozen Red Roses",ep:"S1E19",rarity:"R"},{id:"j20",name:"Red Sauce",ep:"S1E20",rarity:"R"},{id:"j21",name:"Miss Red",ep:"S1E21",rarity:"SR"},{id:"j22",name:"Blood Brothers",ep:"S1E22",rarity:"R"},{id:"j23",name:"Red John's Footsteps",ep:"S1E23",rarity:"SSR"}];
const NEAL_POOL=[{id:"n01",name:"Pilot",ep:"S1E01",rarity:"SSR"},{id:"n02",name:"Threads",ep:"S1E02",rarity:"R"},{id:"n03",name:"Book of Hours",ep:"S1E03",rarity:"R"},{id:"n04",name:"Flip of the Coin",ep:"S1E04",rarity:"R"},{id:"n05",name:"The Portrait",ep:"S1E05",rarity:"R"},{id:"n06",name:"All In",ep:"S1E06",rarity:"R"},{id:"n07",name:"Free Fall",ep:"S1E07",rarity:"SSR"},{id:"n08",name:"Hard Sell",ep:"S1E08",rarity:"SR"},{id:"n09",name:"Bad Judgment",ep:"S1E09",rarity:"SR"},{id:"n10",name:"Vital Signs",ep:"S1E10",rarity:"R"},{id:"n11",name:"Home Invasion",ep:"S1E11",rarity:"R"},{id:"n12",name:"Bottlenecked",ep:"S1E12",rarity:"R"},{id:"n13",name:"Front Man",ep:"S1E13",rarity:"R"},{id:"n14",name:"Out of the Box",ep:"S1E14",rarity:"SSR"}];
const DUO_POOL=[{id:"d01",name:"Red Threads",rarity:"SR"},{id:"d02",name:"Flame and Portrait",rarity:"SR"},{id:"d03",name:"Ladies All In",rarity:"SR"},{id:"d04",name:"Scarlett Hours",rarity:"SR"},{id:"d05",name:"Crimson Free Fall",rarity:"SSR"},{id:"d06",name:"Blood and Coin",rarity:"SR"},{id:"d07",name:"Russet Bottleneck",rarity:"SR"},{id:"d08",name:"Paint the Box",rarity:"SSR"},{id:"d09",name:"Red Footsteps, Hard Sell",rarity:"SSR"}];

const POOLS={jane:JANE_POOL,neal:NEAL_POOL,duo:DUO_POOL};
const COST={jane:{emerald:10},neal:{sapphire:10},duo:{emerald:7,sapphire:7}};
const RECYCLE={jane:{R:{emerald:1},SR:{emerald:3},SSR:{emerald:5}},neal:{R:{sapphire:1},SR:{sapphire:3},SSR:{sapphire:5}},duo:{SR:{emerald:2,sapphire:2},SSR:{emerald:3,sapphire:3}}};
const RATES={SSR:0.05,SR:0.15,R:0.80};
const PITY=30;

// ── State ──
function safeCount(value){
  const n=Number(value);
  return Number.isFinite(n)?Math.max(0,Math.floor(n)):0;
}
function safePoolCounts(value){
  const v=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  return {jane:safeCount(v.jane),neal:safeCount(v.neal),duo:safeCount(v.duo)};
}
function normalizeGachaState(value){
  const v=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  return {
    ...v,
    emerald:safeCount(v.emerald),
    sapphire:safeCount(v.sapphire),
    owned:Array.isArray(v.owned)?v.owned.filter(id=>typeof id==='string'):[],
    pity:safePoolCounts(v.pity),
    pulls:safePoolCounts(v.pulls),
    history:Array.isArray(v.history)?v.history.filter(item=>item&&typeof item==='object'):[],
    dailyBudget:safeCount(v.dailyBudget),
    currency:typeof v.currency==='string'&&v.currency?v.currency:'JPY'
  };
}
let storedState;
try{storedState=JSON.parse(localStorage.getItem('gacha_st'));}catch(e){storedState=null;}
let st=normalizeGachaState(storedState);
let pool='jane',view='pull';
function save(){try{localStorage.setItem('gacha_st',JSON.stringify(st));}catch(e){}}
if(JSON.stringify(storedState)!==JSON.stringify(st))save();

// ── Render ──
function render(){renderGems();renderPoolTabs();renderViewTabs();renderContent();}

function renderGems(){
  document.getElementById('gemBar').innerHTML=`
    <div class="gem-item"><div class="gem-dot gem-emerald"></div>${st.emerald}</div>
    <div class="gem-item"><div class="gem-dot gem-sapphire"></div>${st.sapphire}</div>`;
}

function renderPoolTabs(){
  const tabs=[{k:'jane',l:'Jane 池'},{k:'neal',l:'Neal 池'},{k:'duo',l:'双人池'}];
  document.getElementById('poolTabs').innerHTML=tabs.map(t=>
    `<div class="pool-tab ${pool===t.k?'active-'+t.k:''}" onclick="setPool('${t.k}')">${t.l}</div>`
  ).join('');
}

function renderViewTabs(){
  const tabs=[{k:'pull',l:'抽卡'},{k:'collection',l:'图鉴'},{k:'history',l:'记录'},{k:'recharge',l:'氪金'}];
  document.getElementById('viewTabs').innerHTML=tabs.map(t=>
    `<div class="view-tab ${view===t.k?'active':''}" onclick="setView('${t.k}')">${t.l}</div>`
  ).join('');
}

function setPool(p){pool=p;render();}
function setView(v){view=v;render();}

function renderContent(){
  const c=document.getElementById('content');
  if(view==='pull')renderPull(c);
  else if(view==='collection')renderCollection(c);
  else if(view==='history')renderHistory(c);
  else if(view==='recharge')renderRecharge(c);
}

// ── Pull view ──
function renderPull(c){
  const p=POOLS[pool],cost=COST[pool];
  const canAfford=(!cost.emerald||st.emerald>=cost.emerald)&&(!cost.sapphire||st.sapphire>=cost.sapphire);
  const pity=st.pity[pool],total=st.pulls[pool];
  const owned=p.filter(x=>st.owned.includes(x.id)).length;
  const costStr=[];
  if(cost.emerald)costStr.push('祖母绿 ×'+cost.emerald);
  if(cost.sapphire)costStr.push('蓝宝石 ×'+cost.sapphire);

  c.innerHTML=`
    <div class="info-card">
      <div class="info-row"><span class="info-label">收集进度</span><span class="info-value">${owned} / ${p.length}</span></div>
      <div class="info-row"><span class="info-label">累计抽取</span><span class="info-value">${total} 次</span></div>
      <div class="info-row"><span class="info-label">距保底 SSR</span><span class="info-value ${pity>=25?'pity-warn':''}">${PITY-pity} 抽</span></div>
      <div class="info-row"><span class="info-label">单抽花费</span><span class="info-value">${costStr.join(' + ')}</span></div>
    </div>
    <button class="pull-btn ${canAfford?pool:'disabled'}" onclick="doPull()" ${canAfford?'':'disabled'}>
      ${canAfford?'抽 卡':'宝石不足'}
    </button>
    <div class="rate-bar">
      <span class="rate-ssr">SSR 5%</span>
      <span class="rate-sr">SR 15%</span>
      <span class="rate-r">R 80%</span>
    </div>
    <div class="recharge" style="margin-top:20px;">
      <h3>快速录入宝石</h3>
      <div style="display:flex;justify-content:center;gap:20px;margin-bottom:10px;font-size:13px;font-weight:500;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5BA66B;vertical-align:middle;margin-right:4px;"></span>${st.emerald}</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6B8AFF;vertical-align:middle;margin-right:4px;"></span>${st.sapphire}</span>
      </div>
      <div class="recharge-row">
        ${[1,5,10].map(n=>`<button class="rch-btn emerald" onclick="addGem('emerald',${n})">祖母绿 +${n}</button>`).join('')}
      </div>
      <div class="recharge-row">
        ${[1,5,10].map(n=>`<button class="rch-btn sapphire" onclick="addGem('sapphire',${n})">蓝宝石 +${n}</button>`).join('')}
      </div>
      <div class="recharge-desc">日常 / 主线 / 聊天掉落的宝石在此录入</div>
    </div>`;
}

// ── Gacha logic ──
function rollRarity(pity){
  if(pity>=PITY-1)return'SSR';
  const r=Math.random();
  if(r<RATES.SSR)return'SSR';if(r<RATES.SSR+RATES.SR)return'SR';return'R';
}

function doPull(){
  const cost=COST[pool];
  if(cost.emerald&&st.emerald<cost.emerald)return;
  if(cost.sapphire&&st.sapphire<cost.sapphire)return;
  if(cost.emerald)st.emerald-=cost.emerald;
  if(cost.sapphire)st.sapphire-=cost.sapphire;

  const p=POOLS[pool];
  const poolRarities=new Set(p.map(x=>x.rarity));
  let rarity=rollRarity(st.pity[pool]);
  if(!poolRarities.has(rarity)){
    if(rarity==='R'&&poolRarities.has('SR'))rarity='SR';
    else if((rarity==='R'||rarity==='SR')&&poolRarities.has('SSR'))rarity='SSR';
  }

  // Pity: if SSR guaranteed, pick from unowned SSR if possible
  let candidates=p.filter(x=>x.rarity===rarity);
  let card;
  if(rarity==='SSR'&&st.pity[pool]>=PITY-1){
    const unowned=candidates.filter(x=>!st.owned.includes(x.id));
    card=unowned.length?unowned[Math.floor(Math.random()*unowned.length)]:candidates[Math.floor(Math.random()*candidates.length)];
  }else{
    card=candidates[Math.floor(Math.random()*candidates.length)];
  }

  const isNew=!st.owned.includes(card.id);
  let recycled=null;
  if(isNew){st.owned=[...st.owned,card.id];}
  else{
    recycled=RECYCLE[pool][card.rarity]||{};
    if(recycled.emerald)st.emerald+=recycled.emerald;
    if(recycled.sapphire)st.sapphire+=recycled.sapphire;
  }

  if(rarity==='SSR')st.pity[pool]=0;else st.pity[pool]++;
  st.pulls[pool]++;
  st.history.unshift({pool,cardId:card.id,name:card.name,rarity:card.rarity,isNew,recycled,time:new Date().toISOString()});
  if(st.history.length>200)st.history=st.history.slice(0,200);

  save();render();showReveal(card,rarity,isNew,recycled);
}

function addGem(type,n){st[type]+=n;save();render();}

// ── Reveal ──
function showReveal(card,rarity,isNew,recycled){
  const colors={SSR:'#E8B96A',SR:'#999',R:'#c4b5a0'};
  const poolColors={jane:'#5BA66B',neal:'#6B8AFF',duo:'#9B6BCC'};
  const newColor=poolColors[pool]||'#5BA66B';
  let statusHtml='';
  if(isNew){statusHtml=`<div class="reveal-status" style="color:${newColor}">✦ NEW</div>`;}
  else{
    const parts=[];
    if(recycled&&recycled.emerald)parts.push('祖母绿 +'+recycled.emerald);
    if(recycled&&recycled.sapphire)parts.push('蓝宝石 +'+recycled.sapphire);
    statusHtml=`<div class="reveal-status" style="color:#999">重复卡 → ${parts.join(' + ')}</div>`;
  }
  const cardClass=rarity==='SSR'?'ssr-card':rarity==='SR'?'sr-card':'';
  const nameClass=rarity==='SSR'?'ssr-name':'';
  
  // SSR particles
  let particlesHtml='';
  if(rarity==='SSR'){
    let particles='';
    for(let i=0;i<30;i++){
      const angle=Math.random()*Math.PI*2;
      const dist=80+Math.random()*150;
      const tx=Math.cos(angle)*dist;
      const ty=Math.sin(angle)*dist;
      const delay=Math.random()*0.5;
      const size=2+Math.random()*4;
      particles+=`<div class="particle" style="left:50%;top:50%;width:${size}px;height:${size}px;--tx:${tx}px;--ty:${ty}px;animation-delay:${delay}s;"></div>`;
    }
    particlesHtml=`<div class="ssr-particles">${particles}</div>`;
  }

  const bg=document.getElementById('revealBg');
  bg.style.display='flex';
  bg.innerHTML=`${particlesHtml}<div class="reveal-card ${cardClass}" onclick="event.stopPropagation()">
    <div class="reveal-rarity" style="color:${colors[rarity]}">${rarity}</div>
    <div class="reveal-name ${nameClass}">${card.name}</div>
    ${card.ep?`<div class="reveal-ep">${card.ep}</div>`:''}
    ${statusHtml}
    <button class="reveal-close" onclick="closeReveal()">確認</button>
  </div>`;
}
function closeReveal(){document.getElementById('revealBg').style.display='none';}

// ── Collection ──
function renderCollection(c){
  const p=POOLS[pool];
  c.innerHTML=`<div class="coll-grid">${p.map(card=>{
    const owned=st.owned.includes(card.id);
    const rc=card.rarity.toLowerCase();
    return`<div class="coll-card ${owned?'owned':'locked'}">
      <div class="coll-rarity ${rc}">${card.rarity}</div>
      <div class="coll-name">${owned?card.name:'???'}</div>
      ${card.ep?`<div class="coll-ep">${card.ep}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

// ── History ──
function renderHistory(c){
  const h=st.history.filter(x=>x.pool===pool);
  if(!h.length){c.innerHTML='<div class="empty">还没有抽卡记录</div>';return;}
  const colors={SSR:'#E8B96A',SR:'#999',R:'#c4b5a0'};
  c.innerHTML=h.map(x=>`<div class="hist-item">
    <span class="hist-rarity" style="color:${colors[x.rarity]}">${x.rarity}</span>
    <span class="hist-name">${x.name}${x.isNew?'<span class="hist-new">NEW</span>':'<span class="hist-dup">重复</span>'}</span>
    <span class="hist-meta">${typeof x.time==='string'?x.time.slice(5,16).replace('T',' '):''}</span>
  </div>`).join('');
}

// ── Recharge (氪金) ──
function renderRecharge(c){
  const packs=[
    {price:120,emerald:3,sapphire:3,label:'微氪'},
    {price:328,emerald:8,sapphire:8,label:'小氪'},
    {price:648,emerald:20,sapphire:20,label:'月卡'},
    {price:1280,emerald:42,sapphire:42,label:'大氪'},
    {price:3280,emerald:115,sapphire:115,label:'重氪'},
    {price:6480,emerald:240,sapphire:240,label:'鲸鱼'},
  ];
  c.innerHTML=`
    <div style="text-align:center;padding:8px 0 16px;">
      <div style="font-size:20px;font-weight:300;letter-spacing:2px;color:#999;margin-bottom:4px;">SHOP</div>
      <div style="display:flex;justify-content:center;gap:20px;font-size:14px;font-weight:500;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5BA66B;vertical-align:middle;margin-right:4px;"></span>${st.emerald}</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6B8AFF;vertical-align:middle;margin-right:4px;"></span>${st.sapphire}</span>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${packs.map(p=>`
        <div class="info-card" style="text-align:center;cursor:pointer;transition:all 0.15s;position:relative;" onclick="buyPack(${p.emerald},${p.sapphire},${p.price},'${p.label}')">
          <div style="font-size:10px;color:#bbb;margin-bottom:4px;">${p.label}</div>
          <div style="display:flex;justify-content:center;gap:8px;margin-bottom:8px;">
            <span style="font-size:12px;color:#5BA66B;">💎 ${p.emerald}</span>
            <span style="font-size:12px;color:#6B8AFF;">💎 ${p.sapphire}</span>
          </div>
          <div style="font-size:15px;font-weight:600;color:#333;">¥${p.price}</div>
        </div>
      `).join('')}
    </div>

    <div id="buyResult" style="font-size:12px;color:#5BA66B;text-align:center;margin-top:12px;min-height:20px;"></div>

    <div class="recharge" style="margin-top:20px;">
      <h3>手动录入宝石</h3>
      <div style="display:flex;justify-content:center;gap:20px;margin-bottom:10px;font-size:13px;font-weight:500;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5BA66B;vertical-align:middle;margin-right:4px;"></span>${st.emerald}</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#6B8AFF;vertical-align:middle;margin-right:4px;"></span>${st.sapphire}</span>
      </div>
      <div class="recharge-row">
        ${[1,5,10].map(n=>`<button class="rch-btn emerald" onclick="addGem('emerald',${n})">祖母绿 +${n}</button>`).join('')}
      </div>
      <div class="recharge-row">
        ${[1,5,10].map(n=>`<button class="rch-btn sapphire" onclick="addGem('sapphire',${n})">蓝宝石 +${n}</button>`).join('')}
      </div>
      <div class="recharge-desc">聊天掉落 / 日常任务 / 主线奖励在此手动录入</div>
    </div>`;
}

function buyPack(e,s,price,label){
  if(!confirm('充值 ¥'+price+'（'+label+'）？'))return;
  st.emerald+=e;st.sapphire+=s;save();render();
  setView('recharge');
  setTimeout(()=>{
    const el=document.getElementById('buyResult');
    if(el)el.textContent='✦ 充值成功！祖母绿 +'+e+'  蓝宝石 +'+s;
  },50);
}

function saveSettings(){}

// ── Export/Import ──
function exportData(){
  const blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`gacha_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importData(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=(ev)=>{try{
    const imp=JSON.parse(ev.target.result);
    if(confirm('导入数据？')){st=imp;save();render();closeModal('exportModal');}
  }catch(e){alert('导入失败');}};
  reader.readAsText(input.files[0]);
}

function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');});});

// ── Init ──
render();
</script>
