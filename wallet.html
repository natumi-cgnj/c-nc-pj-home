<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wallet">
<title>Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:72px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:env(safe-area-inset-top,24px);border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#D85A30}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.tab-bar button{flex:1;padding:8px 0 6px;background:none;border:none;font-family:inherit;font-size:10px;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab-bar button.active{color:#D85A30}
.tab-bar button .tab-icon{font-size:18px}
.view{display:none}.view.active{display:block}

/* Ledger */
.category-list{padding:12px 20px}
.category-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cat-name{font-size:14px;font-weight:500;color:#333}
.cat-budget{font-size:11px;color:#bbb}
.cat-bar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-bottom:4px}
.cat-bar-fill{height:100%;border-radius:2px;transition:width 0.3s}
.cat-stats{display:flex;justify-content:space-between;font-size:11px;color:#999}
.cat-stats .positive{color:#5BA66B}
.cat-stats .negative{color:#D85A30}
.daily-total{background:#fff;border:1px solid #eee;border-radius:12px;padding:14px 16px;margin:8px 20px}
.daily-total-label{font-size:11px;color:#bbb;margin-bottom:4px}
.daily-total-amount{font-size:24px;font-weight:300;color:#333}
.daily-total-surplus{font-size:12px;margin-top:2px}
.record-btn{display:block;margin:12px 20px;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center;width:calc(100% - 40px)}
.history-section{padding:12px 20px}
.history-section-title{font-size:11px;color:#bbb;margin-bottom:8px}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #eee;border-radius:8px;margin-bottom:6px;font-size:13px}
.hist-cat{font-size:10px;padding:2px 8px;border-radius:4px;flex-shrink:0}
.hist-amount{font-weight:500;flex-shrink:0;min-width:60px;text-align:right}
.hist-amount.expense{color:#D85A30}
.hist-amount.income{color:#5BA66B}
.hist-note{color:#555;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-del{font-size:14px;color:#ccc;background:none;border:none;cursor:pointer;padding:2px}

/* Treasury */
.treasury-card{background:#fff;border:1px solid #eee;border-radius:16px;margin:16px 20px;padding:20px;text-align:center}
.treasury-label{font-size:11px;color:#bbb;margin-bottom:4px}
.treasury-amount{font-size:32px;font-weight:300;margin-bottom:12px}
.treasury-amount.positive{color:#5BA66B}
.treasury-amount.negative{color:#D85A30}
.char-funds{display:flex;gap:8px;padding:0 20px;margin-bottom:12px}
.char-fund-card{flex:1;background:#fff;border:1px solid #eee;border-radius:12px;padding:12px 8px;text-align:center}
.char-fund-name{font-size:12px;font-weight:500;margin-bottom:4px}
.char-fund-amount{font-size:16px;font-weight:300}
.transfer-btn{display:block;margin:8px 20px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}

/* Outings */
.period-banner{margin:12px 20px;padding:14px 16px;background:#fff;border:1px solid #eee;border-radius:12px;text-align:center}
.period-name{font-size:14px;font-weight:500;margin-bottom:2px}
.period-time{font-size:11px;color:#bbb}
.outing-card{margin:8px 20px;padding:14px 16px;background:#fff;border:1px solid #eee;border-radius:12px;position:relative;overflow:hidden}
.outing-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.outing-char{font-size:13px;font-weight:500;margin-bottom:4px}
.outing-activity{font-size:12px;color:#555;margin-bottom:4px}
.outing-dialogue{font-size:13px;color:#666;font-style:italic;line-height:1.5;padding:8px 12px;background:#faf8f4;border-radius:8px;margin-top:6px}
.outing-cost{font-size:11px;color:#999;margin-top:4px}
.outing-empty{text-align:center;padding:40px 20px;color:#ccc;font-size:13px}
.process-btn{display:block;margin:12px 20px;padding:12px;background:#D85A30;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center;width:calc(100% - 40px)}

/* Collection */
.set-card{margin:8px 20px;padding:14px 16px;background:#fff;border:1px solid #eee;border-radius:12px}
.set-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.set-name{font-size:14px;font-weight:500}
.set-progress{font-size:11px;color:#bbb}
.set-bar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-bottom:8px}
.set-bar-fill{height:100%;border-radius:2px;transition:width 0.3s}
.set-items{display:flex;flex-wrap:wrap;gap:4px}
.set-item{font-size:11px;padding:3px 8px;border-radius:4px;background:#f0f0f0;color:#ccc}
.set-item.collected{background:#F3EDFF;color:#9B6BCC}
.set-item.secret{font-style:italic}
.set-reward{font-size:11px;color:#E8B96A;margin-top:8px}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,0.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1),opacity 0.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}
.confirm-box p{font-size:14px;color:#333;margin-bottom:16px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:center}
.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:13px}
.cat-setting-row{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.cat-setting-row:last-child{border-bottom:none}
.modal .cat-setting-row input.cat-setting-color{width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;padding:0;flex-shrink:0}
.modal .cat-setting-row input.cat-setting-name{flex:1;width:auto;font-size:13px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;min-width:0;font-family:inherit}
.modal .cat-setting-row input.cat-setting-budget{width:70px;font-size:13px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;text-align:right;font-family:inherit}
.cat-setting-del{width:28px;height:28px;border:none;background:none;color:#ccc;font-size:16px;cursor:pointer;flex-shrink:0;border-radius:6px}
.cat-setting-del:hover{background:#fee;color:#D85A30}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-btn" href="index.html">← Home</a>
  <h1>WALLET</h1>
  <button class="btn-s" onclick="openModal('settingsModal')">设置</button>
</div>

<!-- LEDGER TAB -->
<div id="viewLedger" class="view active">
  <div class="category-list" id="categoryList"></div>
  <div class="daily-total" id="dailyTotal"></div>
  <button class="record-btn" onclick="openRecordModal()">+ 记一笔</button>
  <div class="history-section" id="todayHistory"></div>
</div>

<!-- TREASURY TAB -->
<div id="viewTreasury" class="view">
  <div class="treasury-card" id="treasuryCard"></div>
  <div class="char-funds" id="charFunds"></div>
  <button class="transfer-btn" onclick="openTransferModal()">划拨零花钱</button>
  <div class="history-section" id="treasuryLog"></div>
</div>

<!-- OUTINGS TAB -->
<div id="viewOutings" class="view">
  <div class="period-banner" id="periodBanner"></div>
  <div id="outingCards"></div>
</div>

<!-- COLLECTION TAB -->
<div id="viewCollection" class="view">
  <div id="collectionSets"></div>
</div>

<!-- MODALS -->

<!-- Record expense/income -->
<div class="modal-bg" id="recordModal">
  <div class="modal">
    <h2>记一笔</h2>
    <label>类型</label>
    <select id="recordType">
      <option value="expense">支出</option>
      <option value="income">收入（卖出二手等）</option>
    </select>
    <label>分类</label>
    <select id="recordCategory"></select>
    <label>金额（日元）</label>
    <input type="number" id="recordAmount" placeholder="金额" min="0" step="1">
    <label>备注（选填）</label>
    <input type="text" id="recordNote" placeholder="买了什么">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('recordModal')">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- Transfer -->
<div class="modal-bg" id="transferModal">
  <div class="modal">
    <h2>划拨零花钱</h2>
    <label>划给谁</label>
    <select id="transferTo">
      <option value="neal">Neal</option>
      <option value="jane">Jane</option>
      <option value="will">Will</option>
    </select>
    <label>金额（日元）</label>
    <input type="number" id="transferAmount" placeholder="金额" min="0" step="1">
    <p style="font-size:11px;color:#bbb;margin-top:8px">从共享金库划入角色专属零花钱，总额不变</p>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('transferModal')">取消</button>
      <button class="btn btn-primary" onclick="saveTransfer()">划拨</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>支出分类管理</h2>
    <div id="budgetSettings"></div>
    <button class="btn btn-cancel" style="width:100%;margin-top:8px;border-style:dashed" onclick="addCategory()">+ 新增分类</button>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-cancel" onclick="closeModal('settingsModal')">关闭</button>
      <button class="btn btn-primary" onclick="saveBudgetSettings()">保存</button>
    </div>
    <hr style="margin:16px 0;border:none;border-top:1px solid #eee">
    <h2>数据管理</h2>
    <button class="btn btn-cancel" style="margin-bottom:8px;width:100%" onclick="exportWallet()">导出数据</button>
    <button class="btn btn-cancel" style="width:100%" onclick="document.getElementById('importWalletFile').click()">导入数据</button>
    <input type="file" id="importWalletFile" accept=".json" onchange="importWallet(this)" style="display:none">
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="active" onclick="switchTab('viewLedger',this)"><span class="tab-icon">📝</span>记账</button>
  <button onclick="switchTab('viewTreasury',this)"><span class="tab-icon">💰</span>金库</button>
  <button onclick="switchTab('viewOutings',this)"><span class="tab-icon">🚶</span>外出</button>
  <button onclick="switchTab('viewCollection',this)"><span class="tab-icon">📦</span>收集</button>
</div>

<div class="toast" id="toast"></div>
<div class="confirm-bg" id="confirmBg"><div class="confirm-box"></div></div>

function mergeActivitySets(saved,defaults){
  if(!Array.isArray(saved))return defaults;
  var merged=defaults.map(function(baseSet){
    var old=saved.find(function(set){return set&&set.id===baseSet.id;});
    if(!old)return baseSet;
    var activities=baseSet.activities.map(function(baseActivity){
      var oldActivity=(old.activities||[]).find(function(activity){return activity&&activity.id===baseActivity.id;});
      return oldActivity?Object.assign({},baseActivity,oldActivity):baseActivity;
    });
    (old.activities||[]).forEach(function(activity){
      if(activity&&!activities.some(function(existing){return existing.id===activity.id;}))activities.push(activity);
    });
    return Object.assign({},baseSet,old,{activities:activities});
  });
  saved.forEach(function(set){
    if(set&&!merged.some(function(existing){return existing.id===set.id;}))merged.push(set);
  });
  return merged;
}
function normalizeWalletDB(value){
  var defaults=createDefaultDB();
  if(!value||typeof value!=='object')return defaults;
  var result=Object.assign({},defaults,value);
  result.categories=Array.isArray(value.categories)&&value.categories.length?value.categories:defaults.categories;
  result.records=Array.isArray(value.records)?value.records:[];
  result.charFunds=Object.assign({},defaults.charFunds,value.charFunds||{});
  result.outings=Array.isArray(value.outings)?value.outings:[];
  result.processedPeriods=value.processedPeriods&&typeof value.processedPeriods==='object'?value.processedPeriods:{};
  result.freePool=Object.assign({},defaults.freePool,value.freePool||{});
  result.outingConfig=Object.assign({},defaults.outingConfig,value.outingConfig||{});
  Object.keys(defaults.outingConfig).forEach(function(id){
    result.outingConfig[id]=Object.assign({},defaults.outingConfig[id],result.outingConfig[id]||{});
    result.outingConfig[id].probs=Object.assign({},defaults.outingConfig[id].probs,(result.outingConfig[id]||{}).probs||{});
  });
  result.activitySets=mergeActivitySets(value.activitySets,defaults.activitySets);
  result.schemaVersion=1;
  return result;
}

/* ═══ DATE / PERIOD HELPERS ═══ */
function todayStr(value){
  var d=value?new Date(value):new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getCurrentPeriod(){
  var h=new Date().getHours();
  if(h>=6&&h<11)return'morning';
  if(h>=11&&h<17)return'day';
  if(h>=17&&h<22)return'evening';
  return'night';
}
function periodLabel(p){return{morning:'清晨 06:00–10:59',day:'白天 11:00–16:59',evening:'傍晚 17:00–21:59',night:'夜晚 22:00–次日 05:59'}[p]||p;}
function periodName(p){return{morning:'清晨',day:'白天',evening:'傍晚',night:'夜晚'}[p]||p;}

/* ═══ BUDGET CALCULATION ═══ */
function getTodayRecords(){return db.records.filter(function(r){return r.date===todayStr();});}
function getCategoryToday(catId){
  var today=todayStr();
  var spent=0,earned=0;
  db.records.forEach(function(r){
    if(r.date===today&&r.category===catId){
      if(r.type==='expense')spent+=r.amount;
      else earned+=r.amount;
    }
  });
  return{spent:spent,earned:earned,net:spent-earned};
}
function getTotalSurplus(){
  var total=0;
  var byDate={};
  db.records.forEach(function(r){
    if(!byDate[r.date])byDate[r.date]={};
    if(!byDate[r.date][r.category])byDate[r.date][r.category]={spent:0,earned:0};
    if(r.type==='expense')byDate[r.date][r.category].spent+=r.amount;
    else byDate[r.date][r.category].earned+=r.amount;
  });
  var dates=Object.keys(byDate).sort();
  dates.forEach(function(date){
    db.categories.forEach(function(cat){
      var rec=byDate[date]&&byDate[date][cat.id];
      var spent=rec?rec.spent:0;
      var earned=rec?rec.earned:0;
      total+=(cat.dailyBudget-spent+earned);
    });
  });
  // If no records for today, don't count today's budget yet
  return total;
}
function getSharedFund(){
  var total=getTotalSurplus();
  var charTotal=(db.charFunds.neal||0)+(db.charFunds.jane||0)+(db.charFunds.will||0);
  // Subtract character outing costs
  var outingCosts=0;
  db.outings.forEach(function(o){outingCosts+=o.cost||0;});
  return total-charTotal-outingCosts;
}

function renderLedger(){

    var pct=cat.dailyBudget>0?Math.min(100,Math.round(ct.net/cat.dailyBudget*100)):0;
    var surplus=cat.dailyBudget-ct.net;
    return '<div class="category-card"><div class="cat-header"><span class="cat-name" style="color:'+cat.color+'">'+esc(cat.name)+'</span><span class="cat-budget">日额 ¥'+cat.dailyBudget+'</span></div><div class="cat-bar"><div class="cat-bar-fill" style="width:'+Math.max(0,pct)+'%;background:'+cat.color+'"></div></div><div class="cat-stats"><span>今日支出 ¥'+ct.spent+(ct.earned?' / 收入 ¥'+ct.earned:'')+'</span><span class="'+(surplus>=0?'positive':'negative')+'">'+(surplus>=0?'+':'')+'¥'+surplus+'</span></div></div>';
  }).join('');

  var todayRecords=getTodayRecords();
  var todayTotal=0;
  todayRecords.forEach(function(r){todayTotal+=(r.type==='expense'?r.amount:-r.amount);});
  var totalBudget=0;
  db.categories.forEach(function(c){totalBudget+=c.dailyBudget;});
  var daySurplus=totalBudget-todayTotal;
  document.getElementById('dailyTotal').innerHTML='<div class="daily-total-label">今日总支出</div><div class="daily-total-amount">¥'+todayTotal+'</div><div class="daily-total-surplus" style="color:'+(daySurplus>=0?'#5BA66B':'#D85A30')+'">今日差额 '+(daySurplus>=0?'+':'')+'¥'+daySurplus+'</div>';

  var histHtml='<div class="history-section-title">今日记录</div>';
  if(!todayRecords.length)histHtml+='<div style="text-align:center;color:#ccc;font-size:12px;padding:20px">还没有记录</div>';
  todayRecords.slice().reverse().forEach(function(r,i){
    var cat=db.categories.find(function(c){return c.id===r.category;});
    var catColor=cat?cat.color:'#999';
    var catName=cat?cat.name:r.category;
    histHtml+='<div class="hist-row"><span class="hist-cat" style="background:'+catColor+'20;color:'+catColor+'">'+esc(catName)+'</span><span class="hist-note">'+esc(r.note||'—')+'</span><span class="hist-amount '+(r.type==='expense'?'expense':'income')+'">'+(r.type==='expense'?'-':'+')+'¥'+r.amount+'</span><button class="hist-del" onclick="deleteRecord(\''+r.id+'\')">×</button></div>';
  });
  document.getElementById('todayHistory').innerHTML=histHtml;
}

/* ═══ OUTINGS ═══ */
function renderOutings(){
  var period=getCurrentPeriod();
  document.getElementById('periodBanner').innerHTML='<div class="period-name">'+periodName(period)+'</div><div class="period-time">'+periodLabel(period)+'</div>';

  var today=todayStr();
  var todayOutings=db.outings.filter(function(o){return o.date===today;});
  var cards=document.getElementById('outingCards');

  if(!todayOutings.length){
    cards.innerHTML='<div class="outing-empty">今天还没有人出门</div><button class="process-btn" onclick="processCurrentPeriod()">刷新当前时段</button>';
    return;
  }

  var html='';
  todayOutings.forEach(function(o){
    var cfg=db.outingConfig[o.char]||{color:'#999',name:o.char};
    html+='<div class="outing-card" style="border-left:3px solid '+cfg.color+'"><div class="outing-char" style="color:'+cfg.color+'">'+esc(cfg.name)+' · '+periodName(o.period)+'</div><div class="outing-activity">'+esc(o.activity||'散步')+'</div>'+(o.dialogue?'<div class="outing-dialogue">「'+esc(o.dialogue)+'」</div>':'')+(o.cost?'<div class="outing-cost">-¥'+o.cost+'</div>':'')+'</div>';
  });

  // Check if current period processed
  var periodKey=today+'_'+period;
  if(!db.processedPeriods[periodKey]){
    html+='<button class="process-btn" onclick="processCurrentPeriod()">刷新当前时段</button>';
  }
  cards.innerHTML=html;
}
function processCurrentPeriod(){
  var today=todayStr();
  var period=getCurrentPeriod();
  var periodKey=today+'_'+period;
  if(db.processedPeriods[periodKey]){showToast('当前时段已刷新');return;}

  var chars=['neal','jane','will'];
  var remainingShared=getSharedFund();
  var newOutings=[];

  chars.forEach(function(charId){
    var cfg=db.outingConfig[charId];
    if(!cfg)return;
    // Check daily limit
    var todayCount=db.outings.filter(function(o){return o.date===today&&o.char===charId;}).length;
    if(todayCount>=cfg.maxPerDay)return;
    // Roll probability
    var prob=cfg.probs[period]||0;
    if(Math.random()>prob)return;

    // Character goes out!
    var charFund=db.charFunds[charId]||0;
    var availableFund=remainingShared+charFund;

    if(availableFund<=0){
      // Free outing
      var pool=db.freePool[charId]||[];
      if(!pool.length)return;
      var pick=pool[Math.floor(Math.random()*pool.length)];
      newOutings.push({id:gid(),date:today,period:period,char:charId,activity:'散步',dialogue:pick.dialogue,cost:0,activityId:null});
    }else{
      // Pick a paid activity within budget
      var sets=db.activitySets.filter(function(s){return s.char===charId;});
      var available=[];
      sets.forEach(function(set){
        set.activities.forEach(function(act){
          if(!act.collected&&act.cost<=availableFund)available.push({set:set,act:act});
        });
      });
      if(!available.length){
        // All collected or too expensive, free outing
        var pool=db.freePool[charId]||[];
        if(!pool.length)return;
        var pick=pool[Math.floor(Math.random()*pool.length)];
        newOutings.push({id:gid(),date:today,period:period,char:charId,activity:'散步',dialogue:pick.dialogue,cost:0,activityId:null});
      }else{
        var chosen=available[Math.floor(Math.random()*available.length)];
        chosen.act.collected=true;
        chosen.act.collectedDate=today;
        // Deduct from personal fund first, then shared
        var cost=chosen.act.cost;
        if(charFund>=cost){
          db.charFunds[charId]-=cost;
        }else{
          remainingShared-=Math.max(0,cost-charFund);
          db.charFunds[charId]=0;
          // Remaining comes from shared (tracked via outing cost)
        }
        newOutings.push({id:gid(),date:today,period:period,char:charId,activity:chosen.act.name,dialogue:chosen.act.dialogue,cost:cost,activityId:chosen.act.id,setId:chosen.set.id});
      }
    }
  });

  db.outings=db.outings.concat(newOutings);
  db.processedPeriods[periodKey]=true;
  db.lastProcessed=today;
  save();
  renderOutings();

  if(newOutings.length){
    showToast(newOutings.map(function(o){return db.outingConfig[o.char].name;}).join('、')+' 出门了！');
  }else{
    showToast('这个时段没人出门');
  }
}
