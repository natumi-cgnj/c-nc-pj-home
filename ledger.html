<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LEDGER">
<title>LEDGER</title>
<link rel="stylesheet" href="ledger-tasks.css?v=20261021-tasks1">
<style>
html{height:100%;overflow:hidden;scrollbar-width:none}html::-webkit-scrollbar{display:none}
html.ledger-modal-open{overflow:hidden;overscroll-behavior:none}
html.ledger-modal-open body{position:fixed;top:var(--ledger-scroll-top);left:0;right:0;overflow:hidden}
html.ledger-modal-open .view{overflow:hidden}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#fff;color:#262626;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:15px 20px;padding-top:calc(15px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.96);position:relative;flex-shrink:0;z-index:50;border-bottom:1px solid #f0f0f0}
.top-bar h1{font-size:12px;font-weight:500;letter-spacing:3.2px;color:#8d8579;white-space:nowrap}
.back-btn{justify-self:start;font-size:13px;color:#bbb;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.tab-bar{position:relative;flex-shrink:0;display:flex;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.06);z-index:50;padding:0 12px env(safe-area-inset-bottom,0)}
.tab-bar button{position:relative;flex:1;padding:15px 0 13px;background:none;border:none;font-family:inherit;font-size:10px;letter-spacing:.25px;color:#bbb;cursor:pointer}
.tab-bar button.active{color:#4e4a44}
.tab-bar button.active:before{content:"";position:absolute;left:36%;right:36%;top:0;height:1px;background:#9c907c}
.view{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}.view.active{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;overscroll-behavior:contain;padding:20px;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:#ccc}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}.btn:active{opacity:.8}
.btn-primary{background:#1a1a1a;color:#fff}.btn-cancel{background:#f0f0f0;color:#888}.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}
.category-color-picker{display:grid;grid-template-columns:repeat(6,28px);justify-content:center;column-gap:18px;row-gap:0;padding:8px 0 2px}
.cat-color-swatch{position:relative;width:28px;height:28px;border:0;background:transparent;border-radius:50%;cursor:pointer;padding:0}
.cat-color-swatch:before{content:"";position:absolute;width:16px;height:16px;left:6px;top:6px;border-radius:50%;background:var(--swatch-color)}
.cat-color-swatch.active:after{content:"";position:absolute;width:20px;height:20px;left:4px;top:4px;border:1.5px solid #333;border-radius:50%}
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,.88);color:#fff;font-size:12px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform .3s,opacity .3s;opacity:0}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:300;display:none;align-items:center;justify-content:center}.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}.confirm-box p{font-size:13px;color:#333;margin-bottom:16px;line-height:1.5}.confirm-box .btn-row{justify-content:center}.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:12px}
@media(min-width:700px){.modal-bg{align-items:center;padding:28px}.modal{border-radius:16px}}
</style>
</head>
<body>
<header class="top-bar">
  <a class="back-btn" href="index.html?p=2">← Home</a>
  <h1>LEDGER</h1>
  <span aria-hidden="true"></span>
</header>

<!-- SIX ACCOUNTS TAB -->
<div id="viewAccounts" class="view">
  <section class="asset-board" aria-label="六账户">
    <div class="asset-account-grid" id="assetAccountGrid"></div>
    <div class="asset-account-summary" id="assetAccountSummary" aria-label="资产合计与目标"></div>
  </section>
  <section class="asset-account-detail" id="assetAccountDetail" aria-label="账户详情">
    <div id="assetSavingsDetail"></div>
  </section>
</div>


<div id="viewRecord" class="view active">
  <section class="asset-board" id="assetExpenseBoard" aria-label="六账本">
    <div class="asset-account-grid" id="assetExpenseGrid"></div>
    <div class="asset-account-summary" id="assetExpenseSummary" aria-label="进账与花销合计"></div>
  </section>
  <section class="asset-account-detail" id="assetExpenseDetail" aria-label="账本明细"></section>
</div>
<div id="viewDraft" class="view">
  <section class="asset-board" aria-label="世界">
    <div class="asset-stage-story" id="assetStageStory" aria-label="任务小剧情"><p class="asset-stage-empty">暂无</p></div>
    <div class="asset-account-summary asset-stage-summary" id="assetStageSummary"></div>
  </section>
</div>

<!-- Stage selection and title editor -->
<div class="modal-bg" id="assetStageWorldModal">
  <div class="modal">
    <h2>选择世界</h2>
    <div id="assetStageWorldList" role="radiogroup" aria-label="当前世界"></div>
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetStageWorldModal')">关闭</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="assetStageTitleModal">
  <div class="modal">
    <h2>编辑题目</h2>
    <input type="hidden" id="assetStageWorldId">
    <label for="assetStageWorldTitle">世界题目</label>
    <input type="text" id="assetStageWorldTitle" maxlength="30">
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetStageTitleModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveStageWorldTitle()">保存</button>
    </div>
  </div>
</div>

<!-- Expense record editor -->
<div class="modal-bg" id="assetExpenseRecordModal">
  <div class="modal">
    <h2 id="assetExpenseRecordTitle">记一笔</h2>
    <input type="hidden" id="assetExpenseRecordBookId">
    <input type="hidden" id="assetExpenseRecordId">
    <label for="assetExpenseRecordType">收支</label>
    <select id="assetExpenseRecordType">
      <option value="expense">支出（−）</option>
      <option value="income">进账（＋）</option>
    </select>
    <label for="assetExpenseRecordDate">日期</label>
    <input type="date" id="assetExpenseRecordDate">
    <label for="assetExpenseRecordAmount">金额（日元）</label>
    <input type="number" id="assetExpenseRecordAmount" min="1" step="1" inputmode="numeric">
    <label for="assetExpenseRecordNote">备注（选填）</label>
    <input type="text" id="assetExpenseRecordNote" maxlength="120">
    <div class="btn-row">
      <button class="btn btn-del" id="assetExpenseRecordDelete" type="button" onclick="WalletAssets.deleteExpenseRecord()">删除</button>
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetExpenseRecordModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveExpenseRecord()">保存</button>
    </div>
  </div>
</div>

<!-- Expense book settings -->
<div class="modal-bg" id="assetExpenseBookModal">
  <div class="modal">
    <h2>账本设置</h2>
    <input type="hidden" id="assetExpenseBookId">
    <input type="hidden" id="assetExpenseBookWorldId">
    <label for="assetExpenseBookName">账本名称</label>
    <input type="text" id="assetExpenseBookName" maxlength="30">
    <label>颜色</label>
    <input type="hidden" id="assetExpenseBookColor">
    <div class="category-color-picker asset-inline-color-picker" id="assetExpenseBookColorPicker"></div>
    <label for="assetExpenseBookNote">备注（选填）</label>
    <input type="text" id="assetExpenseBookNote" maxlength="80">
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetExpenseBookModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveExpenseBook()">保存</button>
    </div>
  </div>
</div>

<!-- Account overview editor -->
<div class="modal-bg" id="assetAccountModal">
  <div class="modal">
    <h2 id="assetAccountModalTitle">账户</h2>
    <input type="hidden" id="assetAccountId">
    <input type="hidden" id="assetAccountWorldId">
    <label>账户名称</label>
    <input type="text" id="assetAccountName" maxlength="30">
    <label>余额 <span class="asset-modal-currency" id="assetAccountCurrency"></span></label>
    <input type="number" id="assetAccountBalance" step="0.01" inputmode="decimal">
    <label>颜色</label>
    <input type="hidden" id="assetAccountColor">
    <div class="category-color-picker asset-inline-color-picker" id="assetAccountColorPicker"></div>
    <label>备注（选填）</label>
    <input type="text" id="assetAccountNote" maxlength="80">
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetAccountModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveEditor()">保存</button>
    </div>
  </div>
</div>

<!-- Asset goal editor -->
<div class="modal-bg" id="assetGoalModal">
  <div class="modal">
    <h2>目标金额</h2>
    <label for="assetGoalAmount">目标金额（日元）</label>
    <input type="number" id="assetGoalAmount" min="1" step="1" inputmode="numeric">
    <div class="asset-goal-rate">人民币按 1円＝0.042元折算。留空可清除目标。</div>
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetGoalModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveGoal()">保存</button>
    </div>
  </div>
</div>

<!-- Static account item editor -->
<div class="modal-bg" id="assetSavingsItemModal">
  <div class="modal">
    <h2 id="assetSavingsItemModalTitle">静态资产</h2>
    <input type="hidden" id="assetSavingsItemAccountId">
    <input type="hidden" id="assetSavingsItemId">
    <label>名称</label>
    <input type="text" id="assetSavingsItemName" maxlength="30">
    <label>余额 <span class="asset-modal-currency" id="assetSavingsItemCurrency">CNY</span></label>
    <input type="number" id="assetSavingsItemBalance" step="0.01" inputmode="decimal">
    <label id="assetSavingsItemDateLabel">最后确认时间</label>
    <input type="date" id="assetSavingsItemConfirmedAt">
    <div id="assetMonthlyDebitSection" style="display:none">
      <label>每月扣款</label>
      <div class="asset-monthly-help">按日本日期扣款；当月没有设置的日期时，按月末计算。</div>
      <div class="asset-monthly-list" id="assetMonthlyDebitList"></div>
      <button class="asset-monthly-add" type="button" onclick="WalletAssets.addMonthlyDebit()">＋ 增加每月扣款</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" type="button" onclick="closeModal('assetSavingsItemModal')">取消</button>
      <button class="btn btn-primary" type="button" data-modal-save onclick="WalletAssets.saveSavingsItem()">保存</button>
    </div>
  </div>
</div>

<nav class="tab-bar" aria-label="LEDGER">
  <button type="button" id="ledgerTabAccounts" data-ledger-tab="viewAccounts" onclick="switchTab('viewAccounts',this)">账户</button>
  <button type="button" id="ledgerTabWorld" data-ledger-tab="viewDraft" onclick="switchTab('viewDraft',this)">世界</button>
  <button class="active" type="button" id="ledgerTabRecord" data-ledger-tab="viewRecord" onclick="switchTab('viewRecord',this)">记账</button>
</nav>
<div class="toast" id="toast"></div>
<div class="confirm-bg" id="confirmBg"><div class="confirm-box"></div></div>

<script src="world-context.js?v=20261019-ledger-split1"></script>
<script src="cloud-sync.js?v=20261021-world-tasks1"></script>
<script src="app-back.js?v=20261010-home-return2"></script>
<script src="ledger-modal.js?v=20261020-blank-save1"></script>
<script src="wallet-recurring.js?v=20261019-monthly-debits1"></script>
<script src="ledger-task-catalog.js?v=20261021-tasks1"></script>
<script src="ledger-task-model.js?v=20261021-tasks1"></script>
<script src="ledger-tasks.js?v=20261021-tasks1"></script>
<script src="wallet-assets.js?v=20261021-world-tasks1"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');

var toastTimer=null;
function showToast(message){
  var target=document.getElementById('toast');
  target.textContent=message;
  target.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){target.classList.remove('show');},2200);
}
function customConfirm(message,onYes,options){
  var background=document.getElementById('confirmBg');
  var box=background.querySelector('.confirm-box');
  box.innerHTML='<p></p><div class="btn-row"><button class="btn btn-cancel" type="button">取消</button><button class="btn '+(options&&options.danger?'btn-del':'btn-primary')+'" type="button">确定</button></div>';
  box.querySelector('p').textContent=message;
  var buttons=box.querySelectorAll('button');
  buttons[0].textContent=options&&options.no||'取消';
  buttons[1].textContent=options&&options.yes||'确定';
  buttons[0].onclick=function(){closeModal('confirmBg');};
  buttons[1].onclick=function(){closeModal('confirmBg');onYes();};
  background.onclick=function(event){if(event.target===background)closeModal('confirmBg');};
  openModal('confirmBg');
}
function switchTab(viewId,button){
  if(['viewAccounts','viewDraft','viewRecord'].indexOf(viewId)<0)return;
  document.querySelectorAll('.view').forEach(function(view){view.classList.toggle('active',view.id===viewId);});
  document.querySelectorAll('[data-ledger-tab]').forEach(function(tab){tab.classList.toggle('active',tab===button);});
  WalletAssets.render();
  var hash=viewId==='viewRecord'?'#record':viewId==='viewDraft'?'#draft':'#accounts';
  history.replaceState(null,'',location.pathname+location.search+hash);
}
document.querySelectorAll('.modal-bg').forEach(function(background){
  background.addEventListener('click',handleLedgerModalBlankClick);
});
WalletAssets.mount();
var initialView=location.hash==='#accounts'?'viewAccounts':location.hash==='#draft'?'viewDraft':'viewRecord';
switchTab(initialView,document.querySelector('[data-ledger-tab="'+initialView+'"]'));
window.addEventListener('liminal-cloud-ready',function(){WalletAssets.render();});
window.addEventListener('storage',function(event){if(!event.key||event.key===WalletAssets.storageKey||(window.LedgerTasks&&event.key===window.LedgerTasks.storageKey))WalletAssets.render();});
function refreshAccountDate(){
  if(document.visibilityState!=='hidden'&&(document.getElementById('viewAccounts').classList.contains('active')||document.getElementById('viewRecord').classList.contains('active')||document.getElementById('viewDraft').classList.contains('active')))WalletAssets.render();
}
window.addEventListener('pageshow',refreshAccountDate);
document.addEventListener('visibilitychange',refreshAccountDate);
setInterval(refreshAccountDate,60000);
var swipeStart=null;
document.addEventListener('touchstart',function(event){
  if(window.innerWidth>720||event.touches.length!==1||event.target.closest('input,textarea,select,[contenteditable="true"],.modal-bg.show,.confirm-bg.show')){swipeStart=null;return;}
  swipeStart={x:event.touches[0].clientX,y:event.touches[0].clientY,at:Date.now()};
},{passive:true});
document.addEventListener('touchend',function(event){
  if(!swipeStart||!event.changedTouches.length)return;
  var start=swipeStart;swipeStart=null;
  var dx=event.changedTouches[0].clientX-start.x,dy=event.changedTouches[0].clientY-start.y;
  if(Date.now()-start.at>900||Math.abs(dx)<58||Math.abs(dx)<=Math.abs(dy)*1.25)return;
  var tabs=Array.from(document.querySelectorAll('[data-ledger-tab]'));
  var index=tabs.findIndex(function(tab){return tab.classList.contains('active');});
  var next=tabs[index+(dx<0?1:-1)];
  if(next){event.preventDefault();next.click();}
},{passive:false});
document.addEventListener('touchcancel',function(){swipeStart=null;},{passive:true});
</script>
</body>
</html>
