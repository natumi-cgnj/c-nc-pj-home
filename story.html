<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Story">
<title>Story</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
html{scrollbar-gutter:stable}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:24px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:1px;color:#666}
.top-bar .back{font-size:13px;color:#999;text-decoration:none;cursor:pointer}

/* Chapter list */
.chapter-list{padding:20px}
.chapter-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.chapter-card:active{background:#f8f8f8}
.chapter-card.locked{opacity:0.4;pointer-events:none}
.chapter-card.completed{border-left:3px solid #5BA66B}
.chapter-card.current{border-left:3px solid #E8B96A}
.ch-num{font-size:10px;color:#bbb;letter-spacing:1px;margin-bottom:4px}
.ch-title{font-size:15px;font-weight:500;color:#333;margin-bottom:4px}
.ch-desc{font-size:11px;color:#aaa;line-height:1.5}
.ch-status{position:absolute;top:16px;right:16px;font-size:10px;padding:3px 8px;border-radius:10px}
.ch-status.done{background:#f0faf2;color:#5BA66B}
.ch-status.active{background:#FFF8E6;color:#E8B96A}
.ch-status.lock{background:#f5f5f5;color:#ccc}
.ch-progress{margin-top:8px;background:#f0f0f0;border-radius:3px;height:3px;overflow:hidden}
.ch-progress-bar{height:100%;border-radius:3px;transition:width 0.3s}

/* Route selection (Jane line / Neal line / Converge) */
.routes-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 12px;border-bottom:1px solid #f0f0f0}
.route-section{padding:12px 8px;position:relative}
.routes-grid .route-section:first-child{border-right:1px solid #f0f0f0}
.route-label{font-size:11px;color:#bbb;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;justify-content:center}
.route-label .dot{width:8px;height:8px;border-radius:50%}
.route-divider{text-align:center;padding:10px 20px 4px;font-size:10px;color:#ccc;letter-spacing:1px;position:relative}
.route-divider::before,.route-divider::after{content:'';position:absolute;top:50%;width:30%;height:1px;background:#eee}
.route-divider::before{left:20px}
.route-divider::after{right:20px}
.converge-section{padding:8px 20px 20px}

/* Episode cards */
.ep-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:8px}
.ep-card:active{background:#f8f8f8}
.ep-card.locked{opacity:0.35;pointer-events:none}
.ep-card.completed .ep-check{background:#5BA66B;border-color:#5BA66B;color:#fff}
.ep-card.active-ep{border-color:#E8B96A}
.ep-check{width:20px;height:20px;border-radius:50%;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:12px;font-weight:500;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-sub{font-size:9px;color:#bbb;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-lock-hint{font-size:9px;color:#E8B96A;margin-top:3px}

/* Dialogue screen */
.dialogue-screen{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column}
.dialogue-screen.show{display:flex}
.dia-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:20px;background:rgba(0,0,0,0.8)}
.dia-header .dia-title{color:#aaa;font-size:12px;letter-spacing:0.5px}
.dia-header .dia-close{color:#666;font-size:12px;cursor:pointer;padding:4px 12px;border:1px solid #444;border-radius:6px;background:transparent}
.dia-body{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer}
.dia-content{max-width:360px;width:100%;text-align:center}
.dia-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;border:3px solid #333;box-shadow:0 0 20px rgba(255,255,255,0.05)}
.dia-speaker{font-size:14px;font-weight:600;letter-spacing:1px;margin-bottom:12px}
.dia-speaker.neal-speak{color:#6B8AFF}
.dia-speaker.jane-speak{color:#5BA66B}
.dia-speaker.narr-speak{color:#999}
.dia-text{font-size:14px;color:#ddd;line-height:1.8;letter-spacing:0.3px;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.dia-footer{padding:12px 16px 24px;text-align:center}
.dia-hint{font-size:10px;color:#555;letter-spacing:0.5px}
.dia-progress{display:flex;gap:3px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.dia-dot{width:6px;height:6px;border-radius:50%;background:#333}
.dia-dot.past{background:#666}
.dia-dot.current{background:#E8B96A}

/* Quest section */
.quest-section{padding:16px 20px}
.quest-header{font-size:12px;color:#999;margin-bottom:8px;letter-spacing:0.5px}
.quest-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.quest-card.done{opacity:0.45}
.quest-check{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.quest-check.checked{background:#1a1a1a;border-color:#1a1a1a}
.quest-name{font-size:13px;color:#333;flex:1}
.quest-reward{font-size:10px;color:#bbb}

/* Reward popup */
.reward-popup{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center}
.reward-popup.show{display:flex}
.reward-box{background:#fff;border-radius:16px;padding:24px 20px;width:85%;max-width:300px;text-align:center;animation:revealPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes revealPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.reward-box h3{font-size:16px;font-weight:500;margin-bottom:8px}
.reward-box .reward-text{font-size:13px;color:#5BA66B;margin-bottom:16px}
.reward-box button{padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>

      <img class="dia-avatar" id="diaAvatar" src="">

    <div class="dia-progress" id="diaProgress"></div>

</div>

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let db;
try{db=JSON.parse(localStorage.getItem('story_db'));}catch(e){db=null;}
if(!db)db={completedEps:[],completedQuests:[],currentChapter:null};
function save(){try{localStorage.setItem('story_db',JSON.stringify(db));}catch(e){}}

function getGacha(){try{return JSON.parse(localStorage.getItem('gacha_st'))||{emerald:0,sapphire:0};}catch(e){return{emerald:0,sapphire:0};}}
function saveGacha(g){try{localStorage.setItem('gacha_st',JSON.stringify(g));}catch(e){}}
function addGems(e,s){const g=getGacha();g.emerald=(g.emerald||0)+e;g.sapphire=(g.sapphire||0)+s;saveGacha(g);}
function getDaily(){let d;try{d=JSON.parse(localStorage.getItem('daily_db'));}catch(e){d=null;}if(!d||typeof d!=='object')d={};if(!d.affinity||typeof d.affinity!=='object')d.affinity={neal:0,jane:0};d.affinity.neal=Number(d.affinity.neal)||0;d.affinity.jane=Number(d.affinity.jane)||0;return d;}
function saveDaily(d){try{localStorage.setItem('daily_db',JSON.stringify(d));}catch(e){}}
function addAff(n,j){const d=getDaily();d.affinity.neal+=n;d.affinity.jane+=j;saveDaily(d);}

let currentView='chapters';
let selectedChapter=null;
let selectedEp=null;
let diaLines=[];
let diaIdx=0;

// ══════════════════════════════════════
// HELPERS
// ══════════════════════════════════════
function getAllEps(ch){
  const r=ch.routes;
  return [...(r.jane?r.jane.episodes:[]),...(r.neal?r.neal.episodes:[]),...(r.converge?r.converge.episodes:[])];
}

function isEpDone(id){return db.completedEps.includes(id);}

function isEpUnlocked(ep, ch){
  const routes=ch.routes;
  // Jane line: sequential
  const jEps=routes.jane?routes.jane.episodes:[];
  const nEps=routes.neal?routes.neal.episodes:[];
  const cEps=routes.converge?routes.converge.episodes:[];
  const jIdx=jEps.findIndex(e=>e.id===ep.id);
  const nIdx=nEps.findIndex(e=>e.id===ep.id);
  const cIdx=cEps.findIndex(e=>e.id===ep.id);
  if(jIdx>=0){return jIdx===0||isEpDone(jEps[jIdx-1].id);}
  if(nIdx>=0){return nIdx===0||isEpDone(nEps[nIdx-1].id);}
  if(cIdx>=0){
    // Converge: all jane+neal eps must be done
    const allPrev=[...jEps,...nEps];
    return allPrev.every(e=>isEpDone(e.id));
  }
  return false;
}

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function render(){
  const c=document.getElementById('mainContent');
  if(currentView==='chapters')renderChapters(c);
  else if(currentView==='episodes')renderEpisodes(c);
  else if(currentView==='quests')renderQuests(c);
  updateBack();
}

function updateBack(){
  const btn=document.getElementById('backBtn');
  const title=document.getElementById('pageTitle');
  if(currentView==='chapters'){
    btn.href='index.html';btn.onclick=null;
    title.textContent='STORY';
  }else if(currentView==='episodes'){
    btn.href='#';btn.onclick=(e)=>{e.preventDefault();currentView='chapters';render();};
    title.textContent=selectedChapter?selectedChapter.num:'STORY';
  }else if(currentView==='quests'){
    btn.href='#';btn.onclick=(e)=>{e.preventDefault();currentView='episodes';render();};
    title.textContent=selectedEp?selectedEp.title:'STORY';
  }
}

function renderChapters(c){
  let html='<div class="chapter-list">';
  CHAPTERS.forEach(ch=>{
    const allEps=getAllEps(ch);
    const done=allEps.filter(e=>isEpDone(e.id)).length;
    const total=allEps.length;
    const allDone=done===total;
    const statusCls=allDone?'done':(done>0?'active':'lock');
    const statusText=allDone?'已完成':(done>0?done+'/'+total:'未开始');
    const cardCls=allDone?'completed':(done>0?'current':'');
    const pct=total?Math.round(done/total*100):0;
    const barColor=allDone?'#5BA66B':'#E8B96A';
    html+=`<div class="chapter-card ${cardCls}" onclick="openChapter('${ch.id}')">
      <div class="ch-num">${ch.num}</div>
      <div class="ch-title">${ch.title}</div>
      <div class="ch-desc">${ch.desc}</div>
      <div class="ch-status ${statusCls}">${statusText}</div>
      <div class="ch-progress"><div class="ch-progress-bar" style="width:${pct}%;background:${barColor}"></div></div>
    </div>`;
  });
  html+='</div>';
  c.innerHTML=html;
}

function openChapter(chId){
  selectedChapter=CHAPTERS.find(c=>c.id===chId);
  if(!selectedChapter)return;
  currentView='episodes';render();
}

function renderEpisodes(c){
  const ch=selectedChapter;
  const routes=ch.routes;
  let html='';

  // Jane + Neal side by side
  html+='<div class="routes-grid">';
  if(routes.jane){
    html+=renderRoute(routes.jane, ch);
  }
  if(routes.neal){
    html+=renderRoute(routes.neal, ch);
  }
  html+='</div>';

  // Converge below
  if(routes.converge){
    const jAllDone=routes.jane?routes.jane.episodes.every(e=>isEpDone(e.id)):true;
    const nAllDone=routes.neal?routes.neal.episodes.every(e=>isEpDone(e.id)):true;
    const unlockHint=(!jAllDone||!nAllDone)?'完成两条线后解锁':'';
    html+='<div class="route-divider">汇合</div>';
    html+='<div class="converge-section">';
    routes.converge.episodes.forEach((ep,i)=>{
      const isDone=isEpDone(ep.id);
      const unlocked=isEpUnlocked(ep,ch);
      const isActive=unlocked&&!isDone;
      let cls=isDone?'completed':(isActive?'active-ep':'locked');
      html+=`<div class="ep-card ${cls}" onclick="${unlocked?'openEp(\\x27'+ep.id+'\\x27)':''}">
        <div class="ep-check ${isDone?'checked':''}" style="${isDone?'':'background:#f3eeff;border-color:#9B6BCC;color:#9B6BCC'}">${isDone?'✓':'★'}</div>
        <div class="ep-info">
          <div class="ep-title">${ep.title}</div>
          <div class="ep-sub">${ep.desc}</div>
          ${!unlocked&&unlockHint?'<div class="ep-lock-hint">'+unlockHint+'</div>':''}
        </div>
      </div>`;
    });
    html+='</div>';
  }
  c.innerHTML=html;
}

function renderRoute(route, ch){
  let html='<div class="route-section">';
  html+=`<div class="route-label"><div class="dot" style="background:${route.color}"></div>${route.label}</div>`;
  route.episodes.forEach((ep,i)=>{
    const isDone=isEpDone(ep.id);
    const unlocked=isEpUnlocked(ep,ch);
    const isActive=unlocked&&!isDone;
    let cls=isDone?'completed':(isActive?'active-ep':'locked');
    html+=`<div class="ep-card ${cls}" onclick="${unlocked?'openEp(\x27'+ep.id+'\x27)':''}">
      <div class="ep-check ${isDone?'checked':''}">${isDone?'✓':(i+1)}</div>
      <div class="ep-info">
        <div class="ep-title">${ep.title}</div>
        <div class="ep-sub">${ep.desc}</div>
      </div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function findEpById(epId){
  for(const ch of CHAPTERS){
    const allEps=getAllEps(ch);
    const ep=allEps.find(e=>e.id===epId);
    if(ep)return ep;
  }
  return null;
}

function openEp(epId){
  selectedEp=findEpById(epId);
  if(!selectedEp)return;
  if(!isEpDone(epId)){
    const anyQuestStarted=selectedEp.quests.some(q=>db.completedQuests.includes(q.id));
    if(anyQuestStarted){
      currentView='quests';render();
      return;
    }
    startDia(selectedEp);
  }else{
    currentView='quests';render();
  }
}

// ══════════════════════════════════════
// DIALOGUE
// ══════════════════════════════════════
function startDia(ep){
  diaLines=ep.dialogue;
  diaIdx=0;
  document.getElementById('diaTitle').textContent=ep.title;
  document.getElementById('diaScreen').classList.add('show');
  showLine();
}

function showLine(){
  if(diaIdx>=diaLines.length){
    closeDia();
    currentView='quests';render();
    return;
  }
  const line=diaLines[diaIdx];
  const avatarEl=document.getElementById('diaAvatar');
  const speakerEl=document.getElementById('diaSpeaker');
  const textEl=document.getElementById('diaText');
  if(line.speaker==='jane'){
    const expr=line.expr||'常态微笑';
    avatarEl.src=EXPR['jane_'+expr]||EXPR['jane_常态微笑'];
    avatarEl.style.display='block';
    speakerEl.textContent='Jane';
    speakerEl.className='dia-speaker jane-speak';
  }else if(line.speaker==='neal'){
    const expr=line.expr||'微笑';
    avatarEl.src=EXPR['neal_'+expr]||EXPR['neal_微笑'];
    avatarEl.style.display='block';
    speakerEl.textContent='Neal';
    speakerEl.className='dia-speaker neal-speak';
  }else{
    avatarEl.style.display='none';
    speakerEl.textContent='';
    speakerEl.className='dia-speaker narr-speak';
  }
  textEl.style.animation='none';
  textEl.offsetHeight;
  textEl.style.animation='';
  textEl.textContent=line.text;
  let dots='';
  for(let i=0;i<diaLines.length;i++){
    const cls=i<diaIdx?'past':(i===diaIdx?'current':'');
    dots+='<div class="dia-dot '+cls+'"></div>';
  }
  document.getElementById('diaProgress').innerHTML=dots;
}

function nextLine(){diaIdx++;showLine();}
function closeDia(){document.getElementById('diaScreen').classList.remove('show');}

// ══════════════════════════════════════
// QUESTS
// ══════════════════════════════════════
function renderQuests(c){
  if(!selectedEp)return;
  const ep=selectedEp;
  const allDone=ep.quests.every(q=>db.completedQuests.includes(q.id));
  const epDone=isEpDone(ep.id);
  let html='<div class="quest-section">';
  html+='<div class="quest-header">'+ep.title+' \u00b7 剧情任务</div>';
  ep.quests.forEach(q=>{
    const done=db.completedQuests.includes(q.id);
    const rewards=[];
    if(q.nealAff)rewards.push('画+'+q.nealAff);
    if(q.janeAff)rewards.push('档+'+q.janeAff);
    if(q.gemE)rewards.push('\ud83d\udc8eE+'+q.gemE);
    if(q.gemS)rewards.push('\ud83d\udc8eS+'+q.gemS);
    html+='<div class="quest-card '+(done?'done':'')+'">';
    html+='<div class="quest-check '+(done?'checked':'')+'" onclick="'+(done?'':'completeQuest(\x27'+q.id+'\x27)')+'">'+(done?'\u2713':'')+'</div>';
    html+='<div class="quest-name">'+q.text+'</div>';
    html+='<div class="quest-reward">'+rewards.join(' ')+'</div>';
    html+='</div>';
  });
  if(allDone&&!epDone){
    html+='<div style="text-align:center;margin-top:16px;"><button onclick="claimReward()" style="padding:12px 32px;background:#1a1a1a;color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;">领取奖励</button></div>';
  }else if(epDone){
    html+='<div style="text-align:center;padding:16px;color:#5BA66B;font-size:12px;">\u2726 已完成</div>';
  }
  html+='</div>';
  html+='<div style="text-align:center;padding:0 20px 20px;"><button onclick="replayDia()" style="padding:8px 20px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;font-size:11px;cursor:pointer;color:#999;">重看剧情</button></div>';
  c.innerHTML=html;
}

function completeQuest(qId){
  if(db.completedQuests.includes(qId))return;
  db.completedQuests.push(qId);
  const ep=selectedEp;
  const q=ep.quests.find(x=>x.id===qId);
  if(q){
    if(q.gemE||q.gemS)addGems(q.gemE||0,q.gemS||0);
    if(q.nealAff||q.janeAff)addAff(q.nealAff||0,q.janeAff||0);
  }
  save();render();
}

function claimReward(){
  if(!selectedEp)return;
  const ep=selectedEp;
  db.completedEps.push(ep.id);
  const r=ep.reward;
  if(r.gemE||r.gemS)addGems(r.gemE||0,r.gemS||0);
  if(r.nealAff||r.janeAff)addAff(r.nealAff||0,r.janeAff||0);
  save();
  const parts=[];
  if(r.nealAff)parts.push('画作碎片 +'+r.nealAff);
  if(r.janeAff)parts.push('档案碎片 +'+r.janeAff);
  if(r.gemE)parts.push('祖母绿 +'+r.gemE);
  if(r.gemS)parts.push('蓝宝石 +'+r.gemS);
  document.getElementById('rewardText').textContent='\u2726 '+parts.join('  ');
  document.getElementById('rewardPopup').classList.add('show');
}

function closeReward(){
  document.getElementById('rewardPopup').classList.remove('show');
  render();
}

function replayDia(){
  if(!selectedEp)return;
  startDia(selectedEp);
}

render();
</script>
