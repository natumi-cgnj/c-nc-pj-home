<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doll">
<title>Doll</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100dvh;padding-bottom:56px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top,12px));border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#999}
.back{font-size:13px;color:#bbb;text-decoration:none}
.top-right{display:flex;gap:8px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}

/* Bottom tab bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;z-index:50;padding-bottom:env(safe-area-inset-bottom,0)}
.tab-btn{flex:1;padding:10px 0 8px;text-align:center;font-size:10px;color:#ccc;background:none;border:none;cursor:pointer;font-family:inherit;letter-spacing:0.5px}
.tab-btn.active{color:#9B8AE8;font-weight:600}

/* Views */
.view{display:none}.view.active{display:block}

/* ── Items view ── */
.pending-section{padding:12px 20px}
.pending-header{font-size:10px;color:#bbb;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pending-header .count{background:#f0f0f0;border-radius:8px;padding:1px 6px;font-size:9px;color:#999}
.pending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.item-thumb{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#f5f5f5;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-thumb .item-name-s{font-size:8px;color:#bbb;text-align:center;padding:2px;word-break:break-all}
.item-thumb.long-term{border:2px solid #9B8AE822}
.item-thumb.consumable{border:2px solid #8AAAC422}

.section-divider{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;cursor:pointer;user-select:none}
.section-divider:active{opacity:0.7}
.section-line{flex:1;height:1px;background:#e0e0e0}
.section-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.section-arrow{font-size:8px;color:#ccc;transition:transform 0.2s;display:inline-block}
.section-divider.collapsed .section-arrow{transform:rotate(-90deg)}
.section-items{padding:4px 20px 8px}
.section-items.collapsed{display:none}

.item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.item-row:active{opacity:0.7}
.item-row-img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f0f0f0;flex-shrink:0}
.item-row-body{flex:1;min-width:0}
.item-row-name{font-size:13px;font-weight:500;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row-meta{font-size:10px;color:#ccc;margin-top:2px}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.active{background:#9B8AE8}
.status-dot.pending{background:#ddd}

.add-row{display:flex;gap:8px;padding:12px 20px}
.add-btn{flex:1;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:none;font-size:12px;color:#ccc;cursor:pointer;font-family:inherit;text-align:center}
.add-btn:active{background:#fafafa}
.add-btn.gold{border-color:#E8B96A;color:#E8B96A}

/* ── Catalog view ── */
.fund-pool{padding:12px 20px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.fund-label{font-size:10px;color:#ccc}
.fund-amount{font-size:16px;font-weight:300;color:#9B8AE8;font-variant-numeric:tabular-nums}
.fund-amount.zero{color:#5BA66B}

.catalog-row{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer}
.catalog-row:active{background:#f9f9f9}
.catalog-icon{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f0f0f0}
.catalog-body{flex:1;min-width:0}
.catalog-name{font-size:14px;font-weight:500;color:#333}
.catalog-meta{font-size:11px;color:#ccc;margin-top:2px}
.catalog-add{padding:14px 20px;text-align:center;font-size:13px;color:#ccc;cursor:pointer;background:#fff;border-bottom:1px solid #f5f5f5}
.catalog-add:active{background:#f8f8f8}

/* Shelf (reused from cinema) */
.shelf-header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;user-select:none}
.shelf-header:active{background:#f5f5f5}
.shelf-line{flex:1;height:1px;background:#e0e0e0}
.shelf-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.shelf-arrow{font-size:8px;color:#ccc;transition:transform 0.25s;display:inline-block}
.shelf-header.collapsed .shelf-arrow{transform:rotate(-90deg)}
.shelf-items{overflow:hidden}.shelf-items.collapsed{display:none}

/* ── Catalog detail view ── */
.detail-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top,12px));background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
.detail-bar h1{font-size:14px;font-weight:600;color:#333;text-align:center;flex:1}
.detail-stats{padding:8px 20px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;color:#bbb}
.catalog-grid{display:grid;gap:8px;padding:12px 28px}
.cat-item{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#f0f0f0;aspect-ratio:1}
.cat-item img{width:100%;height:100%;object-fit:cover;transition:opacity 0.2s}
.cat-item:not(.collected) img{opacity:0.3;filter:grayscale(0.6)}
.cat-item.collected img{opacity:1}
.cat-item .cat-name{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:#fff;background:rgba(0,0,0,0.45);padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item .lock-icon{position:absolute;top:3px;right:3px;font-size:10px;opacity:0.6}
.cat-edit-btn{position:absolute;top:3px;left:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font:12px/22px inherit;text-align:center;cursor:pointer;z-index:2}
.cat-item.collected .collect-dot{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#5BA66B;border:1px solid #fff}
.cat-section-div{display:flex;align-items:center;gap:10px;padding:12px 20px 4px}
.cat-section-div .section-line{flex:1;height:1px;background:#e8e8e8}
.cat-section-div .section-label{font-size:11px;color:#bbb}
.detail-add-row{display:flex;gap:8px;padding:12px 20px;margin-top:8px}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:env(safe-area-inset-bottom,20px)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal label{font-size:11px;color:#999;display:block;margin:10px 0 4px}
.modal input[type="text"],.modal input[type="number"],.modal input[type="date"],.modal select,.modal textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid #e8e8e8;border-radius:8px;font-family:inherit;background:#fafafa}
.modal textarea{height:60px;resize:none}
.file-label{display:block;text-align:center;padding:10px;border:1.5px dashed #ddd;border-radius:8px;color:#ccc;cursor:pointer;font-size:12px}
.img-preview{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-top:6px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center}
.btn-cancel{background:#f5f5f5;color:#999}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-del{background:none;border:1px solid #E85A5A;color:#E85A5A}

/* Section list in modal */
.section-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.section-row{display:flex;gap:6px;align-items:center}
.section-row input[type="text"]{flex:1}
.section-row input[type="number"]{width:50px}
.del-sec{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer}
.add-section-btn{width:100%;padding:8px;border:1px dashed #ddd;border-radius:8px;background:none;color:#ccc;cursor:pointer;font-size:12px;font-family:inherit}

/* Label */
.label-row{display:flex;gap:12px;align-items:center;margin-top:8px}
.label-row input{flex:0 0 100px;min-width:0}
.color-picker{display:grid;grid-template-columns:repeat(8,28px);gap:5px;flex:1}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s}
.color-swatch.active{border-color:#333}

/* Category select */
.cat-select{display:flex;gap:6px;margin-top:4px}
.cat-opt{padding:6px 12px;border-radius:8px;border:1.5px solid #e8e8e8;font-size:11px;color:#999;cursor:pointer;font-family:inherit;background:#fff}
.cat-opt.active{border-color:#9B8AE8;color:#9B8AE8;background:#9B8AE80a}

/* Disposition */
.disp-row{display:flex;gap:6px;margin-top:6px}
.disp-btn{padding:6px 12px;border-radius:8px;border:1.5px solid #e8e8e8;font-size:11px;color:#999;cursor:pointer;font-family:inherit;background:#fff}
.disp-btn.active{border-color:#9B8AE8;color:#9B8AE8}
.disp-btn.sold.active{border-color:#5BA66B;color:#5BA66B}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;font-size:11px;padding:8px 16px;border-radius:8px;display:none;z-index:300}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" href="index.html">← Home</a>
  <h1>Doll</h1>
  <div class="top-right"><button class="btn-s" onclick="exportData()">Backup</button></div>
</div>

<!-- Items View (default) -->
<div class="view active" id="viewItems">
  <div id="pendingArea"></div>
  <div id="sectionsArea"></div>
  <div class="add-row">
    <button class="add-btn gold" onclick="openAddItem()">New Item</button>
    <button class="add-btn" onclick="openAddSection()">New Section</button>
  </div>
</div>

<!-- Catalog View -->
<div class="view" id="viewCatalog">
  <div class="fund-pool" id="fundPool"></div>
  <div id="catalogList"></div>
  <div class="catalog-add" onclick="openAddCatalog()">New List</div>
</div>

<!-- Catalog Detail View -->
<div class="view" id="viewCatalogDetail">
  <div class="detail-bar">
    <a class="back" onclick="showView('viewCatalog')">← Back</a>
    <h1 id="catalogDetailTitle"></h1>
    <button class="btn-s" onclick="openEditCatalog()">Edit</button>
  </div>
  <div class="detail-stats" id="catalogDetailStats"></div>
  <div id="catalogDetailGrid"></div>
  <div class="detail-add-row">
    <button class="add-btn gold" onclick="openAddCatItem()">New Title</button>
    <button class="add-btn" onclick="openAddCatSection()">New Section</button>
  </div>
</div>

<!-- Reference View -->
<div class="view" id="viewRef">
  <div id="refList"></div>
  <div class="catalog-add" onclick="openAddRef()">New Reference</div>
</div>

<!-- Reference Detail View -->
<div class="view" id="viewRefDetail">
  <div class="detail-bar">
    <a class="back" onclick="showView('viewRef');document.querySelector('.tab-bar').style.display='flex'">← Back</a>
    <h1 id="refDetailTitle"></h1>
    <button class="btn-s" onclick="openEditRef()">Edit</button>
  </div>
  <div class="catalog-grid" id="refDetailGrid"></div>
  <div style="padding:16px 20px">
    <textarea id="refComment" style="width:100%;min-height:80px;border:1px solid #e8e8e8;border-radius:10px;padding:12px;font-size:12px;font-family:inherit;background:#fafafa;resize:none;color:#666" onchange="saveRefComment()"></textarea>
  </div>
  <div class="detail-add-row">
    <button class="add-btn gold" onclick="openAddRefItem()">New Title</button>
    <button class="add-btn" onclick="addRefToList()">Add to List</button>
  </div>
</div>

<!-- Add/Edit Reference Modal -->
<div class="modal-bg" id="refModal">
<div class="modal">
  <h2 id="refModalTitle">New Reference</h2>
  <label>Cover</label>
  <label class="file-label" id="refIconLabel">Select</label>
  <input type="file" accept="image/*" id="refIconInput" onchange="previewImg(this,'refIconPreview')" style="display:none">
  <img id="refIconPreview" class="img-preview" style="display:none">
  <label>Name</label>
  <input type="text" id="inputRefName">
  <label>Shelf</label>
  <input type="text" id="inputRefShelf">
  <label>Notes</label>
  <textarea id="inputRefNote"></textarea>
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('refModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveRef()">Save</button>
  </div>
</div>
</div>

<!-- Add Reference Item Modal -->
<div class="modal-bg" id="refItemModal">
<div class="modal">
  <h2>New Title</h2>
  <label>Name</label>
  <input type="text" id="inputRefItemName">
  <label>Cover</label>
  <label class="file-label" id="refItemFileLabel">Select</label>
  <input type="file" accept="image/*" id="refItemImgInput" onchange="previewImg(this,'refItemImgPreview')" style="display:none">
  <img id="refItemImgPreview" class="img-preview" style="display:none">
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('refItemModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveRefItem()">Save</button>
  </div>
</div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('viewItems')">Items</button>
  <button class="tab-btn" onclick="switchTab('viewCatalog')">List</button>
  <button class="tab-btn" onclick="switchTab('viewRef')">Ref</button>
</div>

<!-- Add/Edit Item Modal -->
<div class="modal-bg" id="itemModal">
<div class="modal">
  <h2 id="itemModalTitle">New Item</h2>
  <label>Name</label>
  <input type="text" id="inputItemName">
  <label>Cover</label>
  <label class="file-label" id="itemFileLabel">Select</label>
  <input type="file" accept="image/*" id="itemImgInput" onchange="previewImg(this,'itemImgPreview')" style="display:none">
  <img id="itemImgPreview" class="img-preview" style="display:none">
  <label>Category</label>
  <div class="cat-select" id="catSelect">
    <button type="button" class="cat-opt active" onclick="pickCat('long_term')">Long-term</button>
    <button type="button" class="cat-opt" onclick="pickCat('consumable')">Consumable</button>
  </div>
  <input type="hidden" id="itemCat" value="long_term">
  <label>Cost</label>
  <input type="number" id="inputItemCost" min="0" step="1">
  <label>Notes</label>
  <textarea id="inputItemNote"></textarea>
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('itemModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveItem()">Save</button>
  </div>
  <div id="itemDeleteWrap" style="display:none;text-align:center;margin-top:12px">
    <button class="btn-del" style="width:100%;padding:10px;border-radius:10px" onclick="deleteItem()">Delete</button>
  </div>
</div>
</div>

<!-- Add Section Modal -->
<div class="modal-bg" id="sectionModal">
<div class="modal">
  <h2>New Section</h2>
  <label>Name</label>
  <input type="text" id="inputSectionName">
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('sectionModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveSection()">Save</button>
  </div>
</div>
</div>

<!-- Item Action Modal (assign/dispose) -->
<div class="modal-bg" id="actionModal">
<div class="modal">
  <h2 id="actionTitle">Item</h2>
  <div id="actionContent"></div>
</div>
</div>

<!-- Add/Edit Catalog Modal -->
<div class="modal-bg" id="catalogModal">
<div class="modal">
  <h2 id="catalogModalTitle">New List</h2>
  <label>Cover</label>
  <label class="file-label" id="catIconLabel">Select</label>
  <input type="file" accept="image/*" id="catIconInput" onchange="previewImg(this,'catIconPreview')" style="display:none">
  <img id="catIconPreview" class="img-preview" style="display:none">
  <label>Name</label>
  <input type="text" id="inputCatName">
  <label>Shelf</label>
  <input type="text" id="inputCatShelf">
  <label>Sections</label>
  <div class="section-list" id="catSectionList"></div>
  <button class="add-section-btn" onclick="addCatSectionRow()">+ Section</button>
  <label>Notes</label>
  <textarea id="inputCatNote"></textarea>
  <label>Label</label>
  <div class="label-row">
    <input type="text" id="inputCatLabel">
    <div class="color-picker" id="catColorPicker"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('catalogModal')">Cancel</button>
    <button class="btn btn-primary" onclick="saveCatalog()">Save</button>
  </div>
</div>
</div>

<!-- Catalog Item Modal -->
<div class="modal-bg" id="catItemModal">
<div class="modal">
  <h2 id="catItemModalTitle">New Title</h2>
  <div id="catItemSectionField" style="display:none">
    <label>Section</label>
    <select id="inputCatItemSection"></select>
  </div>
  <label>Name</label>
  <input type="text" id="inputCatItemName">
  <label>Cover</label>
  <label class="file-label" id="catItemFileLabel">Select</label>
  <input type="file" accept="image/*" id="catItemImgInput" onchange="previewImg(this,'catItemImgPreview')" style="display:none">
  <img id="catItemImgPreview" class="img-preview" style="display:none">
  <label>Cost</label>
  <input type="number" id="inputCatItemCost" min="0" step="1">
  <label>Lock</label>
  <div class="cat-select">
    <button type="button" class="cat-opt" id="lockBtn" onclick="toggleCatLock()">🔒 Collection only</button>
  </div>
  <input type="hidden" id="catItemLocked" value="0">
  <div class="btn-row">
    <button class="btn btn-cancel" onclick="closeModal('catItemModal')">Cancel</button>
    <button class="btn btn-del" id="catItemDeleteBtn" style="display:none" onclick="deleteCatItem()">Delete</button>
    <button class="btn btn-primary" onclick="saveCatItem()">Save</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script src="cloudinary-upload.js"></script>
<script src="cloud-sync.js"></script>
<script>
'use strict';
const DB_KEY='doll_db2';
const COLORS=['#9B8AE8','#6B5ACD','#D4537E','#B0805A','#D85A30','#E84A7A','#E8B96A','#9B6BCC','#4AADE8','#3A8DD4','#5BA66B','#3D8B50','#6B8AFF','#4A6AE0','#888','#4ECDC4'];
let db={items:[],sections:[],catalogs:[],refs:[],sectionCollapsed:{},shelfCollapsed:{},refShelfCollapsed:{}};
let curCatalogId=null,curRefId=null,editItemId=null,editCatalogId=null,editRefId=null,editCatItemIdx=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d){db={items:d.items||[],sections:d.sections||[],catalogs:d.catalogs||[],refs:d.refs||[],sectionCollapsed:d.sectionCollapsed||{},shelfCollapsed:d.shelfCollapsed||{},refShelfCollapsed:d.refShelfCollapsed||{}};return;}}catch(e){}
}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function gid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

/* ═══ VIEWS ═══ */
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function switchTab(id){
  showView(id);
  const tabs=['viewItems','viewCatalog','viewRef'];
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',tabs[i]===id));
  document.querySelector('.tab-bar').style.display='flex';
  if(id==='viewItems')renderItems();else if(id==='viewCatalog')renderCatalogList();else if(id==='viewRef')renderRefList();
}

/* ═══ ITEMS VIEW ═══ */
function renderItems(){
  const pending=db.items.filter(i=>i.status==='pending');
  const longTerm=pending.filter(i=>i.category==='long_term');
  const consumable=pending.filter(i=>i.category==='consumable');
  let html='';
  if(longTerm.length){
    html+=`<div class="pending-section"><div class="pending-header">Long-term <span class="count">${longTerm.length}</span></div><div class="pending-grid">${longTerm.map(i=>renderThumb(i,'long-term')).join('')}</div></div>`;
  }
  if(consumable.length){
    html+=`<div class="pending-section"><div class="pending-header">Consumable <span class="count">${consumable.length}</span></div><div class="pending-grid">${consumable.map(i=>renderThumb(i,'consumable')).join('')}</div></div>`;
  }
  if(!pending.length)html+=`<div class="pending-section"><div class="pending-header" style="justify-content:center;color:#ddd;padding:20px 0">No pending items</div></div>`;
  document.getElementById('pendingArea').innerHTML=html;
  let secHtml='';
  db.sections.forEach(sec=>{

/* ═══ CATALOG VIEW ═══ */
function renderCatalogList(){
  // Fund pool: sum of cost for items still pending (not disposed as keep/gift)
  const pendingCost=db.items.filter(i=>i.status==='pending'||(!i.disposition&&i.status==='active')).reduce((s,i)=>s+(i.cost||0),0);
  const soldTotal=db.items.filter(i=>i.disposition==='sold').reduce((s,i)=>s+(i.soldPrice||0),0);
  // Also count disposed catalog items that are in 'sold' but removed from items
  // For now just show pending cost and sold recovery
  const pool=pendingCost-soldTotal;
  const fp=document.getElementById('fundPool');
  fp.innerHTML=`<span class="fund-label">Fund Pool</span><span class="fund-amount${pool<=0?' zero':''}">¥${pool.toLocaleString()}</span>`;

  const sorted=db.catalogs.sort((a,b)=>(a.order||0)-(b.order||0));
  const ungrouped=sorted.filter(c=>!c.shelf);
  const shelves={};const shelfOrder=[];
  sorted.forEach(c=>{if(!c.shelf)return;if(!shelves[c.shelf]){shelves[c.shelf]=[];shelfOrder.push(c.shelf);}shelves[c.shelf].push(c);});

  let html='';
  ungrouped.forEach(c=>{html+=renderCatalogRow(c);});
  shelfOrder.forEach(shelf=>{
    const coll=db.shelfCollapsed[shelf];
    html+=`<div class="shelf-header${coll?' collapsed':''}" onclick="toggleShelf('${esc(shelf)}')"><div class="shelf-line"></div><span class="shelf-label">${esc(shelf)}</span><span class="shelf-arrow">▼</span><div class="shelf-line"></div></div>`;
    html+=`<div class="shelf-items${coll?' collapsed':''}">`;shelves[shelf].forEach(c=>{html+=renderCatalogRow(c);});html+=`</div>`;
  });
  document.getElementById('catalogList').innerHTML=html;
}
function renderCatalogRow(c){
  const collected=c.items.filter(i=>i.collected).length;const total=c.items.length;
  const label=c.label&&c.label.name?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${c.label.color||'#ccc'}15;color:${c.label.color||'#ccc'};margin-left:4px">${esc(c.label.name)}</span>`:'';
  return`<div class="catalog-row" onclick="openCatalogDetail('${c.id}')"><img class="catalog-icon" src="${c.icon||''}" onerror="this.style.background='#f0f0f0'"><div class="catalog-body"><div class="catalog-name">${esc(c.name)}${label}</div><div class="catalog-meta">${collected} / ${total}${c.items.length?' · ¥'+c.items.reduce((s,i)=>s+((i.collected&&i.cost)||0),0).toLocaleString():''}</div></div></div>`;
}

/* ── Catalog detail ── */
function openCatalogDetail(id){
  curCatalogId=id;const c=db.catalogs.find(x=>x.id===id);if(!c)return;
  document.getElementById('catalogDetailTitle').textContent=c.name;
  const collected=c.items.filter(i=>i.collected).length;
  const totalCost=c.items.filter(i=>i.collected).reduce((s,i)=>s+(i.cost||0),0);
  document.getElementById('catalogDetailStats').innerHTML=`<span>${collected} / ${c.items.length}</span><span>¥${totalCost.toLocaleString()}</span>`;
  let html='';
  if(c.sections&&c.sections.length>1){
    let idx=0;
    c.sections.forEach(sec=>{
      const cols=Math.max(2,Math.min(5,sec.cols||3));
      html+=`<div class="cat-section-div"><div class="section-line"></div><span class="section-label">${esc(sec.name)}</span><div class="section-line"></div></div>`;
      html+=`<div class="catalog-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
      for(let i=0;i<sec.count;i++){
        if(idx<c.items.length)html+=renderCatItem(c.items[idx],idx);
        idx++;
      }
      html+=`</div>`;
    });
    if(idx<c.items.length){
      html+=`<div class="catalog-grid" style="grid-template-columns:repeat(3,1fr)">`;
      for(;idx<c.items.length;idx++)html+=renderCatItem(c.items[idx],idx);
      html+=`</div>`;
    }
  }else{
    const cols=c.sections&&c.sections[0]?Math.max(2,Math.min(5,c.sections[0].cols||3)):3;
    html+=`<div class="catalog-grid" style="grid-template-columns:repeat(${cols},1fr)">${c.items.map((item,idx)=>renderCatItem(item,idx)).join('')}</div>`;
  }
  document.getElementById('catalogDetailGrid').innerHTML=html;
  showView('viewCatalogDetail');
  document.querySelector('.tab-bar').style.display='none';
}
function renderCatItem(item,idx){
  return`<div class="cat-item${item.collected?' collected':''}" onclick="toggleCollect(${idx})"><img src="${item.img||''}" onerror="this.parentElement.style.background='#e8e8e8'"><button class="cat-edit-btn" aria-label="Edit" onclick="event.stopPropagation();openEditCatItem(${idx})">⋯</button><div class="cat-name">${esc(item.name)}</div>${item.locked?'<div class="lock-icon">🔒</div>':''}${item.collected?'<div class="collect-dot"></div>':''}</div>`;
}
function toggleCollect(idx){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c)return;
  const item=c.items[idx];if(!item)return;
  item.collected=!item.collected;
  if(item.collected&&!item.locked){
    // Create pending item in main items
    db.items.push({id:gid(),name:item.name,img:item.img||'',category:'long_term',status:'pending',assignment:null,cost:item.cost||0,note:'',source:'catalog',catalogRef:{catalogId:curCatalogId,itemIdx:idx},disposition:null,soldPrice:0,addedAt:Date.now()});
  }
  if(!item.collected){
    // Remove from items if uncollecting
    db.items=db.items.filter(i=>!(i.catalogRef&&i.catalogRef.catalogId===curCatalogId&&i.catalogRef.itemIdx===idx&&i.status==='pending'));
  }
  save();openCatalogDetail(curCatalogId);
}

function renderCatSections(){

function saveCatalog(){
  if(!imageReady('catIconPreview'))return;
  const name=document.getElementById('inputCatName').value.trim();if(!name){toast('Name required');return;}
  const shelf=document.getElementById('inputCatShelf').value.trim();
  const note=document.getElementById('inputCatNote').value.trim();
  const labelName=document.getElementById('inputCatLabel').value.trim();
  const preview=document.getElementById('catIconPreview');
  const icon=preview.style.display!=='none'?preview.src:'';
  const sections=_catSections.filter(s=>s.name);
  const label={name:labelName,color:_catLabelColor};
  if(editCatalogId){
    const c=db.catalogs.find(x=>x.id===editCatalogId);
    if(c){c.name=name;c.shelf=shelf;c.note=note;c.label=label;if(icon)c.icon=icon;
      const totalNeeded=sections.reduce((s,sec)=>s+sec.count,0);
      while(c.items.length<totalNeeded)c.items.push({id:gid(),name:'',img:'',collected:false,locked:false,cost:0,note:''});
      c.sections=sections;
    }
  }else{
    const totalItems=sections.reduce((s,sec)=>s+sec.count,0)||0;
    const items=[];for(let i=0;i<totalItems;i++)items.push({id:gid(),name:'Title '+(i+1),img:'',collected:false,locked:false,cost:0,note:''});
    db.catalogs.push({id:gid(),name,shelf,icon:icon||'',note,label,sections,items,order:db.catalogs.length});
  }
  save();closeModal('catalogModal');
  if(editCatalogId)openCatalogDetail(editCatalogId);else renderCatalogList();
}

function openAddCatItem(){

function getCatalogItemSectionIndex(c,itemIdx){
  let end=0;
  for(let i=0;i<(c.sections||[]).length;i++){
    end+=parseInt(c.sections[i].count)||0;
    if(itemIdx<end)return i;
  }
  return -1;
}
function openEditCatItem(idx){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c||!c.items[idx])return;
  const item=c.items[idx];editCatItemIdx=idx;
  document.getElementById('catItemModalTitle').textContent='Edit Title';
  document.getElementById('inputCatItemName').value=item.name||'';
  document.getElementById('inputCatItemCost').value=item.cost||'';
  const preview=document.getElementById('catItemImgPreview');
  if(item.img){preview.src=item.img;preview.style.display='block';}else{preview.removeAttribute('src');preview.style.display='none';}
  document.getElementById('catItemLocked').value=item.locked?'1':'0';
  document.getElementById('lockBtn').classList.toggle('active',!!item.locked);
  document.getElementById('catItemDeleteBtn').style.display='';
  document.getElementById('catItemSectionField').style.display='none';
  openModal('catItemModal');
}
function toggleCatLock(){
  const f=document.getElementById('catItemLocked');
  f.value=f.value==='0'?'1':'0';
  document.getElementById('lockBtn').classList.toggle('active',f.value==='1');
}
function saveCatItem(){
  if(!imageReady('catItemImgPreview'))return;
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c)return;
  const name=document.getElementById('inputCatItemName').value.trim()||'Title '+(c.items.length+1);
  const cost=parseInt(document.getElementById('inputCatItemCost').value)||0;
  const locked=document.getElementById('catItemLocked').value==='1';
  const preview=document.getElementById('catItemImgPreview');
  const img=preview.style.display!=='none'?preview.src:'';
  if(editCatItemIdx!==null){
    const item=c.items[editCatItemIdx];if(item){item.name=name;item.cost=cost;item.locked=locked;if(img)item.img=img;}
  }else{
    const newItem={id:gid(),name,img,collected:false,locked,cost,note:''};
    if(c.sections&&c.sections.length){
      const sectionIdx=Math.max(0,parseInt(document.getElementById('inputCatItemSection').value)||0);
      let insertIdx=0;for(let i=0;i<=sectionIdx;i++)insertIdx+=parseInt(c.sections[i].count)||0;
      c.items.splice(insertIdx,0,newItem);c.sections[sectionIdx].count=(parseInt(c.sections[sectionIdx].count)||0)+1;
      db.items.forEach(item=>{if(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx>=insertIdx)item.catalogRef.itemIdx++;});
    }else c.items.push(newItem);
  }
  save();closeModal('catItemModal');openCatalogDetail(curCatalogId);
}
function deleteCatItem(){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c||editCatItemIdx===null||!c.items[editCatItemIdx])return;
  const removedIdx=editCatItemIdx;
  const sectionIdx=getCatalogItemSectionIndex(c,removedIdx);
  if(sectionIdx>=0)c.sections[sectionIdx].count=Math.max(0,(parseInt(c.sections[sectionIdx].count)||0)-1);
  c.items.splice(removedIdx,1);
  db.items=db.items.filter(item=>!(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx===removedIdx));
  db.items.forEach(item=>{if(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx>removedIdx)item.catalogRef.itemIdx--;});
  editCatItemIdx=null;save();closeModal('catItemModal');openCatalogDetail(curCatalogId);toast('Deleted');
}
function openAddCatSection(){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c)return;
  const name=prompt('Section name');if(!name)return;
  const count=parseInt(prompt('Count'))||0;
  c.sections.push({name,count});
  for(let i=0;i<count;i++)c.items.push({id:gid(),name:'Title '+(c.items.length+1),img:'',collected:false,locked:false,cost:0,note:''});
  save();openCatalogDetail(curCatalogId);
}

    const coll=db.refShelfCollapsed[shelf];
    html+=`<div class="shelf-header${coll?' collapsed':''}" onclick="toggleRefShelf('${esc(shelf)}')"><div class="shelf-line"></div><span class="shelf-label">${esc(shelf)}</span><span class="shelf-arrow">▼</span><div class="shelf-line"></div></div>`;
    html+=`<div class="shelf-items${coll?' collapsed':''}">`;shelves[shelf].forEach(r=>{html+=renderRefRow(r);});html+=`</div>`;
  });
  document.getElementById('refList').innerHTML=html;
}
function renderRefRow(r){
  return`<div class="catalog-row" onclick="openRefDetail('${r.id}')"><img class="catalog-icon" src="${r.icon||''}" onerror="this.style.background='#f0f0f0'"><div class="catalog-body"><div class="catalog-name">${esc(r.name)}</div><div class="catalog-meta">${r.items?r.items.length:0} items</div></div></div>`;
}
function toggleRefShelf(name){db.refShelfCollapsed[name]=!db.refShelfCollapsed[name];save();renderRefList();}
function openRefDetail(id){
  curRefId=id;const r=db.refs.find(x=>x.id===id);if(!r)return;
  document.getElementById('refDetailTitle').textContent=r.name;
  let html=`<div class="catalog-grid">${(r.items||[]).map((item,idx)=>`<div class="cat-item collected" onclick="viewRefImg(${idx})"><img src="${item.img||''}" onerror="this.parentElement.style.background='#e8e8e8'"><div class="cat-name">${esc(item.name)}</div></div>`).join('')}</div>`;
  document.getElementById('refDetailGrid').innerHTML=html;
  document.getElementById('refComment').value=r.comment||'';
  showView('viewRefDetail');
  document.querySelector('.tab-bar').style.display='none';
}
function saveRefComment(){
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  r.comment=document.getElementById('refComment').value;save();
}
function viewRefImg(idx){
  const r=db.refs.find(x=>x.id===curRefId);if(!r||!r.items[idx])return;
  // Simple fullscreen preview
  const img=r.items[idx].img;if(!img)return;
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';
  overlay.innerHTML=`<img src="${img}" style="max-width:90vw;max-height:90vh;object-fit:contain;border-radius:8px">`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}
function addRefToList(){
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  const name=prompt('Add to List — which items? (enter name)');if(!name)return;
  // Find or create a catalog with same name
  let cat=db.catalogs.find(c=>c.name===r.name);
  if(!cat){cat={id:gid(),name:r.name,shelf:r.shelf||'',icon:r.icon||'',note:'',label:{name:'',color:'#9B8AE8'},sections:[],items:[],order:db.catalogs.length};db.catalogs.push(cat);}
  cat.items.push({id:gid(),name,img:'',collected:false,locked:false,cost:0,note:''});
  save();toast('Added to List');
}

/* ── Reference CRUD ── */
function openAddRef(){
  editRefId=null;
  document.getElementById('refModalTitle').textContent='New Reference';
  document.getElementById('inputRefName').value='';document.getElementById('inputRefShelf').value='';document.getElementById('inputRefNote').value='';
  document.getElementById('refIconPreview').style.display='none';
  openModal('refModal');
}
function openEditRef(){
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  editRefId=r.id;
  document.getElementById('refModalTitle').textContent='Edit Reference';
  document.getElementById('inputRefName').value=r.name;document.getElementById('inputRefShelf').value=r.shelf||'';document.getElementById('inputRefNote').value=r.note||'';
  openModal('refModal');
}
function saveRef(){
  if(!imageReady('refIconPreview'))return;
  const name=document.getElementById('inputRefName').value.trim();if(!name){toast('Name required');return;}
  const shelf=document.getElementById('inputRefShelf').value.trim();
  const note=document.getElementById('inputRefNote').value.trim();
  const preview=document.getElementById('refIconPreview');
  const icon=preview.style.display!=='none'?preview.src:'';
  if(editRefId){
    const r=db.refs.find(x=>x.id===editRefId);
    if(r){r.name=name;r.shelf=shelf;r.note=note;if(icon)r.icon=icon;}
  }else{
    db.refs.push({id:gid(),name,shelf,icon:icon||'',note,comment:'',items:[],order:db.refs.length});
  }
  save();closeModal('refModal');renderRefList();
}
function openAddRefItem(){
  document.getElementById('inputRefItemName').value='';
  document.getElementById('refItemImgPreview').style.display='none';
  openModal('refItemModal');
}
function saveRefItem(){
  if(!imageReady('refItemImgPreview'))return;
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  const name=document.getElementById('inputRefItemName').value.trim()||'Item '+(r.items.length+1);
  const preview=document.getElementById('refItemImgPreview');
  const img=preview.style.display!=='none'?preview.src:'';
  r.items.push({id:gid(),name,img});
  save();closeModal('refItemModal');openRefDetail(curRefId);
}

/* ═══ HELPERS ═══ */
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2000);}
function imageReady(previewId){
  const p=document.getElementById(previewId);
  if(p&&p.dataset.uploading==='1'){toast('Please wait for the image upload');return false;}
  return true;
}
async function previewImg(input,previewId){
  if(!input.files||!input.files[0])return;
  const p=document.getElementById(previewId);const file=input.files[0];
  const previousSrc=p.getAttribute('src')||'';const previousDisplay=p.style.display;
  const token=Date.now()+'_'+Math.random();p.dataset.uploadToken=token;p.dataset.uploading='1';p.style.opacity='.45';
  toast('Uploading image…');
  try{
    if(!window.CloudinaryAssets)throw new Error('Image service unavailable');
    const url=await CloudinaryAssets.uploadImage(file);
    if(p.dataset.uploadToken!==token)return;
    p.src=url;p.style.display='block';toast('Image uploaded');
  }catch(e){
    if(p.dataset.uploadToken!==token)return;
    if(previousSrc){p.src=previousSrc;p.style.display=previousDisplay||'block';}else{p.removeAttribute('src');p.style.display='none';}
    input.value='';toast(e&&e.message||'Image upload failed');
  }finally{
    if(p.dataset.uploadToken===token){delete p.dataset.uploading;p.style.opacity='';}
  }
}

document.getElementById('itemFileLabel').addEventListener('click',()=>document.getElementById('itemImgInput').click());
document.getElementById('catIconLabel').addEventListener('click',()=>document.getElementById('catIconInput').click());
document.getElementById('catItemFileLabel').addEventListener('click',()=>document.getElementById('catItemImgInput').click());
document.getElementById('refIconLabel').addEventListener('click',()=>document.getElementById('refIconInput').click());
document.getElementById('refItemFileLabel').addEventListener('click',()=>document.getElementById('refItemImgInput').click());

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='doll-backup.json';a.click();
}
