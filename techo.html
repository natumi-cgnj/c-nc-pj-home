<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Techo">
<title>Techo</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
html{scrollbar-gutter:stable}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100dvh}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top,12px));border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#999}
.back{font-size:13px;color:#bbb;text-decoration:none}
.top-right{display:flex;gap:8px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}

/* Sub-navigation */
.sub-bar{padding:10px 20px;background:#fafafa;border-bottom:1px solid #eee}
.sub-bar .back{font-size:12px;color:#bbb;text-decoration:none;cursor:pointer}
.nav-deeper{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;margin:4px 20px 24px;border-radius:10px;background:#fff;font-size:12px;color:#bbb;cursor:pointer;border:1px solid #eee;letter-spacing:0.3px}
.nav-deeper:active{background:#f8f8f8}

/* Views */
.view{display:none}.view.active{display:block}

/* ── Items view ── */
.pending-section{padding:12px 20px}
.pending-header{font-size:10px;color:#bbb;letter-spacing:0.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pending-header .count{background:#f0f0f0;border-radius:8px;padding:1px 6px;font-size:9px;color:#999}
.pending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.item-thumb{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#f5f5f5;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.item-thumb img{width:100%;height:100%;object-fit:cover}
.item-thumb .item-name-s{font-size:8px;color:#bbb;text-align:center;padding:2px;word-break:break-all}
.item-thumb.long-term{border:2px solid #C4A24C22}
.item-thumb.consumable{border:2px solid #8AAAC422}

.section-divider{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;cursor:pointer;user-select:none}
.section-divider:active{opacity:0.7}
.section-line{flex:1;height:1px;background:#e0e0e0}
.section-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.section-arrow{font-size:8px;color:#ccc;transition:transform 0.2s;display:inline-block}
.section-divider.collapsed .section-arrow{transform:rotate(-90deg)}
.section-items{padding:4px 20px 8px}
.section-items.collapsed{display:none}

.item-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.item-row:active{opacity:0.7}
.item-row-img{width:40px;height:40px;border-radius:6px;object-fit:cover;background:#f0f0f0;flex-shrink:0}
.item-row-body{flex:1;min-width:0}
.item-row-name{font-size:13px;font-weight:500;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-row-meta{font-size:10px;color:#ccc;margin-top:2px}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.active{background:#C4A24C}
.status-dot.pending{background:#ddd}

.add-row{display:flex;gap:8px;padding:12px 20px}
.add-btn{flex:1;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:none;font-size:12px;color:#ccc;cursor:pointer;font-family:inherit;text-align:center}
.add-btn:active{background:#fafafa}
.add-btn.gold{border-color:#E8B96A;color:#E8B96A}

/* ── Catalog view ── */
.fund-pool{padding:12px 20px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.fund-label{font-size:10px;color:#ccc}
.fund-amount{font-size:16px;font-weight:300;color:#C4A24C;font-variant-numeric:tabular-nums}
.fund-amount.zero{color:#5BA66B}

.ref-allocation-pool{padding:12px 20px 14px;background:#fff;border-bottom:1px solid #eee}
.allocation-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.allocation-title{font-size:10px;color:#aaa;letter-spacing:.4px}
.allocation-hint{font-size:9px;color:#ccc}
.allocation-grid{display:flex;gap:8px;overflow-x:auto;padding:1px 0 3px;scrollbar-width:none}
.allocation-grid::-webkit-scrollbar{display:none}
.allocation-card{width:68px;flex:0 0 68px;aspect-ratio:1;border:1.5px solid #E8B96A66;border-radius:9px;background:#FFFDF7;position:relative;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 5px rgba(120,90,30,.04)}
.allocation-card:active{cursor:grabbing}
.allocation-card img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.allocation-card-name{position:absolute;left:0;right:0;bottom:0;padding:11px 4px 3px;background:linear-gradient(transparent,rgba(0,0,0,.52));color:#fff;font-size:8px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.allocation-card.no-img{display:flex;align-items:center;justify-content:center;padding:5px}
.allocation-card.no-img .allocation-card-name{position:static;background:none;color:#aaa;padding:0;white-space:normal;line-height:1.3}
.allocation-card.dragging{opacity:.28}
.allocation-ghost{position:fixed!important;z-index:500;pointer-events:none!important;opacity:.9;transform:rotate(2deg) scale(1.04);box-shadow:0 8px 24px rgba(0,0,0,.18)}

.catalog-row{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .15s,box-shadow .15s}
.catalog-row:active{background:#f9f9f9}
.catalog-row.drop-target{background:#FFF9EA;box-shadow:inset 3px 0 #E8B96A}
.ref-project-row{touch-action:pan-y;position:relative}
#viewRef.ref-arrange-mode .ref-project-row{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewRef.ref-arrange-mode .catalog-add{pointer-events:none;opacity:.35;transition:opacity .25s}
.ref-project-row.ref-dragging{opacity:.45;transform:scale(.97);background:#FFFDF7;transition:opacity .2s,transform .2s}
.ref-project-row.ref-drag-over{box-shadow:0 -2px 0 0 #E8B96A}
.catalog-icon{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f0f0f0}
.catalog-body{flex:1;min-width:0}
.catalog-name{font-size:14px;font-weight:500;color:#333}
.catalog-meta{font-size:11px;color:#ccc;margin-top:2px}
.catalog-add{padding:14px 20px;text-align:center;font-size:13px;color:#ccc;cursor:pointer;background:#fff;border-bottom:1px solid #f5f5f5}
.catalog-add:active{background:#f8f8f8}

/* Shelf (reused from cinema) */
.shelf-header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;user-select:none}
.shelf-header:active{background:#f5f5f5}
.shelf-line{flex:1;height:1px;background:#e0e0e0}
.shelf-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px}
.shelf-arrow{font-size:8px;color:#ccc;transition:transform 0.25s;display:inline-block}
.shelf-header.collapsed .shelf-arrow{transform:rotate(-90deg)}
.shelf-items{overflow:hidden}.shelf-items.collapsed{display:none}

/* ── Catalog detail view ── */
.detail-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top,12px));background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
.detail-bar h1{font-size:14px;font-weight:600;color:#333;text-align:center;flex:1}
.detail-stats{padding:8px 20px;background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;color:#bbb}
.catalog-grid{display:grid;gap:8px;padding:12px 28px}
.cat-item{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#f0f0f0;aspect-ratio:1}
.cat-item img{width:100%;height:100%;object-fit:cover;transition:opacity 0.2s}
.cat-item:not(.collected) img{opacity:0.3;filter:grayscale(0.6)}
.cat-item.collected img{opacity:1}
.cat-item .cat-name{position:absolute;bottom:0;left:0;right:0;font-size:9px;color:#fff;background:rgba(0,0,0,0.45);padding:3px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item .lock-icon{position:absolute;top:3px;right:3px;font-size:10px;opacity:0.6}
.cat-edit-btn{position:absolute;top:3px;left:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font:12px/22px inherit;text-align:center;cursor:pointer;z-index:2}
.cat-item.collected .collect-dot{position:absolute;bottom:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#5BA66B;border:1px solid #fff}
.ref-item{background:#fff;border:1px solid #eee}
.ref-item.no-img{display:flex;align-items:center;justify-content:center;padding:8px}
.ref-item.no-img .cat-name{position:static;background:none;color:#aaa;font-size:9px;white-space:normal;line-height:1.35}
.ref-mode-badge{position:absolute;top:4px;right:4px;z-index:3;border:0;border-radius:7px;padding:3px 6px;font:9px/1.2 inherit;cursor:pointer;background:#5BA66B20;color:#4B8C59;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ref-mode-badge.list{background:#E8B96A28;color:#B18028}
.ref-mode-badge.assigned{box-shadow:inset 0 0 0 1px #E8B96A55}
.cat-section-div{display:flex;align-items:center;gap:10px;padding:12px 20px 4px}
.cat-section-div .section-line{flex:1;height:1px;background:#e8e8e8}
.cat-section-div .section-label{font-size:11px;color:#bbb}
.cat-section-div .section-label-editable{cursor:pointer;border-bottom:1px dashed transparent;transition:color .15s,border-color .15s}
.cat-section-div .section-label-editable:hover{color:#888;border-bottom-color:#bbb}
.detail-add-row{display:flex;gap:8px;padding:12px 20px;margin-top:8px}
@media (min-width:700px){
  #catalogDetailGrid,#refDetailGrid{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
  #refDetailGrid{grid-template-columns:repeat(5,minmax(0,1fr))}
  #viewCatalogDetail .detail-add-row,#viewRefDetail .detail-add-row{max-width:600px;margin-left:auto;margin-right:auto}
  .ref-comment-wrap{width:100%;max-width:640px;margin-left:auto;margin-right:auto}
}

/* Modals */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:env(safe-area-inset-bottom,20px)}
.modal h2{font-size:16px;font-weight:600;margin-bottom:16px}
.modal label{font-size:11px;color:#999;display:block;margin:10px 0 4px}
.modal input[type="text"],.modal input[type="number"],.modal input[type="date"],.modal select,.modal textarea{width:100%;font-size:13px;padding:10px 12px;border:1px solid #e8e8e8;border-radius:8px;font-family:inherit;background:#fafafa}
.modal textarea{height:60px;resize:none}
.file-label{display:block;text-align:center;padding:10px;border:1.5px dashed #ddd;border-radius:8px;color:#ccc;cursor:pointer;font-size:12px}
.img-preview{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-top:6px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center}
.btn-cancel{background:#f5f5f5;color:#999}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-del{background:none;border:1px solid #E85A5A;color:#E85A5A}

/* Reference project editor — aligned with Food */
#refModal .ref-project-modal{max-width:480px;padding:20px;animation:refEditorSlideUp .25s ease-out}
@keyframes refEditorSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#refModal .ref-project-modal h2{font-size:15px;color:#333;margin-bottom:16px}
#refModal .ref-project-modal label{font-size:12px;margin:12px 0 4px}
#refModal .ref-project-modal input[type="text"],#refModal .ref-project-modal input[type="number"],#refModal .ref-project-modal select,#refModal .ref-project-modal textarea{font-size:14px;padding:10px 12px;border-color:#e0e0e0;background:#fff;color:#1a1a1a}
#refModal .ref-project-modal textarea{min-height:50px;height:auto;resize:vertical}
#refModal .ref-project-modal .file-label{margin-top:4px;border-width:1px;color:#aaa}
.ref-cover-editor{width:min(180px,100%);margin:8px auto 0}
.ref-cover-frame{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;cursor:grab;touch-action:none;border:1px solid #eee;background:#f7f7f7}
.ref-cover-frame:active{cursor:grabbing}
.ref-cover-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.ref-cover-clear{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:12px;cursor:pointer;line-height:22px;text-align:center;z-index:2}
.ref-cover-hint{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.ref-cover-hint-text{font-size:10px;color:#bbb}
.ref-cover-reset{font-size:10px;color:#aaa;background:none;border:1px solid #e0e0e0;border-radius:6px;padding:2px 8px;cursor:pointer;font-family:inherit}
.ref-cover-reset:hover{color:#888;border-color:#ccc}
.ref-label-row{display:flex;gap:5px;align-items:center;margin-top:6px;flex-wrap:wrap}
#refModal .ref-label-row input{flex:1 1 160px;min-width:140px;font-size:12px;padding:6px 8px}
.ref-color-picker{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.ref-color-swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid transparent;padding:0;cursor:pointer;transition:border-color .15s,transform .15s}
.ref-color-swatch:active{transform:scale(1.15)}
.ref-color-swatch.active{border-color:#333}
.ref-project-label{font-size:9px;font-weight:500;letter-spacing:.5px;display:inline-block;padding:1px 6px;border-radius:4px;margin-left:4px}
#refModal .section-list{margin-top:8px;gap:0}
#refModal .section-row{gap:6px;padding:8px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
#refModal .section-row input[type="text"]{flex:1 1 90px;min-width:70px;font-size:12px;padding:6px 8px;border-color:#e8e8e8;border-radius:6px}
#refModal .section-row input[type="number"]{flex:0 0 46px;width:46px;min-width:0;font-size:12px;padding:6px 5px;border-color:#e8e8e8;border-radius:6px}
#refModal .section-row select{width:56px;font-size:11px;padding:4px;border-color:#e8e8e8;border-radius:6px}
#refModal .section-row .del-sec{font-size:11px;padding:4px}
#refModal .add-section-btn{font-size:11px;border-radius:6px;padding:6px 12px;margin-top:6px}
#refModal .btn-row{gap:8px;margin-top:20px}
#refModal .btn{font-size:14px}

/* Reference detail — same visual system as Food */
#viewRefDetail{padding-bottom:64px}
.ref-detail-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.ref-detail-header h1{font-size:15px;font-weight:600;color:#333;letter-spacing:.5px;text-align:center;flex:1}
.ref-detail-overall{padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;background:#fff;border-bottom:1px solid #f5f5f5}
.ref-detail-overall-bar{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.ref-detail-overall-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width .3s}
.ref-item-grid{padding:16px 0}
#viewRefDetail .section-divider{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:default}
#viewRefDetail .section-divider-line{flex:1;height:1px;background:#e0e0e0}
#viewRefDetail .section-divider-center{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
#viewRefDetail .section-divider-label{font-size:11px;color:#999;font-weight:500;letter-spacing:.3px;cursor:text;border-bottom:1px dashed transparent;transition:color .15s,border-color .15s}
#viewRefDetail .section-divider-label:hover{color:#8B6914;border-bottom-color:#D8C18B}
.ref-section-grid{display:grid;gap:8px;padding:8px 20px 16px}
.ref-item-cell{aspect-ratio:1;border-radius:10px;border:1.5px solid #E8B96A;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;background:#FFFDF7;touch-action:pan-y}
.ref-item-cell:active{transform:scale(.97)}
.ref-item-cell .item-img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:9px;position:absolute;inset:0;background:#fff;filter:none}
.ref-item-cell .item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.5));color:#fff;font-size:10px;font-weight:500;padding:14px 5px 4px;border-radius:0 0 9px 9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.ref-item-cell:not(.has-img) .item-label{background:none;color:#ccc;position:static;font-size:9px;padding:0 4px;margin-top:2px;white-space:normal}
#viewRefDetail.ref-item-arrange-mode .ref-item-cell{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewRefDetail.ref-item-arrange-mode .section-divider-label{pointer-events:none}
#viewRefDetail.ref-item-arrange-mode .ref-add-item-btn{pointer-events:none;opacity:.35;transition:opacity .25s}
.ref-item-cell.drag-source{opacity:.2;transition:opacity .15s}
.ref-item-cell.drop-target{box-shadow:0 0 0 2px rgba(232,185,106,.7);border-color:rgba(232,185,106,.6);transition:box-shadow .15s,border-color .15s}
.ref-item-drag-ghost{position:fixed!important;margin:0!important;z-index:500;pointer-events:none;opacity:.88;transform:scale(1.04) rotate(.8deg);box-shadow:0 10px 32px rgba(0,0,0,.18);border-radius:10px}
.ref-add-item-btn{margin:0 20px 16px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}
.ref-add-item-btn.gold{border-color:#E8B96A;color:#E8B96A}
@media(min-width:700px){.ref-item-grid{width:100%;max-width:640px;margin-left:auto;margin-right:auto}.ref-add-item-btn{display:block;max-width:600px;margin-left:auto;margin-right:auto}}

/* Reference item/section editors follow the Food modal rhythm */
#refItemModal .ref-food-modal,#refSectionQuickModal .ref-food-modal{max-width:480px;padding:20px;animation:refEditorSlideUp .25s ease-out}
#refItemModal .ref-food-modal h2,#refSectionQuickModal .ref-food-modal h2{font-size:15px;color:#333;margin-bottom:16px}
#refItemModal .ref-food-modal label,#refSectionQuickModal .ref-food-modal label{font-size:12px;margin:12px 0 4px}
#refItemModal .ref-food-modal input[type="text"],#refItemModal .ref-food-modal select,#refItemModal .ref-food-modal textarea,#refSectionQuickModal .ref-food-modal input[type="text"],#refSectionQuickModal .ref-food-modal input[type="number"],#refSectionQuickModal .ref-food-modal select{font-size:14px;padding:10px 12px;border-color:#e0e0e0;background:#fff;color:#1a1a1a}
#refItemModal .ref-food-modal textarea{min-height:50px;height:auto;resize:vertical}
#refItemModal .ref-food-modal .file-label{margin-top:4px;border-width:1px;color:#aaa}
#refItemModal .ref-food-modal .img-preview{width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:8px;margin-top:8px;background:#f7f7f7}
#refItemModal .ref-food-modal .cat-select{margin-top:4px}
#refItemModal .ref-food-modal .btn-row,#refSectionQuickModal .ref-food-modal .btn-row{gap:8px;margin-top:20px}
#refItemModal .ref-food-modal .btn,#refSectionQuickModal .ref-food-modal .btn{font-size:14px}

/* Section list in modal */
.section-list{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.section-row{display:flex;gap:6px;align-items:center}
.section-row input[type="text"]{flex:1}
.section-row input[type="number"]{width:50px}
.del-sec{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer}
.add-section-btn{width:100%;padding:8px;border:1px dashed #ddd;border-radius:8px;background:none;color:#ccc;cursor:pointer;font-size:12px;font-family:inherit}

/* Label */
.label-row{display:flex;gap:12px;align-items:center;margin-top:8px}
.label-row input{flex:0 0 100px;min-width:0}
.color-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;flex:1;min-width:0}

<script>
'use strict';
const DB_KEY='techo_archive_db';
const COLORS=['#C4A24C','#8B6B4A','#9B8AE8','#6B5ACD','#D85A30','#E84A7A','#E8B96A','#9B6BCC','#4AADE8','#3A8DD4','#5BA66B','#3D8B50','#6B8AFF','#4A6AE0','#888','#4ECDC4'];
let db={items:[],sections:[],catalogs:[],refs:[],sectionCollapsed:{},shelfCollapsed:{},refShelfCollapsed:{}};
let curCatalogId=null,curRefId=null,editItemId=null,editCatalogId=null,editRefId=null,editCatItemIdx=null,editCatSectionIdx=null;
let editRefItemId=null,editRefSectionIdx=null,_refSections=[];
let refIconTemp='',refIconPosTemp={x:50,y:50};
let refLabelColor='#C4A24C';
let refAllocationDrag=null,refAllocationClickSuppressedUntil=0;
let refProjectArrangeMode=false,refProjectClickSuppressedUntil=0,refProjectGestureBound=false,refProjectPressState=null;
const refDetailScrollByProject={};
let refItemArrangeMode=false,refItemPressState=null,refItemDragState=null,refItemClickSuppressedUntil=0,refItemGestureBound=false;

function load(){
  try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d){db={items:d.items||[],sections:d.sections||[],catalogs:d.catalogs||[],refs:d.refs||[],sectionCollapsed:d.sectionCollapsed||{},shelfCollapsed:d.shelfCollapsed||{},refShelfCollapsed:d.refShelfCollapsed||{}};normalizeTechoData();return;}}catch(e){}
  // Migrate from old stationery_db if exists
  try{
    const old=JSON.parse(localStorage.getItem('stationery_db'));
    if(old&&Array.isArray(old)&&old.length){
      old.forEach(function(p){
        const cat={id:p.id||gid(),name:p.name||'',shelf:'',icon:p.icon||'',note:p.note||'',label:{name:(p.duty&&p.duty.name)||'',color:(p.duty&&p.duty.color)||'#C4A24C'},sections:p.sections||[],items:(p.items||[]).map(function(it){return{id:it.id||gid(),name:it.name||'',img:it.img||'',collected:!!it.collected,locked:false,cost:0,note:it.note||''};}),order:db.catalogs.length};
        db.catalogs.push(cat);
        // Create items for collected entries
        (p.items||[]).forEach(function(it,idx){
          if(it.collected){
            db.items.push({id:gid(),name:it.name||'',img:it.img||'',category:'long_term',status:it.inuseStatus?'active':'pending',assignment:null,cost:0,note:'',source:'catalog',catalogRef:{catalogId:cat.id,itemIdx:idx},disposition:it.inuseStatus||null,soldPrice:0,addedAt:Date.now()});
          }
        });
      });
      normalizeTechoData();save();
    }
  }catch(e){}
  normalizeTechoData();
}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function gid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function clampCols(value){return Math.max(2,Math.min(6,parseInt(value)||3));}
function clampImagePosition(value){const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):50;}
function normalizeRefColor(value){return /^#[0-9a-f]{6}$/i.test(String(value||''))?String(value):'#C4A24C';}
function makeBlankRefItem(number){return{id:gid(),name:'Title '+number,img:'',note:'',mode:'ref',listAssignment:null};}
function isGenericRefItemName(name){return !String(name||'').trim()||/^Title \d+$/.test(String(name||'').trim())||/^Item \d+$/.test(String(name||'').trim());}
function isBlankRefItem(item){return!!item&&!item.img&&!String(item.note||'').trim()&&(item.mode||'ref')==='ref'&&!item.listAssignment&&isGenericRefItemName(item.name);}
function normalizeTechoData(){
  let changed=false;
  if(!Array.isArray(db.refs)){db.refs=[];changed=true;}
  if(!Array.isArray(db.catalogs)){db.catalogs=[];changed=true;}
  db.catalogs.forEach(c=>{
    if(!Array.isArray(c.sections)){c.sections=[];changed=true;}
    c.sections.forEach(sec=>{const cols=clampCols(sec.cols);if(sec.cols!==cols){sec.cols=cols;changed=true;}if(!Number.isFinite(parseInt(sec.count))){sec.count=0;changed=true;}});
    if(!Array.isArray(c.items)){c.items=[];changed=true;}
    c.items.forEach(item=>{if(!item.id){item.id=gid();changed=true;}});
  });
  db.refs.forEach(r=>{
    const iconPositionX=clampImagePosition(r.iconPositionX),iconPositionY=clampImagePosition(r.iconPositionY);
    if(r.iconPositionX!==iconPositionX){r.iconPositionX=iconPositionX;changed=true;}
    if(r.iconPositionY!==iconPositionY){r.iconPositionY=iconPositionY;changed=true;}
    const labelName=r.label&&typeof r.label.name==='string'?r.label.name:'';
    const labelColor=normalizeRefColor(r.label&&r.label.color);
    if(!r.label||r.label.name!==labelName||r.label.color!==labelColor){r.label={name:labelName,color:labelColor};changed=true;}
    if(!Array.isArray(r.sections)){r.sections=[];changed=true;}
    r.sections.forEach(sec=>{const cols=clampCols(sec.cols);if(sec.cols!==cols){sec.cols=cols;changed=true;}if(!Number.isFinite(parseInt(sec.count))){sec.count=0;changed=true;}});
    if(!Array.isArray(r.items)){r.items=[];changed=true;}
    r.items.forEach((item,index)=>{
      if(!item.id){item.id=gid();changed=true;}
      if(!item.name){item.name='Title '+(index+1);changed=true;}
      if(!('note' in item)){item.note='';changed=true;}
      const mode=item.mode==='list'?'list':'ref';
      if(item.mode!==mode){item.mode=mode;changed=true;}
      if(!('listAssignment' in item)){item.listAssignment=null;changed=true;}
      if(item.listAssignment){
        const cat=db.catalogs.find(c=>c.id===item.listAssignment.catalogId);
        const catItem=cat&&cat.items.find(ci=>ci.id===item.listAssignment.catalogItemId);
        if(!catItem){item.listAssignment=null;changed=true;}
        else if(!catItem.sourceRef){catItem.sourceRef={refId:r.id,itemId:item.id};changed=true;}
      }
    });
  });
  if(changed)save();
}

/* ═══ VIEWS ═══ */
function currentScrollY(){return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;}
function restoreRefDetailScroll(y){
  const target=Math.max(0,Number(y)||0),restore=()=>window.scrollTo(0,target);
  if(typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(restore));else setTimeout(restore,0);
}
function rememberRefDetailScroll(){if(curRefId)refDetailScrollByProject[curRefId]=currentScrollY();}
function showView(id,options){
  const target=document.getElementById(id),preserve=!!(options&&options.preserveScroll);
  if(!preserve||!target.classList.contains('active')){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));target.classList.add('active');}
  if(!preserve)window.scrollTo(0,0);
}
function navTo(id){
  if(id!=='viewRef'&&refProjectArrangeMode)setRefProjectArrangeMode(false);
  if(id!=='viewRefDetail'&&refItemArrangeMode)setRefItemArrangeMode(false);
  showView(id);
  if(id==='viewItems')renderItems();else if(id==='viewCatalog')renderCatalogList();else if(id==='viewRef')renderRefList();
}

/* ═══ ITEMS VIEW ═══ */
function renderItems(){
  const pending=db.items.filter(i=>i.status==='pending');
  const longTerm=pending.filter(i=>i.category==='long_term');
  const consumable=pending.filter(i=>i.category==='consumable');
  let html='';
  if(longTerm.length){
    html+=`<div class="pending-section"><div class="pending-header">Long-term <span class="count">${longTerm.length}</span></div><div class="pending-grid">${longTerm.map(i=>renderThumb(i,'long-term')).join('')}</div></div>`;
  }
  if(consumable.length){
    html+=`<div class="pending-section"><div class="pending-header">Consumable <span class="count">${consumable.length}</span></div><div class="pending-grid">${consumable.map(i=>renderThumb(i,'consumable')).join('')}</div></div>`;
  }
  if(!pending.length)html+=`<div class="pending-section"><div class="pending-header" style="justify-content:center;color:#ddd;padding:20px 0">No pending items</div></div>`;
  document.getElementById('pendingArea').innerHTML=html;
  let secHtml='';
  db.sections.forEach(sec=>{
    const items=db.items.filter(i=>i.assignment===sec.id&&i.status==='active');
    const coll=db.sectionCollapsed[sec.id];
    secHtml+=`<div class="section-divider${coll?' collapsed':''}" onclick="toggleItemSection('${sec.id}')"><div class="section-line"></div><span class="section-label">${esc(sec.name)}</span><span class="section-arrow">▼</span><div class="section-line"></div></div>`;
    secHtml+=`<div class="section-items${coll?' collapsed':''}">`;
    items.forEach(i=>{
      secHtml+=`<div class="item-row" onclick="openItemAction('${i.id}')"><img class="item-row-img" src="${i.img||''}" alt="" onerror="this.style.display='none'"><div class="item-row-body"><div class="item-row-name">${esc(i.name)}</div><div class="item-row-meta">${i.category==='consumable'?'Consumable':'Long-term'}</div></div><div class="status-dot active"></div></div>`;
    });
    if(!items.length)secHtml+=`<div style="padding:12px 0;text-align:center;font-size:11px;color:#ddd">Empty</div>`;
    secHtml+=`</div>`;
  });
  document.getElementById('sectionsArea').innerHTML=secHtml;
}
function renderThumb(item,cls){
  return`<div class="item-thumb ${cls}" onclick="openItemAction('${item.id}')">${item.img?`<img src="${item.img}" onerror="this.style.display='none'">`:`<div class="item-name-s">${esc(item.name)}</div>`}</div>`;
}
function toggleItemSection(id){db.sectionCollapsed[id]=!db.sectionCollapsed[id];save();renderItems();}

/* ── Item CRUD ── */
function openAddItem(){
  editItemId=null;
  document.getElementById('itemModalTitle').textContent='New Item';
  document.getElementById('inputItemName').value='';
  document.getElementById('inputItemCost').value='';
  document.getElementById('inputItemNote').value='';
  document.getElementById('itemImgPreview').style.display='none';
  document.getElementById('itemCat').value='long_term';

/* ═══ CATALOG VIEW ═══ */
function getQueuedRefItems(){
  const queued=[];
  db.refs.forEach(r=>(r.items||[]).forEach(item=>{if(item.mode==='list'&&!item.listAssignment)queued.push({ref:r,item});}));
  return queued;
}
function renderRefAllocationPool(){
  const holder=document.getElementById('refAllocationPool');if(!holder)return;
  const queued=getQueuedRefItems();
  if(!queued.length){holder.innerHTML='';return;}
  holder.innerHTML=`<div class="ref-allocation-pool"><div class="allocation-head"><span class="allocation-title">FROM REF · 待分配 ${queued.length}</span><span class="allocation-hint">拖入下方 List</span></div><div class="allocation-grid">${queued.map(({ref,item})=>`<div class="allocation-card${item.img?'':' no-img'}" data-ref-id="${ref.id}" data-ref-item-id="${item.id}" title="拖入一个 List">${item.img?`<img src="${item.img}" alt="">`:''}<span class="allocation-card-name">${esc(item.name)}</span></div>`).join('')}</div></div>`;
  initRefAllocationDrag();
}
function renderCatalogList(){
  renderRefAllocationPool();
  // Fund pool: sum of cost for items still pending (not disposed as keep/gift)
  const pendingCost=db.items.filter(i=>i.status==='pending'||(!i.disposition&&i.status==='active')).reduce((s,i)=>s+(i.cost||0),0);
  const soldTotal=db.items.filter(i=>i.disposition==='sold').reduce((s,i)=>s+(i.soldPrice||0),0);
  // Also count disposed catalog items that are in 'sold' but removed from items
  // For now just show pending cost and sold recovery
  const pool=pendingCost-soldTotal;
  const fp=document.getElementById('fundPool');
  fp.innerHTML=`<span class="fund-label">Fund Pool</span><span class="fund-amount${pool<=0?' zero':''}">¥${pool.toLocaleString()}</span>`;

  const sorted=db.catalogs.sort((a,b)=>(a.order||0)-(b.order||0));
  const ungrouped=sorted.filter(c=>!c.shelf);
  const shelves={};const shelfOrder=[];
  sorted.forEach(c=>{if(!c.shelf)return;if(!shelves[c.shelf]){shelves[c.shelf]=[];shelfOrder.push(c.shelf);}shelves[c.shelf].push(c);});

  let html='';
  ungrouped.forEach(c=>{html+=renderCatalogRow(c);});
  shelfOrder.forEach(shelf=>{
    const coll=db.shelfCollapsed[shelf];
    html+=`<div class="shelf-header${coll?' collapsed':''}" onclick="toggleShelf('${esc(shelf)}')"><div class="shelf-line"></div><span class="shelf-label">${esc(shelf)}</span><span class="shelf-arrow">▼</span><div class="shelf-line"></div></div>`;
    html+=`<div class="shelf-items${coll?' collapsed':''}">`;shelves[shelf].forEach(c=>{html+=renderCatalogRow(c);});html+=`</div>`;
  });
  document.getElementById('catalogList').innerHTML=html;
}
function renderCatalogRow(c){
  const collected=c.items.filter(i=>i.collected).length;const total=c.items.length;
  const label=c.label&&c.label.name?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${c.label.color||'#ccc'}15;color:${c.label.color||'#ccc'};margin-left:4px">${esc(c.label.name)}</span>`:'';
  return`<div class="catalog-row" data-catalog-id="${c.id}" onclick="handleCatalogRowClick('${c.id}')"><img class="catalog-icon" src="${c.icon||''}" onerror="this.style.background='#f0f0f0'"><div class="catalog-body"><div class="catalog-name">${esc(c.name)}${label}</div><div class="catalog-meta">${collected} / ${total}${c.items.length?' · ¥'+c.items.reduce((s,i)=>s+((i.collected&&i.cost)||0),0).toLocaleString():''}</div></div></div>`;
}
function handleCatalogRowClick(id){if(Date.now()<refAllocationClickSuppressedUntil)return;openCatalogDetail(id);}
function toggleShelf(name){db.shelfCollapsed[name]=!db.shelfCollapsed[name];save();renderCatalogList();}

function clearRefAllocationDrag(){
  if(!refAllocationDrag)return;
  const state=refAllocationDrag;
  if(state.card)state.card.classList.remove('dragging');
  if(state.ghost)state.ghost.remove();
  document.querySelectorAll('.catalog-row.drop-target').forEach(row=>row.classList.remove('drop-target'));
  refAllocationDrag=null;
}
function initRefAllocationDrag(){
  document.querySelectorAll('.allocation-card').forEach(card=>{
    card.addEventListener('pointerdown',event=>{
      if(event.button)return;
      clearRefAllocationDrag();
      refAllocationDrag={card,pointerId:event.pointerId,startX:event.clientX,startY:event.clientY,lastX:event.clientX,lastY:event.clientY,active:false,targetId:null,ghost:null};
      if(card.setPointerCapture)try{card.setPointerCapture(event.pointerId);}catch(e){}
    });
    card.addEventListener('pointermove',event=>{
      const state=refAllocationDrag;if(!state||state.card!==card||state.pointerId!==event.pointerId)return;
      state.lastX=event.clientX;state.lastY=event.clientY;
      if(!state.active&&Math.hypot(event.clientX-state.startX,event.clientY-state.startY)>7){
        state.active=true;card.classList.add('dragging');state.ghost=card.cloneNode(true);state.ghost.classList.remove('dragging');state.ghost.classList.add('allocation-ghost');
        const rect=card.getBoundingClientRect();state.ghost.style.width=rect.width+'px';state.ghost.style.height=rect.height+'px';document.body.appendChild(state.ghost);
      }
      if(!state.active)return;
      event.preventDefault();
      state.ghost.style.left=(event.clientX-34)+'px';state.ghost.style.top=(event.clientY-34)+'px';
      document.querySelectorAll('.catalog-row.drop-target').forEach(row=>row.classList.remove('drop-target'));
      const row=document.elementFromPoint(event.clientX,event.clientY)?.closest('.catalog-row[data-catalog-id]');
      state.targetId=row?row.dataset.catalogId:null;if(row)row.classList.add('drop-target');
    },{passive:false});
    const finish=event=>{
      const state=refAllocationDrag;if(!state||state.card!==card||state.pointerId!==event.pointerId)return;
      if(state.active){
        refAllocationClickSuppressedUntil=Date.now()+700;
        const targetId=state.targetId,refId=card.dataset.refId,itemId=card.dataset.refItemId;
        clearRefAllocationDrag();
        if(targetId)assignRefItemToCatalog(refId,itemId,targetId);else toast('拖到一个 List 上完成分配');
      }else clearRefAllocationDrag();
    };
    card.addEventListener('pointerup',finish);card.addEventListener('pointercancel',finish);
    card.addEventListener('contextmenu',event=>event.preventDefault());
    card.addEventListener('dragstart',event=>event.preventDefault());
  });
}
function assignRefItemToCatalog(refId,itemId,catalogId){
  const r=db.refs.find(ref=>ref.id===refId),item=r&&(r.items||[]).find(entry=>entry.id===itemId),cat=db.catalogs.find(c=>c.id===catalogId);
  if(!r||!item||!cat||item.mode!=='list'||item.listAssignment)return;
  const catalogItem={id:gid(),name:item.name,img:item.img||'',collected:false,locked:false,cost:0,note:item.note||'',sourceRef:{refId:r.id,itemId:item.id}};
  cat.items.push(catalogItem);
  if(cat.sections&&cat.sections.length){const last=cat.sections[cat.sections.length-1];last.count=(parseInt(last.count)||0)+1;}
  item.listAssignment={catalogId:cat.id,catalogItemId:catalogItem.id};
  save();renderCatalogList();toast('已加入 '+cat.name);
}

/* ── Catalog detail ── */
function openCatalogDetail(id){
  curCatalogId=id;const c=db.catalogs.find(x=>x.id===id);if(!c)return;
  document.getElementById('catalogDetailTitle').textContent=c.name;
  const collected=c.items.filter(i=>i.collected).length;
  const totalCost=c.items.filter(i=>i.collected).reduce((s,i)=>s+(i.cost||0),0);
  document.getElementById('catalogDetailStats').innerHTML=`<span>${collected} / ${c.items.length}</span><span>¥${totalCost.toLocaleString()}</span>`;
  let html='';
  if(c.sections&&c.sections.length>1){
    let idx=0;
    c.sections.forEach((sec,sectionIdx)=>{
      const cols=clampCols(sec.cols);
      html+=`<div class="cat-section-div"><div class="section-line"></div><span class="section-label section-label-editable" title="Double-click to edit section" ondblclick="event.stopPropagation();openCatalogSectionQuick(${sectionIdx})">${esc(sec.name)}</span><div class="section-line"></div></div>`;
      html+=`<div class="catalog-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
      for(let i=0;i<sec.count;i++){
        if(idx<c.items.length)html+=renderCatItem(c.items[idx],idx);
        idx++;
      }
      html+=`</div>`;
    });
    if(idx<c.items.length){
      html+=`<div class="catalog-grid" style="grid-template-columns:repeat(3,1fr)">`;
      for(;idx<c.items.length;idx++)html+=renderCatItem(c.items[idx],idx);
      html+=`</div>`;
    }
  }else{
    const cols=c.sections&&c.sections[0]?clampCols(c.sections[0].cols):3;
    html+=`<div class="catalog-grid" style="grid-template-columns:repeat(${cols},1fr)">${c.items.map((item,idx)=>renderCatItem(item,idx)).join('')}</div>`;
  }
  document.getElementById('catalogDetailGrid').innerHTML=html;
  showView('viewCatalogDetail');
}
function renderCatItem(item,idx){
  return`<div class="cat-item${item.collected?' collected':''}" onclick="handleCatalogItemClick(${idx})"><img src="${item.img||''}" onerror="this.parentElement.style.background='#e8e8e8'"><button class="cat-edit-btn" aria-label="Edit" onclick="event.stopPropagation();openEditCatItem(${idx})">⋯</button><div class="cat-name">${esc(item.name)}</div>${item.locked?'<div class="lock-icon">🔒</div>':''}${item.collected?'<div class="collect-dot"></div>':''}</div>`;
}
function isGenericCatalogItemName(name){return !String(name||'').trim()||/^Title \d+$/.test(String(name||'').trim());}
function isBlankCatalogItem(item){
  return!!item&&!item.collected&&!item.img&&!item.locked&&!(parseInt(item.cost)||0)&&!String(item.note||'').trim()&&isGenericCatalogItemName(item.name);
}
function handleCatalogItemClick(idx){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c||!c.items[idx])return;
  if(isBlankCatalogItem(c.items[idx])){openEditCatItem(idx);return;}
  toggleCollect(idx);
}
function toggleCollect(idx){
  const c=db.catalogs.find(x=>x.id===curCatalogId);if(!c)return;
  const item=c.items[idx];if(!item)return;
  item.collected=!item.collected;
  if(item.collected&&!item.locked){
    // Create pending item in main items
    db.items.push({id:gid(),name:item.name,img:item.img||'',category:'long_term',status:'pending',assignment:null,cost:item.cost||0,note:'',source:'catalog',catalogRef:{catalogId:curCatalogId,itemIdx:idx},disposition:null,soldPrice:0,addedAt:Date.now()});
  }
  if(!item.collected){
    // Remove from items if uncollecting
    db.items=db.items.filter(i=>!(i.catalogRef&&i.catalogRef.catalogId===curCatalogId&&i.catalogRef.itemIdx===idx&&i.status==='pending'));
  }
  save();openCatalogDetail(curCatalogId);
}

function openCatalogSectionQuick(idx){
  const c=db.catalogs.find(x=>x.id===curCatalogId);const sec=c&&c.sections&&c.sections[idx];if(!sec)return;
  editCatSectionIdx=idx;
  document.getElementById('inputQuickCatSectionName').value=sec.name||'';
  document.getElementById('inputQuickCatSectionCount').value=parseInt(sec.count)||0;
  document.getElementById('inputQuickCatSectionCols').value=String(clampCols(sec.cols));
  openModal('catSectionQuickModal');
}
function saveCatalogSectionQuick(){
  const c=db.catalogs.find(x=>x.id===curCatalogId);const sec=c&&c.sections&&c.sections[editCatSectionIdx];if(!sec)return;
  const name=document.getElementById('inputQuickCatSectionName').value.trim();if(!name){toast('Name required');return;}
  const nextCount=Math.max(0,Math.min(999,parseInt(document.getElementById('inputQuickCatSectionCount').value)||0));
  const nextCols=clampCols(document.getElementById('inputQuickCatSectionCols').value);
  const oldCount=parseInt(sec.count)||0;
  let start=0;for(let i=0;i<editCatSectionIdx;i++)start+=parseInt(c.sections[i].count)||0;
  if(nextCount<oldCount){
    const removeAt=start+nextCount,removeCount=oldCount-nextCount;
    if(c.items.slice(removeAt,removeAt+removeCount).some(item=>!isBlankCatalogItem(item))){toast('Clear filled titles before reducing count');return;}
    c.items.splice(removeAt,removeCount);
    db.items=db.items.filter(item=>!(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx>=removeAt&&item.catalogRef.itemIdx<removeAt+removeCount));
    db.items.forEach(item=>{if(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx>=removeAt+removeCount)item.catalogRef.itemIdx-=removeCount;});
  }else if(nextCount>oldCount){
    const insertAt=start+oldCount,addCount=nextCount-oldCount,items=[];
    for(let i=0;i<addCount;i++)items.push({id:gid(),name:'Title '+(insertAt+i+1),img:'',collected:false,locked:false,cost:0,note:''});
    c.items.splice(insertAt,0,...items);
    db.items.forEach(item=>{if(item.catalogRef&&item.catalogRef.catalogId===curCatalogId&&item.catalogRef.itemIdx>=insertAt)item.catalogRef.itemIdx+=addCount;});
  }
  sec.name=name;sec.count=nextCount;sec.cols=nextCols;
  c.items.forEach((item,idx)=>{if(isBlankCatalogItem(item))item.name='Title '+(idx+1);});
  editCatSectionIdx=null;save();closeModal('catSectionQuickModal');openCatalogDetail(curCatalogId);toast('Section updated');
}

function renderCatSections(){

function addCatSectionRow(){_catSections.push({name:'',count:0,cols:3});renderCatSections();}
function renderCatColors(){document.getElementById('catColorPicker').innerHTML=COLORS.map(c=>`<div class="color-swatch${c===_catLabelColor?' active':''}" style="background:${c}" onclick="_catLabelColor='${c}';renderCatColors()"></div>`).join('');}
function saveCatalog(){
  if(!imageReady('catIconPreview'))return;
  const name=document.getElementById('inputCatName').value.trim();if(!name){toast('Name required');return;}
  const shelf=document.getElementById('inputCatShelf').value.trim();
  const note=document.getElementById('inputCatNote').value.trim();
  const labelName=document.getElementById('inputCatLabel').value.trim();
  const preview=document.getElementById('catIconPreview');
  const icon=preview.style.display!=='none'?preview.src:'';
  const sections=_catSections.filter(s=>s.name).map(sec=>({...sec,count:Math.max(0,parseInt(sec.count)||0),cols:clampCols(sec.cols)}));
  const label={name:labelName,color:_catLabelColor};
  if(editCatalogId){
    const c=db.catalogs.find(x=>x.id===editCatalogId);
    if(c){c.name=name;c.shelf=shelf;c.note=note;c.label=label;if(icon)c.icon=icon;
      const totalNeeded=sections.reduce((s,sec)=>s+sec.count,0);
      while(c.items.length<totalNeeded)c.items.push({id:gid(),name:'',img:'',collected:false,locked:false,cost:0,note:''});
      c.sections=sections;
    }
  }else{
    const totalItems=sections.reduce((s,sec)=>s+sec.count,0)||0;

function getCatalogItemSectionIndex(c,itemIdx){

function removeCatalogItemAt(c,itemIdx){

  if(mode==='ref'&&!removeRefListAssignment(r,item))return false;
  item.mode=mode;return true;
}
function toggleRefItemMode(refId,itemId){
  const r=db.refs.find(ref=>ref.id===refId),item=r&&(r.items||[]).find(entry=>entry.id===itemId);if(!r||!item)return;
  const next=item.mode==='list'?'ref':'list';if(!changeRefItemMode(r,item,next))return;
  const scroll=currentScrollY();save();openRefDetail(r.id,{restoreScroll:scroll});toast(next==='list'?'已进入 List 待分配池':'已留在图鉴');
}

/* ── Reference CRUD ── */
function openAddRef(){
  editRefId=null;refIconTemp='';refIconPosTemp={x:50,y:50};refLabelColor='#C4A24C';
  document.getElementById('refModalTitle').textContent='New Reference';
  document.getElementById('inputRefName').value='';document.getElementById('inputRefShelf').value='';document.getElementById('inputRefNote').value='';document.getElementById('inputRefLabel').value='';
  document.getElementById('refIconInput').value='';
  const preview=document.getElementById('refIconPreview');preview.dataset.uploadToken='reset_'+Date.now();delete preview.dataset.uploading;preview.style.opacity='';preview.removeAttribute('src');preview.style.objectPosition='50% 50%';
  document.getElementById('refIconEditor').style.display='none';
  _refSections=[{name:'',count:0,cols:3}];renderRefSections();renderRefColors();
  openModal('refModal');
}
function openEditRef(){
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  editRefId=r.id;refIconTemp=r.icon||'';refIconPosTemp={x:clampImagePosition(r.iconPositionX),y:clampImagePosition(r.iconPositionY)};refLabelColor=normalizeRefColor(r.label&&r.label.color);
  document.getElementById('refModalTitle').textContent='Edit Reference';
  document.getElementById('inputRefName').value=r.name;document.getElementById('inputRefShelf').value=r.shelf||'';document.getElementById('inputRefNote').value=r.note||'';document.getElementById('inputRefLabel').value=r.label&&r.label.name||'';
  document.getElementById('refIconInput').value='';
  const preview=document.getElementById('refIconPreview'),editor=document.getElementById('refIconEditor');
  preview.dataset.uploadToken='reset_'+Date.now();delete preview.dataset.uploading;preview.style.opacity='';
  if(r.icon){preview.src=r.icon;preview.style.objectPosition=refIconPosTemp.x+'% '+refIconPosTemp.y+'%';editor.style.display='block';}
  else{preview.removeAttribute('src');preview.style.objectPosition='50% 50%';editor.style.display='none';}
  _refSections=(r.sections&&r.sections.length?r.sections:[{name:'',count:r.items.length,cols:3}]).map(sec=>({...sec,cols:clampCols(sec.cols)}));renderRefSections();renderRefColors();
  openModal('refModal');
}
function renderRefColors(){
  document.getElementById('refColorPicker').innerHTML=COLORS.map(color=>`<button type="button" class="ref-color-swatch${color===refLabelColor?' active':''}" style="background:${color}" aria-label="Select ${color}" onclick="pickRefColor('${color}')"></button>`).join('');
}
function pickRefColor(color){refLabelColor=normalizeRefColor(color);renderRefColors();}
function renderRefSections(){
  document.getElementById('refSectionList').innerHTML=_refSections.map((s,i)=>`<div class="section-row"><input type="text" value="${esc(s.name||'')}" placeholder="Section" onchange="_refSections[${i}].name=this.value"><input type="number" value="${Math.max(0,parseInt(s.count)||0)}" min="0" max="999" aria-label="Item count" onchange="_refSections[${i}].count=parseInt(this.value)||0"><select aria-label="Columns" onchange="_refSections[${i}].cols=parseInt(this.value)||3">${[2,3,4,5,6].map(n=>`<option value="${n}"${clampCols(s.cols)===n?' selected':''}>${n}col</option>`).join('')}</select><button type="button" class="del-sec" aria-label="Delete section" onclick="_refSections.splice(${i},1);renderRefSections()">×</button></div>`).join('');
}
function addRefSectionRow(){_refSections.push({name:'',count:0,cols:3});renderRefSections();}
function saveRef(){
  if(!imageReady('refIconPreview'))return;
  const name=document.getElementById('inputRefName').value.trim();if(!name){toast('Name required');return;}
  const shelf=document.getElementById('inputRefShelf').value.trim();
  const note=document.getElementById('inputRefNote').value.trim();
  const label={name:document.getElementById('inputRefLabel').value.trim(),color:normalizeRefColor(refLabelColor)};
  const icon=refIconTemp||'';
  const iconPositionX=icon?clampImagePosition(refIconPosTemp.x):50,iconPositionY=icon?clampImagePosition(refIconPosTemp.y):50;
  const sections=_refSections.filter(sec=>String(sec.name||'').trim()).map(sec=>({name:String(sec.name).trim(),count:Math.max(0,parseInt(sec.count)||0),cols:clampCols(sec.cols)}));
  if(editRefId){
    const r=db.refs.find(x=>x.id===editRefId);
    if(r){
      const totalNeeded=sections.reduce((sum,sec)=>sum+sec.count,0);
      if(totalNeeded<r.items.length&&r.items.slice(totalNeeded).some(item=>!isBlankRefItem(item))){toast('先清空要删掉的已填写品目');return;}
      while(r.items.length<totalNeeded)r.items.push(makeBlankRefItem(r.items.length+1));
      if(totalNeeded<r.items.length)r.items.splice(totalNeeded);
      r.name=name;r.shelf=shelf;r.note=note;r.label=label;r.sections=sections;r.icon=icon;r.iconPositionX=iconPositionX;r.iconPositionY=iconPositionY;renumberBlankRefItems(r);
    }
  }else{
    const total=sections.reduce((sum,sec)=>sum+sec.count,0),items=[];for(let i=0;i<total;i++)items.push(makeBlankRefItem(i+1));
    db.refs.push({id:gid(),name,shelf,icon,note,label,comment:'',iconPositionX,iconPositionY,sections,items,order:db.refs.length});
  }
  save();closeModal('refModal');if(editRefId)openRefDetail(editRefId);else renderRefList();
}

function openRefSectionQuick(index){
  const r=db.refs.find(x=>x.id===curRefId),sec=r&&r.sections&&r.sections[index];if(!sec)return;
  editRefSectionIdx=index;document.getElementById('refSectionQuickTitle').textContent='Edit Section';
  document.getElementById('inputQuickRefSectionName').value=sec.name||'';document.getElementById('inputQuickRefSectionCount').value=Math.max(0,parseInt(sec.count)||0);document.getElementById('inputQuickRefSectionCols').value=String(clampCols(sec.cols));openModal('refSectionQuickModal');
}
function openAddRefSection(){
  editRefSectionIdx=null;document.getElementById('refSectionQuickTitle').textContent='New Section';
  document.getElementById('inputQuickRefSectionName').value='';document.getElementById('inputQuickRefSectionCount').value='0';document.getElementById('inputQuickRefSectionCols').value='3';openModal('refSectionQuickModal');
}
function saveRefSectionQuick(){
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  const name=document.getElementById('inputQuickRefSectionName').value.trim();if(!name){toast('Name required');return;}
  const nextCount=Math.max(0,Math.min(999,parseInt(document.getElementById('inputQuickRefSectionCount').value)||0)),cols=clampCols(document.getElementById('inputQuickRefSectionCols').value);
  if(editRefSectionIdx===null){
    r.sections=r.sections||[];r.sections.push({name,count:nextCount,cols});for(let i=0;i<nextCount;i++)r.items.push(makeBlankRefItem(r.items.length+1));
  }else{
    const sec=r.sections[editRefSectionIdx],oldCount=Math.max(0,parseInt(sec.count)||0);let start=0;for(let i=0;i<editRefSectionIdx;i++)start+=Math.max(0,parseInt(r.sections[i].count)||0);
    if(nextCount<oldCount){const removeAt=start+nextCount,removeCount=oldCount-nextCount;if(r.items.slice(removeAt,removeAt+removeCount).some(item=>!isBlankRefItem(item))){toast('先清空要删掉的已填写品目');return;}r.items.splice(removeAt,removeCount);}
    else if(nextCount>oldCount){const insertAt=start+oldCount,created=[];for(let i=0;i<nextCount-oldCount;i++)created.push(makeBlankRefItem(insertAt+i+1));r.items.splice(insertAt,0,...created);}
    sec.name=name;sec.count=nextCount;sec.cols=cols;
  }
  renumberBlankRefItems(r);editRefSectionIdx=null;save();closeModal('refSectionQuickModal');openRefDetail(r.id);
}

function openAddRefItem(){
  rememberRefDetailScroll();
  editRefItemId=null;document.getElementById('refItemModalTitle').textContent='New Item';
  document.getElementById('inputRefItemName').value='';
  document.getElementById('inputRefItemNote').value='';
  document.getElementById('refItemImgInput').value='';
  const preview=document.getElementById('refItemImgPreview');preview.removeAttribute('src');preview.style.display='none';
  document.getElementById('refItemDeleteBtn').style.display='none';pickRefItemMode('ref');prepareRefItemSectionSelect(-1);

}
function openEditRefItemById(itemId){
  const r=db.refs.find(x=>x.id===curRefId),index=r?r.items.findIndex(item=>item.id===itemId):-1;if(!r||index<0)return;
  rememberRefDetailScroll();
  const item=r.items[index];editRefItemId=item.id;document.getElementById('refItemModalTitle').textContent='Edit Item';
  document.getElementById('inputRefItemName').value=item.name||'';document.getElementById('inputRefItemNote').value=item.note||'';
  document.getElementById('refItemImgInput').value='';

  document.getElementById('refItemDeleteBtn').style.display='';pickRefItemMode(item.mode||'ref');prepareRefItemSectionSelect(getRefItemSectionIndex(r,index));openModal('refItemModal');

function prepareRefItemSectionSelect(selectedIndex){
  const r=db.refs.find(x=>x.id===curRefId),field=document.getElementById('refItemSectionField'),select=document.getElementById('inputRefItemSection');
  if(r&&r.sections&&r.sections.length){select.innerHTML=r.sections.map((sec,index)=>`<option value="${index}"${index===selectedIndex?' selected':''}>${esc(sec.name||('Section '+(index+1)))}</option>`).join('');field.style.display='block';}
  else{select.innerHTML='';field.style.display='none';}
}
function pickRefItemMode(mode){
  const value=mode==='list'?'list':'ref';document.getElementById('refItemMode').value=value;document.querySelectorAll('#refItemModeSelect .cat-opt').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===value));
}
function saveRefItem(){
  if(!imageReady('refItemImgPreview'))return;
  const r=db.refs.find(x=>x.id===curRefId);if(!r)return;
  const name=document.getElementById('inputRefItemName').value.trim()||'Item '+(r.items.length+1);
  const note=document.getElementById('inputRefItemNote').value.trim(),mode=document.getElementById('refItemMode').value==='list'?'list':'ref';
  const preview=document.getElementById('refItemImgPreview');
  const img=preview.style.display!=='none'?preview.src:'';
  const selectedSection=r.sections&&r.sections.length?Math.max(0,parseInt(document.getElementById('inputRefItemSection').value)||0):-1;
  if(editRefItemId){
    const oldIndex=r.items.findIndex(item=>item.id===editRefItemId),item=r.items[oldIndex];if(oldIndex<0||!item)return;
    if(!changeRefItemMode(r,item,mode))return;
    item.name=name;item.img=img;item.note=note;
    const oldSection=getRefItemSectionIndex(r,oldIndex);
    if(selectedSection>=0&&selectedSection!==oldSection){r.items.splice(oldIndex,1);if(oldSection>=0)r.sections[oldSection].count=Math.max(0,(parseInt(r.sections[oldSection].count)||0)-1);const insertAt=getRefSectionEndIndex(r,selectedSection);r.items.splice(insertAt,0,item);r.sections[selectedSection].count=(parseInt(r.sections[selectedSection].count)||0)+1;}
    const linked=getAssignedCatalogItem(item);if(linked&&!linked.item.collected){linked.item.name=name;linked.item.img=img;linked.item.note=note;}
  }else{
    const item={id:gid(),name,img,note,mode,listAssignment:null};
    if(selectedSection>=0){const insertAt=getRefSectionEndIndex(r,selectedSection);r.items.splice(insertAt,0,item);r.sections[selectedSection].count=(parseInt(r.sections[selectedSection].count)||0)+1;}else r.items.push(item);
  }
  renumberBlankRefItems(r);
  const returnScroll=refDetailScrollByProject[curRefId]??currentScrollY();save();closeModal('refItemModal');openRefDetail(curRefId,{restoreScroll:returnScroll});
}
function deleteRefItem(){
  const r=db.refs.find(x=>x.id===curRefId),index=r?r.items.findIndex(item=>item.id===editRefItemId):-1;if(!r||index<0)return;
  const item=r.items[index];if(!removeRefListAssignment(r,item))return;
  const sectionIndex=getRefItemSectionIndex(r,index);if(sectionIndex>=0)r.sections[sectionIndex].count=Math.max(0,(parseInt(r.sections[sectionIndex].count)||0)-1);
  const returnScroll=refDetailScrollByProject[r.id]??currentScrollY();r.items.splice(index,1);renumberBlankRefItems(r);editRefItemId=null;save();closeModal('refItemModal');openRefDetail(r.id,{restoreScroll:returnScroll});toast('Deleted');
}

/* ═══ HELPERS ═══ */
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2000);}
function imageReady(previewId){
  const p=document.getElementById(previewId);
  if(p&&p.dataset.uploading==='1'){toast('Please wait for the image upload');return false;}
  return true;
}
async function previewImg(input,previewId){
  if(!input.files||!input.files[0])return;
  const p=document.getElementById(previewId);const file=input.files[0];
  const previousSrc=p.getAttribute('src')||'';const previousDisplay=p.style.display;
  const token=Date.now()+'_'+Math.random();p.dataset.uploadToken=token;p.dataset.uploading='1';p.style.opacity='.45';
  toast('Uploading image…');
  try{
    if(!window.CloudinaryAssets)throw new Error('Image service unavailable');
    const url=await CloudinaryAssets.uploadImage(file);
    if(p.dataset.uploadToken!==token)return;
    p.src=url;p.style.display='block';toast('Image uploaded');
  }catch(e){
    if(p.dataset.uploadToken!==token)return;
    if(previousSrc){p.src=previousSrc;p.style.display=previousDisplay||'block';}else{p.removeAttribute('src');p.style.display='none';}
    input.value='';toast(e&&e.message||'Image upload failed');
  }finally{
    if(p.dataset.uploadToken===token){delete p.dataset.uploading;p.style.opacity='';}
  }
}
async function previewRefIcon(input){
  if(!input.files||!input.files[0])return;
  const preview=document.getElementById('refIconPreview'),editor=document.getElementById('refIconEditor'),file=input.files[0];
  const previousSrc=refIconTemp,previousPosition={...refIconPosTemp};
  const token=Date.now()+'_'+Math.random(),localUrl=URL.createObjectURL(file);
  preview.dataset.uploadToken=token;preview.dataset.uploading='1';preview.src=localUrl;preview.style.opacity='.45';
  refIconPosTemp={x:50,y:50};preview.style.objectPosition='50% 50%';editor.style.display='block';toast('Uploading image…');
  try{
    if(!window.CloudinaryAssets)throw new Error('Image service unavailable');
    const url=await CloudinaryAssets.uploadImage(file);
    if(preview.dataset.uploadToken!==token)return;
    refIconTemp=url;preview.src=url;toast('Image uploaded');
  }catch(e){
    if(preview.dataset.uploadToken!==token)return;
    refIconTemp=previousSrc;refIconPosTemp=previousPosition;
    if(previousSrc){preview.src=previousSrc;preview.style.objectPosition=previousPosition.x+'% '+previousPosition.y+'%';editor.style.display='block';}
    else{preview.removeAttribute('src');preview.style.objectPosition='50% 50%';editor.style.display='none';}
    input.value='';toast(e&&e.message||'Image upload failed');
  }finally{
    URL.revokeObjectURL(localUrl);
    if(preview.dataset.uploadToken===token){delete preview.dataset.uploading;preview.style.opacity='';}
  }
}
function clearRefIcon(){
  refIconTemp='';refIconPosTemp={x:50,y:50};
  const preview=document.getElementById('refIconPreview');
  preview.dataset.uploadToken='cleared_'+Date.now();delete preview.dataset.uploading;preview.style.opacity='';preview.removeAttribute('src');preview.style.objectPosition='50% 50%';
  document.getElementById('refIconInput').value='';document.getElementById('refIconEditor').style.display='none';
}
function resetRefIconPos(){refIconPosTemp={x:50,y:50};document.getElementById('refIconPreview').style.objectPosition='50% 50%';}
function startRefIconDrag(e){
  if(e.target.tagName==='BUTTON')return;
  e.preventDefault();
  const frame=document.getElementById('refIconPosFrame'),img=document.getElementById('refIconPreview');
  if(!img.src||!img.naturalWidth)return;
  const startX=e.touches?e.touches[0].clientX:e.clientX,startY=e.touches?e.touches[0].clientY:e.clientY;
  const startPosX=refIconPosTemp.x,startPosY=refIconPosTemp.y,frameW=frame.offsetWidth,frameH=frame.offsetHeight;
  const imgAspect=img.naturalWidth/img.naturalHeight,frameAspect=frameW/frameH;
  let rangeX=0,rangeY=0;
  if(imgAspect>frameAspect)rangeX=(img.naturalWidth*(frameH/img.naturalHeight))-frameW;
  else if(imgAspect<frameAspect)rangeY=(img.naturalHeight*(frameW/img.naturalWidth))-frameH;
  function onMove(ev){
    const cx=ev.touches?ev.touches[0].clientX:ev.clientX,cy=ev.touches?ev.touches[0].clientY:ev.clientY;
    let nx=startPosX,ny=startPosY;
    if(rangeX>0)nx=Math.max(0,Math.min(100,startPosX-((cx-startX)/rangeX)*100));
    if(rangeY>0)ny=Math.max(0,Math.min(100,startPosY-((cy-startY)/rangeY)*100));
    refIconPosTemp={x:Math.round(nx*10)/10,y:Math.round(ny*10)/10};img.style.objectPosition=refIconPosTemp.x+'% '+refIconPosTemp.y+'%';
  }
  function onEnd(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onEnd);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onEnd);}
  document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onEnd);document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onEnd);
}

document.getElementById('catItemFileLabel').addEventListener('click',()=>document.getElementById('catItemImgInput').click());

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='techo-backup.json';a.click();
}
