<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手账包">
<title>手账包</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  background:#FAFAFA; color:#1a1a1a; min-height:100vh; min-height:100dvh; padding-bottom:40px;
}

.top-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; padding-top:24px; border-bottom:1px solid #eee;
  background:#fff; position:sticky; top:0; z-index:50;
}
.top-bar h1 { font-size:15px; font-weight:600; letter-spacing:1px; color:#666; }
.top-bar .back { font-size:13px; color:#999; text-decoration:none; cursor:pointer; }
.top-bar .btn-s { font-size:11px; color:#999; background:none; border:1px solid #ddd; border-radius:6px; padding:4px 10px; cursor:pointer; }

/* ── 4-grid home ── */
.home-grid {
  display:grid; grid-template-columns:1fr 1fr;
  max-width:480px; margin:0 auto; background:#fff;
  border-bottom:1px solid #eee;
}
.home-cell {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 12px; cursor:pointer; transition:background 0.2s; position:relative;
}
.home-cell:hover { background:rgba(0,0,0,0.01); }
.home-cell:active { background:rgba(0,0,0,0.03); }
.home-cell:nth-child(1) { border-right:1px solid #f0f0f0; border-bottom:1px solid #f0f0f0; }
.home-cell:nth-child(2) { border-bottom:1px solid #f0f0f0; }
.home-cell:nth-child(3) { border-right:1px solid #f0f0f0; }
.cell-icon {
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; font-weight:600; margin-bottom:8px;
}
.cell-neal .cell-icon { background:#EEF1FF; color:#6B8AFF; }
.cell-jane .cell-icon { background:#EDFBEF; color:#5BA66B; }
.cell-label { font-size:12px; font-weight:600; letter-spacing:0.3px; margin-bottom:2px; }
.cell-neal .cell-label { color:#6B8AFF; }
.cell-jane .cell-label { color:#5BA66B; }
.cell-sub { font-size:10px; color:#bbb; }
.cell-count { position:absolute; top:8px; right:12px; font-size:10px; color:#ccc; }

@media (min-width:700px) {
  .home-grid {
    max-width:760px;
    margin:24px auto;
    border:1px solid #eee;
    border-radius:12px;
    overflow:hidden;
  }
  .home-cell { padding:44px 20px; }
}

/* ── Detail page ── */
.detail-page { display:none; }
.detail-page.show { display:block; }

/* ── Size control ── */
.size-bar {
  display:flex; align-items:center; gap:8px; padding:10px 20px;
  background:#fff; border-bottom:1px solid #f0f0f0;
  justify-content:space-between;
}
.size-bar .left { display:flex; align-items:center; gap:8px; }
.size-bar span { font-size:11px; color:#bbb; }
.size-bar button {
  width:28px; height:28px; border-radius:6px; border:1px solid #e0e0e0;
  background:#fff; cursor:pointer; font-size:12px; color:#999;
}
.size-bar button.active { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
.size-bar .edit-cats-btn { font-size:11px; color:#bbb; cursor:pointer; border:1px solid #e8e8e8; border-radius:6px; padding:4px 10px; background:#fff; }

/* ── Category rows ── */
.cat-section { margin-bottom:4px; }
.cat-header {
  display:flex; align-items:center; gap:8px;
  padding:10px 20px; background:#fff; border-bottom:1px solid #f5f5f5;
  position:sticky; top:56px; z-index:10;
}
.cat-header .cat-name { font-size:13px; font-weight:500; color:#555; }
.cat-header .cat-count { font-size:11px; color:#ccc; }
.cat-header .add-in-cat {
  margin-left:auto; font-size:18px; color:#ccc; cursor:pointer;
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  border-radius:6px; border:1px solid #eee; background:#fff;
}
.cat-header .add-in-cat:active { background:#f5f5f5; }

/* ── Items row (horizontal scroll) ── */
.items-row {
  display:flex; gap:8px; padding:10px 20px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:#fff; border-bottom:1px solid #f0f0f0;
}
.items-row::-webkit-scrollbar { display:none; }

.item-card {
  flex-shrink:0; border:1px solid #eee; border-radius:8px;
  overflow:hidden; cursor:pointer; transition:box-shadow 0.2s; background:#fff;
}
.item-card:active { box-shadow:0 1px 6px rgba(0,0,0,0.04); }
.item-card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.item-card .no-img {
  width:100%; aspect-ratio:1; background:#f5f5f5;
  display:flex; align-items:center; justify-content:center; font-size:20px; color:#ddd;
}
.item-card .item-name {
  padding:6px 8px; font-size:11px; color:#555;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* card sizes */
.sz-s .item-card { width:80px; }
.sz-m .item-card { width:110px; }
.sz-l .item-card { width:150px; }

/* techo pages row */
.techo-row {
  display:flex; gap:6px; padding:10px 20px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:#fff; border-bottom:1px solid #f0f0f0;
}
.techo-row::-webkit-scrollbar { display:none; }
.techo-page {
  flex-shrink:0; border-radius:4px; overflow:hidden;
  cursor:pointer; background:#f0f0f0; position:relative;
}
.techo-page img { width:100%; height:100%; object-fit:cover; display:block; }
.techo-page .page-label {
  position:absolute; bottom:0; left:0; right:0;
  padding:3px 6px; font-size:9px; color:#fff;
  background:linear-gradient(transparent, rgba(0,0,0,0.45));
}
.sz-s .techo-page { width:60px; height:80px; }
.sz-m .techo-page { width:90px; height:120px; }
.sz-l .techo-page { width:130px; height:173px; }

/* ── Empty ── */
.cat-empty { padding:16px 20px; font-size:12px; color:#ddd; background:#fff; border-bottom:1px solid #f0f0f0; }

/* ── Modals ── */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:200; display:none; align-items:flex-end; justify-content:center; }
.modal-bg.show { display:flex; }
.modal {
  background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:480px; max-height:85vh;
  overflow-y:auto; padding:20px; animation:slideUp 0.25s ease-out;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal h2 { font-size:15px; font-weight:600; margin-bottom:16px; color:#333; }
.modal label { display:block; font-size:12px; color:#999; margin-bottom:4px; margin-top:12px; }
.modal input, .modal textarea, .modal select {
  width:100%; font-size:14px; padding:10px 12px; border:1px solid #e0e0e0; border-radius:8px;
  font-family:inherit; background:#fff; color:#1a1a1a;
}
.modal textarea { height:80px; resize:vertical; }
.modal .btn-row { display:flex; gap:8px; margin-top:20px; }
.modal .btn { flex:1; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; font-family:inherit; }
.modal .btn-primary { background:#1a1a1a; color:#fff; }
.modal .btn-cancel { background:#f0f0f0; color:#666; }
.modal .img-preview { width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin-top:8px; }
.modal .file-label {
  display:inline-block; padding:8px 16px; border:1px dashed #ccc;
  border-radius:8px; font-size:12px; color:#999; cursor:pointer; text-align:center; width:100%; margin-top:4px;
}
.detail-content { padding:4px 0; }
.detail-content .d-title { font-size:16px; font-weight:500; margin-bottom:6px; }
.detail-content .d-cat { font-size:12px; color:#999; margin-bottom:8px; }
.detail-content .d-note { font-size:13px; color:#666; line-height:1.6; margin-bottom:8px; }
.detail-content img { width:100%; border-radius:8px; margin-bottom:8px; }
.detail-content .actions { display:flex; gap:8px; justify-content:flex-end; }
.detail-content .actions button { font-size:11px; padding:5px 12px; border:1px solid #e8e8e8; border-radius:6px; background:#fff; cursor:pointer; color:#999; }
.del { color:#e07!important; border-color:#fcc!important; }

/* ── Cat editor ── */
.ce-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #f5f5f5; }
.ce-row .ce-name { flex:1; font-size:13px; }
.ce-row button { font-size:11px; color:#e07; background:none; border:none; cursor:pointer; }
.ce-add { display:flex; gap:8px; margin-top:12px; }
.ce-add input { flex:1; }
.ce-add button { padding:8px 14px; border:1px solid #e0e0e0; border-radius:8px; background:#fff; cursor:pointer; font-size:12px; }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back" id="backBtn" href="index.html">&larr; Home</a>
  <h1 id="pageTitle">手账包</h1>
  <button class="btn-s" onclick="showModal('exportModal')">备份</button>
</div>

<!-- Home: 4 grid -->
<div id="homeView">
  <div class="home-grid">
    <div class="home-cell cell-neal" onclick="enter('neal','bag')">
      <span class="cell-count" id="cnt-neal-bag"></span>
      <div class="cell-icon">NC</div>
      <div class="cell-label">Neal's bag</div>
      <div class="cell-sub">物品</div>
    </div>
    <div class="home-cell cell-jane" onclick="enter('jane','bag')">
      <span class="cell-count" id="cnt-jane-bag"></span>
      <div class="cell-icon">PJ</div>
      <div class="cell-label">Jane's bag</div>
      <div class="cell-sub">物品</div>
    </div>
    <div class="home-cell cell-neal" onclick="enter('neal','note')">
      <span class="cell-count" id="cnt-neal-note"></span>
      <div class="cell-icon">NC</div>
      <div class="cell-label">Neal's note</div>
      <div class="cell-sub">手账</div>
    </div>
    <div class="home-cell cell-jane" onclick="enter('jane','note')">
      <span class="cell-count" id="cnt-jane-note"></span>
      <div class="cell-icon">PJ</div>
      <div class="cell-label">Jane's note</div>
      <div class="cell-sub">手账</div>
    </div>
  </div>
</div>

<!-- Detail page -->
<div class="detail-page" id="detailPage">
  <div class="size-bar">
    <div class="left">
      <span>大小</span>
      <button data-sz="s" onclick="setSz('s')">S</button>
      <button data-sz="m" class="active" onclick="setSz('m')">M</button>
      <button data-sz="l" onclick="setSz('l')">L</button>
    </div>
    <button class="edit-cats-btn" onclick="showCatEditor()">编辑分类</button>
  </div>
  <div id="catContent"></div>
</div>

<!-- Entry Modal -->
<div class="modal-bg" id="entryModal">
  <div class="modal">
    <h2 id="modalTitle">添加</h2>
    <label>名称</label>
    <input type="text" id="entryName" placeholder="名称">
    <label>分类</label>
    <select id="entryCat"></select>
    <label>备注</label>
    <textarea id="entryNote" placeholder="（选填）"></textarea>
    <label>图片</label>
    <label class="file-label" id="fileLabel">点击选择图片</label>
    <input type="file" accept="image/*" id="entryImg" onchange="previewImg(this)" style="display:none;">
    <img id="imgPreview" class="img-preview" style="display:none;">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('entryModal')">取消</button>
      <button class="btn btn-primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<!-- View detail -->
<div class="modal-bg" id="viewModal">
  <div class="modal">
    <div class="detail-content" id="viewContent"></div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('viewModal')">关闭</button></div>
  </div>
</div>

<!-- Category editor -->
<div class="modal-bg" id="catModal">
  <div class="modal">
    <h2 id="catModalTitle">编辑分类</h2>
    <div id="catList"></div>
    <div class="ce-add">
      <input type="text" id="newCatName" placeholder="新分类名称">
      <button onclick="addCat()">添加</button>
    </div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('catModal')">关闭</button></div>
  </div>
</div>

<!-- Export/Import -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>数据备份</h2>
    <div style="padding:8px 0;">
      <button class="btn btn-cancel" style="margin-bottom:8px;width:100%;" onclick="exportData()">导出所有数据</button>
      <button class="btn btn-cancel" style="width:100%;" onclick="document.getElementById('importFile').click()">从备份导入</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(this)" style="display:none;">
      <p style="font-size:11px;color:#bbb;text-align:center;margin-top:12px;">建议定期导出备份</p>
    </div>
    <div class="btn-row"><button class="btn btn-cancel" onclick="closeModal('exportModal')">关闭</button></div>
  </div>
</div>

<script src="cloud-sync.js?v=20260802-outing1"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');
let db;
try{db=JSON.parse(localStorage.getItem('techo_db2'));}catch(e){db=null;}
if(!db||!db.entries||!db.categories) db={entries:[],categories:{neal_bag:[],jane_bag:[],neal_note:[],jane_note:[]}};
// ensure all keys
['neal_bag','jane_bag','neal_note','jane_note'].forEach(k=>{if(!db.categories[k])db.categories[k]=[];});

let curOwner=null, curType=null, curSz='m', editingId=null, addToCat=null;
function dbKey(){return curOwner+'_'+curType;}
function save(){try{localStorage.setItem('techo_db2',JSON.stringify(db));}catch(e){}}

// ── Home ──
function showHome() {
  curOwner=null; curType=null;
  document.getElementById('homeView').style.display='block';
  document.getElementById('detailPage').classList.remove('show');
  document.getElementById('backBtn').href='index.html';
  document.getElementById('backBtn').onclick=null;
  document.getElementById('pageTitle').textContent='手账包';
  updateCounts();
}
function updateCounts() {
  ['neal','jane'].forEach(o=>{['bag','note'].forEach(t=>{
    const n=db.entries.filter(e=>e.owner===o&&e.type===t).length;
    const el=document.getElementById('cnt-'+o+'-'+t);
    if(el) el.textContent=n?n+' items':'';
  });});
}

function enter(owner,type) {
  curOwner=owner; curType=type;
  document.getElementById('homeView').style.display='none';
  document.getElementById('detailPage').classList.add('show');
  const names={neal_bag:"Neal's bag",jane_bag:"Jane's bag",neal_note:"Neal's note",jane_note:"Jane's note"};
  document.getElementById('pageTitle').textContent=names[dbKey()]||'';
  document.getElementById('backBtn').href='#';
  document.getElementById('backBtn').onclick=(e)=>{e.preventDefault();showHome();};
  renderDetail();
}

// ── Detail (category rows) ──
function renderDetail() {
  const c=document.getElementById('catContent');
  const key=dbKey();
  const cats=db.categories[key]||[];

  if(!cats.length) {
    c.innerHTML=`<div style="text-align:center;padding:60px 20px;color:#ccc;">
      <p style="font-size:13px;margin-bottom:8px;">还没有分类</p>
      <p style="font-size:11px;">点右上角「编辑分类」添加</p></div>`;
    return;
  }

  const isNote = curType==='note';
  c.innerHTML = cats.map(cat=>{
    const items = db.entries.filter(e=>e.owner===curOwner&&e.type===curType&&e.category===cat);
    const rowClass = isNote ? 'techo-row' : 'items-row';
    const szClass = 'sz-'+curSz;
    let content = '';
    if (!items.length) {
      content = `<div class="cat-empty">还没有内容，点 + 添加</div>`;
    } else if (isNote) {
      content = `<div class="${rowClass} ${szClass}">${items.map(e=>
        `<div class="techo-page" onclick="showView('${e.id}')">
          ${e.img?`<img src="${e.img}">`:''}
          <span class="page-label">${e.name||''}</span>
        </div>`).join('')}</div>`;
    } else {
      content = `<div class="${rowClass} ${szClass}">${items.map(e=>
        `<div class="item-card" onclick="showView('${e.id}')">
          ${e.img?`<img src="${e.img}">`:`<div class="no-img">✦</div>`}
          <div class="item-name">${e.name}</div>
        </div>`).join('')}</div>`;
    }
    return `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-name">${cat}</span>
        <span class="cat-count">${items.length}</span>
        <div class="add-in-cat" onclick="addInCat('${cat}')">+</div>
      </div>
      ${content}
    </div>`;
  }).join('');
}

function setSz(s) {
  curSz=s;
  document.querySelectorAll('.size-bar button[data-sz]').forEach(b=>b.classList.toggle('active',b.dataset.sz===s));
  renderDetail();
}

// ── Category editor ──
function showCatEditor() {
  document.getElementById('catModalTitle').textContent = curType==='bag'?'编辑物品分类':'编辑本子分类';
  renderCatList();
  showModal('catModal');
}
function renderCatList() {
  const key=dbKey();
  const cats=db.categories[key]||[];
  const list=document.getElementById('catList');
  if(!cats.length){list.innerHTML='<p style="font-size:12px;color:#ccc;padding:8px 0;">还没有分类</p>';return;}
  list.innerHTML=cats.map((c,i)=>`<div class="ce-row">
    <span class="ce-name">${c}</span>
    <button onclick="removeCat(${i})">删除</button>
  </div>`).join('');
}
function addCat() {
  const name=document.getElementById('newCatName').value.trim();
  if(!name)return;
  const key=dbKey();
  if(!db.categories[key])db.categories[key]=[];
  db.categories[key].push(name);
  document.getElementById('newCatName').value='';
  save(); renderCatList(); renderDetail();
}
function removeCat(i) {
  const key=dbKey();
  const catName=db.categories[key][i];
  if(!confirm('删除分类「'+catName+'」？里面的物品也会删除。'))return;
  db.categories[key].splice(i,1);
  db.entries=db.entries.filter(e=>!(e.owner===curOwner&&e.type===curType&&e.category===catName));
  save(); renderCatList(); renderDetail(); updateCounts();
}

// ── Add entry ──
function addInCat(cat) { addToCat=cat; showAddEntry(); }
function showAddEntry() {
  editingId=null;
  document.getElementById('modalTitle').textContent=curType==='bag'?'添加物品':'添加页面';
  document.getElementById('entryName').value='';
  document.getElementById('entryNote').value='';
  document.getElementById('imgPreview').style.display='none';
  delete document.getElementById('imgPreview').dataset.source;
  document.getElementById('entryImg').value='';
  const sel=document.getElementById('entryCat');
  const cats=db.categories[dbKey()]||[];
  sel.innerHTML=cats.map(c=>`<option ${c===addToCat?'selected':''}>${c}</option>`).join('');
  addToCat=null;
  showModal('entryModal');
}

function editEntry(id) {
  const e=db.entries.find(x=>x.id===id);if(!e)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='编辑';
  document.getElementById('entryName').value=e.name;
  document.getElementById('entryNote').value=e.note||'';
  const sel=document.getElementById('entryCat');
  const cats=db.categories[e.owner+'_'+e.type]||[];
  sel.innerHTML=cats.map(c=>`<option ${c===e.category?'selected':''}>${c}</option>`).join('');
  if(e.img){document.getElementById('imgPreview').dataset.source=e.img;document.getElementById('imgPreview').src=e.img;document.getElementById('imgPreview').style.display='block';}
  else{document.getElementById('imgPreview').style.display='none';delete document.getElementById('imgPreview').dataset.source;}
  showModal('entryModal');
}

function previewImg(input) {
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const MAX=800;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=h*MAX/w;w=MAX;}else{w=w*MAX/h;h=MAX;}}
      canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      const preview=document.getElementById('imgPreview');
      const dataUrl=canvas.toDataURL('image/jpeg',0.7);
      preview.dataset.source=dataUrl;
      preview.src=dataUrl;
      preview.style.display='block';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

async function saveEntry() {
  const name=document.getElementById('entryName').value.trim();
  if(!name)return;
  const note=document.getElementById('entryNote').value;
  const cat=document.getElementById('entryCat').value;
  const preview=document.getElementById('imgPreview');
  const entryId=editingId||'te_'+Date.now();
  let img=preview.style.display!=='none'?(preview.dataset.source||preview.getAttribute('src')||''):'';
  if(img.startsWith('data:')&&window.CloudSync){
    try{img=await CloudSync.uploadDataUrl(img,`techo/${entryId}.jpg`);}
    catch(error){console.warn(error);alert('照片暂时没有传到云端，记录仍会保存在这台设备。');}
  }

  let oldImg='';
  if(editingId) {
    const e=db.entries.find(x=>x.id===editingId);
    if(e){oldImg=e.img||'';e.name=name;e.note=note;e.category=cat;e.img=img;}
  } else {
    db.entries.push({id:entryId,owner:curOwner,type:curType,name,note,img,category:cat,created:new Date().toISOString()});
  }
  save();closeModal('entryModal');renderDetail();updateCounts();
  if(oldImg&&oldImg!==img&&window.CloudSync) CloudSync.deleteAsset(oldImg);
}

function deleteEntry(id) {
  if(!confirm('确定删除？'))return;
  const entry=db.entries.find(e=>e.id===id);
  db.entries=db.entries.filter(e=>e.id!==id);
  save();renderDetail();updateCounts();
  if(entry&&entry.img&&window.CloudSync) CloudSync.deleteAsset(entry.img);
}

// ── View ──
function showView(id) {
  const e=db.entries.find(x=>x.id===id);if(!e)return;
  document.getElementById('viewContent').innerHTML=`
    <div class="d-title">${e.name}</div>
    <div class="d-cat">${e.category||''}</div>
    ${e.note?`<div class="d-note">${e.note.replace(/\n/g,'<br>')}</div>`:''}
    ${e.img?`<img src="${e.img}">`:''}
    <div class="actions">
      <button onclick="closeModal('viewModal');editEntry('${e.id}')">编辑</button>
      <button class="del" onclick="closeModal('viewModal');deleteEntry('${e.id}')">删除</button>
    </div>`;
  showModal('viewModal');
}

// ── Export/Import ──
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`techo_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();
}
function importData(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=(ev)=>{try{
    const imp=JSON.parse(ev.target.result);
    if(imp.entries&&imp.categories){if(confirm('导入数据？')){db=imp;save();showHome();closeModal('exportModal');}}
    else alert('格式不对');
  }catch(e){alert('导入失败');}};
  reader.readAsText(input.files[0]);
}

// ── Modal ──
function showModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');});});
document.getElementById('fileLabel').addEventListener('click',()=>document.getElementById('entryImg').click());

async function migrateLocalImages(){
  if(!window.CloudSync)return;
  try{
    await CloudSync.whenReady();
    let changed=false;
    for(const entry of db.entries){
      if(entry.img&&entry.img.startsWith('data:')){
        entry.img=await CloudSync.uploadDataUrl(entry.img,`techo/${entry.id}.jpg`);
        changed=true;
      }
    }
    if(changed){save();showHome();}
  }catch(error){console.warn('手账照片迁移暂未完成：',error);}
}

// ── Init ──
showHome(); migrateLocalImages();
</script>
</body>
