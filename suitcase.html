<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suitcase">
<title>Suitcase</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}button{color:inherit}
body{min-height:100vh;min-height:100dvh;padding-bottom:36px;background:#fafafa;color:#333;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
.top-bar{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:62px 1fr 62px;align-items:center;min-height:54px;padding:env(safe-area-inset-top,0) 16px 0;border-bottom:1px solid #eeeeec;background:rgba(255,255,255,.96);backdrop-filter:blur(12px)}
.top-bar h1{text-align:center;color:#8f8d89;font-size:13px;font-weight:500;letter-spacing:3px}.top-link,.top-action{border:0;background:none;color:#aaa;font-size:11px;text-decoration:none;cursor:pointer}.top-link{justify-self:start}.top-action{justify-self:end;letter-spacing:.5px}
.view{width:min(100%,560px);margin:0 auto}.point-panel{margin:18px 14px 2px;padding:15px 16px 16px;border:1px solid #e8e8e5;border-radius:13px;background:#fff}.point-head{display:flex;align-items:baseline;justify-content:space-between}.point-title{color:#a7a39c;font-size:9px;letter-spacing:1.6px}.point-value{color:#4b4945;font-size:25px;font-weight:300;font-variant-numeric:tabular-nums}.point-unit{margin-left:3px;color:#bbb;font-size:8px;letter-spacing:.5px}.size-buttons{display:flex;align-items:flex-end;justify-content:space-between;margin-top:13px;padding:0 2px}.size-button{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid #e2ddd4;border-radius:50%;background:#fff;color:#82745c;cursor:pointer;transition:background .12s,transform .08s}.size-button:active{background:#f5f1e9;transform:scale(.94)}.size-button.xlarge{width:47px;height:47px}.size-button.large{width:52px;height:52px}.size-button.medium{width:57px;height:57px}.size-button.small{width:62px;height:62px}.size-score{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}.size-name{margin-top:3px;color:#aaa;font-size:8px}
.section-label{display:flex;align-items:center;justify-content:space-between;padding:21px 20px 9px;color:#aaa;font-size:9px;letter-spacing:1.4px}.section-count{color:#c6c6c2;font-variant-numeric:tabular-nums;letter-spacing:0}.inventory,.collection,.history{margin:0 14px}.history{margin-bottom:28px}
.series-group,.history-group{margin-bottom:9px;overflow:hidden;border:1px solid #eaeae7;border-radius:11px;background:#fff}.series-head{display:flex;width:100%;align-items:center;gap:9px;padding:12px 13px;border:0;background:#fff;text-align:left;cursor:pointer}.series-mark{width:5px;height:5px;flex:0 0 5px;border-radius:50%;background:#b5a17c}.series-name{min-width:0;flex:1;overflow:hidden;color:#68645d;font-size:11px;letter-spacing:.4px;text-overflow:ellipsis;white-space:nowrap}.series-total,.history-total{color:#c2c2be;font-size:9px;font-variant-numeric:tabular-nums}.caret,.history-caret{color:#ccc;font-size:9px;transition:transform .18s}.series-head[aria-expanded="true"] .caret,.history-group[open] .history-caret{transform:rotate(180deg)}.series-body[hidden]{display:none}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;border-top:1px solid #f1f1ef;background:#fff}.item-edit{display:block;min-width:0;padding:11px 13px;border:0;background:#fff;text-align:left;cursor:pointer}.item-name{display:block;overflow:hidden;color:#444;font-size:12px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.item-note{display:block;margin-top:4px;overflow:hidden;color:#aaa;font-size:9px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.item-arrow{align-self:center;padding-right:13px;color:#c2c2bd;font-size:12px}.redeem-button{align-self:center;min-width:48px;margin-right:10px;padding:6px 7px;border:1px solid #dcd4c6;border-radius:8px;background:#fff;color:#887653;font-size:8px;line-height:1.25;text-align:center;cursor:pointer}.redeem-button span{display:block;font-size:10px;font-variant-numeric:tabular-nums}.redeem-button:disabled{border-color:#eceae5;color:#cac8c2;cursor:default}
.item-edit{display:flex;align-items:center;gap:10px}.item-copy{min-width:0;flex:1}.item-thumb{width:38px;height:38px;flex:0 0 38px;border-radius:7px;background:#f6f5f2;object-fit:cover}.item-note.no-name{margin-top:0}
.history-group summary{display:flex;align-items:center;gap:8px;padding:10px 12px;list-style:none;cursor:pointer}.history-group summary::-webkit-details-marker{display:none}.history-date{flex:1;color:#999;font-size:10px}.history-entry{display:grid;width:100%;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:11px 12px;border:0;border-top:1px solid #f3f3f1;background:#fff;text-align:left}.history-entry[data-item]{cursor:pointer}.history-copy{min-width:0}.history-name{display:block;overflow:hidden;color:#555;font-size:11px;line-height:1.45;text-overflow:ellipsis;white-space:nowrap}.history-meta{display:block;margin-top:3px;overflow:hidden;color:#bbb;font-size:8px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.history-delta{color:#7d9f82;font-size:10px;font-variant-numeric:tabular-nums}.history-delta.spend{color:#b09a78}
.history-main{display:flex;min-width:0;align-items:center;gap:9px}.history-thumb{width:32px;height:32px;flex:0 0 32px;border-radius:6px;background:#f6f5f2;object-fit:cover}
.empty{padding:25px 18px;border:1px dashed #deded9;border-radius:11px;color:#c2c2bd;font-size:10px;line-height:1.7;text-align:center}.empty-add{display:block;margin:11px auto 0;padding:7px 11px;border:1px solid #ddd8cf;border-radius:8px;background:#fff;color:#94866e;font-size:9px;cursor:pointer}
.sheet-overlay{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(35,33,29,.22)}.sheet-overlay.show{display:flex}.sheet{width:min(100%,560px);max-height:88dvh;overflow:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom,0));border-radius:16px 16px 0 0;background:#fff;box-shadow:0 -10px 30px rgba(0,0,0,.08)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.sheet-title{color:#999;font-size:10px;letter-spacing:1.5px}.sheet-close{padding:3px;border:0;background:none;color:#bbb;font-size:18px;cursor:pointer}.field{margin-bottom:12px}.field label{display:block;margin:0 0 6px 2px;color:#aaa;font-size:9px;letter-spacing:.6px}.field input{width:100%;height:42px;padding:0 11px;border:1px solid #e7e7e3;border-radius:9px;outline:none;background:#fff;color:#444;font-size:12px}.field input:focus{border-color:#cfc6b5}.field input::placeholder{color:#cececa}.field-grid{display:grid;grid-template-columns:1fr 96px;gap:9px}.sheet-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:17px}.sheet-btn{min-width:66px;padding:9px 13px;border:1px solid #ddd9d1;border-radius:8px;background:#fff;color:#888;font-size:10px;cursor:pointer}.sheet-btn.primary{border-color:#4f4b45;background:#4f4b45;color:#fff}.sheet-btn.danger{margin-right:auto;border-color:#eadfdc;color:#b98579}.sheet-btn[hidden]{display:none}
.image-field{display:flex;align-items:center;gap:10px}.field .image-picker{position:relative;display:flex;width:72px;height:72px;margin:0;align-items:center;justify-content:center;overflow:hidden;border:1px dashed #dcd9d2;border-radius:9px;background:#faf9f7;color:#aaa;cursor:pointer}.image-picker img{width:100%;height:100%;object-fit:cover}.image-picker .image-placeholder{font-size:9px;letter-spacing:0}.image-picker.has-image{border-style:solid}.image-picker.has-image .image-placeholder{display:none}.image-remove{padding:6px 9px;border:1px solid #e5e2dc;border-radius:7px;background:#fff;color:#aaa;font-size:9px;cursor:pointer}.image-remove[hidden]{display:none}
@media(max-width:350px){.size-button.xlarge{width:45px;height:45px}.size-button.large{width:49px;height:49px}.size-button.medium{width:53px;height:53px}.size-button.small{width:57px;height:57px}}
@media(min-width:700px){.view{margin-top:18px;border:1px solid #eeeeec;border-radius:12px;background:#fff;overflow:hidden}.top-bar{padding-top:0}.point-panel,.inventory,.collection,.history{margin-right:18px;margin-left:18px}}
</style>
</head>
<body>
<header class="top-bar">
  <a class="top-link" href="index.html">Home</a>
  <h1>SUITCASE</h1>
  <button class="top-action" id="addItem" type="button">＋ ITEM</button>
</header>

<main class="view">
  <div class="section-label"><span>SACRAMENTO</span><span class="section-count" id="collectionCount"></span></div>
  <div class="collection" id="collectionList"></div>
  <div class="section-label"><span>OSAKA INVENTORY</span><span class="section-count" id="inventoryCount"></span></div>
  <div class="inventory" id="inventoryList"></div>

  <section class="point-panel" aria-label="Suitcase Point">
    <div class="point-head"><span class="point-title">SUITCASE POINT</span><span><strong class="point-value" id="pointBalance">0</strong><span class="point-unit">PT</span></span></div>
    <div class="size-buttons" aria-label="记录清出的物品尺寸">
      <button class="size-button xlarge" type="button" data-cleanup="xlarge"><span class="size-score">+20</span><span class="size-name">极大</span></button>
      <button class="size-button large" type="button" data-cleanup="large"><span class="size-score">+8</span><span class="size-name">大</span></button>
      <button class="size-button medium" type="button" data-cleanup="medium"><span class="size-score">+5</span><span class="size-name">中</span></button>
      <button class="size-button small" type="button" data-cleanup="small"><span class="size-score">+2</span><span class="size-name">小</span></button>
    </div>
  </section>

  <div class="section-label"><span>HISTORY</span><span class="section-count" id="historyCount"></span></div>
  <div class="history" id="historyList"></div>
</main>

<div class="sheet-overlay" id="itemSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form class="sheet" id="itemForm" onclick="event.stopPropagation()">
    <div class="sheet-head"><span class="sheet-title" id="sheetTitle">NEW ITEM</span><button class="sheet-close" id="closeSheet" type="button" aria-label="关闭">×</button></div>
    <div class="field"><label for="itemName">物品（选填）</label><input id="itemName" maxlength="120" autocomplete="off"></div>
    <div class="field">
      <label for="itemImage">图片</label>
      <div class="image-field">
        <label class="image-picker" id="itemImagePicker" for="itemImage"><img id="itemImagePreview" alt="" hidden><span class="image-placeholder">＋ 图片</span></label>
        <button class="image-remove" id="removeItemImage" type="button" hidden>移除</button>
      </div>
      <input id="itemImage" type="file" accept="image/*" hidden>
    </div>
    <div class="field-grid">
      <div class="field"><label for="itemSeries">系列 / 分栏</label><input id="itemSeries" maxlength="80" list="seriesOptions" autocomplete="off" placeholder="例如 文具"></div>
      <div class="field"><label for="itemCost">所需点数</label><input id="itemCost" type="number" min="1" step="1" inputmode="numeric" required></div>
    </div>
    <div class="field"><label for="itemNote">备注</label><input id="itemNote" maxlength="160" autocomplete="off" placeholder="留在家里 / 送给谁"></div>
    <datalist id="seriesOptions"></datalist>
    <div class="sheet-actions"><button class="sheet-btn danger" id="deleteItem" type="button" hidden>删除</button><button class="sheet-btn" id="cancelItem" type="button">取消</button><button class="sheet-btn primary" type="submit">保存</button></div>
  </form>
</div>

<script src="world-context.js?v=20260920-suitcase2"></script>
<script src="cloud-sync.js?v=20260920-suitcase2"></script>
<script src="cbi-data.js?v=20260920-suitcase4"></script>
<script>
(function(){
  'use strict';

  var COLLAPSED_KEY='cbi_suitcase_collapsed_v2';
  var SIZE_META={xlarge:{label:'极大',order:0},large:{label:'大',order:1},medium:{label:'中',order:2},small:{label:'小',order:3}};
  var editingId='';
  var itemImageDraft='';

  function el(id){return document.getElementById(id)}
  function escapeHtml(value){return String(value==null?'':value).replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]})}
  function displayDay(key){var parts=String(key).split('-');if(parts.length!==3)return key;var today=CBIData.workDayKey(new Date());var label=Number(parts[1])+' / '+Number(parts[2]);if(key===today)return'TODAY · '+label;if(Number(parts[0])!==new Date().getFullYear())return parts[0]+' · '+label;return label}
  function shortDay(key){var parts=String(key).split('-');return parts.length===3?Number(parts[1])+'/'+Number(parts[2]):key}
  function readCollapsed(){try{var value=JSON.parse(localStorage.getItem(COLLAPSED_KEY)||'[]');return new Set(Array.isArray(value)?value:[])}catch(error){return new Set()}}
  function writeCollapsed(value){try{localStorage.setItem(COLLAPSED_KEY,JSON.stringify(Array.from(value)))}catch(error){}}
  function load(){return CBIData.load()}
  function suitcaseOf(db){return db.work.suitcase}
  function itemsOf(db){return suitcaseOf(db).items}
  function sortItems(items,status){return items.slice().sort(function(left,right){var a=status==='inventory'?left.createdAt:(left.redeemedAt||left.createdAt);var b=status==='inventory'?right.createdAt:(right.redeemedAt||right.createdAt);return String(b).localeCompare(String(a))})}

  function seriesGroups(items,status){
    var groups=[];var index={};
    sortItems(items,status).forEach(function(item){
      var name=item.series||'未分栏';
      if(index[name]===undefined){index[name]=groups.length;groups.push({name:name,items:[]})}
      groups[index[name]].items.push(item);
    });
    return groups;
  }

  function groupedHtml(items,scope,points){
    var collapsed=readCollapsed();
    return seriesGroups(items,scope).map(function(group){
      var collapseId=scope+':'+group.name;var closed=collapsed.has(collapseId);
      var rows=group.items.map(function(item){
        var meta=[];
        if(scope==='inventory')meta.push(item.cost+' PT');else if(item.broughtOn)meta.push(shortDay(item.broughtOn));
        if(item.note)meta.push(item.note);
        var thumb=item.image?'<img class="item-thumb" src="'+escapeHtml(item.image)+'" alt="">':'';var nameHtml=item.name?'<span class="item-name">'+escapeHtml(item.name)+'</span>':'';
        var edit='<button class="item-edit" type="button" data-item="'+escapeHtml(item.id)+'">'+thumb+'<span class="item-copy">'+nameHtml+(meta.length?'<span class="item-note'+(item.name?'':' no-name')+'">'+escapeHtml(meta.join(' · '))+'</span>':'')+'</span></button>';
        if(scope==='inventory'){
          var disabled=points<item.cost?' disabled':'';
          return '<div class="item-row">'+edit+'<button class="redeem-button" type="button" data-redeem="'+escapeHtml(item.id)+'"'+disabled+'><span>'+item.cost+' PT</span>带走</button></div>';
        }
        return '<div class="item-row">'+edit+'<span class="item-arrow">›</span></div>';
      }).join('');
      return '<section class="series-group"><button class="series-head" type="button" data-series="'+escapeHtml(group.name)+'" data-series-scope="'+scope+'" aria-expanded="'+(!closed)+'"><span class="series-mark"></span><span class="series-name">'+escapeHtml(group.name)+'</span><span class="series-total">'+group.items.length+'</span><span class="caret">⌄</span></button><div class="series-body" '+(closed?'hidden':'')+'>'+rows+'</div></section>';
    }).join('');
  }

  function renderInventory(items,points){
    el('inventoryCount').textContent=items.length?items.length+' 件':'';
    el('inventoryList').innerHTML=items.length?groupedHtml(items,'inventory',points):'<div class="empty">—<button class="empty-add" type="button" data-add-item>＋ 添加物品</button></div>';
  }

  function renderCollection(items){
    el('collectionCount').textContent=items.length?items.length+' 件':'';
    el('collectionList').innerHTML=items.length?groupedHtml(items,'collected',0):'<div class="empty">—</div>';
  }

  function historyEntries(state){
    var cleanup={};var entries=[];
    state.cleanupLog.forEach(function(entry){
      var date=CBIData.workDayKey(entry.at);var key=date+'|'+entry.size;
      if(!cleanup[key])cleanup[key]={kind:'cleanup',date:date,size:entry.size,count:0,delta:0,at:entry.at};
      cleanup[key].count+=1;cleanup[key].delta+=entry.points;
      if(String(entry.at)>String(cleanup[key].at))cleanup[key].at=entry.at;
    });
    Object.keys(cleanup).forEach(function(key){entries.push(cleanup[key])});
    state.items.filter(function(item){return item.status==='collected'}).forEach(function(item){
      entries.push({kind:'item',date:item.broughtOn||CBIData.workDayKey(item.redeemedAt||item.createdAt),at:item.redeemedAt||item.createdAt,item:item,delta:-Math.max(0,item.redeemedCost||0)});
    });
    return entries.sort(function(left,right){if(left.date!==right.date)return right.date.localeCompare(left.date);return String(right.at).localeCompare(String(left.at))});
  }

  function renderHistory(state){
    var entries=historyEntries(state);var groups={};
    entries.forEach(function(entry){(groups[entry.date]||(groups[entry.date]=[])).push(entry)});
    var keys=Object.keys(groups).sort().reverse();
    el('historyCount').textContent=(state.cleanupLog.length+state.items.filter(function(item){return item.status==='collected'}).length)||'';
    if(!keys.length){el('historyList').innerHTML='<div class="empty">—</div>';return}
    el('historyList').innerHTML=keys.map(function(key,index){
      var eventCount=groups[key].reduce(function(sum,entry){return sum+(entry.kind==='cleanup'?entry.count:1)},0);
      var rows=groups[key].map(function(entry){
        if(entry.kind==='cleanup'){
          var size=SIZE_META[entry.size]||SIZE_META.small;
          return '<div class="history-entry"><span class="history-copy"><span class="history-name">清出 · '+size.label+(entry.count>1?' ×'+entry.count:'')+'</span></span><span class="history-delta">+'+entry.delta+'</span></div>';
        }
        var item=entry.item;var meta=[item.series||'未分栏',item.note].filter(Boolean).join(' · ');
        var thumb=item.image?'<img class="history-thumb" src="'+escapeHtml(item.image)+'" alt="">':'';var historyName=item.name?'带来 · '+escapeHtml(item.name):'带来';
        return '<button class="history-entry" type="button" data-item="'+escapeHtml(item.id)+'"><span class="history-main">'+thumb+'<span class="history-copy"><span class="history-name">'+historyName+'</span>'+(meta?'<span class="history-meta">'+escapeHtml(meta)+'</span>':'')+'</span></span>'+(entry.delta?'<span class="history-delta spend">'+entry.delta+'</span>':'<span></span>')+'</button>';
      }).join('');
      return '<details class="history-group" '+(index===0?'open':'')+'><summary><span class="history-date">'+displayDay(key)+'</span><span class="history-total">'+eventCount+'</span><span class="history-caret">⌄</span></summary>'+rows+'</details>';
    }).join('');
  }

  function render(){
    var db=load();var state=suitcaseOf(db);var inventory=state.items.filter(function(item){return item.status==='inventory'});var collected=state.items.filter(function(item){return item.status==='collected'});
    el('pointBalance').textContent=state.points;
    renderInventory(inventory,state.points);renderCollection(collected);renderHistory(state);
    var seen={};el('seriesOptions').innerHTML=state.items.map(function(item){return item.series}).filter(function(name){if(!name||seen[name])return false;seen[name]=true;return true}).map(function(name){return '<option value="'+escapeHtml(name)+'"></option>'}).join('');
  }

  function renderImageDraft(){
    var hasImage=!!itemImageDraft;var preview=el('itemImagePreview');
    el('itemImagePicker').classList.toggle('has-image',hasImage);el('removeItemImage').hidden=!hasImage;preview.hidden=!hasImage;
    if(hasImage)preview.setAttribute('src',itemImageDraft);else{preview.removeAttribute('src');delete preview.dataset.cloudPath}
  }

  function optimizedImage(file,maxSide){
    return new Promise(function(resolve,reject){
      var reader=new FileReader();reader.onerror=reject;reader.onload=function(){
        var image=new Image();image.onerror=reject;image.onload=function(){
          var scale=Math.min(1,(maxSide||1200)/Math.max(image.width,image.height));var canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));var context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.84));
        };image.src=reader.result;
      };reader.readAsDataURL(file);
    });
  }

  function itemImageSelected(input){
    if(!input.files||!input.files[0])return;
    optimizedImage(input.files[0],1200).then(function(data){itemImageDraft=data;renderImageDraft()}).catch(function(){input.value=''});
  }

  function removeItemImage(){itemImageDraft='';el('itemImage').value='';renderImageDraft()}

  function openEditor(id){
    editingId=id||'';var item=editingId?itemsOf(load()).find(function(entry){return entry.id===editingId}):null;
    if(editingId&&!item)return;
    el('sheetTitle').textContent=item?'EDIT ITEM':'NEW ITEM';el('itemName').value=item?item.name:'';el('itemSeries').value=item?item.series:'';el('itemCost').value=item?item.cost:2;el('itemNote').value=item?item.note:'';el('deleteItem').hidden=!item;el('itemImage').value='';itemImageDraft=item?item.image||'':'';renderImageDraft();
    el('itemSheet').classList.add('show');setTimeout(function(){el('itemName').focus()},80);
  }

  function closeEditor(){editingId='';itemImageDraft='';el('itemImage').value='';el('itemSheet').classList.remove('show')}

  async function saveItem(event){
    event.preventDefault();var name=el('itemName').value.trim();if(!name&&!itemImageDraft){el('itemImage').click();return}
    var db=load();var items=itemsOf(db);var now=new Date().toISOString();var cost=Math.max(1,Math.floor(Number(el('itemCost').value)||1));var item=editingId?items.find(function(entry){return entry.id===editingId}):null;if(editingId&&!item)return;var stableId=item?item.id:CBIData.createId('suitcase');var previousImage=item?item.image||'':'';var image=itemImageDraft;
    if(image&&/^data:/.test(image)&&window.CloudSync&&typeof CloudSync.uploadDataUrl==='function'){try{image=await CloudSync.uploadDataUrl(image,'suitcase/'+stableId+'.jpg')}catch(error){}}
    var value={name:name,series:el('itemSeries').value.trim(),note:el('itemNote').value.trim(),image:image,cost:cost,updatedAt:now};
    if(item)Object.assign(item,value);else items.push(Object.assign({id:stableId,status:'inventory',broughtOn:'',redeemedAt:'',redeemedCost:0,createdAt:now},value));
    if(!CBIData.save(db))return;if(previousImage&&previousImage!==image&&/^cloud:\/\//.test(previousImage)&&window.CloudSync&&typeof CloudSync.deleteAsset==='function')CloudSync.deleteAsset(previousImage).catch(function(){});closeEditor();render();
  }

  function deleteItem(){
    if(!editingId||!window.confirm('删除这件物品？'))return;
    var db=load();var items=itemsOf(db);var index=items.findIndex(function(item){return item.id===editingId});if(index<0)return;
    var removed=items[index];items.splice(index,1);if(!CBIData.save(db))return;if(removed.image&&/^cloud:\/\//.test(removed.image)&&window.CloudSync&&typeof CloudSync.deleteAsset==='function')CloudSync.deleteAsset(removed.image).catch(function(){});closeEditor();render();
  }

  function recordCleanup(size){var result=CBIData.recordSuitcaseCleanup(load(),size,new Date());if(result.ok&&CBIData.save(result.db))render()}
  function redeemItem(id){var result=CBIData.redeemSuitcaseItem(load(),id,new Date());if(result.ok&&CBIData.save(result.db))render();else render()}
  function toggleSeries(head){var collapsed=readCollapsed();var id=head.dataset.seriesScope+':'+head.dataset.series;var closing=head.getAttribute('aria-expanded')==='true';if(closing)collapsed.add(id);else collapsed.delete(id);writeCollapsed(collapsed);render()}
  function handleListClick(event){var add=event.target.closest('[data-add-item]');if(add){openEditor('');return}var redeem=event.target.closest('[data-redeem]');if(redeem){redeemItem(redeem.dataset.redeem);return}var item=event.target.closest('[data-item]');if(item){openEditor(item.dataset.item);return}var head=event.target.closest('[data-series-scope]');if(head)toggleSeries(head)}

  document.querySelectorAll('[data-cleanup]').forEach(function(button){button.addEventListener('click',function(){recordCleanup(button.dataset.cleanup)})});
  el('addItem').addEventListener('click',function(){openEditor('')});el('inventoryList').addEventListener('click',handleListClick);el('collectionList').addEventListener('click',handleListClick);
  el('historyList').addEventListener('click',function(event){var item=event.target.closest('[data-item]');if(item)openEditor(item.dataset.item)});
  el('itemImage').addEventListener('change',function(){itemImageSelected(this)});el('removeItemImage').addEventListener('click',removeItemImage);
  el('itemForm').addEventListener('submit',saveItem);el('deleteItem').addEventListener('click',deleteItem);el('closeSheet').addEventListener('click',closeEditor);el('cancelItem').addEventListener('click',closeEditor);
  el('itemSheet').addEventListener('click',function(event){if(event.target===el('itemSheet'))closeEditor()});document.addEventListener('keydown',function(event){if(event.key==='Escape')closeEditor()});window.addEventListener('storage',function(event){if(event.key===CBIData.STORAGE_KEY)render()});

  render();if(window.CloudSync&&typeof CloudSync.whenReady==='function')CloudSync.whenReady().then(render).catch(function(){});
})();
</script>
