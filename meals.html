<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#8B6914}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.world-label{min-width:72px;text-align:right;font-size:9px;color:#bbb;letter-spacing:.5px}
.mini-cal{padding:12px 16px 8px;background:#fff;border-bottom:1px solid #f0f0f0}
.mini-cal-row{display:flex;gap:6px}
.mini-cal-day{flex:1;min-width:0;text-align:center;padding:6px 2px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.mini-cal-day:active{background:#f5f5f5}
.mini-cal-day.today{background:#FFFDF7;box-shadow:inset 0 0 0 1.5px #E8B96A40}
.mini-cal-day.selected{background:#E8B96A15;box-shadow:inset 0 0 0 1.5px #E8B96A}
.mini-cal-dow{font-size:9px;color:#bbb;margin-bottom:2px}
.mini-cal-date{font-size:13px;font-weight:500;color:#333;margin-bottom:4px}
.mini-cal-day.today .mini-cal-date{color:#B9872F}
.mini-cal-dots{display:flex;justify-content:center;gap:3px;min-height:6px;flex-wrap:wrap}
.mini-cal-dots span{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.mini-cal-detail{margin-top:8px;padding:8px 4px;border-top:1px solid #f5f5f5;display:none}
.mini-cal-detail.show{display:block}
.cal-food-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.cal-food-period{font-size:9px;color:#bbb;width:28px;flex-shrink:0;text-align:right}

.cal-food-chip{font-size:10px;padding:2px 7px;border-radius:4px;white-space:nowrap}

.cal-appt-chip{font-size:10px;padding:2px 7px;border-radius:4px;background:#E8B96A15;color:#B9872F;display:inline-flex;align-items:center;gap:3px;margin:2px 0}
.cal-my-input{width:32px;min-width:32px;max-width:80px;border:none;background:transparent;font-size:10px;color:#B9872F;outline:none;font-family:inherit;padding:2px 0}
.dining-invite{margin:8px 16px;padding:14px 16px;background:#fff;border-radius:12px;border:1.5px solid #f0e8d8;position:relative;animation:inviteIn .4s ease-out}
@keyframes inviteIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.dining-invite-char{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dining-invite-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.dining-invite-name{font-size:11px;font-weight:600}
.dining-invite-msg{font-size:13px;color:#555;line-height:1.5;margin-bottom:10px;font-style:italic}
.dining-invite-place{font-size:12px;font-weight:500;color:#333;margin-bottom:10px}
.dining-invite-actions{display:flex;gap:8px}
.dining-invite-actions button{flex:1;padding:8px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;border:1px solid #e8e8e8;background:#fff;color:#999;transition:all .15s}
.dining-invite-actions button:active{transform:scale(.97)}
.dining-invite-actions button.accept{background:#E8B96A;border-color:#E8B96A;color:#fff}
.dining-invite-dismiss{position:absolute;top:8px;right:10px;background:none;border:none;font-size:14px;color:#ccc;cursor:pointer}
.dining-date-input{width:100%;padding:10px;border:1px solid #e8e8e8;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px}
.shelf-header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;cursor:pointer;user-select:none;-webkit-user-select:none}
.shelf-header:active{background:#f5f5f5}
.shelf-line{flex:1;height:1px;background:#e0e0e0}
.shelf-label{font-size:11px;color:#999;font-weight:500;letter-spacing:.3px}
.shelf-arrow{font-size:8px;color:#ccc;transition:transform .25s;display:inline-block;width:8px}
.shelf-header.collapsed .shelf-arrow{transform:rotate(-90deg)}
.shelf-items{display:grid;grid-template-rows:1fr;overflow:hidden;transition:grid-template-rows .3s ease,opacity .25s ease;opacity:1}
.shelf-items>div{min-height:0}
.shelf-items.collapsed{grid-template-rows:0fr;opacity:0;pointer-events:none}
.project-list{padding:8px 0}
.project-row{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background .15s;position:relative;text-decoration:none;color:inherit}
.project-row:active{background:#FFFDF7}
.project-icon-wrap{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FFF8E6;flex-shrink:0}
.project-icon-wrap .emoji-fb{font-size:22px}
.project-row-body{flex:1;min-width:0}
.project-row-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.project-row-name{font-size:14px;font-weight:500;color:#333}
.project-row-meta{font-size:11px;color:#bbb;display:flex;align-items:center;gap:8px}
.project-row-progress{flex:1;max-width:120px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.project-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width .3s}
.project-row-pct{font-size:10px;color:#ccc;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.world-empty{margin:8px 16px 0;padding:14px 16px;background:#fff;border:1px dashed #e5e0d5;border-radius:10px;color:#bbb;font-size:11px;line-height:1.65}
.world-empty strong{display:block;color:#888;font-size:12px;font-weight:500;margin-bottom:2px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:8px 16px;border-radius:8px;display:none;z-index:300;white-space:nowrap}
</style>

<script>
'use strict';
if(window.__LIMINAL_REDIRECTING)throw new Error('Redirecting to cloud login');
const WORLD_ID=window.WorldContext?WorldContext.getActiveWorldId():'liminal';
const LOG_KEY='meal_log_db';
const COMPANION_KEY='meal_companion_db';
const FOOD_SLOTS=['morning','day','evening','night'];
const FOOD_SLOT_LABELS={morning:'朝',day:'昼',evening:'夕',night:'夜'};
const WORLDS={
  liminal:{label:'Liminal Space',characters:{
    neal:{name:'Neal',color:'#6B8AFF',initial:'N',pools:{morning:['Espresso & Croissant','Yogurt & Granola','Toast with Jam'],day:['Pasta al Pomodoro','Risotto','Panini','Caprese Salad','Minestrone'],evening:['Grilled Salmon','Steak & Wine','Seafood Pasta','Bruschetta'],night:['Cheese & Wine','Chamomile Tea','Dark Chocolate']},chance:{morning:.7,day:.8,evening:.75,night:.4}},
    jane:{name:'Jane',color:'#5BA66B',initial:'J',pools:{morning:['Coffee','Granola Bar'],day:['Sandwich','Salad','Onigiri'],evening:['Soup','Rice & Fish','Stir-fry'],night:['Tea']},chance:{morning:.3,day:.5,evening:.4,night:.15}},
    will:{name:'Will',color:'#D85A30',initial:'W',pools:{morning:['鬆餅','肉包','飯糰','吐司'],day:['拉麵','牛丼','炸雞便當','咖哩飯','漢堡','烏龍麵'],evening:['燒肉','壽司','串燒','火鍋','拉麵','天婦羅'],night:['泡麵','零食','冰淇淋','珍珠奶茶']},chance:{morning:.8,day:.95,evening:.9,night:.6}}
  },places:[
    {char:'will',name:'松屋',genre:'牛丼',msg:'欸欸，松屋的牛丼最近有新品耶，要不要一起去吃？'},{char:'will',name:'丸亀製麺',genre:'うどん',msg:'突然好想吃烏龍麵喔！丸龜的明太釜玉超好吃的，走吧走吧！'},{char:'will',name:'スシロー',genre:'寿司',msg:'我好想吃迴轉壽司喔～壽司郎走起！'},{char:'will',name:'マクドナルド',genre:'バーガー',msg:'麥當勞出新的了耶！要不要去吃看看？'},{char:'will',name:'天下一品',genre:'ラーメン',msg:'天下一品的濃厚拉麵，今天超適合吃的啦！'},{char:'will',name:'CoCo壱番屋',genre:'カレー',msg:'CoCo壹番屋的咖哩飯！我要十辛！...開玩笑的，五辛就好。'},{char:'will',name:'ウェンディーズ',genre:'バーガー',msg:'溫蒂漢堡耶，他們的薯條真的很好吃，去吃吧？'},
    {char:'neal',name:'Capricciosa',genre:'Italian',msg:'Capricciosa has a decent lunch set. Shall we go?'},{char:'neal',name:'PAUL',genre:'Bakery',msg:'I could go for something from PAUL. Their croissants are quite good.'},{char:'neal',name:'Afternoon Tea',genre:'Café',msg:'Afternoon Tea has a new seasonal menu. Worth a visit, I think.'},{char:'neal',name:'鳥貴族',genre:'焼鳥',msg:'I know it\'s a chain, but Torikizoku is reliable. Drinks on me.'},{char:'neal',name:'Starbucks Reserve',genre:'Coffee',msg:'The Reserve store has single-origin beans I\'ve been meaning to try.'},
    {char:'jane',name:'Subway',genre:'Sandwich',msg:'Subway. Quick, balanced, no hassle. Coming?'},{char:'jane',name:'なか卯',genre:'丼',msg:'Nakau works. Fast and cheap.'},{char:'jane',name:'セブンイレブン',genre:'コンビニ',msg:'...I was just going to grab something from 7-Eleven. You can come if you want.'},{char:'jane',name:'ドトール',genre:'Coffee',msg:'Doutor has decent coffee for the price. Let\'s take a break.'},{char:'jane',name:'大阪王将',genre:'中華',msg:'Osaka Ohsho. Gyoza and fried rice. Simple.'}
  ],inviteChance:{will:.35,neal:.25,jane:.15}},
  cbi:{label:'CBI · Sacramento',characters:{},places:[],inviteChance:{}}
};
const CFG=WORLDS[WORLD_ID]||WORLDS.liminal;
let calSelectedDate=null;
function readJson(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value&&typeof value==='object'?value:fallback;}catch(error){return fallback;}}
function writeJson(key,value){localStorage.setItem(key,JSON.stringify(value));}
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function getSlot(hour){if(hour>=6&&hour<11)return'morning';if(hour>=11&&hour<17)return'day';if(hour>=17&&hour<22)return'evening';return'night';}
function dateKey(value){const date=new Date(value);return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function seedRand(seed){let h=0;for(let i=0;i<seed.length;i++){h=((h<<5)-h)+seed.charCodeAt(i);h|=0;}return()=>{h^=h<<13;h^=h>>17;h^=h<<5;return(h>>>0)/4294967296;};}
function getMealLog(){const data=readJson(LOG_KEY,{version:1,days:{},legacyMigrated:false});data.days=data.days||{};if(!data.legacyMigrated){migrateLegacyMeals(data);data.legacyMigrated=true;writeJson(LOG_KEY,data);}return data;}
function migrateLegacyMeals(target){const legacy=readJson('kitchen_food_cal',null);if(!legacy)return;Object.keys(legacy).filter(day=>/^\d{4}-\d{2}-\d{2}$/.test(day)).forEach(day=>{FOOD_SLOTS.forEach(slot=>{const mine=legacy[day]&&legacy[day][slot]&&legacy[day][slot].me;if(!mine)return;const values=Array.isArray(mine)?mine:[mine];target.days[day]=target.days[day]||{};target.days[day][slot]=target.days[day][slot]||[];values.forEach(text=>target.days[day][slot].push({id:gid('meal'),text:String(text),createdAt:Date.now()}));});});}
function getCompanionStore(){const store=readJson(COMPANION_KEY,{version:1,worlds:{},legacyMigrated:false});store.worlds=store.worlds||{};['liminal','cbi'].forEach(worldId=>{store.worlds[worldId]=store.worlds[worldId]||{days:{},currentInvite:null,dismissedPeriod:null,appointments:[]};const data=store.worlds[worldId];data.days=data.days||{};data.appointments=data.appointments||[];});if(!store.legacyMigrated){migrateLegacyCompanion(store.worlds.liminal);store.legacyMigrated=true;writeJson(COMPANION_KEY,store);}return store;}
function migrateLegacyCompanion(target){const foods=readJson('kitchen_food_cal',null);if(foods)Object.keys(foods).filter(day=>/^\d{4}-\d{2}-\d{2}$/.test(day)).forEach(day=>{FOOD_SLOTS.forEach(slot=>{const source=foods[day]&&foods[day][slot];if(!source)return;Object.keys(source).filter(charId=>charId!=='me').forEach(charId=>{target.days[day]=target.days[day]||{};target.days[day][slot]=target.days[day][slot]||{};target.days[day][slot][charId]=Array.isArray(source[charId])?source[charId]:[source[charId]];});});});const dining=readJson('kitchen_dining',null);if(dining){target.currentInvite=dining.current||null;target.dismissedPeriod=dining.dismissed||null;target.appointments=(dining.appointments||[]).slice();}}
function getWorldCompanion(){const store=getCompanionStore();return{store,data:store.worlds[WORLD_ID]};}
function saveWorldCompanion(holder){writeJson(COMPANION_KEY,holder.store);}
function generateFoodForDay(day){const holder=getWorldCompanion(),data=holder.data;data.days[day]=data.days[day]||{};const now=new Date(),today=dateKey(now),currentSlot=getSlot(now.getHours());FOOD_SLOTS.forEach(slot=>{if(data.days[day][slot])return;if(day===today&&FOOD_SLOTS.indexOf(slot)>FOOD_SLOTS.indexOf(currentSlot))return;if(day>today)return;data.days[day][slot]={};Object.keys(CFG.characters).forEach(charId=>{const meta=CFG.characters[charId],rng=seedRand(WORLD_ID+':'+day+':'+slot+':'+charId);if(rng()>=meta.chance[slot])return;const pool=meta.pools[slot].slice(),picks=[];if(pool.length)picks.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);if(pool.length&&rng()<meta.chance[slot]*.55)picks.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);if(pool.length&&rng()<meta.chance[slot]*.2)picks.push(pool[Math.floor(rng()*pool.length)]);data.days[day][slot][charId]=picks;});});saveWorldCompanion(holder);return data.days[day];}
function renderMiniCal(){const element=document.getElementById('miniCalArea'),now=new Date(),today=dateKey(now);if(!calSelectedDate)calSelectedDate=today;const days=[];for(let i=6;i>=0;i--){const day=new Date(now);day.setDate(day.getDate()-i);days.push(day);}const weekdays=['日','月','火','水','木','金','土'],log=getMealLog();days.forEach(day=>generateFoodForDay(dateKey(day)));const holder=getWorldCompanion();let html='<div class="mini-cal"><div class="mini-cal-row">';days.forEach(day=>{const key=dateKey(day),worldDay=holder.data.days[key]||{},seen=new Set();FOOD_SLOTS.forEach(slot=>Object.keys(worldDay[slot]||{}).forEach(charId=>seen.add(charId)));(holder.data.appointments||[]).filter(item=>item.date===key).forEach(item=>seen.add(item.char));let dots='';Object.keys(CFG.characters).forEach(charId=>{if(seen.has(charId))dots+='<span style="background:'+CFG.characters[charId].color+'"></span>';});const hasMine=Object.values(log.days[key]||{}).some(list=>Array.isArray(list)&&list.length);if(hasMine||(holder.data.appointments||[]).some(item=>item.date===key))dots+='<span style="background:#E8B96A"></span>';html+='<div class="mini-cal-day'+(key===today?' today':'')+(key===calSelectedDate?' selected':'')+'" onclick="selectCalDay(\''+key+'\')"><div class="mini-cal-dow">'+weekdays[day.getDay()]+'</div><div class="mini-cal-date">'+day.getDate()+'</div><div class="mini-cal-dots">'+dots+'</div></div>';});html+='</div>'+renderCalDetail(calSelectedDate,log,holder.data)+'</div>';element.innerHTML=html;}
function renderCalDetail(day,log,world){const worldDay=world.days[day]||{},myDay=log.days[day]||{},appointments=(world.appointments||[]).filter(item=>item.date===day);const today=dateKey(new Date()),currentSlot=getSlot(new Date().getHours());let html='<div class="mini-cal-detail show"><div class="cal-date-label">'+esc(day)+'</div>',hasContent=false;FOOD_SLOTS.forEach(slot=>{const worldFoods=worldDay[slot]||{},mine=myDay[slot]||[];const canEdit=day<today||(day===today&&FOOD_SLOTS.indexOf(slot)<=FOOD_SLOTS.indexOf(currentSlot));if(!Object.keys(worldFoods).length&&!mine.length&&!canEdit)return;hasContent=true;html+='<div class="cal-food-row"><div class="cal-food-period">'+FOOD_SLOT_LABELS[slot]+'</div><div class="cal-food-items">';Object.keys(CFG.characters).forEach(charId=>{const meta=CFG.characters[charId];(worldFoods[charId]||[]).forEach(food=>{html+='<span class="cal-food-chip" style="background:'+meta.color+'12;color:'+meta.color+'">'+esc(food)+'</span>';});});mine.forEach(item=>{html+='<span class="cal-food-chip" style="background:#E8B96A15;color:#B9872F;cursor:pointer;-webkit-user-select:none;user-select:none" title="长按删除" oncontextmenu="event.preventDefault();removeMyFood(\''+day+'\',\''+slot+'\',\''+item.id+'\')" ontouchstart="this._lp=setTimeout(()=>removeMyFood(\''+day+'\',\''+slot+'\',\''+item.id+'\'),600)" ontouchend="clearTimeout(this._lp)" ontouchmove="clearTimeout(this._lp)">'+esc(item.text)+'</span>';});if(canEdit)html+='<input class="cal-my-input" placeholder="+" onkeydown="if(event.key===\'Enter\'){saveMyFood(\''+day+'\',\''+slot+'\',this.value);this.value=\'\';}">';html+='</div></div>';});appointments.forEach(item=>{const meta=CFG.characters[item.char];if(!meta)return;hasContent=true;html+='<div class="cal-food-row"><div class="cal-food-period">約</div><div class="cal-food-items"><span class="cal-appt-chip">🍽 '+esc(meta.name)+' · '+esc(item.place)+'</span></div></div>';});if(!hasContent)html+='<div style="font-size:11px;color:#ccc;text-align:center;padding:6px">暂无记录</div>';return html+'</div>';}
function selectCalDay(day){calSelectedDate=day;renderMiniCal();}
function saveMyFood(day,slot,value){const text=String(value||'').trim();if(!text)return;const log=getMealLog();log.days[day]=log.days[day]||{};log.days[day][slot]=log.days[day][slot]||[];log.days[day][slot].push({id:gid('meal'),text,createdAt:Date.now()});writeJson(LOG_KEY,log);renderMiniCal();}
function removeMyFood(day,slot,itemId){const log=getMealLog(),items=log.days[day]&&log.days[day][slot];if(!items)return;log.days[day][slot]=items.filter(item=>item.id!==itemId);writeJson(LOG_KEY,log);renderMiniCal();}
function currentPeriodKey(){const now=new Date();return dateKey(now)+':'+getSlot(now.getHours());}
function checkDiningInvite(){if(!CFG.places.length)return null;const holder=getWorldCompanion(),data=holder.data,period=currentPeriodKey();if(data.currentInvite&&data.currentInvite.period===period)return data.currentInvite;if(data.dismissedPeriod===period)return null;const rng=seedRand('dining:'+WORLD_ID+':'+period),candidates=[];Object.keys(CFG.characters).forEach(charId=>{if(rng()>=(CFG.inviteChance[charId]||0))return;const places=CFG.places.filter(place=>place.char===charId);if(places.length)candidates.push(places[Math.floor(rng()*places.length)]);});if(!candidates.length){data.dismissedPeriod=period;saveWorldCompanion(holder);return null;}const pick=candidates[0];data.currentInvite={char:pick.char,place:pick.name,genre:pick.genre,msg:pick.msg,period};saveWorldCompanion(holder);return data.currentInvite;}
function renderDiningInvite(){const element=document.getElementById('diningInviteArea'),invite=checkDiningInvite();if(!invite){element.innerHTML='';return;}const meta=CFG.characters[invite.char];element.innerHTML='<div class="dining-invite"><button class="dining-invite-dismiss" onclick="dismissDining()">×</button><div class="dining-invite-char"><div class="dining-invite-avatar" style="background:'+meta.color+'">'+meta.initial+'</div><div class="dining-invite-name" style="color:'+meta.color+'">'+meta.name+'</div></div><div class="dining-invite-msg">「'+esc(invite.msg)+'」</div><div class="dining-invite-place">📍 '+esc(invite.place)+' <span style="font-size:10px;color:#bbb">'+esc(invite.genre)+'</span></div><div class="dining-invite-actions"><button onclick="dismissDining()">下次吧</button><button class="accept" onclick="acceptDining()">好呀！</button></div></div>';}
function dismissDining(){const holder=getWorldCompanion(),data=holder.data;if(data.currentInvite)data.dismissedPeriod=data.currentInvite.period;data.currentInvite=null;saveWorldCompanion(holder);renderDiningInvite();}
function acceptDining(){const holder=getWorldCompanion(),invite=holder.data.currentInvite;if(!invite)return;const meta=CFG.characters[invite.char],element=document.getElementById('diningInviteArea');element.innerHTML='<div class="dining-invite"><div class="dining-invite-char"><div class="dining-invite-avatar" style="background:'+meta.color+'">'+meta.initial+'</div><div class="dining-invite-name" style="color:'+meta.color+'">'+meta.name+'</div></div><div style="font-size:12px;color:#555;margin:8px 0">选择日期：</div><input class="dining-date-input" type="date" id="diningDatePick" value="'+dateKey(new Date())+'"><div class="dining-invite-actions"><button onclick="dismissDining()">取消</button><button class="accept" onclick="confirmDiningDate()">确定</button></div></div>';}
function confirmDiningDate(){const holder=getWorldCompanion(),data=holder.data,invite=data.currentInvite;if(!invite)return;const picked=document.getElementById('diningDatePick').value;if(!picked)return;data.appointments.push({id:gid('appt'),char:invite.char,place:invite.place,genre:invite.genre,date:picked,createdAt:Date.now()});data.dismissedPeriod=invite.period;data.currentInvite=null;saveWorldCompanion(holder);calSelectedDate=picked;renderDiningInvite();renderMiniCal();showToast('已约定 '+picked+' 和 '+CFG.characters[invite.char].name+' 去 '+invite.place);}
function toggleRecipeShelf(){document.getElementById('recipeShelfHeader').classList.toggle('collapsed');document.getElementById('recipeShelfItems').classList.toggle('collapsed');}
function renderRecipeShelf(){let name='沙拉盲盒',meta='',done=0,total=18;if(WORLD_ID==='liminal'){const state=readJson('recipe_salad_db',{items:{}});done=Object.values(state.items||{}).filter(item=>item.status==='collected').length;meta=done+' / '+total+' 已收录';}else{name='CBI 菜谱项目';meta='尚未建立 · 与夹缝空间分开保存';total=0;}const percent=total?Math.round(done/total*100):0;document.getElementById('recipeShelf').innerHTML='<div class="shelf-header" id="recipeShelfHeader" onclick="toggleRecipeShelf()"><div class="shelf-line"></div><span class="shelf-label">盲袋菜谱</span><span class="shelf-arrow">▼</span><div class="shelf-line"></div></div><div class="shelf-items" id="recipeShelfItems"><div><div class="project-list"><a class="project-row" href="recipe.html"><div class="project-icon-wrap"><span class="emoji-fb">🥗</span></div><div class="project-row-body"><div class="project-row-top"><span class="project-row-name">'+esc(name)+'</span></div><div class="project-row-meta"><div class="project-row-progress"><div class="project-row-fill" style="width:'+percent+'%"></div></div><span class="project-row-pct">'+percent+'%</span><span>'+esc(meta)+'</span></div></div></a></div></div></div>';}
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.style.display='block';clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.style.display='none',1800);}
document.getElementById('worldLabel').textContent=CFG.label;
document.getElementById('worldEmptyArea').innerHTML=Object.keys(CFG.characters).length?'':'<div class="world-empty"><strong>CBI 饮食陪伴尚未建立</strong>你的餐食记录仍然延续；这里以后只显示CBI角色的饮食、邀请与约饭。</div>';
renderMiniCal();renderDiningInvite();renderRecipeShelf();
</script>
</body>
</html>
