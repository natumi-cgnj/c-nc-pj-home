<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:#fafafa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;padding-bottom:60px}
.top-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid #eee;background:rgba(255,255,255,.96)}
.top-bar h1{font-size:13px;font-weight:600;letter-spacing:2.2px;color:#8b6914}.back{border:0;background:none;color:#999;text-decoration:none;font:13px inherit}.world-tag{font-size:9px;color:#aaa;letter-spacing:.8px;text-transform:uppercase}
.shell{width:min(620px,100%);margin:0 auto}.intro{padding:18px 20px 10px}.intro h2{font-size:18px;font-weight:500;color:#555}.intro p{margin-top:5px;font-size:11px;line-height:1.7;color:#aaa}
.mini-cal{margin:6px 14px 12px;border:1px solid #eee;border-radius:14px;background:#fff;overflow:hidden}.cal-days{display:flex;padding:10px 8px 8px;gap:4px;border-bottom:1px solid #f3f3f3}.cal-day{flex:1;min-width:0;padding:6px 2px 8px;border:0;border-radius:9px;background:none;text-align:center;font-family:inherit;cursor:pointer}.cal-day.today{background:#fffaf0}.cal-day.selected{box-shadow:inset 0 0 0 1px #e8b96a;background:#fffdf7}.dow{font-size:8px;color:#bbb}.date{margin:3px 0;font-size:13px;color:#555}.dots{display:flex;justify-content:center;gap:2px;min-height:5px}.dot{width:4px;height:4px;border-radius:50%}
.day-detail{padding:10px 14px 14px}.detail-date{margin-bottom:5px;font-size:10px;color:#bbb}.meal-row{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid #f7f7f7}.meal-row:last-child{border-bottom:0}.slot{padding-top:3px;text-align:right;font-size:9px;color:#bbb}.chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;font-size:10px;line-height:1.35}.chip.user{background:#e8b96a18;color:#aa7928}.chip button{border:0;background:none;color:inherit;opacity:.55;font-size:11px;line-height:1;cursor:pointer}.meal-input{width:86px;min-width:32px;padding:3px 5px;border:0;border-bottom:1px dashed #d9c28b;background:transparent;color:#9a7129;outline:none;font:10px inherit}.empty-layer{margin:6px 14px 12px;padding:18px;border:1px dashed #ddd;border-radius:12px;background:#fff;color:#aaa;text-align:center;font-size:11px;line-height:1.7}.empty-layer strong{display:block;color:#777;font-weight:500;font-size:13px;margin-bottom:4px}
.invite{position:relative;margin:0 14px 12px;padding:14px 16px;border:1px solid #efe6d4;border-radius:13px;background:#fff}.invite-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:600}.invite-name{font-size:11px;font-weight:600}.invite-msg{font-size:12px;line-height:1.6;color:#666;font-style:italic}.invite-place{margin-top:7px;font-size:11px;color:#555}.invite-actions{display:flex;gap:7px;margin-top:11px}.invite-actions button{flex:1;padding:8px;border:1px solid #e8e8e8;border-radius:8px;background:#fff;color:#999;font:11px inherit;cursor:pointer}.invite-actions .yes{border-color:#e8b96a;background:#e8b96a;color:#fff}.invite-close{position:absolute;right:9px;top:7px;border:0;background:none;color:#ccc;font-size:15px;cursor:pointer}
.section-title{display:flex;align-items:center;gap:10px;padding:9px 20px;color:#aaa;font-size:10px;letter-spacing:.6px}.section-title::before,.section-title::after{content:"";height:1px;flex:1;background:#e7e7e7}.recipe-card{display:flex;align-items:center;gap:13px;margin:0 14px;padding:14px 16px;border:1px solid #eee;border-radius:13px;background:#fff;color:inherit;text-decoration:none}.recipe-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#fff6df;font-size:20px}.recipe-body{flex:1}.recipe-name{font-size:13px;color:#555}.recipe-meta{margin-top:4px;font-size:10px;color:#bbb}.recipe-bar{height:3px;margin-top:7px;border-radius:2px;background:#f1f1f1;overflow:hidden}.recipe-fill{height:100%;background:#e8b96a}.recipe-arrow{font-size:16px;color:#ccc}.toast{position:fixed;left:50%;bottom:36px;z-index:50;display:none;transform:translateX(-50%);padding:8px 15px;border-radius:9px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;white-space:nowrap}.toast.show{display:block}
@media(min-width:760px){.shell{padding-top:14px}.mini-cal,.invite,.empty-layer,.recipe-card{margin-left:0;margin-right:0}}
</style>
</head>
<body>
<div class="top-bar"><a class="back" href="index.html?p=2">← Home</a><h1>MEALS</h1><span class="world-tag" id="worldTag"></span></div>
<main class="shell">
  <section class="intro"><h2 id="pageTitle">每日饮食</h2><p>你的餐食记录会在所有世界延续；角色的饮食、邀请与菜谱只属于当前世界。</p></section>
  <section id="calendar"></section>
  <section id="inviteArea"></section>
  <section id="worldEmpty"></section>
  <div class="section-title">Recipe Project</div>
  <a class="recipe-card" href="recipe.html"><div class="recipe-icon">🥗</div><div class="recipe-body"><div class="recipe-name" id="recipeName"></div><div class="recipe-meta" id="recipeMeta"></div><div class="recipe-bar"><div class="recipe-fill" id="recipeFill"></div></div></div><div class="recipe-arrow">›</div></a>
</main>
<div class="toast" id="toast"></div>
<script src="world-context.js?v=20260822-world2"></script>
<script src="cloud-sync.js?v=20260822-meals1"></script>
<script>
'use strict';
if(window.__LIMINAL_REDIRECTING)throw new Error('Redirecting to cloud login');
const WORLD_ID=window.WorldContext?WorldContext.getActiveWorldId():'liminal';
const LOG_KEY='meal_log_db';
const COMPANION_KEY='meal_companion_db';
const SLOTS=['morning','day','evening','night'];
const SLOT_LABEL={morning:'朝',day:'昼',evening:'夕',night:'夜'};
const WORLDS={
  liminal:{label:'Liminal Space',title:'夹缝空间 · 每日饮食',characters:{
    neal:{name:'Neal',color:'#6B8AFF',initial:'N',pools:{morning:['Espresso & Croissant','Yogurt & Granola','Toast with Jam'],day:['Pasta al Pomodoro','Risotto','Panini','Caprese Salad','Minestrone'],evening:['Grilled Salmon','Steak & Wine','Seafood Pasta','Bruschetta'],night:['Cheese & Wine','Chamomile Tea','Dark Chocolate']},chance:{morning:.7,day:.8,evening:.75,night:.4}},
    jane:{name:'Jane',color:'#5BA66B',initial:'J',pools:{morning:['Coffee','Granola Bar'],day:['Sandwich','Salad','Onigiri'],evening:['Soup','Rice & Fish','Stir-fry'],night:['Tea']},chance:{morning:.3,day:.5,evening:.4,night:.15}},
    will:{name:'Will',color:'#D85A30',initial:'W',pools:{morning:['鬆餅','肉包','飯糰','吐司'],day:['拉麵','牛丼','炸雞便當','咖哩飯','漢堡','烏龍麵'],evening:['燒肉','壽司','串燒','火鍋','拉麵','天婦羅'],night:['泡麵','零食','冰淇淋','珍珠奶茶']},chance:{morning:.8,day:.95,evening:.9,night:.6}}
  },places:[
    {char:'will',name:'松屋',genre:'牛丼',msg:'欸欸，松屋的牛丼最近有新品耶，要不要一起去吃？'},{char:'will',name:'丸亀製麺',genre:'うどん',msg:'突然好想吃烏龍麵喔！丸龜走吧走吧！'},{char:'will',name:'スシロー',genre:'寿司',msg:'我好想吃迴轉壽司喔～壽司郎走起！'},{char:'neal',name:'Capricciosa',genre:'Italian',msg:'Capricciosa has a decent lunch set. Shall we go?'},{char:'neal',name:'Afternoon Tea',genre:'Café',msg:'Afternoon Tea has a new seasonal menu. Worth a visit, I think.'},{char:'jane',name:'Subway',genre:'Sandwich',msg:'Subway. Quick, balanced, no hassle. Coming?'},{char:'jane',name:'なか卯',genre:'丼',msg:'Nakau works. Fast and cheap.'},{char:'jane',name:'ドトール',genre:'Coffee',msg:'Doutor has decent coffee for the price. Let’s take a break.'}
  ],inviteChance:{will:.35,neal:.25,jane:.15}},
  cbi:{label:'CBI · Sacramento',title:'CBI · 每日饮食',characters:{},places:[],inviteChance:{}}
};
const CFG=WORLDS[WORLD_ID]||WORLDS.liminal;
function read(k,fallback){try{const value=JSON.parse(localStorage.getItem(k));return value&&typeof value==='object'?value:fallback;}catch(e){return fallback;}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v));}
function dateKey(value){const d=new Date(value);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function slotForHour(h){if(h>=6&&h<11)return'morning';if(h>=11&&h<17)return'day';if(h>=17&&h<22)return'evening';return'night';}
function seeded(seed){let h=0;for(let i=0;i<seed.length;i++){h=((h<<5)-h)+seed.charCodeAt(i);h|=0;}return()=>{h^=h<<13;h^=h>>17;h^=h<<5;return(h>>>0)/4294967296;};}
function esc(value){const d=document.createElement('div');d.textContent=String(value||'');return d.innerHTML;}
function id(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function ensureLog(){const data=read(LOG_KEY,{version:1,days:{},legacyMigrated:false});if(!data.days)data.days={};if(!data.legacyMigrated){migrateLegacyMeals(data);data.legacyMigrated=true;write(LOG_KEY,data);}return data;}
function migrateLegacyMeals(target){const legacy=read('kitchen_food_cal',null);if(!legacy)return;Object.keys(legacy).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(day=>{SLOTS.forEach(slot=>{const me=legacy[day]&&legacy[day][slot]&&legacy[day][slot].me;if(!me)return;const values=Array.isArray(me)?me:[me];target.days[day]=target.days[day]||{};target.days[day][slot]=target.days[day][slot]||[];values.forEach(text=>target.days[day][slot].push({id:id('meal'),text:String(text),createdAt:Date.now()}));});});}
function ensureCompanion(){const data=read(COMPANION_KEY,{version:1,worlds:{},legacyMigrated:false});data.worlds=data.worlds||{};['liminal','cbi'].forEach(w=>{data.worlds[w]=data.worlds[w]||{days:{},currentInvite:null,dismissedPeriod:null,appointments:[]};data.worlds[w].days=data.worlds[w].days||{};data.worlds[w].appointments=data.worlds[w].appointments||[];});if(!data.legacyMigrated){migrateLegacyCompanion(data.worlds.liminal);data.legacyMigrated=true;write(COMPANION_KEY,data);}return data;}
function migrateLegacyCompanion(target){const foods=read('kitchen_food_cal',null);if(foods){Object.keys(foods).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).forEach(day=>{SLOTS.forEach(slot=>{const src=foods[day]&&foods[day][slot];if(!src)return;Object.keys(src).filter(k=>k!=='me').forEach(ch=>{target.days[day]=target.days[day]||{};target.days[day][slot]=target.days[day][slot]||{};target.days[day][slot][ch]=Array.isArray(src[ch])?src[ch]:[src[ch]];});});});}const dining=read('kitchen_dining',null);if(dining){target.currentInvite=dining.current||null;target.dismissedPeriod=dining.dismissed||null;target.appointments=(dining.appointments||[]).slice();}}
function worldData(){const all=ensureCompanion();return{all,data:all.worlds[WORLD_ID]};}
function generateDay(day){const holder=worldData(),data=holder.data;data.days[day]=data.days[day]||{};const today=dateKey(new Date()),current=slotForHour(new Date().getHours());SLOTS.forEach(slot=>{if(data.days[day][slot])return;if(day>today||(day===today&&SLOTS.indexOf(slot)>SLOTS.indexOf(current)))return;data.days[day][slot]={};Object.keys(CFG.characters).forEach(ch=>{const meta=CFG.characters[ch],rng=seeded(WORLD_ID+':'+day+':'+slot+':'+ch);if(rng()>=meta.chance[slot])return;const pool=meta.pools[slot].slice(),items=[];if(pool.length)items.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);if(pool.length&&rng()<meta.chance[slot]*.55)items.push(pool.splice(Math.floor(rng()*pool.length),1)[0]);data.days[day][slot][ch]=items;});});write(COMPANION_KEY,holder.all);return data.days[day];}
let selected=dateKey(new Date());
function renderCalendar(){const now=new Date(),days=[];for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push(d);}const log=ensureLog(),holder=worldData();days.forEach(d=>generateDay(dateKey(d)));let html='<div class="mini-cal"><div class="cal-days">';const dows=['日','月','火','水','木','金','土'];days.forEach(d=>{const dk=dateKey(d),seen=new Set(),wd=holder.data.days[dk]||{};SLOTS.forEach(slot=>Object.keys(wd[slot]||{}).forEach(ch=>seen.add(ch)));const hasUser=Object.values(log.days[dk]||{}).some(list=>Array.isArray(list)&&list.length);let dots='';Object.keys(CFG.characters).forEach(ch=>{if(seen.has(ch))dots+='<i class="dot" style="background:'+CFG.characters[ch].color+'"></i>';});if(hasUser)dots+='<i class="dot" style="background:#E8B96A"></i>';html+='<button class="cal-day'+(dk===dateKey(now)?' today':'')+(dk===selected?' selected':'')+'" onclick="selectDay(\''+dk+'\')"><div class="dow">'+dows[d.getDay()]+'</div><div class="date">'+d.getDate()+'</div><div class="dots">'+dots+'</div></button>';});html+='</div><div class="day-detail"><div class="detail-date">'+esc(selected)+'</div>'+renderDay(selected,log,holder.data)+'</div></div>';document.getElementById('calendar').innerHTML=html;}
function renderDay(day,log,world){let html='',wd=world.days[day]||{},ud=log.days[day]||{};SLOTS.forEach(slot=>{html+='<div class="meal-row"><div class="slot">'+SLOT_LABEL[slot]+'</div><div class="chips">';Object.keys(CFG.characters).forEach(ch=>{const meta=CFG.characters[ch];(wd[slot]&&wd[slot][ch]||[]).forEach(food=>{html+='<span class="chip" style="background:'+meta.color+'14;color:'+meta.color+'">'+esc(food)+'</span>';});});(ud[slot]||[]).forEach(item=>{html+='<span class="chip user">'+esc(item.text)+'<button onclick="removeMeal(\''+day+'\',\''+slot+'\',\''+item.id+'\')">×</button></span>';});html+='<input class="meal-input" placeholder="＋记录" onkeydown="if(event.key===\'Enter\'){addMeal(\''+day+'\',\''+slot+'\',this.value);this.value=\'\';}"></div></div>';});(world.appointments||[]).filter(a=>a.date===day).forEach(a=>{const meta=CFG.characters[a.char];if(meta)html+='<div class="meal-row"><div class="slot">约</div><div class="chips"><span class="chip" style="background:'+meta.color+'14;color:'+meta.color+'">'+esc(meta.name)+' · '+esc(a.place)+'</span></div></div>';});return html;}
function selectDay(day){selected=day;renderCalendar();}
function addMeal(day,slot,text){const value=String(text||'').trim();if(!value)return;const data=ensureLog();data.days[day]=data.days[day]||{};data.days[day][slot]=data.days[day][slot]||[];data.days[day][slot].push({id:id('meal'),text:value,createdAt:Date.now()});write(LOG_KEY,data);renderCalendar();}
function removeMeal(day,slot,itemId){const data=ensureLog(),list=data.days[day]&&data.days[day][slot];if(!list)return;data.days[day][slot]=list.filter(x=>x.id!==itemId);write(LOG_KEY,data);renderCalendar();}
function currentPeriod(){const now=new Date();return dateKey(now)+':'+slotForHour(now.getHours());}
function getInvite(){if(!CFG.places.length)return null;const holder=worldData(),data=holder.data,period=currentPeriod();if(data.currentInvite&&data.currentInvite.period===period)return data.currentInvite;if(data.dismissedPeriod===period)return null;const rng=seeded('invite:'+WORLD_ID+':'+period),candidates=[];Object.keys(CFG.characters).forEach(ch=>{if(rng()<(CFG.inviteChance[ch]||0)){const places=CFG.places.filter(p=>p.char===ch);if(places.length)candidates.push(places[Math.floor(rng()*places.length)]);}});if(!candidates.length){data.dismissedPeriod=period;write(COMPANION_KEY,holder.all);return null;}const pick=candidates[0];data.currentInvite={char:pick.char,place:pick.name,genre:pick.genre,msg:pick.msg,period};write(COMPANION_KEY,holder.all);return data.currentInvite;}
function renderInvite(){const el=document.getElementById('inviteArea'),invite=getInvite();if(!invite){el.innerHTML='';return;}const meta=CFG.characters[invite.char];el.innerHTML='<div class="invite"><button class="invite-close" onclick="dismissInvite()">×</button><div class="invite-head"><div class="avatar" style="background:'+meta.color+'">'+meta.initial+'</div><div class="invite-name" style="color:'+meta.color+'">'+meta.name+'</div></div><div class="invite-msg">「'+esc(invite.msg)+'」</div><div class="invite-place">📍 '+esc(invite.place)+' · '+esc(invite.genre)+'</div><div class="invite-actions"><button onclick="dismissInvite()">下次吧</button><button class="yes" onclick="chooseInviteDate()">好呀</button></div></div>';}
function dismissInvite(){const holder=worldData(),data=holder.data;if(data.currentInvite)data.dismissedPeriod=data.currentInvite.period;data.currentInvite=null;write(COMPANION_KEY,holder.all);renderInvite();}
function chooseInviteDate(){const invite=getInvite();if(!invite)return;const value=prompt('约在哪一天？',dateKey(new Date()));if(!value)return;const holder=worldData(),data=holder.data;data.appointments.push({id:id('appt'),char:invite.char,place:invite.place,genre:invite.genre,date:value,createdAt:Date.now()});data.dismissedPeriod=invite.period;data.currentInvite=null;write(COMPANION_KEY,holder.all);selected=value;renderInvite();renderCalendar();toast('已记下约饭日期');}
function renderRecipe(){let done=0,total=0,name='CBI 菜谱项目',meta='尚未建立 · 与夹缝空间分开保存';if(WORLD_ID==='liminal'){name='沙拉盲盒';total=18;const state=read('recipe_salad_db',{items:{}});done=Object.values(state.items||{}).filter(x=>x.status==='collected').length;meta=done+' / '+total+' 已收录';}document.getElementById('recipeName').textContent=name;document.getElementById('recipeMeta').textContent=meta;document.getElementById('recipeFill').style.width=(total?Math.round(done/total*100):0)+'%';}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800);}
document.body.dataset.worldId=WORLD_ID;document.getElementById('worldTag').textContent=CFG.label;document.getElementById('pageTitle').textContent=CFG.title;document.getElementById('worldEmpty').innerHTML=Object.keys(CFG.characters).length?'':'<div class="empty-layer"><strong>CBI 饮食陪伴尚未建立</strong>你的真实餐食仍可正常记录；角色吃了什么、约饭与台词会在建立 CBI 内容包后只显示在这个世界。</div>';
renderCalendar();renderInvite();renderRecipe();
</script>
</body>
