<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DIET">
<title>DIET</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
html{scrollbar-gutter:stable}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#8B6914}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.world-label{min-width:72px;text-align:right;font-size:9px;color:#bbb;letter-spacing:.5px}
.view{display:none}
.view.active{display:block}
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.94);border-top:1px solid rgba(0,0,0,.06);z-index:80;padding:0 12px env(safe-area-inset-bottom,0);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.tab-bar button{position:relative;flex:1;padding:15px 0 13px;background:none;border:0;font-family:inherit;font-size:10px;line-height:1;letter-spacing:.25px;color:#bbb;cursor:pointer}
.tab-bar button.active{color:#8B6914}
.tab-bar button.active::before{content:"";position:absolute;left:36%;right:36%;top:0;height:1px;background:#C69A42}
.calorie-summary{padding:24px 20px 20px;background:#fff;border-bottom:1px solid #eee;text-align:center}
.calorie-summary-label{font-size:10px;color:#bbb;letter-spacing:.8px;margin-bottom:5px}
.calorie-net{font-size:34px;line-height:1.15;font-weight:250;color:#333;font-variant-numeric:tabular-nums}
.calorie-net small{font-size:11px;font-weight:400;color:#bbb;margin-left:4px}
.calorie-flow{display:flex;justify-content:center;gap:22px;margin-top:8px;font-size:11px;color:#999;font-variant-numeric:tabular-nums}
.calorie-flow b{font-weight:500;color:#555}
.calorie-add{display:block;width:calc(100% - 40px);max-width:520px;margin:14px auto;padding:11px;border:1px dashed #d9d4ca;border-radius:9px;background:#fff;color:#9B7D41;font:500 12px/1 inherit;cursor:pointer}
.calorie-fold{background:#fafafa;border:0;border-top:1px solid #eeeeec;border-bottom:1px solid #eeeeec}
.calorie-fold summary{list-style:none;padding:11px 20px;font-size:10px;color:#999;letter-spacing:.45px;cursor:pointer}
.calorie-fold summary::-webkit-details-marker{display:none}
.calorie-count{color:#ccc;font-variant-numeric:tabular-nums}
.calorie-row{display:flex;align-items:center;gap:8px;padding:10px 20px;background:#fff;border-top:1px solid #f1f1ef;font-size:12px}
.calorie-date{font-size:9px;color:#bbb;flex-shrink:0;font-variant-numeric:tabular-nums}
.calorie-kind{font-size:9px;padding:2px 5px;border-radius:4px;flex-shrink:0}
.calorie-kind.intake{background:#E8B96A18;color:#A77A23}
.calorie-kind.burn{background:#6B8FAF16;color:#66839D}
.calorie-detail{flex:1;min-width:0;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calorie-amount{font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.calorie-amount.intake{color:#A77A23}
.calorie-amount.burn{color:#66839D}
.calorie-delete{border:0;background:none;color:#d5d5d5;font-size:14px;padding:3px;cursor:pointer}
.calorie-empty{padding:28px 20px;text-align:center;color:#ccc;font-size:11px;background:#fff}
.nutrition-wrap{padding:10px 14px 18px;max-width:560px;margin:0 auto}
.nutrition-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nutrition-title{font-size:13px;font-weight:600;color:#333;letter-spacing:.2px}
.nutrition-date-nav{display:flex;align-items:center;gap:6px}
.nutrition-date{font-size:10px;color:#888;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.nutrition-nav-btn{width:24px;height:24px;border:1px solid #ece7dd;border-radius:7px;background:#fff;color:#9B7D41;font:13px/1 inherit;cursor:pointer}
.nutrition-nav-btn:disabled{color:#ddd;border-color:#eee;cursor:default}
.nutrition-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.nutrition-summary-item{background:#fff;border:1px solid #eee9df;border-radius:10px;padding:7px 8px;text-align:center}
.nutrition-summary-label{font-size:8px;color:#bbb;letter-spacing:.3px;margin-bottom:2px}
.nutrition-summary-value{font-size:15px;font-weight:500;color:#444;font-variant-numeric:tabular-nums}
.nutrition-summary-value small{font-size:8px;font-weight:400;color:#bbb;margin-left:2px}
.nutrition-card{background:#fff;border:1px solid #eee9df;border-radius:12px;overflow:hidden}
.nutrition-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #f2f0eb}
.nutrition-row:last-child{border-bottom:0}
.nutrition-copy{flex:1;min-width:0}
.nutrition-name{font-size:12px;font-weight:500;color:#333}
.nutrition-source{font-size:8px;color:#aaa;margin-top:2px;line-height:1.25}
.nutrition-state{width:18px;height:18px;flex:0 0 18px;padding:0;border-radius:50%;border:1.4px solid #d8d4ca;background:transparent;color:transparent;font:0/0 inherit;cursor:pointer}
.nutrition-state.s1{background:linear-gradient(90deg,#D9B86F 50%,transparent 50%);border-color:#D9B86F}
.nutrition-state.s2{background:#C69A42;border-color:#C69A42}
.nutrition-legend{display:flex;gap:10px;justify-content:center;margin-top:8px;font-size:8px;color:#bbb}
.nutrition-note{margin-top:7px;font-size:8px;color:#bbb;line-height:1.4;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.modal h2{font-size:15px;font-weight:600;color:#333;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#999;margin:12px 0 4px}
.modal input{width:100%;padding:10px 12px;border:1px solid #e4e4e4;border-radius:8px;background:#fff;color:#333;font:14px/1.2 inherit;outline:none}
.calorie-types{display:flex;gap:8px}
.calorie-types button{flex:1;padding:9px;border:1px solid #e4e4e4;border-radius:8px;background:#fff;color:#999;font:12px/1 inherit;cursor:pointer}
.calorie-types button.active{border-color:#D2B16F;background:#FFF9EC;color:#8B6914}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions button{flex:1;padding:10px;border:0;border-radius:8px;font:12px/1 inherit;cursor:pointer}
.modal-cancel{background:#f5f5f5;color:#999}
.modal-save{background:#C69A42;color:#fff}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:8px 16px;border-radius:8px;display:none;z-index:300;white-space:nowrap}
/* Keep the compact mobile layout; give the nutrition overview room on desktop. */
@media (min-width:900px){
  .nutrition-wrap{max-width:1120px;padding:28px 32px 32px}
  .nutrition-head{margin-bottom:20px;gap:24px}
  .nutrition-title{font-size:20px;letter-spacing:.4px}
  .nutrition-date-nav{gap:10px}
  .nutrition-date{min-width:132px;font-size:12px}
  .nutrition-nav-btn{width:32px;height:32px;border-radius:9px;font-size:18px}
  .nutrition-summary{gap:16px;margin-bottom:20px}
  .nutrition-summary-item{padding:16px 22px;border-radius:14px;text-align:left}
  .nutrition-summary-label{font-size:11px;margin-bottom:6px}
  .nutrition-summary-value{font-size:28px;line-height:1.2}
  .nutrition-summary-value small{font-size:11px;margin-left:6px}
  .nutrition-card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:14px}
  .nutrition-row{min-height:70px;padding:14px 20px;gap:20px}
  .nutrition-row:nth-child(odd){border-right:1px solid #f2f0eb}
  .nutrition-row:nth-last-child(-n+2){border-bottom:0}
  .nutrition-name{font-size:14px}
  .nutrition-source{font-size:11px;line-height:1.5;margin-top:4px}
  .nutrition-state{width:24px;height:24px;flex-basis:24px;border-width:1.5px}
  .nutrition-state:focus-visible,.nutrition-nav-btn:focus-visible{outline:2px solid #9B7D41;outline-offset:4px}
  .nutrition-legend{gap:20px;margin-top:16px;font-size:11px}
  .nutrition-note{margin-top:10px;font-size:11px;line-height:1.5}
}
</style>
</head>
<body>
<div class="top-bar"><a class="back-btn" href="index.html?p=2">← Home</a><h1>DIET</h1><span class="world-label" id="worldLabel"></span></div>
<div id="viewNutrition" class="view active">
  <section class="nutrition-wrap">
    <div class="nutrition-head">
      <div class="nutrition-title">今日饮食</div>
      <div class="nutrition-date-nav">
        <button class="nutrition-nav-btn" type="button" onclick="shiftNutritionDay(-1)" aria-label="前一天">‹</button>
        <span class="nutrition-date" id="nutritionDate"></span>
        <button class="nutrition-nav-btn" id="nutritionNext" type="button" onclick="shiftNutritionDay(1)" aria-label="后一天">›</button>
      </div>
    </div>
    <div class="nutrition-summary">
      <div class="nutrition-summary-item"><div class="nutrition-summary-label">摄入</div><div class="nutrition-summary-value"><span id="nutritionIntake">0</span><small>kcal</small></div></div>
      <div class="nutrition-summary-item"><div class="nutrition-summary-label">消耗</div><div class="nutrition-summary-value"><span id="nutritionBurn">0</span><small>kcal</small></div></div>
      <div class="nutrition-summary-item"><div class="nutrition-summary-label">净摄入</div><div class="nutrition-summary-value"><span id="nutritionNet">0</span><small>kcal</small></div></div>
    </div>
    <div class="nutrition-card" id="nutritionRows"></div>
    <div class="nutrition-legend"><span>○ 未覆盖</span><span>◐ 有一点</span><span>● 够了</span></div>
    <div class="nutrition-note">按当天实际摄入记录；强化食品或补充剂也可以算。</div>
  </section>
</div>
<div id="viewCalories" class="view">
  <section class="calorie-summary">
    <div class="calorie-summary-label">今日净摄入</div>
    <div class="calorie-net"><span id="calorieNet">0</span><small>kcal</small></div>
    <div class="calorie-flow"><span>摄入 <b id="calorieIntake">0</b></span><span>消耗 <b id="calorieBurn">0</b></span></div>
  </section>
  <button class="calorie-add" type="button" onclick="openCalorieModal()">＋ 记一笔</button>
  <details class="calorie-fold" open>
    <summary>热量记录 <span class="calorie-count" id="calorieCount"></span></summary>
    <div id="calorieHistory"></div>
  </details>
</div>

<div id="viewDraft" class="view"></div>

<div class="modal-bg" id="calorieModal" onclick="if(event.target===this)closeMealModal('calorieModal')">
  <div class="modal">
    <h2>记录热量</h2>
    <label>日期</label>
    <input type="date" id="calorieDate">
    <label>类型</label>
    <input type="hidden" id="calorieType" value="intake">
    <div class="calorie-types" id="calorieTypeGroup">
      <button type="button" class="active" data-value="intake" onclick="pickCalorieType(this)">吃了</button>
      <button type="button" data-value="burn" onclick="pickCalorieType(this)">运动</button>
    </div>
    <label id="calorieDetailLabel">吃了什么</label>
    <input type="text" id="calorieDetail">
    <label>卡路里（kcal）</label>
    <input type="number" id="calorieAmount" min="1" step="1">
    <div class="modal-actions">
      <button class="modal-cancel" type="button" onclick="closeMealModal('calorieModal')">取消</button>
      <button class="modal-save" type="button" onclick="saveCalorieRecord()">保存</button>
    </div>
  </div>
</div>

<nav class="tab-bar" aria-label="DIET">
  <button type="button" class="active" onclick="switchMealTab('viewNutrition',this)">营养</button>
  <button type="button" onclick="switchMealTab('viewCalories',this)">热量</button>
  <button type="button" onclick="switchMealTab('viewDraft',this)">暂定</button>
</nav>
<div class="toast" id="toast"></div>
<script src="world-context.js?v=20261019-diet-split1"></script>
<script src="cloud-sync.js?v=20261019-diet-split1"></script>
<script src="app-back.js?v=20261010-home-return2"></script>
<script>
'use strict';
if(window.__LIMINAL_REDIRECTING)throw new Error('Redirecting to cloud login');
const CALORIE_KEY='calorie_log_db';
const NUTRITION_KEY='nutrition_check_db';
const NUTRITION_ITEMS=[
  {id:'carbs',name:'碳水',source:'米饭 · 乌冬 · 面包 · 面类 · 薯类'},
  {id:'protein',name:'蛋白质',source:'肉 · 鱼 · 蛋 · 豆'},
  {id:'fat',name:'脂肪',source:'肉 · 鱼 · 蛋 · 奶 · 坚果 · 油脂'},
  {id:'fiber',name:'膳食纤维',source:'豆类 · 燕麦 · 全麦 · 车前子壳'},
  {id:'calcium',name:'钙',source:'牛奶 · 酸奶 · 奶酪 · 小鱼'},
  {id:'vitaminC',name:'维C',source:'果汁 · 强化饮料 · 补充剂'},
  {id:'folate',name:'叶酸',source:'豆类 · 纳豆 · 蛋 · 强化食品'},
  {id:'vitaminD',name:'维D',source:'鱼 · 蛋 · 强化食品 · 补充剂'},
  {id:'omega3',name:'Omega-3',source:'青花鱼 · 鲑鱼 · 沙丁鱼'},
  {id:'ironZincB12',name:'铁 / 锌 / B12',source:'红肉 · 贝类 · 鱼 · 蛋 · 奶'}
];
let nutritionSelectedDate=null;
function readJson(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value&&typeof value==='object'?value:fallback;}catch(error){return fallback;}}
function writeJson(key,value){localStorage.setItem(key,JSON.stringify(value));}
function esc(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gid(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function dateKey(value){const date=new Date(value);return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function workdayKey(value){const date=value?new Date(value):new Date();date.setHours(date.getHours()-4);return dateKey(date);}
function getCalorieLog(){const data=readJson(CALORIE_KEY,{version:1,records:[]});data.version=1;data.records=Array.isArray(data.records)?data.records:[];return data;}
function calorieStatsForDay(day){return getCalorieLog().records.reduce((total,record)=>{if(record.date!==day)return total;const kcal=Math.max(0,Math.round(Number(record.kcal)||0));if(record.type==='burn')total.burn+=kcal;else total.intake+=kcal;total.net=total.intake-total.burn;return total;},{intake:0,burn:0,net:0});}
function renderCalorieLedger(){const today=workdayKey(),stats=calorieStatsForDay(today),log=getCalorieLog();document.getElementById('calorieNet').textContent=(stats.net<0?'−':'')+Math.abs(stats.net);document.getElementById('calorieIntake').textContent=stats.intake+' kcal';document.getElementById('calorieBurn').textContent=stats.burn+' kcal';const records=log.records.slice().sort((left,right)=>String(right.date||'').localeCompare(String(left.date||''))||(Number(right.createdAt)||0)-(Number(left.createdAt)||0));document.getElementById('calorieCount').textContent=records.length?'· '+records.length+' 笔':'';document.getElementById('calorieHistory').innerHTML=records.length?records.map(record=>{const burn=record.type==='burn',kcal=Math.max(0,Math.round(Number(record.kcal)||0));return'<div class="calorie-row"><span class="calorie-date">'+esc(record.date||'—')+'</span><span class="calorie-kind '+(burn?'burn':'intake')+'">'+(burn?'运动':'吃')+'</span><span class="calorie-detail">'+esc(record.detail||'—')+'</span><span class="calorie-amount '+(burn?'burn':'intake')+'">'+(burn?'−':'+')+kcal+' kcal</span><button class="calorie-delete" type="button" aria-label="删除" onclick="deleteCalorieRecord(\''+record.id+'\')">×</button></div>';}).join(''):'<div class="calorie-empty">还没有记录</div>';}
function getNutritionStore(){const data=readJson(NUTRITION_KEY,{version:1,days:{}});data.version=1;data.days=data.days&&typeof data.days==='object'?data.days:{};return data;}
function nutritionDayDate(day){const parts=String(day||'').split('-').map(Number);return new Date(parts[0]||1970,(parts[1]||1)-1,parts[2]||1,12,0,0,0);}
function shiftNutritionDay(delta){if(!nutritionSelectedDate)nutritionSelectedDate=workdayKey();const date=nutritionDayDate(nutritionSelectedDate);date.setDate(date.getDate()+delta);const next=dateKey(date),today=workdayKey();nutritionSelectedDate=next>today?today:next;renderNutritionChecklist();}
function cycleNutrition(itemId){if(!nutritionSelectedDate)nutritionSelectedDate=workdayKey();const store=getNutritionStore();store.days[nutritionSelectedDate]=store.days[nutritionSelectedDate]||{};const current=Math.max(0,Math.min(2,Number(store.days[nutritionSelectedDate][itemId])||0));store.days[nutritionSelectedDate][itemId]=(current+1)%3;writeJson(NUTRITION_KEY,store);renderNutritionChecklist();}
function renderNutritionChecklist(){if(!nutritionSelectedDate)nutritionSelectedDate=workdayKey();const today=workdayKey();if(nutritionSelectedDate>today)nutritionSelectedDate=today;const store=getNutritionStore(),day=store.days[nutritionSelectedDate]||{},dateEl=document.getElementById('nutritionDate'),rowsEl=document.getElementById('nutritionRows'),nextEl=document.getElementById('nutritionNext');if(!dateEl||!rowsEl)return;dateEl.textContent=nutritionSelectedDate===today?'今天 · '+nutritionSelectedDate:nutritionSelectedDate;if(nextEl)nextEl.disabled=nutritionSelectedDate>=today;const stats=calorieStatsForDay(nutritionSelectedDate),intakeEl=document.getElementById('nutritionIntake'),burnEl=document.getElementById('nutritionBurn'),netEl=document.getElementById('nutritionNet');if(intakeEl)intakeEl.textContent=stats.intake;if(burnEl)burnEl.textContent=stats.burn;if(netEl)netEl.textContent=(stats.net<0?'−':'')+Math.abs(stats.net);const labels=['未覆盖','有一点','够了'];rowsEl.innerHTML=NUTRITION_ITEMS.map(item=>{const state=Math.max(0,Math.min(2,Number(day[item.id])||0));return'<div class="nutrition-row"><div class="nutrition-copy"><div class="nutrition-name">'+esc(item.name)+'</div><div class="nutrition-source">'+esc(item.source)+'</div></div><button class="nutrition-state s'+state+'" type="button" aria-label="'+esc(item.name)+'：'+labels[state]+'" title="'+labels[state]+'" onclick="cycleNutrition(\''+item.id+'\')"></button></div>';}).join('');}
function switchMealTab(viewId,button){if(['viewNutrition','viewCalories','viewDraft'].indexOf(viewId)<0)return;document.querySelectorAll('.view').forEach(view=>view.classList.toggle('active',view.id===viewId));document.querySelectorAll('.tab-bar button').forEach(item=>item.classList.remove('active'));if(button)button.classList.add('active');document.getElementById('worldLabel').textContent=viewId==='viewDraft'?'':'REALITY';if(viewId==='viewNutrition')renderNutritionChecklist();if(viewId==='viewCalories')renderCalorieLedger();}
function openCalorieModal(){const today=workdayKey(),first=document.querySelector('#calorieTypeGroup button[data-value="intake"]');document.getElementById('calorieDate').value=today;document.getElementById('calorieDate').max=today;document.getElementById('calorieDetail').value='';document.getElementById('calorieAmount').value='';pickCalorieType(first);document.getElementById('calorieModal').classList.add('show');}
function closeMealModal(id){document.getElementById(id).classList.remove('show');}
function pickCalorieType(button){if(!button)return;document.querySelectorAll('#calorieTypeGroup button').forEach(item=>item.classList.toggle('active',item===button));const type=button.dataset.value==='burn'?'burn':'intake';document.getElementById('calorieType').value=type;document.getElementById('calorieDetailLabel').textContent=type==='burn'?'做了什么运动':'吃了什么';}
function saveCalorieRecord(){const date=document.getElementById('calorieDate').value,type=document.getElementById('calorieType').value==='burn'?'burn':'intake',detail=document.getElementById('calorieDetail').value.trim(),kcal=Math.round(Number(document.getElementById('calorieAmount').value)||0);if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>workdayKey()){showToast('请选择有效日期');return;}if(!detail){showToast(type==='burn'?'请填写运动':'请填写吃了什么');return;}if(kcal<=0){showToast('请输入卡路里');return;}const log=getCalorieLog();log.records.push({id:gid('kcal'),date,type,detail,kcal,createdAt:Date.now()});writeJson(CALORIE_KEY,log);closeMealModal('calorieModal');renderCalorieLedger();renderNutritionChecklist();}
function deleteCalorieRecord(id){const log=getCalorieLog();log.records=log.records.filter(record=>record.id!==id);writeJson(CALORIE_KEY,log);renderCalorieLedger();renderNutritionChecklist();}
function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.style.display='block';clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.style.display='none',1800);}
function refreshDiet(){renderNutritionChecklist();renderCalorieLedger();}
document.getElementById('worldLabel').textContent='REALITY';
refreshDiet();
window.addEventListener('liminal-cloud-ready',refreshDiet);
window.addEventListener('storage',function(event){if(!event.key||event.key===CALORIE_KEY||event.key===NUTRITION_KEY)refreshDiet();});
window.addEventListener('pageshow',refreshDiet);
</script>
</body>
</html>
