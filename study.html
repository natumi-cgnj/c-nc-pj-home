<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study">
<title>Study</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:72px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;padding-top:env(safe-area-inset-top,20px);background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid #f0f0f0}
.top-bar h1{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#999}
.back-btn{font-size:13px;color:#bbb;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.content{padding:20px}
.section-title{font-size:11px;font-weight:600;color:#999;letter-spacing:1px;margin:20px 0 10px;text-transform:uppercase}
.log-list{display:flex;flex-direction:column;gap:8px}
.log-item{background:#fff;border:1px solid #eee;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.log-item .title{font-size:13px;color:#333;font-weight:500}
.log-item .meta{font-size:10px;color:#bbb;margin-top:3px}
.log-item .duration{font-size:14px;font-weight:600;color:#6B8AFF;white-space:nowrap}
.add-btn{width:100%;height:44px;border:1px dashed #ddd;border-radius:10px;background:transparent;color:#bbb;font-size:12px;font-family:inherit;cursor:pointer;margin-top:12px;transition:all 0.15s}
.add-btn:active{background:#f8f8f8;border-color:#bbb}
.empty{text-align:center;color:#ddd;font-size:12px;padding:60px 20px}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:min(360px,100%);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:15px;font-weight:600;color:#333;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:#999;font-weight:600;letter-spacing:.3px;margin-bottom:4px}
.field input,.field select{width:100%;height:36px;border:1px solid #e8e8e8;border-radius:8px;padding:0 12px;font-size:12px;font-family:inherit;color:#333;outline:none}
.field input:focus{border-color:#6B8AFF}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;height:40px;border-radius:10px;border:none;font-size:13px;font-family:inherit;cursor:pointer}
.btn-cancel{background:#f3f3f3;color:#666}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-primary:active{opacity:.7}
.del-link{font-size:10px;color:#e57373;cursor:pointer;text-align:center;margin-top:8px;background:none;border:none;font-family:inherit}
.del-link.confirming{width:100%;padding:8px;border:1px solid #f1caca;border-radius:8px;background:#fff4f4;color:#c95656}
</style>
</head>
<body>
<div class="top-bar">
<button class="back-btn" onclick="location.href='index.html'">← 返回</button>
<h1>学习</h1>
<div style="width:40px"></div>
</div>
<div class="content">
<div class="section-title">学习记录</div>
<div class="log-list" id="logList"></div>
<button class="add-btn" type="button" onclick="openAdd()">＋ 记录学习</button>
</div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
<div class="modal" onclick="event.stopPropagation()">
<h2 id="modalTitle">记录学习</h2>
<div class="field"><label>科目 / 内容</label><input id="fSubject" type="text" maxlength="60" placeholder="例：日语 N2"></div>
<div class="field"><label>时长（分钟）</label><input id="fDuration" type="number" min="1" max="999" placeholder="30"></div>
<div class="field"><label>备注</label><input id="fNote" type="text" maxlength="120" placeholder="可选"></div>
<div class="modal-actions">
<button class="btn-cancel" type="button" onclick="closeModal()">取消</button>
<button class="btn-primary" type="button" onclick="saveLog()">保存</button>
</div>
<button class="del-link" id="delBtn" type="button" style="display:none" onclick="delLog()">删除这条</button>
</div>
</div>

<script src="cloud-sync.js?v=20260804-layout2"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting');
var DB_KEY='study_db';
var editIdx=-1;
var deleteArmed=false;
function load(){try{return JSON.parse(localStorage.getItem(DB_KEY))||[];}catch(e){return[];}}
function save(d){localStorage.setItem(DB_KEY,JSON.stringify(d));}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function appDayKey(value){
  var d=value instanceof Date?new Date(value.getTime()):new Date(value||Date.now());
  d.setHours(d.getHours()-4);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function resetDeleteConfirm(){
  deleteArmed=false;
  var btn=document.getElementById('delBtn');
  if(btn){btn.textContent='删除这条';btn.classList.remove('confirming');}
}
function requireDeleteConfirm(){
  if(deleteArmed)return true;
  deleteArmed=true;
  var btn=document.getElementById('delBtn');
  if(btn){btn.textContent='再次点击确认删除';btn.classList.add('confirming');}
  return false;
}
function render(){
  var list=document.getElementById('logList');
  var data=load();
  if(!data.length){list.innerHTML='<div class="empty">还没有学习记录</div>';return;}
  var today=appDayKey(new Date());
  var h='';
  data.slice().reverse().forEach(function(it,ri){
    var i=data.length-1-ri;
    var d=it.date||'';
    var tag=d===today?'今天':d;
    h+='<div class="log-item" onclick="openEdit('+i+')"><div><div class="title">'+escH(it.subject||'学习')+'</div><div class="meta">'+tag+(it.note?' · '+escH(it.note):'')+'</div></div><div class="duration">'+(it.duration||0)+' min</div></div>';
  });
  list.innerHTML=h;
}
function openAdd(){
  editIdx=-1;
  resetDeleteConfirm();
  document.getElementById('modalTitle').textContent='记录学习';
  document.getElementById('fSubject').value='';
  document.getElementById('fDuration').value='';
  document.getElementById('fNote').value='';
  document.getElementById('delBtn').style.display='none';
  document.getElementById('modal').classList.add('show');
}
function openEdit(i){
  var data=load();if(!data[i])return;
  editIdx=i;
  resetDeleteConfirm();
  document.getElementById('modalTitle').textContent='编辑';
  document.getElementById('fSubject').value=data[i].subject||'';
  document.getElementById('fDuration').value=data[i].duration||'';
  document.getElementById('fNote').value=data[i].note||'';
  document.getElementById('delBtn').style.display='';
  document.getElementById('modal').classList.add('show');
}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modal').classList.remove('show');resetDeleteConfirm();}
function saveLog(){
  var subj=document.getElementById('fSubject').value.trim();
  var dur=parseInt(document.getElementById('fDuration').value)||0;
  if(!subj){alert('请输入科目');return;}
  if(dur<1){alert('请输入时长');return;}
  var data=load();
  var existing=editIdx>=0&&data[editIdx]?data[editIdx]:null;
  var entry={subject:subj,duration:dur,note:document.getElementById('fNote').value.trim(),date:existing&&existing.date?existing.date:appDayKey(new Date())};
  if(editIdx>=0&&data[editIdx]){data[editIdx]=Object.assign(data[editIdx],entry);}
  else{entry.id='s_'+Date.now();data.push(entry);}
  save(data);closeModal();render();
}
function delLog(){
  if(editIdx<0)return;
  if(!requireDeleteConfirm())return;
  var data=load();data.splice(editIdx,1);save(data);closeModal();render();
}
render();
</script>
</body>
</html>
