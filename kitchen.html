<!DOCTYPE html>
<!-- Kitchen build: 2026-08-03-optional-subsections-r3 -->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<title>Kitchen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:env(safe-area-inset-top,24px);border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#8B6914}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}
.view{display:none}.view.active{display:block}
#viewHome.active{min-height:100vh;min-height:100dvh}

/* ── Project list (horizontal rows) ── */
.project-list{padding:8px 0}
.project-row{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;position:relative}
.project-row:active{background:#FFFDF7}
.project-icon-wrap{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FFF8E6;flex-shrink:0}
.project-icon-wrap img{width:100%;height:100%;object-fit:cover}
.project-icon-wrap .emoji-fb{font-size:22px}
.project-row-body{flex:1;min-width:0}
.project-row-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.project-row-name{font-size:14px;font-weight:500;color:#333}
.project-row-meta{font-size:11px;color:#bbb;display:flex;align-items:center;gap:8px}
.project-row-progress{flex:1;max-width:120px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.project-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width 0.3s}
.project-row-pct{font-size:10px;color:#ccc;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.project-complete-star{font-size:12px;color:#E8B96A;flex-shrink:0}
.project-row-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px;color:#ccc}
.project-row-add:active{background:#f8f8f8}
/* Duty accent: left border color via inline style */
.duty-badge{font-size:9px;font-weight:500;letter-spacing:0.5px;display:inline-block;padding:1px 6px;border-radius:4px}
/* Project list arrange mode */
.project-row{touch-action:pan-y;position:relative}
.project-delete-x{display:none;position:absolute;top:50%;right:14px;transform:translateY(-50%) scale(0.3);width:20px;height:20px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(120,110,100,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:10px;line-height:17px;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewHome.project-arrange-mode .project-delete-x{display:block;opacity:1;transform:translateY(-50%) scale(1)}
#viewHome.project-arrange-mode .project-row{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewHome.project-arrange-mode .project-row-add{pointer-events:none;opacity:0.35}
.dragging{opacity:0.45;transform:scale(0.97);background:#FFFDF7;transition:opacity 0.2s,transform 0.2s}
.drag-over{box-shadow:0 -2px 0 0 #E8B96A}

/* ── Item detail view ── */
.detail-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.detail-header h2{font-size:15px;font-weight:600;color:#333;letter-spacing:0.5px}
.detail-overall{padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;background:#fff;border-bottom:1px solid #f5f5f5}
.detail-overall-bar{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.detail-overall-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width 0.3s}

/* ── Item grid (thumbnails) ── */
.item-grid{padding:16px 0}
.item-cell{aspect-ratio:1;border-radius:10px;border:1.5px solid #e8e8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;background:#f5f5f5}
.section-grid.one-column .item-cell{aspect-ratio:2/1}
.item-cell:active{transform:scale(0.97)}
.item-cell .item-img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:9px;position:absolute;top:0;left:0;background:#fff;filter:grayscale(100%) brightness(0.85);transition:filter 0.4s}
.item-cell.collected{border-color:#E8B96A}
.item-cell.recorded .item-img,.item-cell.collected .item-img{filter:none}
.item-cell .item-num{font-size:20px;font-weight:200;color:#ddd;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.item-cell .item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.5));color:#fff;font-size:10px;font-weight:500;padding:14px 5px 4px;border-radius:0 0 9px 9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.item-cell:not(.has-img) .item-label{background:none;color:#ccc;position:static;font-size:9px;padding:0 4px;margin-top:2px}
.item-cell.collected:not(.has-img){background:#FFFDF7;border-color:#E8B96A}
.item-cell.collected:not(.has-img) .item-num{color:#E8B96A}
.item-check{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(232,185,106,0.9);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;z-index:2}
.item-delete-x{display:none;position:absolute;top:3px;right:3px;width:16px;height:16px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(120,110,100,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:9px;line-height:13px;font-weight:600;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transform:scale(0.3);transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewDetail.arrange-mode .item-cell{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewDetail.arrange-mode .item-delete-x{display:block;opacity:1;transform:scale(1)}
#viewDetail.arrange-mode .item-check{display:none}
#viewDetail.arrange-mode .section-divider-label{pointer-events:none}
#viewDetail.arrange-mode .add-item-btn{pointer-events:none;opacity:0.35;transition:opacity 0.25s}
.item-cell.drag-source{opacity:0.2;transition:opacity 0.15s}
.item-cell.drop-target{box-shadow:0 0 0 2px rgba(232,185,106,0.7);border-color:rgba(232,185,106,0.6);transition:box-shadow 0.15s,border-color 0.15s}
.item-drag-ghost{position:fixed!important;margin:0!important;z-index:500;pointer-events:none;opacity:0.88;transform:scale(1.04) rotate(0.8deg);box-shadow:0 10px 32px rgba(0,0,0,0.18);border-radius:10px}
.item-drag-ghost .item-delete-x,.item-drag-ghost .item-check{display:none!important}
.add-item-btn{margin:0 20px 16px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}

/* ── Item detail card ── */
.card-detail{width:calc(100% - 40px);max-width:520px;margin:20px auto;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card-detail-media{min-height:180px;max-height:420px;padding:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center}
.card-detail-img{display:block;width:auto;max-width:100%;height:auto;max-height:388px;object-fit:contain}
.card-detail-body{padding:14px 16px}
.card-detail-name{font-size:16px;font-weight:600;color:#333;margin-bottom:4px;cursor:default;border-bottom:1px dashed transparent;transition:border-color 0.15s}
.card-detail-name:hover{border-bottom-color:#D8C18B}
.card-detail-name[contenteditable]{outline:none;border-bottom:1px solid #E8B96A;cursor:text}
.card-detail-note[contenteditable]{outline:none;border-bottom:1px solid #E8B96A;cursor:text}
.card-detail-date{font-size:11px;color:#bbb;margin-bottom:8px}
.card-detail-item-note{margin-top:8px;padding:8px 10px;border-radius:8px;background:#faf8f4;font-size:12px;color:#777;line-height:1.6;white-space:pre-wrap}
.card-detail-item-note-label{display:block;margin-bottom:2px;font-size:9px;color:#bbb;letter-spacing:0.8px}
.card-detail-note{font-size:13px;color:#666;line-height:1.6;white-space:pre-wrap}
.card-actions{width:calc(100% - 40px);max-width:520px;display:flex;gap:8px;padding:0;margin:8px auto 0}
.card-actions .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Modals ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal textarea{resize:vertical;min-height:50px}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}
.file-label{display:block;padding:10px 12px;border:1px dashed #ddd;border-radius:8px;text-align:center;color:#aaa;font-size:12px;cursor:pointer;margin-top:4px}
.img-preview{width:100%;border-radius:8px;margin-top:8px;max-height:240px;object-fit:contain;background:#f7f7f7}
.project-icon-editor{width:min(180px,100%);margin:8px auto 0}
.project-icon-pos-frame{width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;cursor:grab;touch-action:none;border:1px solid #eee;background:#f7f7f7}
.project-icon-pos-frame:active{cursor:grabbing}
.project-icon-pos-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.project-icon-clear{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,0.45);color:#fff;font-size:12px;cursor:pointer;line-height:22px;text-align:center;z-index:2}
/* Duty color selector */
.duty-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.duty-opt{padding:3px 9px;border-radius:6px;border:1.5px solid #e0e0e0;font-size:11px;cursor:pointer;font-family:inherit;background:#fff;transition:all 0.15s}
.duty-opt.active{border-width:2px}
.duty-custom-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.duty-custom-row input{flex:1;font-size:12px;padding:6px 8px}
.color-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid #ddd;cursor:pointer;flex-shrink:0}
.color-picker-row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.color-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:border 0.15s,transform 0.15s}
.color-swatch:active{transform:scale(1.15)}
.color-swatch.active{border-color:#333}

/* ── Checkin celebration ── */
.checkin-popup{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center}
.checkin-popup.show{display:flex}
.checkin-box{background:#fff;border-radius:16px;padding:24px 20px;width:85%;max-width:300px;text-align:center;animation:revealPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes revealPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.checkin-char-img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid #f0f0f0}
.checkin-char-placeholder{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#fff}
.checkin-char-name{font-size:12px;font-weight:600;letter-spacing:0.5px;margin-bottom:4px}
.checkin-char-line{font-size:13px;color:#555;line-height:1.5;margin-bottom:16px;font-style:italic}
.checkin-ok{padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Section dividers ── */
.section-divider{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.section-divider-line{flex:1;height:1px;background:#e0e0e0}
.section-divider-center{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0}
.section-divider-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px;cursor:text;border-bottom:1px dashed transparent;transition:color 0.15s,border-color 0.15s}
.section-divider-label:hover{color:#8B6914;border-bottom-color:#D8C18B}
.section-progress{font-size:9px;color:#c5c5c5;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:0.3px}
.section-banner{height:clamp(68px,10vw,88px);overflow:hidden;cursor:pointer;position:relative;margin:0 20px;border-radius:10px}
.section-banner img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.3s}
.section-banner-full{position:fixed;inset:0;z-index:280;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;cursor:pointer}
.section-banner-full.show{display:flex}
.section-banner-full img{max-width:92%;max-height:85vh;object-fit:contain;border-radius:8px}
/* Banner position editor */
.banner-pos-editor{margin-top:6px;position:relative}
.banner-pos-frame{width:100%;height:clamp(68px,10vw,88px);border-radius:10px;overflow:hidden;position:relative;cursor:grab;touch-action:none;border:1px solid #eee}
.banner-pos-frame:active{cursor:grabbing}
.banner-pos-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.banner-pos-hint{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.banner-pos-hint-text{font-size:10px;color:#bbb}
.banner-pos-reset{font-size:10px;color:#aaa;background:none;border:1px solid #e0e0e0;border-radius:6px;padding:2px 8px;cursor:pointer}
.banner-pos-reset:hover{color:#888;border-color:#ccc}
.subcount-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.subcount-row label{margin:0;font-size:12px;color:#999}
.subcount-row input[type="number"]{width:60px;font-size:13px;padding:6px 8px}
.cost-tag{font-size:10px;padding:2px 6px;border-radius:4px;background:#E8B96A15;color:#B9872F;margin-left:4px}
.cost-summary{font-size:11px;color:#999;padding:6px 14px;text-align:right}
.section-grid{display:grid;gap:8px;padding:8px 20px 16px}
.section-grid.flat-grid{padding-top:0}
@media (min-width:700px){
  .item-grid{max-width:640px;margin:0 auto}
  #viewDetail>.add-item-btn{display:block;max-width:600px;margin-left:auto;margin-right:auto}
}
/* Section editor in modal */
.section-list{margin-top:8px}
.section-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f5f5f5;flex-wrap:wrap}
.section-row input{font-size:12px;padding:6px 8px;border:1px solid #e8e8e8;border-radius:6px;font-family:inherit;background:#fff}
.section-row input[type="text"]{flex:1 1 90px;min-width:70px}
.section-row input[type="number"]{flex:0 0 46px;min-width:0}
.section-row select{width:56px;font-size:11px;padding:4px;border:1px solid #e8e8e8;border-radius:6px;font-family:inherit;background:#fff}
.section-row .del-sec{font-size:11px;color:#d0d0d0;background:none;border:none;cursor:pointer;padding:4px;transition:color 0.15s}
.section-row .del-sec:active{color:#D85A30}
.section-row.sec-dragging{opacity:0.4;background:#f8f8f8}
.section-row.sec-drag-over{box-shadow:0 -2px 0 0 #E8B96A}
.add-section-btn{font-size:11px;color:#bbb;background:none;border:1px dashed #e0e0e0;border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:6px;font-family:inherit;width:100%;transition:color 0.15s,border-color 0.15s}
.add-section-btn:active{color:#999;border-color:#ccc}
.section-config{width:100%;padding:5px 0;margin-top:4px}
.section-config-line{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.section-config-line+.section-config-line{margin-top:5px}
.section-config-label{font-size:10px;color:#aaa;white-space:nowrap}
.section-config input[type="text"]{flex:1 1 96px;min-width:80px;font-size:12px;padding:5px 8px;border:1px solid #e8e8e8;border-radius:6px;background:#fff}
.section-config input[type="number"]{width:42px;flex:0 0 42px;font-size:12px;padding:5px 4px;border:1px solid #e8e8e8;border-radius:6px;text-align:center;background:#fff}
.section-config select{width:auto;min-width:52px;font-size:11px;padding:4px 4px;border:1px solid #e8e8e8;border-radius:6px;background:#fff}
.section-tag-palette{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.section-tag-swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid transparent;padding:0;cursor:pointer;transition:border-color 0.15s,transform 0.15s}
.section-tag-swatch:active{transform:scale(1.15)}
.section-tag-swatch.active{border-color:#333}
.subsection-editor{width:100%;padding:5px 0;border-top:1px solid #f0f0f0;position:relative}
.subsection-editor:first-child{border-top:none}
.subsection-editor-main{display:grid;grid-template-columns:minmax(70px,1fr) auto auto auto auto;gap:4px;align-items:center}
.subsection-editor-main input{min-width:0;width:100%;font-size:12px;padding:5px 8px;border:1px solid #e8e8e8;border-radius:6px;background:#fff}
.subsection-editor-main input[type="number"]{width:42px;padding:5px 4px;text-align:center}
.subsection-editor-main select{min-width:0;width:100%;font-size:11px;padding:4px 4px;border:1px solid #e8e8e8;border-radius:6px;background:#fff}
.subsection-drag-handle{display:none}
.subsection-editor.sub-dragging{opacity:0.42;background:#f8f8f8}
.subsection-editor.sub-drag-over{box-shadow:0 -2px 0 0 #E8B96A}
.subsection-editor-actions{display:flex;gap:2px}
.subsection-editor-actions button{border:none;background:none;color:#ccc;font-size:10px;padding:2px;cursor:pointer;transition:color 0.15s}
.subsection-editor-actions button:active{color:#D85A30}
.subsection-add-btn{font-size:11px;color:#bbb;background:none;border:1px dashed #e0e0e0;border-radius:6px;padding:4px 8px;cursor:pointer;font-family:inherit;transition:color 0.15s,border-color 0.15s}
.subsection-add-btn:active{color:#999;border-color:#ccc}
@media(max-width:380px){
  .subsection-editor-main{grid-template-columns:minmax(60px,1fr) auto auto auto}
  .subsection-editor-actions{grid-column:2/-1;justify-content:flex-end}
}

/* ── Action sheet ── */
.action-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:250;display:none;align-items:flex-end;justify-content:center}
.action-sheet-bg.show{display:flex}
.action-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:400px;padding:8px 0 env(safe-area-inset-bottom,8px)}
.action-sheet button{display:block;width:100%;padding:14px;background:none;border:none;border-bottom:1px solid #f5f5f5;font-size:14px;cursor:pointer;font-family:inherit;color:#333}
.action-sheet button:active{background:#f8f8f8}
.action-sheet button.cancel-as{color:#999;border-bottom:none}
.action-sheet button.del-as{color:#D85A30}

/* ── Confirm ── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}
.confirm-box p{font-size:14px;color:#333;margin-bottom:16px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:center}
.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:13px}

/* ── Toast ── */
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,0.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1),opacity 0.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── Collaboration records ── */
.item-count-badge{position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:rgba(232,185,106,0.9);color:#fff;font-size:9px;font-weight:600;text-align:center;line-height:18px;padding:0 4px;z-index:2;font-variant-numeric:tabular-nums}
.item-status-dot{position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:50%;z-index:2;border:1px solid rgba(255,255,255,0.8)}
.item-status-dot.keeping{background:#5BA66B}
.item-status-dot.sold{background:#ccc}
.item-status-dot.mixed{background:linear-gradient(135deg,#5BA66B 50%,#ccc 50%)}
.section-type-badge{font-size:9px;padding:1px 6px;border-radius:4px;margin-left:4px}
.section-type-badge.normal-type{background:#88888815;color:#999}
.section-type-badge.collab{background:#E8B96A20;color:#B9872F}
.history-list{width:calc(100% - 40px);max-width:520px;margin:8px auto 0}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border:1px solid #eee;border-radius:8px;margin-bottom:6px;font-size:13px}
.history-item.history-editable{cursor:text}
.history-item.history-editable:hover{border-color:#e5d2a7}
.history-date{color:#999;font-size:12px;min-width:80px;flex-shrink:0}
.history-date[title]{cursor:pointer}
.history-date-input{width:126px;max-width:100%;padding:4px 6px;border:1px solid #E8B96A;border-radius:5px;background:#fff;color:#555;font:inherit;font-size:12px;outline:none}
.history-note{color:#555;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-note.is-empty{color:#ccc;font-style:italic}
.history-note[contenteditable]{outline:none;border-bottom:1px solid #E8B96A;overflow:visible;text-overflow:clip;cursor:text}
.history-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0}
.history-status{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.history-status.keeping{background:#5BA66B20;color:#5BA66B}
.history-status.sold{background:#ccc3;color:#999}
.history-status.gifted{background:#D85A3020;color:#D85A30}
.history-process{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:none;font-family:inherit;flex-shrink:0}
.history-process.pending{background:#E8B96A20;color:#E8B96A}

<script src="cloud-sync.js?v=20260802-outing1"></script>
<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');

/* ═══ DATA ═══ */
const SK='kitchen_db';
const SECTION_TAG_COLORS=['#9B8AE8','#6B5ACD','#D85A30','#E84A7A','#E8B96A','#C7A24C','#9B6BCC','#4AADE8','#3A8DD4','#5BA66B','#3D8B50','#6B8AFF','#4A6AE0','#888','#B0805A','#4ECDC4'];
let projects=[];
try{projects=JSON.parse(localStorage.getItem(SK))||[];}catch(e){projects=[];}

// Migrate from old goshanbou key FIRST (before format migration)
(function(){try{
  if(!projects.length){
    const old=localStorage.getItem('goshanbou_v3');
    if(old){projects=JSON.parse(old);localStorage.setItem(SK,JSON.stringify(projects));}
  }
}catch(e){}})();

// Migrate from old format (shops with series)
if(projects.length&&projects[0]&&projects[0].series){
  const migrated=[];
  projects.forEach(shop=>{
    (shop.series||[]).forEach(ser=>{
      const items=(ser.dishes||[]).map((d,i)=>({
        id:d.id||('it_'+Date.now()+'_'+i),name:d.name||('品目'+(i+1)),
        note:d.note||'',img:d.img||'',collected:!!d.collected,
        collectedDate:d.collectedDate||d.date||null,
        checkinNote:d.checkinNote||'',checkinImg:d.checkinImg||''
      }));
      migrated.push({
        id:shop.id+'_'+ser.id,name:shop.name+(shop.series.length>1?' - '+ser.name:''),
        note:shop.note||'',icon:shop.icon||'',count:ser.count||items.length,
        duty:shop.char?{type:shop.char,color:shop.char==='neal'?'#6B8AFF':shop.char==='jane'?'#5BA66B':'#D85A30',name:''}:{type:'',color:'#E8B96A',name:''},
        items:items,order:migrated.length
      });
    });
    if(!shop.series||!shop.series.length){
      migrated.push({
        id:shop.id,name:shop.name,note:shop.note||'',icon:shop.icon||'',count:0,
        duty:shop.char?{type:shop.char,color:shop.char==='neal'?'#6B8AFF':shop.char==='jane'?'#5BA66B':'#D85A30',name:''}:{type:'',color:'#E8B96A',name:''},
        items:[],order:migrated.length
      });
    }
  });
  if(migrated.length){projects=migrated;save();}
}

// Upgrade the fixed “通常 / 联名 = 餐品 + 赠品” layout into optional,
// user-defined subsections. Existing item order and records stay untouched.
(function(){
  let changed=migrateKitchenSectionModel();
  projects.forEach(p=>{if(normalizeProjectSubtypes(p))changed=true;});
  if(changed)localStorage.setItem(SK,JSON.stringify(projects));
})();

let curProjectId=null, curItemIdx=null, quickItemIdx=null, editSectionIdx=null;
let editProjectId=null, editItemIdx=null;
let projectTempIcon='';
let projectIconPosTemp={x:50,y:50};
const detailScrollByProject={};
let itemArrangeMode=false,itemPressState=null,itemDragState=null,itemClickSuppressedUntil=0;

function save(){localStorage.setItem(SK,JSON.stringify(projects));}
function gid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clampImagePosition(value){const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):50;}

/* ═══ CUSTOM DIALOGS (replace confirm/alert/prompt) ═══ */
function customConfirm(msg,onYes,opts){
  const bg=document.getElementById('confirmBg');
  const box=bg.querySelector('.confirm-box');
  const yesLabel=(opts&&opts.yes)||'确定';
  const noLabel=(opts&&opts.no)||'取消';
  const isDanger=opts&&opts.danger;
  box.innerHTML=`<p>${msg}</p><div class="btn-row"><button class="btn btn-cancel" id="confirmNo">${esc(noLabel)}</button><button class="btn ${isDanger?'btn-del':'btn-primary'}" id="confirmYes">${esc(yesLabel)}</button></div>`;
  bg.classList.add('show');
  box.querySelector('#confirmYes').onclick=()=>{bg.classList.remove('show');onYes();};
  box.querySelector('#confirmNo').onclick=()=>{bg.classList.remove('show');};
  bg.onclick=e=>{if(e.target===bg)bg.classList.remove('show');};
}
let _toastTimer=null;
function showToast(msg,ms){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),ms||2200);
}
function getProject(id){return projects.find(p=>p.id===id);}
function isItemCompleted(p,item,index){
  const bt=getItemBehaviorType(p,item,index);
  if(bt==='merch'||bt==='shopping'){
    return !!(item.records&&item.records.length&&item.records.every(r=>r.processStatus==='processed'));
  }
  return !!item.collected;
}
function isItemRecorded(p,item,index){
  const bt=getItemBehaviorType(p,item,index);
  if(bt==='merch'||bt==='shopping')return !!(item.records&&item.records.length);
  return !!item.collected;
}
function projectStats(p){
  let total=0,collected=0;
  (p.items||[]).forEach((item,index)=>{
    total++;
    if(isItemCompleted(p,item,index))collected++;
  });
  return{total,collected};
}
function sectionStats(p,sectionIdx){
  if(!p||!p.sections||!p.sections[sectionIdx])return{total:0,collected:0};
  let offset=0;
  for(let i=0;i<sectionIdx;i++)offset+=Math.max(0,parseInt(p.sections[i].count)||0);
  const count=Math.max(0,parseInt(p.sections[sectionIdx].count)||0);
  let total=0,collected=0;
  for(let i=offset;i<offset+count&&i<p.items.length;i++){
    total++;
    if(isItemCompleted(p,p.items[i],i))collected++;
  }
  return{total,collected};
}
function normalizeItemType(type){return type==='merch'||type==='shopping'?'merch':'food';}
function clampSectionCols(value){return Math.max(1,Math.min(5,parseInt(value)||3));}
function normalizeTagColor(color){return /^#[0-9a-f]{6}$/i.test(String(color||''))?String(color):'#E8B96A';}
function migrateKitchenSectionModel(){
  let changed=false;
  projects.forEach(p=>{
    if(!Array.isArray(p.sections))return;
    let offset=0;
    p.sections.forEach(sec=>{
      const count=Math.max(0,parseInt(sec.count)||0);
      if(sec.tagText===undefined){
        const oldType=sec.sectionType||'';
        sec.tagText=oldType==='collab'||oldType==='collab_food'||oldType==='merch'?'联名':oldType==='normal'?'通常':'';
        changed=true;
      }
      if(!sec.tagColor){
        sec.tagColor=(sec.sectionType==='normal')?'#888888':'#E8B96A';
        changed=true;
      }
      const cleanTagColor=normalizeTagColor(sec.tagColor);
      if(sec.tagColor!==cleanTagColor){sec.tagColor=cleanTagColor;changed=true;}
      if(Array.isArray(sec.subsections)){
        sec.subsections.forEach((sub,subIdx)=>{
          if(!sub.id){sub.id=gid();changed=true;}
          const type=normalizeItemType(sub.itemType);
          if(sub.itemType!==type){sub.itemType=type;changed=true;}
          const cols=clampSectionCols(sub.cols);
          if(sub.cols!==cols){sub.cols=cols;changed=true;}
          const subCount=Math.max(0,parseInt(sub.count)||0);
          if(sub.count!==subCount){sub.count=subCount;changed=true;}
          if(sub.name===undefined){sub.name='';changed=true;}
        });
      }else{
        let legacy=[
          {key:'food',label:(sec.subLabels&&sec.subLabels.food)||'餐品',count:Math.max(0,parseInt(sec.subcounts&&sec.subcounts.food)||0),cols:clampSectionCols(sec.subCols&&sec.subCols.food||sec.cols)},
          {key:'merch',label:(sec.subLabels&&sec.subLabels.merch)||'周边',count:Math.max(0,parseInt(sec.subcounts&&sec.subcounts.merch)||0),cols:clampSectionCols(sec.subCols&&sec.subCols.merch||sec.cols)}
        ].filter(entry=>entry.count>0);
        if(!legacy.length){
          const runs=[];
          (p.items||[]).slice(offset,offset+count).forEach(item=>{
            const key=normalizeItemType(item&&item.itemType);
            const last=runs[runs.length-1];
            if(last&&last.key===key)last.count++;
            else runs.push({key,label:key==='merch'?'周边':'餐品',count:1,cols:clampSectionCols(sec.cols)});
          });
          if(runs.length>1)legacy=runs;
        }
        if(legacy.length>1){
          sec.subsections=legacy.map(entry=>({id:gid(),name:entry.label,itemType:entry.key,count:entry.count,cols:entry.cols}));
          changed=true;
        }else{
          const fallbackType=sec.sectionType==='merch'||sec.sectionType==='activity'?'merch':'food';
          const only=legacy[0];
          const inferred=(p.items||[]).slice(offset,offset+count).find(item=>item&&item.itemType);
          const itemType=only?only.key:normalizeItemType(inferred&&inferred.itemType||fallbackType);
          if(sec.itemType!==itemType){sec.itemType=itemType;changed=true;}
          const cols=only?only.cols:clampSectionCols(sec.cols);
          if(sec.cols!==cols){sec.cols=cols;changed=true;}
        }
      }
      offset+=count;
    });
  });
  return changed;
}
function getSectionStartIndex(p,sectionIdx){
  let start=0;
  for(let i=0;i<sectionIdx&&p&&Array.isArray(p.sections);i++)start+=Math.max(0,parseInt(p.sections[i].count)||0);
  return start;
}
function getSubtypeForLocalPosition(section,localIdx){
  if(section&&Array.isArray(section.subsections)&&section.subsections.length){
    let run=0;
    for(const sub of section.subsections){
      run+=Math.max(0,parseInt(sub.count)||0);
      if(localIdx<run)return normalizeItemType(sub.itemType);
    }
  }
  return normalizeItemType(section&&section.itemType);
}
function getItemGroupInfo(p,itemIdx){
  const sectionIdx=getItemSectionIndex(p,itemIdx);
  if(sectionIdx<0)return{sectionIdx:-1,subsectionIdx:-1,itemType:''};
  const section=p.sections[sectionIdx];
  const localIdx=itemIdx-getSectionStartIndex(p,sectionIdx);
  if(Array.isArray(section.subsections)&&section.subsections.length){
    let run=0;
    for(let subsectionIdx=0;subsectionIdx<section.subsections.length;subsectionIdx++){
      const sub=section.subsections[subsectionIdx];
      run+=Math.max(0,parseInt(sub.count)||0);
      if(localIdx<run)return{sectionIdx,subsectionIdx,itemType:normalizeItemType(sub.itemType)};
    }
  }
  return{sectionIdx,subsectionIdx:-1,itemType:normalizeItemType(section.itemType)};
}
function getItemSubtype(p,itemIdx){
  const info=getItemGroupInfo(p,itemIdx);
  return info.itemType;
}
function normalizeProjectSubtypes(p){
  if(!p)return false;
  let changed=false;
  if(!Array.isArray(p.items)){p.items=[];changed=true;}
  if(!Array.isArray(p.sections)||!p.sections.length){
    if(p.count!==p.items.length){p.count=p.items.length;changed=true;}
    return changed;
  }
  let remaining=p.items.length;
  let offset=0;
  p.sections.forEach((section,sectionIdx)=>{
    const declared=Math.max(0,parseInt(section.count)||0);
    const count=sectionIdx===p.sections.length-1?remaining:Math.min(declared,remaining);
    if(section.count!==count){section.count=count;changed=true;}
    remaining-=count;
    if(Array.isArray(section.subsections)&&section.subsections.length){
      let total=0;
      section.subsections.forEach(sub=>{
        const subCount=Math.max(0,parseInt(sub.count)||0);
        if(sub.count!==subCount){sub.count=subCount;changed=true;}
        const subType=normalizeItemType(sub.itemType);
        if(sub.itemType!==subType){sub.itemType=subType;changed=true;}
        const subCols=clampSectionCols(sub.cols);
        if(sub.cols!==subCols){sub.cols=subCols;changed=true;}
        total+=subCount;
      });
      if(total<count){section.subsections[section.subsections.length-1].count+=count-total;total=count;changed=true;}
      if(total>count){
        let excess=total-count;
        for(let i=section.subsections.length-1;i>=0&&excess>0;i--){
          const take=Math.min(section.subsections[i].count,excess);
          section.subsections[i].count-=take;excess-=take;changed=true;
        }
      }
    }else{
      const itemType=normalizeItemType(section.itemType);
      if(section.itemType!==itemType){section.itemType=itemType;changed=true;}
      const cols=clampSectionCols(section.cols);
      if(section.cols!==cols){section.cols=cols;changed=true;}
    }
    for(let localIdx=0;localIdx<count&&offset+localIdx<p.items.length;localIdx++){
      const type=getSubtypeForLocalPosition(section,localIdx);
      if(p.items[offset+localIdx].itemType!==type){p.items[offset+localIdx].itemType=type;changed=true;}
    }
    if(section.tagText===undefined){section.tagText='';changed=true;}
    const tagColor=normalizeTagColor(section.tagColor);
    if(section.tagColor!==tagColor){section.tagColor=tagColor;changed=true;}
    offset+=count;
  });
  if(p.count!==p.items.length){p.count=p.items.length;changed=true;}
  return changed;
}
function adjustSectionGroupCount(section,subsectionIdx,delta){
  if(!section)return;
  section.count=Math.max(0,(parseInt(section.count)||0)+delta);
  if(subsectionIdx>=0&&Array.isArray(section.subsections)&&section.subsections[subsectionIdx]){
    const sub=section.subsections[subsectionIdx];
    sub.count=Math.max(0,(parseInt(sub.count)||0)+delta);
  }
}
function getGroupInsertIndex(p,sectionIdx,subsectionIdx){
  const section=p&&p.sections&&p.sections[sectionIdx];
  if(!section)return p&&p.items?p.items.length:0;
  let index=getSectionStartIndex(p,sectionIdx);
  if(subsectionIdx>=0&&Array.isArray(section.subsections)){
    for(let i=0;i<=subsectionIdx&&i<section.subsections.length;i++)index+=Math.max(0,parseInt(section.subsections[i].count)||0);
    return Math.min(index,p.items.length);
  }
  return Math.min(index+Math.max(0,parseInt(section.count)||0),p.items.length);
}
function sameItemGroup(a,b){
  return !!a&&!!b&&a.sectionIdx===b.sectionIdx&&a.subsectionIdx===b.subsectionIdx;
}
function normalizeGenericItemNames(p){
  if(!p||!Array.isArray(p.items))return;
  p.items.forEach((item,i)=>{if(/^品目\d+$/.test(item.name||''))item.name='品目'+(i+1);});
}
function isGenericItemName(name){
  return !String(name||'').trim()||/^品目\d+$/.test(String(name).trim());
}
function getItemDisplayName(p,item,itemIdx){
  const name=String(item&&item.name||'').trim();
  if(!isGenericItemName(name))return name;
  const group=getItemGroupInfo(p,itemIdx);
  const section=group.sectionIdx>=0&&p&&Array.isArray(p.sections)?p.sections[group.sectionIdx]:null;
  if(!section)return'';
  const subsection=group.subsectionIdx>=0&&Array.isArray(section.subsections)?section.subsections[group.subsectionIdx]:null;
  return String(subsection&&subsection.name||section.name||'').trim();
}

function currentScrollY(){return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;}

  if(curProjectId)detailScrollByProject[curProjectId]=currentScrollY();
}
function restoreDetailScroll(y){
  const target=Math.max(0,Number(y)||0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,target)));
}
function returnToDetail(){
  const p=getProject(curProjectId);if(!p)return;
  const detailIsActive=document.getElementById('viewDetail').classList.contains('active');
  const target=detailIsActive?currentScrollY():(detailScrollByProject[curProjectId]||0);
  detailScrollByProject[curProjectId]=target;
  renderDetail(p);
  switchView('viewDetail');
  restoreDetailScroll(target);
}

function renderProjects(){
  const list=document.getElementById('projectList');
  let html=projects.sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>{
    const st=projectStats(p);
    const pct=st.total>0?Math.round(st.collected/st.total*100):0;
    const done=st.collected>=st.total&&st.total>0;
    const iconPosX=clampImagePosition(p.iconPositionX);
    const iconPosY=clampImagePosition(p.iconPositionY);
    const iconHtml=p.icon?`<img src="${p.icon}" alt="" style="object-position:${iconPosX}% ${iconPosY}%">`:`<div class="emoji-fb">🍽</div>`;
    const duty=p.duty||{};
    const dutyColor=duty.color||'#E8B96A';
    const dutyName=duty.type?DUTY_PRESETS.find(d=>d.type===duty.type)?.name||duty.name||'':duty.name||'';
    const dutyBadge=dutyName?`<span class="duty-badge" style="background:${dutyColor}15;color:${dutyColor}">${esc(dutyName)}</span>`:'';
    const borderStyle=dutyName?`border-left:3px solid ${dutyColor}`:'';
    const fillStyle=dutyName?`background:linear-gradient(90deg,${dutyColor},${dutyColor}cc)`:'';
    return`<div class="project-row" style="${borderStyle}" data-id="${p.id}" onclick="handleProjectRowClick('${p.id}')">
      <div class="project-icon-wrap">${iconHtml}</div>
      <div class="project-row-body">
        <div class="project-row-top">
          <span class="project-row-name">${esc(p.name)}</span>
          ${dutyBadge}
          ${done?'<span class="project-complete-star">★</span>':''}
        </div>
        <div class="project-row-meta">
          <span>${st.collected} / ${st.total}</span>
          <div class="project-row-progress"><div class="project-row-fill" style="width:${pct}%;${fillStyle}"></div></div>
          <span class="project-row-pct">${pct}%</span>
        </div>
      </div>
      <button class="project-delete-x" aria-label="删除项目" onclick="handleProjectDeleteClick(event,'${p.id}')">×</button>
    </div>`;
  }).join('');
  html+=`<div class="project-row-add" onclick="openAddProject()">+ 添加项目</div>`;
  list.innerHTML=html;
  initProjectDrag();
}

let projectArrangeMode=false,projectClickSuppressed=0,projectDeleteArmedAt=0;
let projectGestureBound=false,projectPressState=null;
function setProjectArrangeMode(active){
  projectArrangeMode=!!active;
  document.getElementById('viewHome').classList.toggle('project-arrange-mode',projectArrangeMode);
  if(projectArrangeMode){
    projectDeleteArmedAt=Date.now()+500;
    projectClickSuppressed=Date.now()+700;
  }else{
    projectDeleteArmedAt=0;
    projectClickSuppressed=Date.now()+400;
    clearProjectPress(false);
  }
}
function handleProjectRowClick(id){
  if(projectArrangeMode||Date.now()<projectClickSuppressed)return;
  openProject(id);
}
function handleProjectDeleteClick(event,id){
  event.preventDefault();
  event.stopPropagation();
  // Prevent the synthetic click emitted when the long-press itself ends.
  if(!projectArrangeMode||Date.now()<projectDeleteArmedAt)return;
  deleteProjectById(id);
}
function deleteProjectById(id){
  const p=projects.find(pr=>pr.id===id);
  const name=p?p.name:'项目';
  customConfirm(`删除「${esc(name)}」？所有品目和打卡记录都会消失。`,()=>{
    const deletingCurrent=curProjectId===id;
    projects=projects.filter(pr=>pr.id!==id);
    if(deletingCurrent){
      curProjectId=null;curItemIdx=null;quickItemIdx=null;
      editProjectId=null;editItemIdx=null;editSectionIdx=null;
      setItemArrangeMode(false);
      switchView('viewHome');
    }
    save();renderProjects();
    if(!projects.length)setProjectArrangeMode(false);
  },{yes:'删除',danger:true});
}
function initProjectDrag(){
  if(projectGestureBound)return;
  projectGestureBound=true;
  const list=document.getElementById('projectList');
  list.addEventListener('pointerdown',onDown);
  list.addEventListener('pointermove',onMove,{passive:false});
  list.addEventListener('pointerup',onUp);
  list.addEventListener('pointercancel',onCancel);
  list.addEventListener('contextmenu',e=>{if(e.target.closest('.project-row'))e.preventDefault();});
  list.addEventListener('dragstart',e=>e.preventDefault());
  function onDown(e){
    if(e.target.closest('.project-delete-x'))return;
    const row=e.target.closest('.project-row');
    if(!row||(e.button!==undefined&&e.button!==0))return;
    clearProjectPress(false);
    const state={
      row,
      pointerId:e.pointerId,
      startX:e.clientX,
      startY:e.clientY,
      lastX:e.clientX,
      lastY:e.clientY,
      activated:false,
      moved:false,
      timer:null
    };
    projectPressState=state;
    if(row.setPointerCapture){try{row.setPointerCapture(e.pointerId);}catch(err){}}
    state.timer=setTimeout(()=>{
      if(projectPressState!==state)return;
      state.timer=null;
      state.activated=true;
      if(!projectArrangeMode)setProjectArrangeMode(true);
      projectClickSuppressed=Date.now()+700;
      if(navigator.vibrate)navigator.vibrate(12);
    },projectArrangeMode?170:450);
  }
  function onMove(e){
    const state=projectPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    state.lastX=e.clientX;state.lastY=e.clientY;
    const distance=Math.hypot(e.clientX-state.startX,e.clientY-state.startY);
    if(!state.activated){
      if(distance>10)clearProjectPress(false);
      return;
    }
    if(distance<=6)return;
    state.moved=true;
    state.row.classList.add('dragging');
    e.preventDefault();
    list.querySelectorAll('.project-row').forEach(c=>c.classList.remove('drag-over'));
    for(const card of list.querySelectorAll('.project-row')){
      if(card===state.row)continue;
      const r=card.getBoundingClientRect();
      if(e.clientY<r.top+r.height/2){card.classList.add('drag-over');break;}
    }
  }
  function onUp(e){
    const state=projectPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    if(state.timer){clearTimeout(state.timer);state.timer=null;}
    releaseProjectPointer(state);
    // A normal tap must be allowed to produce the row's click event.
    if(state.activated||state.moved)projectClickSuppressed=Date.now()+700;
    if(state.activated&&state.moved){
      commitProjectDrag(state,state.lastY);
    }
    clearProjectPress(false);
  }
  function onCancel(e){
    const state=projectPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    projectClickSuppressed=Date.now()+700;
    // pointercancel is a browser interruption, never a reorder confirmation.
    clearProjectPress(false);
  }
  // The blank area can be outside #viewHome's content height, so listen on document.
  document.addEventListener('click',e=>{
    if(!projectArrangeMode)return;
    if(!document.getElementById('viewHome').classList.contains('active'))return;
    if(document.querySelector('.modal-bg.show,.action-sheet-bg.show,.confirm-bg.show'))return;
    if(e.target.closest('.project-row')||e.target.closest('.btn-s')||e.target.closest('.back-btn'))return;
    setProjectArrangeMode(false);
  });
}
function releaseProjectPointer(state){
  if(!state||!state.row||!state.row.releasePointerCapture)return;
  try{
    if(!state.row.hasPointerCapture||state.row.hasPointerCapture(state.pointerId)){
      state.row.releasePointerCapture(state.pointerId);
    }
  }catch(e){}
}
function clearProjectPress(release=true){
  const state=projectPressState;
  if(!state)return;
  if(state.timer)clearTimeout(state.timer);
  if(release)releaseProjectPointer(state);
  state.row&&state.row.classList.remove('dragging');
  document.querySelectorAll('#projectList .project-row.drag-over').forEach(row=>row.classList.remove('drag-over'));
  projectPressState=null;
}
function commitProjectDrag(state,y){
  if(!state||!state.row)return;
  const dragId=state.row.dataset.id;
  let insertBefore=null;
  for(const card of document.querySelectorAll('#projectList .project-row')){
    if(card===state.row||!card.dataset.id)continue;
    const r=card.getBoundingClientRect();
    if(y<r.top+r.height/2){insertBefore=card.dataset.id;break;}
  }
  const item=projects.find(p=>p.id===dragId);
  if(!item)return;
  const others=projects.filter(p=>p.id!==dragId);
  const newOrder=[];
  if(!insertBefore){
    newOrder.push(...others,item);
  }else{
    others.forEach(p=>{if(p.id===insertBefore)newOrder.push(item);newOrder.push(p);});
  }
  newOrder.forEach((p,i)=>p.order=i);
  projects=newOrder;
  save();
  renderProjects();
}

function renderDutyRow(selected){
  const row=document.getElementById('dutyRow');
  const selType=(selected&&selected.type)||'';

    const active=selType===d.type;
    return`<button class="duty-opt ${active?'active':''}" style="border-color:${d.color};${active?'background:'+d.color+'15;color:'+d.color:''}" onclick="selectDuty('${d.type}')">${d.name}</button>`;
  }).join('');
  html+=`<button class="duty-opt ${selType==='custom'?'active':''}" style="${selType==='custom'?'border-color:'+(selected.color||'#E8B96A'):''}" onclick="selectDuty('custom')">其他</button>`;
  row.innerHTML=html;
  document.getElementById('dutyCustomRow').style.display=selType==='custom'?'flex':'none';
  if(selType==='custom'){
    document.getElementById('dutyCustomName').value=(selected&&selected.name)||'';
    renderColorPicker((selected&&selected.color)||'#E8B96A');
  }
}
function renderColorPicker(activeColor){
  document.getElementById('colorPicker').innerHTML=CUSTOM_COLORS.map(c=>
    `<div class="color-swatch ${c===activeColor?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}
let _dutyState={type:'',color:'#E8B96A',name:''};

/* ── Section rows in modal ── */
let _sections=[],_addSectionDraft=null,_quickSectionDraft=null,sectionDragBound=false,sectionPressState=null;
function makeEmptyItem(number){
  return{id:gid(),name:'品目'+number,note:'',img:'',collected:false,collectedDate:null,checkinNote:'',checkinImg:''};
}
function itemHasSavedContent(item){
  if(!item)return false;
  return !!(item.collected||item.img||item.note||item.checkinNote||item.checkinImg||
    (item.checkinHistory&&item.checkinHistory.length)||
    (item.records&&item.records.length)||
    (item.name&&!/^品目\d+$/.test(item.name)));
}
function buildSectionDrafts(p){
  const source=p.sections&&p.sections.length
    ?p.sections
    :[{name:'',count:p.items.length,cols:3,itemType:'food',tagText:'',tagColor:'#E8B96A'}];
  let offset=0;
  const drafts=source.map(sec=>{
    const count=Math.max(0,parseInt(sec.count)||0);
    const sectionItems=p.items.slice(offset,offset+count);
    const draft={name:sec.name||'',count,cols:clampSectionCols(sec.cols),itemType:normalizeItemType(sec.itemType),tagText:sec.tagText||'',tagColor:normalizeTagColor(sec.tagColor),bannerImg:sec.bannerImg||'',bannerPositionX:sec.bannerPositionX!=null?sec.bannerPositionX:50,bannerPositionY:sec.bannerPositionY!=null?sec.bannerPositionY:50};
    if(Array.isArray(sec.subsections)&&sec.subsections.length){
      let subOffset=0;
      draft.subsections=sec.subsections.map(sub=>{
        const subCount=Math.max(0,parseInt(sub.count)||0);
        const subDraft={id:sub.id||gid(),name:sub.name||'',itemType:normalizeItemType(sub.itemType),count:subCount,cols:clampSectionCols(sub.cols),_items:sectionItems.slice(subOffset,subOffset+subCount)};
        subOffset+=subCount;
        return subDraft;
      });
      if(subOffset<sectionItems.length){
        const last=draft.subsections[draft.subsections.length-1];
        last._items.push(...sectionItems.slice(subOffset));
        last.count=last._items.length;
      }
    }else{
      draft._items=sectionItems;
    }
    offset+=count;
    return draft;
  });
  // Repair old count drift without changing the order the user currently sees:
  // uncovered items stay with the last visible section.
  if(offset<p.items.length){
    if(!drafts.length)drafts.push({name:'',count:0,cols:3,itemType:'food',tagText:'',tagColor:'#E8B96A',_items:[]});
    const last=drafts[drafts.length-1];
    const extra=p.items.slice(offset);
    if(Array.isArray(last.subsections)&&last.subsections.length){
      const lastSub=last.subsections[last.subsections.length-1];
      lastSub._items.push(...extra);
      lastSub.count=lastSub._items.length;
      last.count=last.subsections.reduce((sum,sub)=>sum+sub.count,0);
    }else{
      last._items.push(...extra);
      last.count=last._items.length;
    }
  }
  return drafts;
}
function finalizeItemBucket(bucket,requested,itemType,startNumber){
  const source=Array.isArray(bucket)?bucket.slice():[];
  const group=source.slice(0,requested);
  let preserved=0;
  for(let i=requested;i<source.length;i++){
    if(itemHasSavedContent(source[i])){group.push(source[i]);preserved++;}
  }
  while(group.length<requested)group.push(makeEmptyItem(startNumber+group.length));
  group.forEach(item=>{item.itemType=normalizeItemType(itemType);});
  return{items:group,preserved};
}
function finalizeOneSectionDraft(sec,startNumber){
  const result={name:sec.name||'',count:0,cols:clampSectionCols(sec.cols),itemType:normalizeItemType(sec.itemType),tagText:String(sec.tagText||'').trim(),tagColor:normalizeTagColor(sec.tagColor)};
  if(sec.bannerImg){result.bannerImg=sec.bannerImg;result.bannerPositionX=sec.bannerPositionX!=null?sec.bannerPositionX:50;result.bannerPositionY=sec.bannerPositionY!=null?sec.bannerPositionY:50;}
  let items=[];let preserved=0;
  const activeSubs=Array.isArray(sec.subsections)
    ?sec.subsections.filter(sub=>sub.name||Math.max(0,parseInt(sub.count)||0)>0||(sub._items&&sub._items.length))
    :[];
  if(activeSubs.length===1&&!String(activeSubs[0].name||'').trim()){
    const sub=activeSubs[0];
    result.cols=clampSectionCols(sub.cols);result.itemType=normalizeItemType(sub.itemType);
    const finalized=finalizeItemBucket(sub._items,Math.max(0,parseInt(sub.count)||0),result.itemType,startNumber);
    items=finalized.items;preserved+=finalized.preserved;
  }else if(activeSubs.length){
    result.subsections=[];
    activeSubs.forEach(sub=>{
      const requested=Math.max(0,parseInt(sub.count)||0);
      const finalized=finalizeItemBucket(sub._items,requested,sub.itemType,startNumber+items.length);
      preserved+=finalized.preserved;
      result.subsections.push({id:sub.id||gid(),name:String(sub.name||'').trim(),itemType:normalizeItemType(sub.itemType),count:finalized.items.length,cols:clampSectionCols(sub.cols)});
      items.push(...finalized.items);
    });
  }else{
    const requested=Math.max(0,parseInt(sec.count)||0);
    const finalized=finalizeItemBucket(sec._items,requested,result.itemType,startNumber);
    items=finalized.items;preserved+=finalized.preserved;
  }
  result.count=items.length;
  return{section:result,items,preserved};
}
function removeSectionRow(index){
  if(index<0||index>=_sections.length)return;
  const sec=_sections[index];
  if(sectionDraftHasItems(sec)){
    const sName=sec.name||('分栏 '+(index+1));
    customConfirm(`删除分栏「${esc(sName)}」？其中品目会一起删除。`,()=>{
      _sections.splice(index,1);
      renderSectionList();
    },{yes:'确认删除'});
  }else{
    _sections.splice(index,1);
    renderSectionList();
  }
}
function sectionDraftHasItems(sec){
  return !!(sec&&((sec._items&&sec._items.length)||(Array.isArray(sec.subsections)&&sec.subsections.some(sub=>sub._items&&sub._items.length))));
}
function finalizeSectionDrafts(){
  const sections=[];
  const items=[];
  let preserved=0;
  _sections.filter(sec=>sec.name||sec.count>0||sectionDraftHasItems(sec)).forEach(sec=>{
    const finalized=finalizeOneSectionDraft(sec,items.length+1);
    sections.push(finalized.section);
    items.push(...finalized.items);
    preserved+=finalized.preserved;
  });
  normalizeGenericItemNames({items});
  return{sections,items,preserved};
}
function getDraftSection(scope,index){
  if(scope==='project')return _sections[index];
  if(scope==='add')return _addSectionDraft;
  if(scope==='quick')return _quickSectionDraft;
  return null;
}
function rerenderDraftScope(scope){
  if(scope==='project')renderSectionList();
  else renderStandaloneSectionDraft(scope);
}
function setDraftField(scope,index,field,value,rerender){
  const sec=getDraftSection(scope,index);if(!sec)return;
  if(field==='count')sec.count=Math.max(0,parseInt(value)||0);
  else if(field==='cols')sec.cols=clampSectionCols(value);
  else if(field==='itemType')sec.itemType=normalizeItemType(value);
  else if(field==='tagColor')sec.tagColor=normalizeTagColor(value);
  else sec[field]=value;
  if(rerender)rerenderDraftScope(scope);
}
function setSubDraftField(scope,index,subIndex,field,value){
  const sec=getDraftSection(scope,index);if(!sec||!Array.isArray(sec.subsections)||!sec.subsections[subIndex])return;
  const sub=sec.subsections[subIndex];
  if(field==='count')sub.count=Math.max(0,parseInt(value)||0);
  else if(field==='cols')sub.cols=clampSectionCols(value);
  else if(field==='itemType')sub.itemType=normalizeItemType(value);
  else sub[field]=value;
  sec.count=sec.subsections.reduce((sum,entry)=>sum+Math.max(0,parseInt(entry.count)||0),0);
}
function addDraftSubsection(scope,index){
  const sec=getDraftSection(scope,index);if(!sec)return;
  if(!Array.isArray(sec.subsections)||!sec.subsections.length){
    sec.subsections=[{id:gid(),name:'',itemType:normalizeItemType(sec.itemType),count:Math.max(0,parseInt(sec.count)||0),cols:clampSectionCols(sec.cols),_items:Array.isArray(sec._items)?sec._items.slice():[]}];
    delete sec._items;
  }
  sec.subsections.push({id:gid(),name:'',itemType:'food',count:0,cols:3,_items:[]});
  rerenderDraftScope(scope);
}
function removeDraftSubsection(scope,index,subIndex){
  const sec=getDraftSection(scope,index);if(!sec||!Array.isArray(sec.subsections)||!sec.subsections[subIndex])return;
  const candidate=sec.subsections[subIndex];
  if((candidate._items||[]).some(itemHasSavedContent)){
    showToast('这个子分栏里有已填写的品目，请先移动品目');
    return;
  }
  const removed=sec.subsections.splice(subIndex,1)[0];
  if(!sec.subsections.length){
    sec.itemType=normalizeItemType(removed.itemType);sec.cols=clampSectionCols(removed.cols);sec.count=Math.max(0,parseInt(removed.count)||0);sec._items=removed._items||[];delete sec.subsections;
  }else if(sec.subsections.length===1){
    const only=sec.subsections[0];
    const removedItems=removed._items||[];
    if(subIndex===0)only._items=removedItems.concat(only._items||[]);else only._items=(only._items||[]).concat(removedItems);
    only.count=Math.max(0,parseInt(only.count)||0)+Math.max(0,parseInt(removed.count)||0);
    sec.itemType=normalizeItemType(only.itemType);sec.cols=clampSectionCols(only.cols);sec.count=only.count;sec._items=only._items||[];delete sec.subsections;
  }else{
    const targetIndex=subIndex>0?subIndex-1:0;
    const target=sec.subsections[targetIndex];
    const removedItems=removed._items||[];
    if(subIndex===0)target._items=removedItems.concat(target._items||[]);else target._items=(target._items||[]).concat(removedItems);
    target.count=Math.max(0,parseInt(target.count)||0)+Math.max(0,parseInt(removed.count)||0);
    sec.count=sec.subsections.reduce((sum,entry)=>sum+Math.max(0,parseInt(entry.count)||0),0);
  }
  rerenderDraftScope(scope);
}
function moveDraftSubsection(scope,index,subIndex,delta){
  const sec=getDraftSection(scope,index);if(!sec||!Array.isArray(sec.subsections))return;
  const next=subIndex+delta;if(next<0||next>=sec.subsections.length)return;
  const moved=sec.subsections.splice(subIndex,1)[0];sec.subsections.splice(next,0,moved);rerenderDraftScope(scope);
}
let subsectionDragBound=false,subsectionPressState=null;
function setupSubsectionDrag(){
  if(subsectionDragBound)return;
  subsectionDragBound=true;
  document.addEventListener('pointerdown',e=>{
    const row=e.target.closest('.subsection-editor');
    if(e.target.closest('input')||e.target.closest('select')||e.target.closest('button'))return;
    if(!row||(e.button!==undefined&&e.button!==0))return;
    const handle=row.querySelector('.subsection-drag-handle');
    clearSubsectionPress();
    const state={
      row,handle,captureEl:e.target,
      scope:row.dataset.subScope,
      parentIndex:parseInt(row.dataset.parentIndex),
      index:parseInt(row.dataset.subIndex),
      pointerId:e.pointerId,
      startY:e.clientY,lastY:e.clientY,
      activated:false,moved:false,timer:null
    };
    subsectionPressState=state;
    if(state.captureEl.setPointerCapture){try{state.captureEl.setPointerCapture(e.pointerId);}catch(err){}}
    state.timer=setTimeout(()=>{
      if(subsectionPressState!==state)return;
      state.timer=null;state.activated=true;state.row.classList.add('sub-dragging');
      if(navigator.vibrate)navigator.vibrate(12);
    },330);
  });
  document.addEventListener('pointermove',e=>{
    const state=subsectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    state.lastY=e.clientY;
    const distance=Math.abs(e.clientY-state.startY);
    if(!state.activated){if(distance>10)clearSubsectionPress();return;}
    if(distance<=5)return;
    state.moved=true;e.preventDefault();
    getSubsectionDragRows(state).forEach(row=>row.classList.remove('sub-drag-over'));
    for(const row of getSubsectionDragRows(state)){
      if(parseInt(row.dataset.subIndex)===state.index)continue;
      const rect=row.getBoundingClientRect();
      if(e.clientY<rect.top+rect.height/2){row.classList.add('sub-drag-over');break;}
    }
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    const state=subsectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    if(state.timer){clearTimeout(state.timer);state.timer=null;}
    if(state.activated&&state.moved)commitSubsectionDrag(state);
    clearSubsectionPress();
  });
  document.addEventListener('pointercancel',e=>{
    const state=subsectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    clearSubsectionPress();
  });
}
function getSubsectionDragRows(state){
  return Array.from(document.querySelectorAll(`.subsection-editor[data-sub-scope="${state.scope}"][data-parent-index="${state.parentIndex}"]`));
}
function commitSubsectionDrag(state){
  const sec=getDraftSection(state.scope,state.parentIndex);if(!sec||!Array.isArray(sec.subsections))return;
  let toIndex=sec.subsections.length;
  for(const row of getSubsectionDragRows(state)){
    const idx=parseInt(row.dataset.subIndex);if(idx===state.index)continue;
    const rect=row.getBoundingClientRect();
    if(state.lastY<rect.top+rect.height/2){toIndex=idx;break;}
  }
  const insertAt=toIndex>state.index?toIndex-1:toIndex;
  if(insertAt!==state.index){
    const moved=sec.subsections.splice(state.index,1)[0];
    sec.subsections.splice(insertAt,0,moved);
    rerenderDraftScope(state.scope);
  }
}
function clearSubsectionPress(){
  const state=subsectionPressState;if(!state)return;
  if(state.timer)clearTimeout(state.timer);
  try{
    if(state.captureEl&&state.captureEl.releasePointerCapture&&
      (!state.captureEl.hasPointerCapture||state.captureEl.hasPointerCapture(state.pointerId)))state.captureEl.releasePointerCapture(state.pointerId);
  }catch(e){}
  state.row&&state.row.classList.remove('sub-dragging');
  getSubsectionDragRows(state).forEach(row=>row.classList.remove('sub-drag-over'));
  subsectionPressState=null;
}
function sectionTypeOptions(value){
  return`<option value="food"${value==='merch'?'':' selected'}>餐品</option><option value="merch"${value==='merch'?' selected':''}>周边</option>`;
}
function sectionColsOptions(value){
  const active=clampSectionCols(value);let html='';for(let i=1;i<=5;i++)html+=`<option value="${i}"${i===active?' selected':''}>${i}列</option>`;return html;
}
function sectionTagEditorHtml(sec,scope,index){
  const color=normalizeTagColor(sec.tagColor);
  return`<div class="section-config-line"><input type="text" value="${esc(sec.tagText||'')}" placeholder="如：角落生物、春季限定" maxlength="20" oninput="setDraftField('${scope}',${index},'tagText',this.value,false)"><div class="section-tag-palette">${SECTION_TAG_COLORS.map(c=>`<button type="button" class="section-tag-swatch ${c===color?'active':''}" style="background:${c}" aria-label="选择标签颜色" onclick="setDraftField('${scope}',${index},'tagColor','${c}',true)"></button>`).join('')}</div></div>`;
}
function sectionSettingsHtml(sec,scope,index){
  if(Array.isArray(sec.subsections)&&sec.subsections.length){
    const rows=sec.subsections.map((sub,subIndex)=>`<div class="subsection-editor" data-sub-scope="${scope}" data-parent-index="${index}" data-sub-index="${subIndex}"><div class="subsection-editor-main"><input type="text" value="${esc(sub.name||'')}" placeholder="子分栏名称" oninput="setSubDraftField('${scope}',${index},${subIndex},'name',this.value)"><select aria-label="子分栏类型" onchange="setSubDraftField('${scope}',${index},${subIndex},'itemType',this.value)">${sectionTypeOptions(normalizeItemType(sub.itemType))}</select><input type="number" value="${Math.max(0,parseInt(sub.count)||0)}" min="0" max="99" aria-label="数量" onchange="setSubDraftField('${scope}',${index},${subIndex},'count',this.value)"><select aria-label="列数" onchange="setSubDraftField('${scope}',${index},${subIndex},'cols',this.value)">${sectionColsOptions(sub.cols)}</select><div class="subsection-editor-actions"><button type="button" aria-label="删除子分栏" onclick="removeDraftSubsection('${scope}',${index},${subIndex})">×</button></div></div></div>`).join('');
    return`${rows}<div class="section-config-line"><button type="button" class="subsection-add-btn" onclick="addDraftSubsection('${scope}',${index})">＋ 添加子分栏</button></div>`;
  }
  return`<div class="section-config-line"><span class="section-config-label">内容</span><select aria-label="内容类型" onchange="setDraftField('${scope}',${index},'itemType',this.value,false)">${sectionTypeOptions(normalizeItemType(sec.itemType))}</select><span class="section-config-label">数量</span><input type="number" value="${Math.max(0,parseInt(sec.count)||0)}" min="0" max="99" aria-label="数量" onchange="setDraftField('${scope}',${index},'count',this.value,false)"><select aria-label="列数" onchange="setDraftField('${scope}',${index},'cols',this.value,false)">${sectionColsOptions(sec.cols)}</select><button type="button" class="subsection-add-btn" onclick="addDraftSubsection('${scope}',${index})">＋ 添加子分栏</button></div>`;
}
function renderStandaloneSectionDraft(scope){
  const sec=getDraftSection(scope,0);if(!sec)return;
  const tag=document.getElementById(scope==='add'?'addSectionTag':'quickSectionTag');
  const config=document.getElementById(scope==='add'?'addSectionConfig':'quickSectionConfig');
  if(tag)tag.innerHTML=`<div class="section-config">${sectionTagEditorHtml(sec,scope,0)}</div>`;
  if(config)config.innerHTML=`<div class="section-config">${sectionSettingsHtml(sec,scope,0)}</div>`;
}
function renderSectionList(){
  const list=document.getElementById('sectionList');
  if(!_sections.length){list.innerHTML='<div style="font-size:11px;color:#ccc;padding:8px 0">点下方"添加分栏"设置细分类别</div>';return;}
  list.innerHTML=_sections.map((s,i)=>`<div class="section-row" data-sec-idx="${i}"><input type="text" value="${esc(s.name)}" placeholder="分栏名称" oninput="setDraftField('project',${i},'name',this.value,false)"><button class="del-sec" onclick="removeSectionRow(${i})">×</button><div class="section-config">${sectionTagEditorHtml(s,'project',i)}${sectionSettingsHtml(s,'project',i)}</div></div>`).join('');
  initSectionDrag();
}
function initSectionDrag(){
  if(sectionDragBound)return;
  sectionDragBound=true;
  const list=document.getElementById('sectionList');
  list.addEventListener('pointerdown',e=>{
    if(e.target.closest('.subsection-editor'))return;
    if(e.target.closest('input')||e.target.closest('select')||e.target.closest('button'))return;
    const row=e.target.closest('.section-row');
    if(!row||(e.button!==undefined&&e.button!==0))return;
    clearSectionPress();
    const state={
      row,
      index:parseInt(row.dataset.secIdx),
      pointerId:e.pointerId,
      startY:e.clientY,
      lastY:e.clientY,
      activated:false,
      moved:false,
      timer:null
    };
    sectionPressState=state;
    if(row.setPointerCapture){try{row.setPointerCapture(e.pointerId);}catch(err){}}
    state.timer=setTimeout(()=>{
      if(sectionPressState!==state)return;
      state.timer=null;
      state.activated=true;
      if(navigator.vibrate)navigator.vibrate(12);
    },350);
  });
  list.addEventListener('pointermove',e=>{
    const state=sectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    state.lastY=e.clientY;
    const distance=Math.abs(e.clientY-state.startY);
    if(!state.activated){
      if(distance>10)clearSectionPress();
      return;
    }
    if(distance<=6)return;
    state.moved=true;
    state.row.classList.add('sec-dragging');
    e.preventDefault();
    list.querySelectorAll('.section-row').forEach(r=>r.classList.remove('sec-drag-over'));
    for(const row of list.querySelectorAll('.section-row')){
      const idx=parseInt(row.dataset.secIdx);if(idx===state.index)continue;
      const r=row.getBoundingClientRect();
      if(e.clientY<r.top+r.height/2){row.classList.add('sec-drag-over');break;}
    }
  },{passive:false});
  list.addEventListener('pointerup',e=>{
    const state=sectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    if(state.timer){clearTimeout(state.timer);state.timer=null;}
    if(state.activated&&state.moved)commitSectionDrag(state);
    clearSectionPress();
  });
  list.addEventListener('pointercancel',e=>{
    const state=sectionPressState;
    if(!state||state.pointerId!==e.pointerId)return;
    // A browser interruption must not reorder the section draft.
    clearSectionPress();
  });
  function commitSectionDrag(state){
    let toIdx=_sections.length;
    for(const row of list.querySelectorAll('.section-row')){
      const idx=parseInt(row.dataset.secIdx);if(idx===state.index)continue;
      const r=row.getBoundingClientRect();
      if(state.lastY<r.top+r.height/2){toIdx=idx;break;}
    }
    if(toIdx!==state.index){
      const moved=_sections.splice(state.index,1)[0];
      const insertAt=toIdx>state.index?toIdx-1:toIdx;
      _sections.splice(insertAt,0,moved);
    }
    renderSectionList();
  }
}
function clearSectionPress(){
  const state=sectionPressState;
  if(!state)return;
  if(state.timer)clearTimeout(state.timer);
  try{
    if(state.row&&state.row.releasePointerCapture&&
      (!state.row.hasPointerCapture||state.row.hasPointerCapture(state.pointerId))){
      state.row.releasePointerCapture(state.pointerId);
    }
  }catch(e){}
  state.row&&state.row.classList.remove('sec-dragging');
  document.querySelectorAll('#sectionList .section-row.sec-drag-over').forEach(row=>row.classList.remove('sec-drag-over'));
  sectionPressState=null;
}

let _sectionBannerTemp={quick:'',add:''};

let _bannerDragState=null;
async function persistSectionBanner(value,projectId){
  if(!value||!value.startsWith('data:')||!window.CloudSync)return value||'';
  try{
    return await CloudSync.uploadDataUrl(value,`kitchen/${projectId}_section_${gid()}.jpg`);
  }catch(error){

    return value;
  }

function previewSectionBanner(input,scope){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const MW=800,MH=300;
      let w=img.width,h=img.height;
      if(w>MW){h=h*MW/w;w=MW;}
      if(h>MH){w=w*MH/h;h=MH;}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',0.75);
      _sectionBannerTemp[scope]=data;
      _bannerPosTemp[scope]={x:50,y:50};
      const wrap=document.getElementById(scope+'BannerPreview');
      wrap.style.display='block';
      const pimg=wrap.querySelector('img');
      pimg.src=data;
      pimg.style.objectPosition='50% 50%';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}
function clearSectionBanner(scope){
  _sectionBannerTemp[scope]='';
  _bannerPosTemp[scope]={x:50,y:50};
  const wrap=document.getElementById(scope+'BannerPreview');
  wrap.style.display='none';
  const pimg=wrap.querySelector('img');
  pimg.src='';pimg.style.objectPosition='50% 50%';

function showBannerFull(src){

  document.getElementById('bannerFullView').classList.add('show');

function startBannerDrag(e,scope){
  if(e.target.tagName==='BUTTON')return;
  e.preventDefault();
  const frame=document.getElementById(scope+'BannerPosFrame');
  const img=frame.querySelector('img');
  if(!img.src||!img.naturalWidth)return;
  const startX=e.touches?e.touches[0].clientX:e.clientX;
  const startY=e.touches?e.touches[0].clientY:e.clientY;
  const startPosX=_bannerPosTemp[scope].x;
  const startPosY=_bannerPosTemp[scope].y;
  const frameW=frame.offsetWidth;
  const frameH=frame.offsetHeight;
  const imgAspect=img.naturalWidth/img.naturalHeight;
  const frameAspect=frameW/frameH;
  let rangeX=0,rangeY=0;
  if(imgAspect>frameAspect){rangeX=((img.naturalWidth*(frameH/img.naturalHeight))-frameW);rangeY=0;}
  else{rangeX=0;rangeY=((img.naturalHeight*(frameW/img.naturalWidth))-frameH);}
  function onMove(ev){
    const cx=ev.touches?ev.touches[0].clientX:ev.clientX;
    const cy=ev.touches?ev.touches[0].clientY:ev.clientY;
    const dx=cx-startX;
    const dy=cy-startY;
    let nx=startPosX,ny=startPosY;
    if(rangeX>0)nx=Math.max(0,Math.min(100,startPosX-(dx/rangeX)*100));
    if(rangeY>0)ny=Math.max(0,Math.min(100,startPosY-(dy/rangeY)*100));
    _bannerPosTemp[scope]={x:Math.round(nx*10)/10,y:Math.round(ny*10)/10};
    img.style.objectPosition=_bannerPosTemp[scope].x+'% '+_bannerPosTemp[scope].y+'%';
  }
  function onEnd(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onEnd);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onEnd);
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
}
function resetBannerPos(scope){
  _bannerPosTemp[scope]={x:50,y:50};
  const frame=document.getElementById(scope+'BannerPosFrame');
  if(frame){const img=frame.querySelector('img');if(img)img.style.objectPosition='50% 50%';}
}

function renderDetail(p){
  if(!p)p=getProject(curProjectId);if(!p)return;
  const st=projectStats(p);
  const pct=st.total>0?Math.round(st.collected/st.total*100):0;
  document.getElementById('detailTitle').textContent=p.name;
  document.getElementById('detailOverall').innerHTML=`<span>${st.collected} / ${st.total}</span><div class="detail-overall-bar"><div class="detail-overall-fill" style="width:${pct}%"></div></div><span>${pct}%</span>`;

  const grid=document.getElementById('itemGrid');
  const sections=p.sections&&p.sections.length?p.sections:null;

  if(!sections){
    // No sections: flat grid
    grid.innerHTML=`<div class="section-grid flat-grid" style="grid-template-columns:repeat(3,1fr)">${renderItemCells(p.items,0,3)}</div>`;
    return;
  }

  // With sections: render each section with divider
  let html='';
  let offset=0;
  sections.forEach((sec,si)=>{
    const count=sec.count||0;
    const cols=clampSectionCols(sec.cols);
    const secItems=p.items.slice(offset,offset+count);
    if(sec.name){
      const tagColor=normalizeTagColor(sec.tagColor);
      const typeBadge=sec.tagText?`<span class="section-type-badge" style="background:${tagColor}20;color:${tagColor}">${esc(sec.tagText)}</span>`:'';
      const secSt=sectionStats(p,si);
      const secPct=secSt.total>0?Math.round(secSt.collected/secSt.total*100):0;
      const progressHtml=`<span class="section-progress">${secSt.collected}/${secSt.total} ${secPct}%</span>`;
      html+=`<div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-center"><span class="section-divider-label" title="双击编辑分栏" ondblclick="event.stopPropagation();openSectionQuickEdit(${si})">${esc(sec.name)}${typeBadge}</span>${progressHtml}</div><div class="section-divider-line"></div></div>`;
    }else if(si>0){
      html+=`<div class="section-divider"><div class="section-divider-line"></div></div>`;
    }
    if(sec.bannerImg){
      const bpx=sec.bannerPositionX!=null?sec.bannerPositionX:50;
      const bpy=sec.bannerPositionY!=null?sec.bannerPositionY:50;
      html+=`<div class="section-banner" onclick="showBannerFull('${sec.bannerImg.replace(/'/g,"\\'")}')"><img src="${sec.bannerImg}" alt="" style="object-position:${bpx}% ${bpy}%"></div>`;
    }
    if(Array.isArray(sec.subsections)&&sec.subsections.length){
      let subOff=0;
      sec.subsections.forEach(sub=>{
        const sc=Math.max(0,parseInt(sub.count)||0);
        const subC=clampSectionCols(sub.cols);
        if(sc>0){
          const subLabel=String(sub.name||'').trim()||(normalizeItemType(sub.itemType)==='merch'?'周边':'餐品');
          html+=`<div style="font-size:10px;color:#bbb;padding:3px 14px;margin-top:2px">${esc(subLabel)}</div>`;
          html+=`<div class="section-grid${subC===1?' one-column':''}" style="grid-template-columns:repeat(${subC},1fr)">`;
          html+=renderItemCells(secItems.slice(subOff,subOff+sc),offset+subOff,subC);
          html+=`</div>`;
        }
        subOff+=sc;
      });
      if(subOff<secItems.length){
        html+=`<div class="section-grid${cols===1?' one-column':''}" style="grid-template-columns:repeat(${cols},1fr)">`;
        html+=renderItemCells(secItems.slice(subOff),offset+subOff,cols);
        html+=`</div>`;
      }
    }else{
      html+=`<div class="section-grid${cols===1?' one-column':''}" style="grid-template-columns:repeat(${cols},1fr)">`;
      html+=renderItemCells(secItems,offset,cols);
      html+=`</div>`;
    }
    offset+=count;
  });
  // Any remaining items beyond sections
  if(offset<p.items.length){
    const remaining=p.items.slice(offset);
    html+=`<div class="section-grid" style="grid-template-columns:repeat(3,1fr)">`;
    html+=renderItemCells(remaining,offset,3);
    html+=`</div>`;
  }
  grid.innerHTML=html;
}

    let start=0;
    for(let i=0;i<sectionIdx;i++)start+=Math.max(0,parseInt(p.sections[i].count)||0);

function renderItemCells(items,globalOffset,cols){
  const p=getProject(curProjectId);
  return items.map((item,i)=>{
    const idx=globalOffset+i;
    const hasImg=!!item.img;
    const bt=p?getItemBehaviorType(p,item,idx):'normal';
    const completed=p?isItemCompleted(p,item,idx):!!item.collected;
    const recorded=p?isItemRecorded(p,item,idx):!!item.collected;
    let recordBadge='';
    if(bt==='food'||bt==='content'){
      const history=getCheckinHistory(item);
      if(history.length>1)recordBadge+=`<span class="item-count-badge">×${history.length}</span>`;
    }else if((bt==='merch'||bt==='shopping')&&item.records&&item.records.length){
      if(item.records.length>1)recordBadge+=`<span class="item-count-badge">×${item.records.length}</span>`;
      const hasKeeping=item.records.some(record=>!record.status||record.status==='keeping');
      const hasGone=item.records.some(record=>record.status==='sold'||record.status==='gifted');
      recordBadge+=`<span class="item-status-dot ${hasKeeping&&hasGone?'mixed':hasGone?'sold':'keeping'}"></span>`;
    }
    return`<div class="item-cell ${recorded?'recorded':''} ${completed?'collected':''} ${hasImg?'has-img':''}" data-index="${idx}" onclick="handleItemClick(${idx})">
      ${hasImg?`<img class="item-img" src="${item.img}">`:''}
      ${!isGenericItemName(item.name)?`<span class="item-label">${esc(item.name)}</span>`:''}
      ${completed?'<div class="item-check">✓</div>':''}
      ${recordBadge}
      <button class="item-delete-x" aria-label="删除品目" onclick="event.stopPropagation();deleteGridItem(${idx})">×</button>
    </div>`;
  }).join('');
}

  customConfirm(`删除${label}？图片、日期和感想也会一起删除。`,()=>{
    const group=getItemGroupInfo(p,idx);

function moveGridItem(fromIdx,toIdx){
  const p=getProject(curProjectId);
  if(!p||fromIdx===toIdx||fromIdx<0||toIdx<0||fromIdx>=p.items.length||toIdx>=p.items.length)return false;
  const fromGroup=getItemGroupInfo(p,fromIdx),toGroup=getItemGroupInfo(p,toIdx);
  if(fromGroup.sectionIdx>=0&&toGroup.sectionIdx>=0&&!sameItemGroup(fromGroup,toGroup)){
    adjustSectionGroupCount(p.sections[fromGroup.sectionIdx],fromGroup.subsectionIdx,-1);
    adjustSectionGroupCount(p.sections[toGroup.sectionIdx],toGroup.subsectionIdx,1);
  }
  const scroll=currentScrollY();
  const moved=p.items.splice(fromIdx,1)[0];
  if(toGroup.itemType)moved.itemType=toGroup.itemType;
  p.items.splice(toIdx,0,moved);
  normalizeProjectSubtypes(p);
  normalizeGenericItemNames(p);
  curItemIdx=null;editItemIdx=null;quickItemIdx=null;
  save();
  renderDetail(p);
  restoreDetailScroll(scroll);
