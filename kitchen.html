<!DOCTYPE html>
<!-- Kitchen build: 2026-07-28-polish-fixes -->
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<title>Kitchen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;background:#FAFAFA;color:#1a1a1a;min-height:100vh;min-height:100dvh;padding-bottom:80px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;padding-top:env(safe-area-inset-top,24px);border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:15px;font-weight:600;letter-spacing:2px;color:#8B6914}
.back-btn{font-size:13px;color:#999;text-decoration:none;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px}
.btn-s{font-size:11px;color:#999;background:none;border:1px solid #ddd;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}
.view{display:none}.view.active{display:block}

/* ── Project list (horizontal rows) ── */
.project-list{padding:8px 0}
.project-row{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;transition:background 0.15s;position:relative}
.project-row:active{background:#FFFDF7}
.project-icon-wrap{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FFF8E6;flex-shrink:0}
.project-icon-wrap img{width:100%;height:100%;object-fit:cover}
.project-icon-wrap .emoji-fb{font-size:22px}
.project-row-body{flex:1;min-width:0}
.project-row-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.project-row-name{font-size:14px;font-weight:500;color:#333}
.project-row-meta{font-size:11px;color:#bbb;display:flex;align-items:center;gap:8px}
.project-row-progress{flex:1;max-width:120px;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.project-row-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width 0.3s}
.project-row-pct{font-size:10px;color:#ccc;font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.project-complete-star{font-size:12px;color:#E8B96A;flex-shrink:0}
.project-row-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;background:#fff;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:13px;color:#ccc}
.project-row-add:active{background:#f8f8f8}
/* Duty accent: left border color via inline style */
.duty-badge{font-size:9px;font-weight:500;letter-spacing:0.5px;display:inline-block;padding:1px 6px;border-radius:4px}
/* Project list arrange mode */
.project-row{touch-action:pan-y;position:relative}
.project-delete-x{display:none;position:absolute;top:50%;right:14px;transform:translateY(-50%) scale(0.3);width:20px;height:20px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(120,110,100,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:10px;line-height:17px;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewHome.project-arrange-mode .project-delete-x{display:block;opacity:1;transform:translateY(-50%) scale(1)}
#viewHome.project-arrange-mode .project-row{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewHome.project-arrange-mode .project-row-add{pointer-events:none;opacity:0.35}
.dragging{opacity:0.45;transform:scale(0.97);background:#FFFDF7;transition:opacity 0.2s,transform 0.2s}
.drag-over{box-shadow:0 -2px 0 0 #E8B96A}

/* ── Item detail view ── */
.detail-header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:50}
.detail-header h2{font-size:15px;font-weight:600;color:#333;letter-spacing:0.5px}
.detail-overall{padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:11px;color:#bbb;background:#fff;border-bottom:1px solid #f5f5f5}
.detail-overall-bar{flex:1;height:3px;background:#f0f0f0;border-radius:2px;overflow:hidden}
.detail-overall-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#E8B96A,#D4A24A);transition:width 0.3s}

/* ── Item grid (thumbnails) ── */
.item-grid{padding:16px 0}
.item-cell{aspect-ratio:1;border-radius:10px;border:1.5px solid #e8e8e8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;background:#f5f5f5}
.item-cell:active{transform:scale(0.97)}
.item-cell .item-img{width:100%;height:100%;object-fit:contain;padding:5px;border-radius:9px;position:absolute;top:0;left:0;background:#fff;filter:grayscale(100%) brightness(0.85);transition:filter 0.4s}
.item-cell.collected{border-color:#E8B96A}
.item-cell.collected .item-img{filter:none}
.item-cell .item-num{font-size:20px;font-weight:200;color:#ddd;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.item-cell .item-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.5));color:#fff;font-size:10px;font-weight:500;padding:14px 5px 4px;border-radius:0 0 9px 9px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.item-cell:not(.has-img) .item-label{background:none;color:#ccc;position:static;font-size:9px;padding:0 4px;margin-top:2px}
.item-cell.collected:not(.has-img){background:#FFFDF7;border-color:#E8B96A}
.item-cell.collected:not(.has-img) .item-num{color:#E8B96A}
.item-check{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:rgba(232,185,106,0.9);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;z-index:2}
.item-delete-x{display:none;position:absolute;top:3px;right:3px;width:16px;height:16px;border:1.5px solid rgba(255,255,255,0.9);border-radius:50%;background:rgba(120,110,100,0.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:9px;line-height:13px;font-weight:600;text-align:center;z-index:6;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-family:inherit;opacity:0;transform:scale(0.3);transition:opacity 0.2s,transform 0.2s cubic-bezier(0.34,1.3,0.64,1)}
#viewDetail.arrange-mode .item-cell{cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none}
#viewDetail.arrange-mode .item-delete-x{display:block;opacity:1;transform:scale(1)}
#viewDetail.arrange-mode .item-check{display:none}
#viewDetail.arrange-mode .section-divider-label{pointer-events:none}
#viewDetail.arrange-mode .add-item-btn{pointer-events:none;opacity:0.35;transition:opacity 0.25s}
.item-cell.drag-source{opacity:0.2;transition:opacity 0.15s}
.item-cell.drop-target{box-shadow:0 0 0 2px rgba(232,185,106,0.7);border-color:rgba(232,185,106,0.6);transition:box-shadow 0.15s,border-color 0.15s}
.item-drag-ghost{position:fixed!important;margin:0!important;z-index:500;pointer-events:none;opacity:0.88;transform:scale(1.04) rotate(0.8deg);box-shadow:0 10px 32px rgba(0,0,0,0.18);border-radius:10px}
.item-drag-ghost .item-delete-x,.item-drag-ghost .item-check{display:none!important}
.add-item-btn{margin:0 20px 16px;padding:10px;border:1.5px dashed #ddd;border-radius:10px;background:#fff;font-size:12px;color:#aaa;cursor:pointer;text-align:center;font-family:inherit;width:calc(100% - 40px)}

/* ── Item detail card ── */
.card-detail{width:calc(100% - 40px);max-width:520px;margin:20px auto;background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}
.card-detail-media{min-height:180px;max-height:420px;padding:16px;background:#f7f7f7;display:flex;align-items:center;justify-content:center}
.card-detail-img{display:block;width:auto;max-width:100%;height:auto;max-height:388px;object-fit:contain}
.card-detail-body{padding:14px 16px}
.card-detail-name{font-size:16px;font-weight:600;color:#333;margin-bottom:4px;cursor:default;border-bottom:1px dashed transparent;transition:border-color 0.15s}
.card-detail-name:hover{border-bottom-color:#D8C18B}
.card-detail-name[contenteditable]{outline:none;border-bottom:1px solid #E8B96A;cursor:text}
.card-detail-note[contenteditable]{outline:none;border-bottom:1px solid #E8B96A;cursor:text}
.card-detail-date{font-size:11px;color:#bbb;margin-bottom:8px}
.card-detail-item-note{margin-top:8px;padding:8px 10px;border-radius:8px;background:#faf8f4;font-size:12px;color:#777;line-height:1.6;white-space:pre-wrap}
.card-detail-item-note-label{display:block;margin-bottom:2px;font-size:9px;color:#bbb;letter-spacing:0.8px}
.card-detail-note{font-size:13px;color:#666;line-height:1.6;white-space:pre-wrap}
.card-actions{width:calc(100% - 40px);max-width:520px;display:flex;gap:8px;padding:0;margin:8px auto 0}
.card-actions .btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Modals ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#333}
.modal label{display:block;font-size:12px;color:#999;margin-bottom:4px;margin-top:12px}
.modal input,.modal textarea,.modal select{width:100%;font-size:14px;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-family:inherit;background:#fff;color:#1a1a1a}
.modal textarea{resize:vertical;min-height:50px}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-primary{background:#1a1a1a;color:#fff}
.btn-cancel{background:#f0f0f0;color:#666}
.btn-del{background:#fff;color:#D85A30;border:1px solid #f0d0c0}
.file-label{display:block;padding:10px 12px;border:1px dashed #ddd;border-radius:8px;text-align:center;color:#aaa;font-size:12px;cursor:pointer;margin-top:4px}
.img-preview{width:100%;border-radius:8px;margin-top:8px;max-height:240px;object-fit:contain;background:#f7f7f7}
/* Duty color selector */
.duty-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.duty-opt{padding:4px 10px;border-radius:6px;border:1.5px solid #e0e0e0;font-size:12px;cursor:pointer;font-family:inherit;background:#fff;transition:all 0.15s}
.duty-opt.active{border-width:2px}
.duty-custom-row{display:flex;gap:6px;align-items:center;margin-top:8px}
.duty-custom-row input{flex:1}
.color-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #ddd;cursor:pointer;flex-shrink:0}
.color-picker-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border 0.15s}
.color-swatch.active{border-color:#333}

/* ── Checkin celebration ── */
.checkin-popup{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center}
.checkin-popup.show{display:flex}
.checkin-box{background:#fff;border-radius:16px;padding:24px 20px;width:85%;max-width:300px;text-align:center;animation:revealPop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes revealPop{from{transform:scale(0.6);opacity:0}to{transform:scale(1);opacity:1}}
.checkin-char-img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid #f0f0f0}
.checkin-char-placeholder{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;color:#fff}
.checkin-char-name{font-size:12px;font-weight:600;letter-spacing:0.5px;margin-bottom:4px}
.checkin-char-line{font-size:13px;color:#555;line-height:1.5;margin-bottom:16px;font-style:italic}
.checkin-ok{padding:10px 32px;border:1px solid #e0e0e0;border-radius:10px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}

/* ── Section dividers ── */
.section-divider{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0}
.section-divider-line{flex:1;height:1px;background:#e0e0e0}
.section-divider-label{font-size:11px;color:#999;font-weight:500;letter-spacing:0.3px;cursor:text;border-bottom:1px dashed transparent;transition:color 0.15s,border-color 0.15s}
.section-divider-label:hover{color:#8B6914;border-bottom-color:#D8C18B}
.section-divider-cols{font-size:10px;color:#ccc}
.section-grid{display:grid;gap:8px;padding:8px 20px 16px}
.section-grid.flat-grid{padding-top:0}
@media (min-width:700px){
  .item-grid{max-width:640px;margin:0 auto}
  #viewDetail>.add-item-btn{display:block;max-width:600px;margin-left:auto;margin-right:auto}
}
/* Section editor in modal */
.section-list{margin-top:8px}
.section-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5f5f5}
.section-row input{flex:1;font-size:13px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:6px;font-family:inherit}
.section-row select{width:60px;font-size:12px;padding:4px;border:1px solid #e0e0e0;border-radius:6px;font-family:inherit}
.section-row .del-sec{font-size:12px;color:#ccc;background:none;border:none;cursor:pointer;padding:4px}
.section-row.sec-dragging{opacity:0.4;background:#f8f8f8}
.section-row.sec-drag-over{box-shadow:0 -2px 0 0 #E8B96A}
.add-section-btn{font-size:12px;color:#aaa;background:none;border:1px dashed #ddd;border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:6px;font-family:inherit;width:100%}

/* ── Action sheet ── */
.action-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:250;display:none;align-items:flex-end;justify-content:center}
.action-sheet-bg.show{display:flex}
.action-sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:400px;padding:8px 0 env(safe-area-inset-bottom,8px)}
.action-sheet button{display:block;width:100%;padding:14px;background:none;border:none;border-bottom:1px solid #f5f5f5;font-size:14px;cursor:pointer;font-family:inherit;color:#333}
.action-sheet button:active{background:#f8f8f8}
.action-sheet button.cancel-as{color:#999;border-bottom:none}
.action-sheet button.del-as{color:#D85A30}

/* ── Confirm ── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:none;align-items:center;justify-content:center}
.confirm-bg.show{display:flex}
.confirm-box{background:#fff;border-radius:16px;width:85%;max-width:320px;padding:24px 20px;text-align:center}
.confirm-box p{font-size:14px;color:#333;margin-bottom:16px;line-height:1.5}
.confirm-box .btn-row{display:flex;gap:8px;justify-content:center}
.confirm-box .btn{min-width:80px;flex:none;padding:10px 16px;font-size:13px}

/* ── Toast ── */
.toast{position:fixed;top:env(safe-area-inset-top,20px);left:50%;transform:translateX(-50%) translateY(-120%);background:rgba(30,30,30,0.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:13px;padding:10px 20px;border-radius:10px;z-index:400;pointer-events:none;transition:transform 0.3s cubic-bezier(0.34,1.3,0.64,1),opacity 0.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<!-- ═══ HOME VIEW ═══ -->
<div id="viewHome" class="view active">
  <div class="top-bar">
    <a class="back-btn" href="index.html">← Home</a>
    <h1>KITCHEN</h1>
    <button class="btn-s" onclick="openModal('backupModal')">备份</button>
  </div>
  <div class="project-list" id="projectList"></div>
</div>

<!-- ═══ DETAIL VIEW ═══ -->
<div id="viewDetail" class="view">
  <div class="detail-header">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <h2 id="detailTitle"></h2>
    <button class="btn-s" id="projectHeaderBtn" onclick="handleProjectHeaderButton()">⋯</button>
  </div>
  <div class="detail-overall" id="detailOverall"></div>
  <div class="item-grid" id="itemGrid"></div>
  <button class="add-item-btn" onclick="openAddItem()">+ 添加品目</button>
  <button class="add-item-btn" style="border-color:#E8B96A;color:#E8B96A" onclick="openAddSection()">+ 追加新一弹</button>
</div>
<input type="file" accept="image/*" id="quickItemImgInput" onchange="quickItemImgSelected(this)" style="display:none">

<!-- ═══ ITEM VIEW ═══ -->
<div id="viewItem" class="view">
  <div class="detail-header">
    <button class="back-btn" id="itemBackBtn">← 返回</button>
    <h2 id="itemTitle"></h2>
    <button class="btn-s" onclick="openItemMenu()">⋯</button>
  </div>
  <div id="itemContent"></div>
</div>

<!-- ═══ MODALS ═══ -->

<!-- Add/Edit project -->
<div class="modal-bg" id="projectModal">
  <div class="modal">
    <h2 id="projectModalTitle">添加项目</h2>
    <label>项目图标</label>
    <label class="file-label" id="projectIconLabel">点击选择图片</label>
    <input type="file" accept="image/*" id="projectIconInput" onchange="previewProjectIcon(this)" style="display:none">
    <img id="projectIconPreview" class="img-preview" style="display:none">
    <label>项目名</label>
    <input type="text" id="inputProjectName" placeholder="如: Subway 三明治收集">
    <label>项目细分</label>
    <div class="section-list" id="sectionList"></div>
    <button class="add-section-btn" onclick="addSectionRow()">+ 添加分栏</button>
    <label>备注（选填）</label>
    <textarea id="inputProjectNote" placeholder="心斋桥店、只记常规款…"></textarea>
    <label>值班</label>
    <div class="duty-row" id="dutyRow"></div>
    <div class="duty-custom-row" id="dutyCustomRow" style="display:none">
      <input type="text" id="dutyCustomName" placeholder="如: Hello Kitty">
      <div class="color-picker-row" id="colorPicker"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('projectModal')">取消</button>
      <button class="btn btn-primary" onclick="saveProject()">保存</button>
    </div>
  </div>
</div>

<!-- Add/Edit item -->
<div class="modal-bg" id="itemModal">
  <div class="modal">
    <h2 id="itemModalTitle">添加品目</h2>
    <div id="itemSectionField" style="display:none">
      <label>所属分类</label>
      <select id="inputItemSection"></select>
    </div>
    <label>名称</label>
    <input type="text" id="inputItemName" placeholder="品目名称">
    <label>备注（选填）</label>
    <textarea id="inputItemNote" placeholder="口感、评价…"></textarea>
    <label>照片</label>
    <label class="file-label" id="itemFileLabel">点击选择图片</label>
    <input type="file" accept="image/*" id="itemImgInput" onchange="previewItemImg(this)" style="display:none">
    <img id="itemImgPreview" class="img-preview" style="display:none">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('itemModal')">取消</button>
      <button class="btn btn-del" id="itemDeleteBtn" style="display:none" onclick="deleteEditingItem()">删除</button>
      <button class="btn btn-primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- Check-in modal -->
<div class="modal-bg" id="checkinModal">
  <div class="modal">
    <h2>打卡记录</h2>
    <label>品名</label>
    <input type="text" id="checkinItemName" placeholder="品目名称">
    <label>日期</label>
    <input type="date" id="checkinDate">
    <label>一句话感想（选填）</label>
    <input type="text" id="checkinNote" maxlength="120" placeholder="味道怎么样、有什么想记的…">
    <label>打卡照片（选填）</label>
    <label class="file-label" id="checkinImgLabel">点击选择图片</label>
    <input type="file" accept="image/*" id="checkinImgInput" onchange="previewCheckinImg(this)" style="display:none">
    <img id="checkinImgPreview" class="img-preview" style="display:none">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal('checkinModal')">取消</button>
      <button class="btn btn-primary" onclick="saveCheckin()">打卡</button>
    </div>
  </div>

<script>
if(window.__LIMINAL_REDIRECTING) throw new Error('Redirecting to cloud login');

/* ═══ DATA ═══ */
const SK='kitchen_db';
let projects=[];
try{projects=JSON.parse(localStorage.getItem(SK))||[];}catch(e){projects=[];}

// Migrate from old goshanbou key FIRST (before format migration)
(function(){try{
  if(!projects.length){
    const old=localStorage.getItem('goshanbou_v3');
    if(old){projects=JSON.parse(old);localStorage.setItem(SK,JSON.stringify(projects));}
  }
}catch(e){}})();

// Migrate from old format (shops with series)
if(projects.length&&projects[0]&&projects[0].series){
  const migrated=[];
  projects.forEach(shop=>{
    (shop.series||[]).forEach(ser=>{
      const items=(ser.dishes||[]).map((d,i)=>({
        id:d.id||('it_'+Date.now()+'_'+i),name:d.name||('品目'+(i+1)),
        note:d.note||'',img:d.img||'',collected:!!d.collected,
        collectedDate:d.collectedDate||d.date||null,
        checkinNote:d.checkinNote||'',checkinImg:d.checkinImg||''
      }));
      migrated.push({
        id:shop.id+'_'+ser.id,name:shop.name+(shop.series.length>1?' - '+ser.name:''),
        note:shop.note||'',icon:shop.icon||'',count:ser.count||items.length,
        duty:shop.char?{type:shop.char,color:shop.char==='neal'?'#6B8AFF':shop.char==='jane'?'#5BA66B':'#D85A30',name:''}:{type:'',color:'#E8B96A',name:''},
        items:items,order:migrated.length
      });
    });
    if(!shop.series||!shop.series.length){
      migrated.push({
        id:shop.id,name:shop.name,note:shop.note||'',icon:shop.icon||'',count:0,
        duty:shop.char?{type:shop.char,color:shop.char==='neal'?'#6B8AFF':shop.char==='jane'?'#5BA66B':'#D85A30',name:''}:{type:'',color:'#E8B96A',name:''},
        items:[],order:migrated.length
      });
    }
  });
  if(migrated.length){projects=migrated;save();}
}

let curProjectId=null, curItemIdx=null, quickItemIdx=null, editSectionIdx=null;
let editProjectId=null, editItemIdx=null;
let projectTempIcon='';
const detailScrollByProject={};
let itemArrangeMode=false,itemPressState=null,itemDragState=null,itemClickSuppressedUntil=0;

function save(){localStorage.setItem(SK,JSON.stringify(projects));}
function gid(){return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ═══ CUSTOM DIALOGS (replace confirm/alert/prompt) ═══ */
function customConfirm(msg,onYes,opts){
  const bg=document.getElementById('confirmBg');
  const box=bg.querySelector('.confirm-box');
  const yesLabel=(opts&&opts.yes)||'确定';
  const noLabel=(opts&&opts.no)||'取消';
  const isDanger=opts&&opts.danger;
  box.innerHTML=`<p>${msg}</p><div class="btn-row"><button class="btn btn-cancel" id="confirmNo">${esc(noLabel)}</button><button class="btn ${isDanger?'btn-del':'btn-primary'}" id="confirmYes">${esc(yesLabel)}</button></div>`;
  bg.classList.add('show');
  box.querySelector('#confirmYes').onclick=()=>{bg.classList.remove('show');onYes();};
  box.querySelector('#confirmNo').onclick=()=>{bg.classList.remove('show');};
  bg.onclick=e=>{if(e.target===bg)bg.classList.remove('show');};
}
let _toastTimer=null;
function showToast(msg,ms){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),ms||2200);
}
function getProject(id){return projects.find(p=>p.id===id);}
function projectStats(p){const total=Math.max(p.count||0,p.items.length);const collected=p.items.filter(i=>i.collected).length;return{total,collected};}
function normalizeGenericItemNames(p){
  if(!p||!Array.isArray(p.items))return;
  p.items.forEach((item,i)=>{if(/^品目\d+$/.test(item.name||''))item.name='品目'+(i+1);});
}

/* ═══ VIEWS ═══ */
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goHome(){setItemArrangeMode(false);switchView('viewHome');renderProjects();}
function currentScrollY(){return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;}
function rememberDetailScroll(){
  if(curProjectId)detailScrollByProject[curProjectId]=currentScrollY();
}
function restoreDetailScroll(y){
  const target=Math.max(0,Number(y)||0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,target)));
}
function returnToDetail(){
  const p=getProject(curProjectId);if(!p)return;
  const detailIsActive=document.getElementById('viewDetail').classList.contains('active');
  const target=detailIsActive?currentScrollY():(detailScrollByProject[curProjectId]||0);
  detailScrollByProject[curProjectId]=target;
  renderDetail(p);
  switchView('viewDetail');
  restoreDetailScroll(target);
}

/* ═══ DUTY PRESETS ═══ */
const DUTY_PRESETS=[
  {type:'neal',name:'Neal',color:'#6B8AFF'},
  {type:'jane',name:'Jane',color:'#5BA66B'},
  {type:'will',name:'Will',color:'#D85A30'}
];
const CUSTOM_COLORS=['#E8B96A','#D85A30','#E84A7A','#9B6BCC','#4AADE8','#5BA66B','#6B8AFF','#888'];

/* ── Celebration lines per character ── */
const CHECKIN_LINES={
  neal:[
    {mood:'微笑',line:'看起来还不错，摆盘有进步。'},
    {mood:'满意',line:'这个我可以给 7 分。嗯……7.5。'},

  ],
  jane:[
    {mood:'嘴角微扬',line:'嗯……还行。仅此而已。'},
    {mood:'喝茶',line:'吃完了？那来杯茶消消食。'},
    {mood:'观察中',line:'你刚才吃第一口的表情……值得记录。'},
    {mood:'心情不错',line:'偶尔吃点好的也不是坏事。'},
    {mood:'做笔记',line:'已记录。继续收集。'}
  ],
  will:[
    {mood:'开心',line:'好吃吗好吃吗！！我也想吃！'},
    {mood:'心满意足',line:'吃饱了就是幸福～你说对不对！'},
    {mood:'撒娇',line:'下次带我一起去嘛～'},
    {mood:'研究外卖',line:'还有几款没吃？我帮你排计划！'},
    {mood:'饿了',line:'看着你打卡我又饿了……'}
  ],
  other:[
    {mood:'✦',line:'又完成一个，继续加油。'},
    {mood:'★',line:'收集进度 +1！'},
    {mood:'♪',line:'不错不错，记录下来了。'}
  ]
};
function showCheckinCelebration(duty){
  const d=duty||{};
  const charType=d.type||'';
  const lines=CHECKIN_LINES[charType]||CHECKIN_LINES.other;
  const pick=lines[Math.floor(Math.random()*lines.length)];
  const color=d.color||'#E8B96A';
  const name=charType?DUTY_PRESETS.find(p=>p.type===charType)?.name||d.name||'':'';

  let visual='';
  if(name){
    visual=`<div class="checkin-char-placeholder" style="background:${color}">${name[0]}</div>`;
  }else if(d.name){
    visual=`<div class="checkin-char-placeholder" style="background:${color}">${d.name[0]||'★'}</div>`;
  }else{
    visual=`<div class="checkin-char-placeholder" style="background:#E8B96A">✦</div>`;
  }
  document.getElementById('checkinCharVisual').innerHTML=visual;
  document.getElementById('checkinCharName').textContent=name||d.name||'';

function closeCheckinPopup(){document.getElementById('checkinPopup').classList.remove('show');}

/* ═══ PROJECT LIST ═══ */
function renderProjects(){
  const list=document.getElementById('projectList');
  let html=projects.sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>{
    const st=projectStats(p);
    const pct=st.total>0?Math.round(st.collected/st.total*100):0;
    const done=st.collected>=st.total&&st.total>0;
    const iconHtml=p.icon?`<img src="${p.icon}" alt="">`:`<div class="emoji-fb">🍽</div>`;
    const duty=p.duty||{};
    const dutyColor=duty.color||'#E8B96A';
    const dutyName=duty.type?DUTY_PRESETS.find(d=>d.type===duty.type)?.name||duty.name||'':duty.name||'';
    const dutyBadge=dutyName?`<span class="duty-badge" style="background:${dutyColor}15;color:${dutyColor}">${esc(dutyName)}</span>`:'';
    const borderStyle=dutyName?`border-left:3px solid ${dutyColor}`:'';
    const fillStyle=dutyName?`background:linear-gradient(90deg,${dutyColor},${dutyColor}cc)`:'';
    return`<div class="project-row" style="${borderStyle}" data-id="${p.id}" onclick="handleProjectRowClick('${p.id}')">
      <div class="project-icon-wrap">${iconHtml}</div>
      <div class="project-row-body">
        <div class="project-row-top">
          <span class="project-row-name">${esc(p.name)}</span>
          ${dutyBadge}
          ${done?'<span class="project-complete-star">★</span>':''}
        </div>
        <div class="project-row-meta">
          <span>${st.collected} / ${st.total}</span>
          <div class="project-row-progress"><div class="project-row-fill" style="width:${pct}%;${fillStyle}"></div></div>
          <span class="project-row-pct">${pct}%</span>
        </div>
      </div>
      <button class="project-delete-x" aria-label="删除项目" onclick="event.stopPropagation();deleteProjectById('${p.id}')">×</button>
    </div>`;
  }).join('');
  html+=`<div class="project-row-add" onclick="openAddProject()">+ 添加项目</div>`;
  list.innerHTML=html;
  initProjectDrag();
}

let projectArrangeMode=false,projectClickSuppressed=0;
function setProjectArrangeMode(active){
  projectArrangeMode=!!active;
  document.getElementById('viewHome').classList.toggle('project-arrange-mode',projectArrangeMode);
  if(!projectArrangeMode)projectClickSuppressed=Date.now()+400;
}
function handleProjectRowClick(id){
  if(projectArrangeMode||Date.now()<projectClickSuppressed)return;
  openProject(id);
}
function deleteProjectById(id){
  const p=projects.find(pr=>pr.id===id);
  const name=p?p.name:'项目';
  customConfirm(`删除「${esc(name)}」？所有品目和打卡记录都会消失。`,()=>{
    const deletingCurrent=curProjectId===id;
    projects=projects.filter(pr=>pr.id!==id);
    if(deletingCurrent){
      curProjectId=null;curItemIdx=null;quickItemIdx=null;
      editProjectId=null;editItemIdx=null;editSectionIdx=null;
      setItemArrangeMode(false);
      switchView('viewHome');
    }
    save();renderProjects();
    if(!projects.length)setProjectArrangeMode(false);
  },{yes:'删除',danger:true});
}
function initProjectDrag(){
  const list=document.getElementById('projectList');
  let dragEl=null,pressTimer=null,startY=0,pointerId=-1,activated=false;
  list.addEventListener('pointerdown',onDown);
  list.addEventListener('pointermove',onMove,{passive:false});
  list.addEventListener('pointerup',onUp);
  list.addEventListener('pointercancel',onUp);
  function onDown(e){
    if(e.target.closest('.project-delete-x'))return;
    const row=e.target.closest('.project-row');if(!row||e.button)return;
    startY=e.clientY;activated=false;pointerId=e.pointerId;
    pressTimer=setTimeout(()=>{
      activated=true;dragEl=row;dragEl.classList.add('dragging');
      if(!projectArrangeMode)setProjectArrangeMode(true);
      if(navigator.vibrate)navigator.vibrate(12);
      try{row.setPointerCapture(e.pointerId);}catch(err){}
    },projectArrangeMode?170:450);
  }
  function onMove(e){
    if(pressTimer&&!activated&&Math.abs(e.clientY-startY)>8){clearTimeout(pressTimer);pressTimer=null;return;}
    if(!dragEl||!activated)return;e.preventDefault();
    const y=e.clientY;
    list.querySelectorAll('.project-row').forEach(c=>c.classList.remove('drag-over'));
    for(const card of list.querySelectorAll('.project-row')){if(card===dragEl)continue;const r=card.getBoundingClientRect();if(y<r.top+r.height/2){card.classList.add('drag-over');break;}}
  }
  function onUp(e){
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(!dragEl){activated=false;return;}
    const y=e.clientY;const dragId=dragEl.dataset.id;
    dragEl.classList.remove('dragging');
    list.querySelectorAll('.project-row').forEach(c=>c.classList.remove('drag-over'));
    let insertBefore=null;
    for(const card of list.querySelectorAll('.project-row')){if(card===dragEl||!card.dataset.id)continue;const r=card.getBoundingClientRect();if(y<r.top+r.height/2){insertBefore=card.dataset.id;break;}}
    const item=projects.find(p=>p.id===dragId);
    if(item){
      const others=projects.filter(p=>p.id!==dragId);const newOrder=[];
      if(!insertBefore){others.forEach(p=>newOrder.push(p));newOrder.push(item);}
      else{others.forEach(p=>{if(p.id===insertBefore)newOrder.push(item);newOrder.push(p);});}
      newOrder.forEach((p,i)=>p.order=i);projects=newOrder;save();renderProjects();
    }
    dragEl=null;activated=false;
  }
  // Tap empty to exit
  document.getElementById('viewHome').addEventListener('click',e=>{
    if(!projectArrangeMode)return;
    if(e.target.closest('.project-row')||e.target.closest('.btn-s')||e.target.closest('.back-btn'))return;
    setProjectArrangeMode(false);
  });
}

/* ═══ PROJECT MODAL ═══ */
function renderDutyRow(selected){
  const row=document.getElementById('dutyRow');
  const selType=(selected&&selected.type)||'';
  let html=DUTY_PRESETS.map(d=>{
    const active=selType===d.type;
    return`<button class="duty-opt ${active?'active':''}" style="border-color:${d.color};${active?'background:'+d.color+'15;color:'+d.color:''}" onclick="selectDuty('${d.type}')">${d.name}</button>`;
  }).join('');
  html+=`<button class="duty-opt ${selType==='custom'?'active':''}" style="${selType==='custom'?'border-color:'+(selected.color||'#E8B96A'):''}" onclick="selectDuty('custom')">其他</button>`;
  row.innerHTML=html;
  document.getElementById('dutyCustomRow').style.display=selType==='custom'?'flex':'none';
  if(selType==='custom'){
    document.getElementById('dutyCustomName').value=(selected&&selected.name)||'';
    renderColorPicker((selected&&selected.color)||'#E8B96A');
  }
}
function renderColorPicker(activeColor){
  document.getElementById('colorPicker').innerHTML=CUSTOM_COLORS.map(c=>
    `<div class="color-swatch ${c===activeColor?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
}
let _dutyState={type:'',color:'#E8B96A',name:''};
function selectDuty(type){
  if(type==='custom'){_dutyState.type='custom';renderDutyRow(_dutyState);}
  else{const preset=DUTY_PRESETS.find(d=>d.type===type);_dutyState={type:type,color:preset.color,name:preset.name};renderDutyRow(_dutyState);}
}
function pickColor(c){_dutyState.color=c;renderColorPicker(c);}

/* ── Section rows in modal ── */
let _sections=[];
function renderSectionList(){
  const list=document.getElementById('sectionList');
  if(!_sections.length){list.innerHTML='<div style="font-size:11px;color:#ccc;padding:8px 0">点下方"添加分栏"设置细分类别</div>';return;}
  list.innerHTML=_sections.map((s,i)=>`<div class="section-row" data-sec-idx="${i}">
    <input type="text" value="${esc(s.name)}" placeholder="分栏名称" onchange="_sections[${i}].name=this.value">
    <input type="number" value="${s.count||0}" min="0" max="99" style="width:50px" placeholder="数量" onchange="_sections[${i}].count=parseInt(this.value)||0">
    <select onchange="_sections[${i}].cols=parseInt(this.value)">
      <option value="2"${s.cols===2?' selected':''}>2列</option>
      <option value="3"${s.cols===3?' selected':''}>3列</option>
      <option value="4"${s.cols===4?' selected':''}>4列</option>
    </select>
    <button class="del-sec" onclick="_sections.splice(${i},1);renderSectionList()">×</button>
  </div>`).join('');
  initSectionDrag();
}
function initSectionDrag(){
  const list=document.getElementById('sectionList');
  let dragIdx=-1,pressTimer=null,startY=0,activated=false;
  list.addEventListener('pointerdown',e=>{
    if(e.target.closest('input')||e.target.closest('select')||e.target.closest('button'))return;
    const row=e.target.closest('.section-row');if(!row||e.button)return;
    dragIdx=parseInt(row.dataset.secIdx);startY=e.clientY;activated=false;
    pressTimer=setTimeout(()=>{
      activated=true;row.classList.add('sec-dragging');
      if(navigator.vibrate)navigator.vibrate(12);
      try{row.setPointerCapture(e.pointerId);}catch(err){}
    },350);
  });
  list.addEventListener('pointermove',e=>{
    if(pressTimer&&!activated&&Math.abs(e.clientY-startY)>8){clearTimeout(pressTimer);pressTimer=null;return;}
    if(!activated||dragIdx<0)return;e.preventDefault();
    list.querySelectorAll('.section-row').forEach(r=>r.classList.remove('sec-drag-over'));
    const y=e.clientY;
    for(const row of list.querySelectorAll('.section-row')){
      const idx=parseInt(row.dataset.secIdx);if(idx===dragIdx)continue;
      const r=row.getBoundingClientRect();
      if(y<r.top+r.height/2){row.classList.add('sec-drag-over');break;}
    }
  },{passive:false});
  function finish(e){
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(!activated||dragIdx<0){activated=false;dragIdx=-1;return;}
    const y=e.clientY;let toIdx=_sections.length;
    for(const row of list.querySelectorAll('.section-row')){
      const idx=parseInt(row.dataset.secIdx);if(idx===dragIdx)continue;
      const r=row.getBoundingClientRect();
      if(y<r.top+r.height/2){toIdx=idx;break;}
    }
    if(toIdx!==dragIdx){
      const moved=_sections.splice(dragIdx,1)[0];
      const insertAt=toIdx>dragIdx?toIdx-1:toIdx;
      _sections.splice(insertAt,0,moved);
    }
    dragIdx=-1;activated=false;
    renderSectionList();
  }
  list.addEventListener('pointerup',finish);
  list.addEventListener('pointercancel',finish);
}
function addSectionRow(){
  _sections.push({name:'',count:0,cols:3});
  renderSectionList();
}

function openAddProject(){
  editProjectId=null;projectTempIcon='';
  document.getElementById('projectModalTitle').textContent='添加项目';
  document.getElementById('inputProjectName').value='';

async function saveProject(){
  const name=document.getElementById('inputProjectName').value.trim();if(!name)return;
  const note=document.getElementById('inputProjectNote').value.trim();
  let duty={..._dutyState};
  if(duty.type==='custom'){duty.name=document.getElementById('dutyCustomName').value.trim();}
  let icon=projectTempIcon;
  if(icon&&icon.startsWith('data:')&&window.CloudSync){try{icon=await CloudSync.uploadDataUrl(icon,`kitchen/${editProjectId||gid()}_icon.jpg`);}catch(e){}}

  // Build sections data
  const sections=_sections.filter(s=>s.count>0||s.name).map(s=>({name:s.name||'',count:Math.max(0,s.count||0),cols:s.cols||3}));
  const totalCount=sections.reduce((sum,s)=>sum+s.count,0);

  if(editProjectId){
    const p=getProject(editProjectId);
    if(p){
      p.name=name;p.note=note;p.duty=duty;if(icon)p.icon=icon;
      p.sections=sections;
      // Grow: add empty slots at end
      while(p.items.length<totalCount)p.items.push({id:gid(),name:'品目'+(p.items.length+1),note:'',img:'',collected:false,collectedDate:null,checkinNote:'',checkinImg:''});
      // Shrink: scan from end, remove ALL empty items (skip over content items)
      if(p.items.length>totalCount){
        const keep=[];
        for(let i=0;i<p.items.length;i++){
          const it=p.items[i];
          if(i<totalCount||it.collected||it.img||it.note||it.checkinNote||it.checkinImg){
            keep.push(it);
          }
        }
        p.items=keep;
      }
      // Reconcile: ensure p.count === p.items.length === sum of section.count
      const actualLen=p.items.length;
      if(actualLen!==totalCount){
        // Distribute overflow into last section
        const diff=actualLen-totalCount;
        if(p.sections.length)p.sections[p.sections.length-1].count+=diff;
      }
      p.count=p.items.length;
    }
  }else{
    const items=[];for(let i=0;i<totalCount;i++)items.push({id:gid(),name:'品目'+(i+1),note:'',img:'',collected:false,collectedDate:null,checkinNote:'',checkinImg:''});
    projects.push({id:gid(),name,note,icon:icon||'',count:totalCount,duty,items,sections,order:projects.length});
  }
  save();closeModal('projectModal');
  if(editProjectId){renderDetail();}
  renderProjects();
}

function renderDetail(p){

  const grid=document.getElementById('itemGrid');

  if(!sections){
    // No sections: flat grid
    grid.innerHTML=`<div class="section-grid flat-grid" style="grid-template-columns:repeat(3,1fr)">${renderItemCells(p.items,0,3)}</div>`;
    return;
  }

  // With sections: render each section with divider
  let html='';
  let offset=0;
  sections.forEach((sec,si)=>{
    const count=sec.count||0;
    const cols=sec.cols||3;
    const secItems=p.items.slice(offset,offset+count);
    if(sec.name){
      html+=`<div class="section-divider"><div class="section-divider-line"></div><span class="section-divider-label" title="双击编辑分栏" ondblclick="event.stopPropagation();openSectionQuickEdit(${si})">${esc(sec.name)}</span><span class="section-divider-cols">${cols}列</span><div class="section-divider-line"></div></div>`;
    }else if(si>0){
      html+=`<div class="section-divider"><div class="section-divider-line"></div></div>`;
    }
    html+=`<div class="section-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
    html+=renderItemCells(secItems,offset,cols);

    offset+=count;

  if(offset<p.items.length){
    const remaining=p.items.slice(offset);
    html+=`<div class="section-grid" style="grid-template-columns:repeat(3,1fr)">`;
    html+=renderItemCells(remaining,offset,3);

function deleteGridItem(idx){
  const p=getProject(curProjectId);if(!p||!p.items[idx])return;
  const item=p.items[idx];
  const generic=!item.name||/^品目\d+$/.test(item.name);

    itemClickSuppressedUntil=Date.now()+400;
    save();renderDetail(p);restoreDetailScroll(scroll);
  },{yes:'删除',danger:true});

function moveGridItem(fromIdx,toIdx){
  const p=getProject(curProjectId);
  if(!p||fromIdx===toIdx||fromIdx<0||toIdx<0||fromIdx>=p.items.length||toIdx>=p.items.length)return false;
  // Fix section counts when crossing sections
  if(p.sections&&p.sections.length){
    const fromSec=getItemSectionIndex(p,fromIdx);
    // After splice, toIdx shifts if fromIdx < toIdx
    const adjustedTo=fromIdx<toIdx?toIdx-1:toIdx;
    const tempItems=[...p.items];tempItems.splice(fromIdx,1);
    // Determine target section in the post-splice array
    let toSec=-1,off=0;
    for(let i=0;i<p.sections.length;i++){
      const c=Math.max(0,parseInt(p.sections[i].count)||0)-(i===fromSec?1:0);
      if(adjustedTo<off+c){toSec=i;break;}
      off+=c;
    }
    if(toSec<0)toSec=p.sections.length-1;
    if(fromSec>=0&&toSec>=0&&fromSec!==toSec){
      p.sections[fromSec].count=Math.max(0,(parseInt(p.sections[fromSec].count)||0)-1);
      p.sections[toSec].count=(parseInt(p.sections[toSec].count)||0)+1;
    }
  }
  const scroll=currentScrollY();
  const moved=p.items.splice(fromIdx,1)[0];
  p.items.splice(toIdx,0,moved);
  normalizeGenericItemNames(p);
  curItemIdx=null;editItemIdx=null;quickItemIdx=null;
  save();
  renderDetail(p);
  restoreDetailScroll(scroll);
  return true;
}
function releaseItemPointer(state){
  if(!state||!state.cell||!state.cell.releasePointerCapture)return;
  try{
    if(!state.cell.hasPointerCapture||state.cell.hasPointerCapture(state.pointerId))state.cell.releasePointerCapture(state.pointerId);
  }catch(e){}
}
function clearItemPressState(){
  const state=itemPressState;
  if(state&&state.timer)clearTimeout(state.timer);
  releaseItemPointer(state);
  itemPressState=null;
}
function beginItemDrag(state){
  if(!state||itemDragState||!state.cell||!state.cell.isConnected)return;
  if(state.timer){clearTimeout(state.timer);state.timer=null;}
  const rect=state.cell.getBoundingClientRect();
  const ghost=state.cell.cloneNode(true);
  ghost.classList.remove('drag-source','drop-target');
  ghost.classList.add('item-drag-ghost');
  ghost.removeAttribute('onclick');
  ghost.style.width=rect.width+'px';
  ghost.style.height=rect.height+'px';
  document.body.appendChild(ghost);
  state.cell.classList.add('drag-source');
  itemDragState={from:state.idx,target:state.idx,source:state.cell,ghost,width:rect.width,height:rect.height};
  updateItemDrag(state.lastX,state.lastY);
}
function updateItemDrag(x,y){
  const drag=itemDragState;if(!drag)return;
  drag.ghost.style.left=(x-drag.width/2)+'px';
  drag.ghost.style.top=(y-drag.height/2)+'px';
  document.querySelectorAll('#itemGrid .item-cell.drop-target').forEach(cell=>cell.classList.remove('drop-target'));
  const under=document.elementFromPoint(x,y);
  const target=under&&under.closest?under.closest('#itemGrid .item-cell'):null;
  if(target){
    const idx=parseInt(target.dataset.index);
    if(Number.isInteger(idx)){
      drag.target=idx;
      if(idx!==drag.from)target.classList.add('drop-target');
    }
  }
  const edge=72;
  if(y<edge&&window.scrollBy)window.scrollBy(0,-12);
  else if(y>window.innerHeight-edge&&window.scrollBy)window.scrollBy(0,12);
}
function finishItemDrag(commit){
  const drag=itemDragState;if(!drag)return;
  drag.source&&drag.source.classList.remove('drag-source');
  document.querySelectorAll('#itemGrid .item-cell.drop-target').forEach(cell=>cell.classList.remove('drop-target'));
  drag.ghost&&drag.ghost.remove();
  itemDragState=null;
  itemClickSuppressedUntil=Date.now()+700;
  if(commit&&drag.from!==drag.target)moveGridItem(drag.from,drag.target);
}
function cancelItemArrangeGesture(){
  clearItemPressState();
  finishItemDrag(false);
}
function onItemPointerDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  if(e.target.closest('.item-delete-x'))return;
  const cell=e.target.closest('#itemGrid .item-cell');if(!cell)return;
  cancelItemArrangeGesture();
  const idx=parseInt(cell.dataset.index);if(!Number.isInteger(idx))return;
  const state={cell,idx,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,timer:null};
  itemPressState=state;
  if(cell.setPointerCapture){try{cell.setPointerCapture(e.pointerId);}catch(err){}}
  state.timer=setTimeout(()=>{
    if(itemPressState!==state)return;
    itemClickSuppressedUntil=Date.now()+700;
    setItemArrangeMode(true);
    if(navigator.vibrate)navigator.vibrate(12);
    beginItemDrag(state);
  },itemArrangeMode?170:520);
}
function onItemPointerMove(e){
  const state=itemPressState;if(!state||state.pointerId!==e.pointerId)return;
  state.lastX=e.clientX;state.lastY=e.clientY;
  const distance=Math.hypot(e.clientX-state.startX,e.clientY-state.startY);
  if(itemDragState){
    e.preventDefault();
    updateItemDrag(e.clientX,e.clientY);
    return;
  }
  if(itemArrangeMode&&distance>6){
    itemClickSuppressedUntil=Date.now()+700;
    beginItemDrag(state);
    e.preventDefault();
  }else if(!itemArrangeMode&&distance>10){
    clearItemPressState();
  }
}
function onItemPointerUp(e){
  const state=itemPressState;if(!state||state.pointerId!==e.pointerId)return;
  if(state.timer)clearTimeout(state.timer);
  releaseItemPointer(state);
  const shouldCommit=!!itemDragState;
  itemPressState=null;
  if(shouldCommit)finishItemDrag(true);
}
function onItemPointerCancel(e){
  const state=itemPressState;if(!state||state.pointerId!==e.pointerId)return;
  clearItemPressState();
  finishItemDrag(false);
}
function setupItemArrangeGestures(){
  const grid=document.getElementById('itemGrid');if(!grid)return;
  grid.addEventListener('pointerdown',onItemPointerDown);
  grid.addEventListener('pointermove',onItemPointerMove,{passive:false});
  grid.addEventListener('pointerup',onItemPointerUp);
  grid.addEventListener('pointercancel',onItemPointerCancel);
  grid.addEventListener('contextmenu',e=>{if(e.target.closest('.item-cell'))e.preventDefault();});
  grid.addEventListener('dragstart',e=>e.preventDefault());
  // Tap empty area to exit arrange mode
  document.getElementById('viewDetail').addEventListener('click',e=>{
    if(!itemArrangeMode)return;
    if(e.target.closest('.item-cell')||e.target.closest('.btn-s')||e.target.closest('.back-btn')||e.target.closest('.add-item-btn')||e.target.closest('.section-divider'))return;
    setItemArrangeMode(false);
  });
}

function optimizedImageDataUrl(file,maxSize){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error('没有选择图片'));return;}
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error('读取图片失败'));
    reader.onload=ev=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('图片格式无法读取'));
      img.onload=()=>{
        const c=document.createElement('canvas');
        const M=maxSize||1000;
        let w=img.width,h=img.height;
        if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const keepAlpha=file.type==='image/png';
        resolve(c.toDataURL(keepAlpha?'image/png':'image/jpeg',keepAlpha?undefined:0.82));
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function imagePathExt(dataUrl){
  if(String(dataUrl).startsWith('data:image/png'))return'png';
  if(String(dataUrl).startsWith('data:image/webp'))return'webp';
  return'jpg';
}
async function quickItemImgSelected(input){
  const idx=quickItemIdx;

  const item=p&&idx!==null?p.items[idx]:null;
  if(!item||!input.files||!input.files[0]){quickItemIdx=null;input.value='';return;}
  try{
    let img=await optimizedImageDataUrl(input.files[0],1000);
    if(img.startsWith('data:')&&window.CloudSync){
      const ext=imagePathExt(img);
      img=await CloudSync.uploadDataUrl(img,`kitchen/${curProjectId}_${item.id}.${ext}`);
    }
    item.img=img;
    save();renderDetail(p);
  }catch(e){
    console.error(e);
    showToast('图片保存失败，请再试一次');
  }finally{
    quickItemIdx=null;input.value='';
  }
}

function startInlineEdit(elId,field){
  const el=document.getElementById(elId);if(!el)return;
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  const item=p.items[curItemIdx];
  el.contentEditable='true';
  el.style.color='';el.style.fontStyle='';
  if(field==='checkinNote'&&!item.checkinNote)el.textContent='';
  el.focus();
  // Select all text
  const range=document.createRange();range.selectNodeContents(el);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
  function commit(){
    el.contentEditable='false';
    const val=el.textContent.trim();
    item[field]=val;
    if(field==='name'){
      document.getElementById('itemTitle').textContent=val||('品目'+(curItemIdx+1));
      if(!val)el.textContent='品目'+(curItemIdx+1);
    }
    if(field==='checkinNote'&&!val){el.textContent='双击添加感想…';el.style.color='#ccc';el.style.fontStyle='italic';}
    save();
    el.removeEventListener('blur',commit);
    el.removeEventListener('keydown',onKey);
  }
  function onKey(e){if(e.key==='Enter'){e.preventDefault();el.blur();}}
  el.addEventListener('blur',commit);
  el.addEventListener('keydown',onKey);
}
function openCheckin(){
  const p=getProject(curProjectId);
  const item=p&&curItemIdx!==null?p.items[curItemIdx]:null;
  const nameInput=document.getElementById('checkinItemName');
  nameInput.value=item?(item.name&&!/^品目\d+$/.test(item.name)?item.name:''):'';
  document.getElementById('checkinDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('checkinNote').value='';
  document.getElementById('checkinImgPreview').style.display='none';
  delete document.getElementById('checkinImgPreview').dataset.source;
  document.getElementById('checkinImgInput').value='';
  openModal('checkinModal');
}
function previewCheckinImg(input){
  if(!input.files||!input.files[0])return;
  optimizedImageDataUrl(input.files[0],1000).then(d=>{
    const p=document.getElementById('checkinImgPreview');p.dataset.source=d;p.src=d;p.style.display='block';
  }).catch(e=>{console.error(e);showToast('图片读取失败');});
}
async function saveCheckin(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  const item=p.items[curItemIdx];
  const checkinName=document.getElementById('checkinItemName').value.trim();
  if(checkinName)item.name=checkinName;
  item.collected=true;
  item.collectedDate=document.getElementById('checkinDate').value||new Date().toISOString().slice(0,10);
  item.checkinNote=document.getElementById('checkinNote').value.trim();
  const preview=document.getElementById('checkinImgPreview');
  let cImg=preview.style.display!=='none'?(preview.dataset.source||''):'';
  if(cImg&&cImg.startsWith('data:')&&window.CloudSync){
    try{cImg=await CloudSync.uploadDataUrl(cImg,`kitchen/${curProjectId}_${item.id}_checkin.${imagePathExt(cImg)}`);}catch(e){}
  }
  if(cImg)item.checkinImg=cImg;
  save();closeModal('checkinModal');returnToDetail();
  const proj=getProject(curProjectId);
  if(proj)showCheckinCelebration(proj.duty);
}
function uncollect(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null||curItemIdx===undefined)return;
  const item=p.items[curItemIdx];if(!item)return;
  item.collected=false;
  item.collectedDate=null;
  item.checkinNote='';
  item.checkinImg='';
  save();
  openItem(curItemIdx);
}
function toggleCollected(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  const item=p.items[curItemIdx];
  if(item.collected){uncollect();}else{openCheckin();}
}

/* ═══ ITEM MODAL ═══ */
function getItemSectionIndex(p,itemIdx){
  if(!p.sections||!p.sections.length||itemIdx===null||itemIdx<0)return -1;
  let offset=0;
  for(let i=0;i<p.sections.length;i++){
    const count=Math.max(0,parseInt(p.sections[i].count)||0);
    if(itemIdx>=offset&&itemIdx<offset+count)return i;
    offset+=count;
  }
  return -1;
}
function getSectionEndIndex(p,sectionIdx){
  let end=0;
  for(let i=0;i<=sectionIdx&&i<p.sections.length;i++){
    end+=Math.max(0,parseInt(p.sections[i].count)||0);
  }
  return Math.min(end,p.items.length);
}
function renderItemSectionSelect(p,selectedIdx){
  const field=document.getElementById('itemSectionField');
  const select=document.getElementById('inputItemSection');
  if(!p.sections||!p.sections.length){
    field.style.display='none';
    select.innerHTML='';
    return;
  }
  const fallback=selectedIdx>=0&&selectedIdx<p.sections.length?selectedIdx:0;
  select.innerHTML=p.sections.map((sec,i)=>`<option value="${i}">${esc(sec.name||('分类 '+(i+1)))}</option>`).join('');
  select.value=String(fallback);
  field.style.display='block';
}
function getSelectedItemSection(p){
  if(!p.sections||!p.sections.length)return -1;
  const idx=parseInt(document.getElementById('inputItemSection').value);
  return Number.isInteger(idx)&&idx>=0&&idx<p.sections.length?idx:0;
}
function openAddItem(){
  const p=getProject(curProjectId);if(!p)return;
  editItemIdx=null;
  document.getElementById('itemModalTitle').textContent='添加品目';
  document.getElementById('inputItemName').value='';
  document.getElementById('inputItemNote').value='';
  document.getElementById('itemImgPreview').style.display='none';
  delete document.getElementById('itemImgPreview').dataset.source;
  document.getElementById('itemDeleteBtn').style.display='none';
  renderItemSectionSelect(p,0);
  openModal('itemModal');
}
function openEditItem(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  const item=p.items[curItemIdx];
  editItemIdx=curItemIdx;
  document.getElementById('itemModalTitle').textContent='编辑品目';
  document.getElementById('inputItemName').value=item.name||'';
  document.getElementById('inputItemNote').value=item.note||'';
  if(item.img){const pr=document.getElementById('itemImgPreview');pr.src=item.img;pr.dataset.source=item.img;pr.style.display='block';}
  else{document.getElementById('itemImgPreview').style.display='none';delete document.getElementById('itemImgPreview').dataset.source;}
  document.getElementById('itemDeleteBtn').style.display='';
  renderItemSectionSelect(p,getItemSectionIndex(p,curItemIdx));
  openModal('itemModal');
}
function previewItemImg(input){
  if(!input.files||!input.files[0])return;
  optimizedImageDataUrl(input.files[0],1000).then(d=>{
    const p=document.getElementById('itemImgPreview');p.dataset.source=d;p.src=d;p.style.display='block';
  }).catch(e=>{console.error(e);showToast('图片读取失败');});
}
async function saveItem(){
  const p=getProject(curProjectId);if(!p)return;
  const wasEditing=editItemIdx!==null;
  const existingItem=wasEditing?p.items[editItemIdx]:null;
  const stableItemId=existingItem&&existingItem.id?existingItem.id:gid();
  if(existingItem&&!existingItem.id)existingItem.id=stableItemId;
  const selectedSection=getSelectedItemSection(p);
  const inputName=document.getElementById('inputItemName').value.trim();
  const name=wasEditing?inputName:(inputName||('品目'+(p.items.length+1)));
  const note=document.getElementById('inputItemNote').value.trim();
  const preview=document.getElementById('itemImgPreview');
  let img=preview.style.display!=='none'?(preview.dataset.source||''):'';
  if(img&&img.startsWith('data:')&&window.CloudSync){try{img=await CloudSync.uploadDataUrl(img,`kitchen/${curProjectId}_${stableItemId}.${imagePathExt(img)}`);}catch(e){}}
  let savedItemIdx=editItemIdx;
  if(wasEditing){
    const oldItemIdx=editItemIdx;
    const item=p.items[oldItemIdx];
    if(item){
      item.name=name;item.note=note;if(img)item.img=img;
      const oldSection=getItemSectionIndex(p,oldItemIdx);
      if(selectedSection>=0&&selectedSection!==oldSection){
        p.items.splice(oldItemIdx,1);
        if(oldSection>=0)p.sections[oldSection].count=Math.max(0,(parseInt(p.sections[oldSection].count)||0)-1);
        const insertAt=getSectionEndIndex(p,selectedSection);
        p.items.splice(insertAt,0,item);
        p.sections[selectedSection].count=(parseInt(p.sections[selectedSection].count)||0)+1;
        savedItemIdx=insertAt;
      }
    }
  }else{
    const item={id:stableItemId,name,note,img,collected:false,collectedDate:null,checkinNote:'',checkinImg:''};
    if(selectedSection>=0){
      const insertAt=getSectionEndIndex(p,selectedSection);
      p.items.splice(insertAt,0,item);
      p.sections[selectedSection].count=(parseInt(p.sections[selectedSection].count)||0)+1;
      savedItemIdx=insertAt;
    }else{
      p.items.push(item);
      savedItemIdx=p.items.length-1;
    }
  }
  p.count=p.items.length;
  save();closeModal('itemModal');
  if(wasEditing){curItemIdx=savedItemIdx;editItemIdx=savedItemIdx;openItem(savedItemIdx);}else{renderDetail(p);}
}
function deleteEditingItem(){
  if(editItemIdx===null)return;
  curItemIdx=editItemIdx;
  deleteItem();
}
function deleteItem(){
  const p=getProject(curProjectId);if(!p||curItemIdx===null)return;
  customConfirm('删除这个品目？图片和打卡记录也会一起删除。',()=>{
    const sectionIdx=getItemSectionIndex(p,curItemIdx);
    if(sectionIdx>=0)p.sections[sectionIdx].count=Math.max(0,(parseInt(p.sections[sectionIdx].count)||0)-1);
    p.items.splice(curItemIdx,1);
    p.count=p.items.length;
    normalizeGenericItemNames(p);
    curItemIdx=null;editItemIdx=null;
    closeModal('itemModal');
    save();returnToDetail();
  },{yes:'删除',danger:true});
}

/* ═══ MENUS ═══ */
function openProjectMenu(){document.getElementById('projectMenuSheet').classList.add('show');}
function openItemMenu(){document.getElementById('itemMenuSheet').classList.add('show');}
function closeSheet(id){document.getElementById(id).classList.remove('show');}

/* ═══ BACKUP ═══ */
function exportKitchen(){
  const blob=new Blob([JSON.stringify(projects,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='kitchen_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importKitchen(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)){showToast('格式不正确');input.value='';return;}
      customConfirm('导入数据？将覆盖当前记录。',()=>{
        projects=data;save();renderProjects();closeModal('backupModal');
      });
    }catch(e){showToast('导入失败');}
    input.value='';
  };
  reader.readAsText(input.files[0]);
}

/* ═══ MODALS ═══ */
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
document.querySelectorAll('.modal-bg,.action-sheet-bg').forEach(bg=>{bg.addEventListener('click',e=>{if(e.target===bg)bg.classList.remove('show');});});
document.getElementById('projectIconLabel').addEventListener('click',()=>document.getElementById('projectIconInput').click());
document.getElementById('itemFileLabel').addEventListener('click',()=>document.getElementById('itemImgInput').click());
document.getElementById('checkinImgLabel').addEventListener('click',()=>document.getElementById('checkinImgInput').click());

/* ═══ CLOUD MIGRATE ═══ */
async function migrateLocalImages(){
  if(!window.CloudSync)return;
  try{await CloudSync.whenReady();let changed=false;
  for(const p of projects){
    if(p.icon&&p.icon.startsWith('data:')){p.icon=await CloudSync.uploadDataUrl(p.icon,`kitchen/${p.id}_icon.jpg`);changed=true;}
    for(const item of p.items){
      if(item.img&&item.img.startsWith('data:')){item.img=await CloudSync.uploadDataUrl(item.img,`kitchen/${p.id}_${item.id}.jpg`);changed=true;}
      if(item.checkinImg&&item.checkinImg.startsWith('data:')){item.checkinImg=await CloudSync.uploadDataUrl(item.checkinImg,`kitchen/${p.id}_${item.id}_checkin.jpg`);changed=true;}
    }
  }
  if(changed){save();renderProjects();}}catch(e){console.warn('Kitchen image migration pending:',e);}
}

/* ═══ INIT ═══ */
setupItemArrangeGestures();
renderProjects();
migrateLocalImages();
</script>
